<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>My Bookings - Vedanta</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050508;
            color: #FFFFFF;
            overflow-x: hidden;
            padding-bottom: 80px;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.08), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid rgba(212,175,55,0.3);
            background: rgba(5,5,8,0.95);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FF8C00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .back-btn {
            background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.3);
            padding: 8px 16px;
            border-radius: 40px;
            color: #D4AF37;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Page Title */
        .page-title {
            padding: 20px 16px 8px;
            text-align: center;
        }
        .page-title h2 {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .page-title p {
            color: #888;
            font-size: 13px;
            margin-top: 8px;
        }

        /* Tabs / Filters */
        .tabs-container {
            padding: 16px 16px 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }
        .tabs {
            display: inline-flex;
            gap: 12px;
            background: rgba(20,20,30,0.5);
            padding: 6px;
            border-radius: 60px;
            backdrop-filter: blur(8px);
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            color: #ccc;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .tab-btn.active {
            background: #D4AF37;
            color: #050508;
            box-shadow: 0 2px 8px rgba(212,175,55,0.3);
        }

        /* Orders Container */
        .orders-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Booking Card */
        .booking-card {
            background: rgba(15,15,22,0.7);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(212,175,55,0.2);
            transition: transform 0.2s, border-color 0.2s;
        }
        .booking-card:hover {
            border-color: rgba(212,175,55,0.5);
            transform: translateY(-2px);
        }

        /* Product row with image and details */
        .product-row {
            display: flex;
            gap: 16px;
            padding: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .product-img {
            width: 90px;
            height: 90px;
            background: #0E0E14;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-img i {
            font-size: 44px;
            color: #D4AF37;
        }
        .product-details {
            flex: 1;
        }
        .product-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }
        .order-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 8px 0;
            font-size: 12px;
            color: #aaa;
        }
        .order-meta span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .order-meta i {
            font-size: 12px;
            color: #D4AF37;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            width: fit-content;
            margin-top: 8px;
        }
        .status-confirmed { background: rgba(33,150,243,0.15); color: #2196F3; border: 1px solid rgba(33,150,243,0.3); }
        .status-upcoming { background: rgba(255,152,0,0.15); color: #FF9800; border: 1px solid rgba(255,152,0,0.3); }
        .status-completed { background: rgba(76,175,80,0.15); color: #4CAF50; border: 1px solid rgba(76,175,80,0.3); }
        .status-cancelled { background: rgba(244,67,54,0.15); color: #F44336; border: 1px solid rgba(244,67,54,0.3); }
        .status-processing { background: rgba(156,39,176,0.15); color: #CE93D8; border: 1px solid rgba(156,39,176,0.3); }
        
        /* Info grid */
        .info-grid {
            padding: 16px 18px;
            background: rgba(0,0,0,0.2);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .info-label {
            font-size: 10px;
            color: #888;
            letter-spacing: 0.5px;
        }
        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #eee;
        }
        .price-highlight {
            color: #D4AF37;
            font-size: 18px;
            font-weight: 800;
        }

        /* Action Buttons - ONLY VIEW DETAILS */
        .card-actions {
            display: flex;
            gap: 12px;
            padding: 16px 18px;
        }
        .btn-view {
            flex: 1;
            background: rgba(212,175,55,0.12);
            border: 1px solid rgba(212,175,55,0.4);
            border-radius: 50px;
            padding: 12px;
            font-weight: 700;
            font-size: 13px;
            color: #D4AF37;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            text-decoration: none;
        }
        .btn-view:hover, .btn-view:active {
            background: rgba(212,175,55,0.25);
            transform: scale(0.98);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-state i {
            font-size: 80px;
            color: #D4AF37;
            opacity: 0.4;
            margin-bottom: 20px;
        }
        .empty-state h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        .shop-now-btn {
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 700;
            color: #050508;
            margin-top: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: #D4AF37;
            color: #050508;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 10000;
            font-size: 12px;
            display: none;
        }
        .toast.show { display: block; animation: fadeInOut 2s ease; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 8px 20px;
            display: flex;
            gap: 30px;
            z-index: 1000;
            border: 1px solid rgba(212,175,55,0.5);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            padding: 5px 14px;
            border-radius: 50px;
        }
        .nav-item i { font-size: 20px; color: #ccc; }
        .nav-item span { font-size: 10px; }
        .nav-item.active, .nav-item:hover { background: rgba(212,175,55,0.2); }
        .nav-item.active i, .nav-item.active span { color: #D4AF37; }

        @media (min-width: 768px) {
            .bottom-nav { bottom: 20px; padding: 12px 32px; gap: 50px; }
            .nav-item { padding: 6px 20px; }
            .product-img { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo"><h1>VEDANTA</h1></div>
    <div class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back</div>
</div>

<div class="page-title">
    <h2><i class="fas fa-calendar-alt"></i> My Bookings</h2>
    <p>Your orders & reservations at a glance</p>
</div>

<div class="tabs-container">
    <div class="tabs">
        <button class="tab-btn active" data-filter="all">All Bookings</button>
        <button class="tab-btn" data-filter="upcoming">Upcoming</button>
        <button class="tab-btn" data-filter="completed">Completed</button>
        <button class="tab-btn" data-filter="cancelled">Cancelled</button>
    </div>
</div>

<div class="orders-container" id="ordersContainer"></div>

<div class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i><span>HOME</span></div>
    <div class="nav-item active" onclick="window.location.href='bookings.html'"><i class="fas fa-calendar-alt"></i><span>BOOKING</span></div>
    <div class="nav-item" onclick="window.location.href='profile.html'"><i class="fas fa-user-circle"></i><span>PROFILE</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
    // -------- LOAD REAL ORDERS FROM LOCALSTORAGE (no dummy orders) --------
    let allOrders = [];
    let productsMap = new Map(); // store product images/icons

    // Load products to get images
    function loadProducts() {
        try {
            const saved = localStorage.getItem('vedantaProducts');
            if (saved) {
                const prods = JSON.parse(saved);
                if (Array.isArray(prods)) {
                    prods.forEach(p => {
                        productsMap.set(p.id, { images: p.images || [], icon: p.icon || 'fa-gem', name: p.name });
                    });
                }
            }
        } catch(e) {}
    }

    function loadOrdersFromStorage() {
        const stored = localStorage.getItem('vedantaOrders');
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) {
                    allOrders = parsed;
                } else {
                    allOrders = [];
                }
            } catch(e) { allOrders = []; }
        } else {
            allOrders = [];
        }
        // NO DEFAULT DATA - strictly user-placed orders only
    }

    // Helper: get product image
    function getProductImage(productId) {
        const prod = productsMap.get(productId);
        if (prod && prod.images && prod.images.length > 0) return prod.images[0];
        return null;
    }
    function getProductIcon(productId) {
        const prod = productsMap.get(productId);
        return (prod && prod.icon) ? prod.icon : 'fa-gem';
    }

    // Status style mapping
    function getStatusClass(status) {
        switch(status) {
            case 'confirmed': return 'status-confirmed';
            case 'upcoming': return 'status-upcoming';
            case 'processing': return 'status-processing';
            case 'shipped': return 'status-upcoming';
            case 'delivered': return 'status-completed';
            case 'completed': return 'status-completed';
            case 'cancelled': return 'status-cancelled';
            default: return 'status-confirmed';
        }
    }
    function getStatusLabel(status) {
        const map = {
            'confirmed': 'Confirmed', 'processing': 'Processing', 'shipped': 'Shipped',
            'delivered': 'Delivered', 'completed': 'Completed', 'cancelled': 'Cancelled', 'upcoming': 'Upcoming'
        };
        return map[status] || status;
    }

    // Determine filter group: upcoming, completed, cancelled based on status
    function getFilterGroup(order) {
        const st = order.status;
        if (st === 'cancelled') return 'cancelled';
        if (st === 'delivered' || st === 'completed') return 'completed';
        if (st === 'confirmed' || st === 'processing' || st === 'shipped' || st === 'upcoming') return 'upcoming';
        return 'upcoming';
    }

    let currentFilter = 'all';

    function renderOrders() {
        const container = document.getElementById('ordersContainer');
        if (!container) return;
        
        loadOrdersFromStorage();
        loadProducts();
        
        let filtered = [...allOrders];
        if (currentFilter !== 'all') {
            filtered = filtered.filter(o => getFilterGroup(o) === currentFilter);
        }
        
        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <h3>No Bookings Found</h3>
                    <p>You haven't placed any orders yet.<br>Start exploring our collection!</p>
                    <button class="shop-now-btn" onclick="window.location.href='index.html'">
                        <i class="fas fa-shopping-cart"></i> Shop Now
                    </button>
                </div>
            `;
            return;
        }
        
        container.innerHTML = '';
        filtered.forEach(order => {
            const mainItem = order.items && order.items[0] ? order.items[0] : { id: 0, name: 'Product', price: order.total || 0, quantity: 1 };
            const productImg = getProductImage(mainItem.id);
            const iconClass = getProductIcon(mainItem.id);
            const statusClass = getStatusClass(order.status);
            const statusLabel = getStatusLabel(order.status);
            
            // Build dynamic info rows based on order type (travel or product)
            const priceAmount = order.total || mainItem.price * mainItem.quantity;
            const eventDate = order.eventDate || order.date?.split(',')[0] || '';
            const timeSlot = order.timeSlot || '';
            const checkIn = order.checkIn;
            
            container.innerHTML += `
                <div class="booking-card" data-order-id="${order.orderId}">
                    <div class="product-row">
                        <div class="product-img">
                            ${productImg ? `<img src="${productImg}" alt="${escapeHtml(mainItem.name)}">` : `<i class="fas ${iconClass}"></i>`}
                        </div>
                        <div class="product-details">
                            <div class="product-name">${escapeHtml(mainItem.name)}</div>
                            <div class="order-meta">
                                <span><i class="fas fa-hashtag"></i> ${order.orderId}</span>
                                <span><i class="far fa-calendar-alt"></i> ${order.date?.split(',')[0] || 'N/A'}</span>
                            </div>
                            <div class="status-badge ${statusClass}">
                                <i class="fas ${order.status === 'cancelled' ? 'fa-times-circle' : (order.status === 'delivered' ? 'fa-check-circle' : 'fa-clock')}"></i> ${statusLabel}
                            </div>
                        </div>
                    </div>
                    
                    <div class="info-grid">
                        ${checkIn ? `
                            <div class="info-item"><span class="info-label">CHECK-IN</span><span class="info-value">${order.checkIn}</span></div>
                            <div class="info-item"><span class="info-label">CHECK-OUT</span><span class="info-value">${order.checkOut || '—'}</span></div>
                            <div class="info-item"><span class="info-label">GUESTS</span><span class="info-value">${order.guests || '2 Adults'}</span></div>
                        ` : `
                            ${eventDate ? `<div class="info-item"><span class="info-label">DATE</span><span class="info-value">${eventDate}</span></div>` : ''}
                            ${timeSlot ? `<div class="info-item"><span class="info-label">TIME</span><span class="info-value">${timeSlot}</span></div>` : ''}
                            <div class="info-item"><span class="info-label">TOTAL</span><span class="info-value price-highlight">₹${priceAmount.toLocaleString('en-IN')}</span></div>
                        `}
                        ${!checkIn && !eventDate ? `<div class="info-item"><span class="info-label">ORDER TOTAL</span><span class="info-value price-highlight">₹${priceAmount.toLocaleString('en-IN')}</span></div>` : ''}
                    </div>
                    
                    <div class="card-actions">
                        <a href="view-detail.html?orderId=${encodeURIComponent(order.orderId)}" class="btn-view">
                            <i class="fas fa-eye"></i> View Details
                        </a>
                    </div>
                </div>
            `;
        });
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function showToastMessage(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    
    // Filter tabs
    function initFilters() {
        const btns = document.querySelectorAll('.tab-btn');
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                renderOrders();
            });
        });
    }
    
    // Expose global functions
    window.showToastMessage = showToastMessage;
    
    // Initialize
    loadProducts();
    loadOrdersFromStorage();
    renderOrders();
    initFilters();
</script>
</body>
</html>
