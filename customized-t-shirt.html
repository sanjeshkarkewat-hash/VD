<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Vedanta</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050508;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .checkout-card {
            background: rgba(15,15,22,0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .checkout-card i { font-size: 80px; color: #4CAF50; margin-bottom: 20px; }
        .checkout-card h2 { color: #D4AF37; margin-bottom: 15px; }
        .checkout-card p { color: #aaa; margin-bottom: 25px; line-height: 1.6; }
        .order-details {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .order-details h4 { color: #D4AF37; margin-bottom: 15px; }
        .order-detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .design-preview {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
        }
        .design-preview img { max-width: 100%; border-radius: 12px; max-height: 200px; }
        .btn-continue {
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            color: #050508;
            margin-top: 20px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="checkout-card">
        <i class="fas fa-check-circle"></i>
        <h2>Order Ready for Checkout!</h2>
        <p>Your custom design has been saved successfully. Please proceed to complete your order.</p>
        
        <div class="order-details" id="orderDetails">
            <h4>Order Summary</h4>
            <div id="orderInfo"></div>
        </div>
        
        <div class="design-preview" id="designPreview">
            <h4>Your Custom Design</h4>
            <div id="designImage"></div>
        </div>
        
        <button class="btn-continue" onclick="completeOrder()">Proceed to Complete Order</button>
        <br>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Designer</a>
    </div>

    <script>
        function loadOrderDetails() {
            const orderData = JSON.parse(localStorage.getItem('pendingCheckoutOrder') || '{}');
            
            if (orderData.orderId) {
                document.getElementById('orderInfo').innerHTML = `
                    <div class="order-detail-row"><span>Order ID:</span><span>${orderData.orderId}</span></div>
                    <div class="order-detail-row"><span>Product:</span><span>${orderData.style || 'Custom T-Shirt'}</span></div>
                    <div class="order-detail-row"><span>Size:</span><span>${orderData.size || 'M'}</span></div>
                    <div class="order-detail-row"><span>GSM:</span><span>${orderData.gsm || '220 GSM'}</span></div>
                    <div class="order-detail-row"><span>Fabric:</span><span>${orderData.fabric || '100% Cotton'}</span></div>
                    <div class="order-detail-row"><span>Amount:</span><span>₹${orderData.price || 1699}</span></div>
                `;
                
                if (orderData.designImage) {
                    document.getElementById('designImage').innerHTML = `<img src="${orderData.designImage}" alt="Your Design">`;
                } else {
                    document.getElementById('designImage').innerHTML = '<p style="color:#888;">Custom design included</p>';
                }
            } else {
                document.getElementById('orderInfo').innerHTML = '<p>Loading order details...</p>';
            }
        }
        
        function completeOrder() {
            alert('Thank you for your order! Our team will contact you shortly to confirm the customization details.\n\nOrder has been saved in our system.');
            localStorage.removeItem('pendingCheckoutOrder');
            window.location.href = 'index.html';
        }
        
        loadOrderDetails();
    </script>
</body>
</html>
