<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VEDANTA | Custom T-Shirt Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display&family=Montserrat&family=Dancing+Script&family=Pacifico&family=Oswald&family=Raleway&family=Lobster&family=Bebas+Neue&family=Great+Vibes&family=Caveat&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #050508;
            color: #FFFFFF;
            overflow-x: hidden;
            padding-bottom: 70px;
        }

        /* App-like container */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 16px 80px 16px;
        }

        /* Header compact */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FFD700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tagline-sm {
            font-size: 9px;
            letter-spacing: 2px;
            color: #D4AF37;
        }

        .cart-icon-header {
            background: rgba(212, 175, 55, 0.15);
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .cart-count {
            background: #D4AF37;
            color: #050508;
            border-radius: 30px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Horizontal scrollable style collection */
        .style-scroll {
            overflow-x: auto;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 24px;
        }

        .style-row {
            display: flex;
            gap: 14px;
            padding: 4px 2px 12px 2px;
        }

        .style-card {
            flex: 0 0 110px;
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 10px 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .style-card.active {
            border-color: #D4AF37;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(255, 140, 0, 0.1));
        }

        .style-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 8px;
            background: #1a1a2e;
        }

        .style-name {
            font-size: 12px;
            font-weight: 600;
        }

        .style-price {
            font-size: 11px;
            color: #D4AF37;
            font-weight: 700;
        }

        /* 3-Column layout for desktop + mobile adaptation */
        .designer-layout {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 1000px) {
            .designer-layout {
                grid-template-columns: 1fr;
                gap: 18px;
            }
        }

        /* Tools Panel (compact, app-like) */
        .tools-panel {
            background: rgba(15, 15, 22, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 16px;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }

        .panel-title {
            font-size: 15px;
            font-weight: 700;
            color: #D4AF37;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 8px;
        }

        .tool-group {
            margin-bottom: 18px;
        }

        .tool-group label {
            font-size: 12px;
            font-weight: 600;
            color: #ddd;
            display: block;
            margin-bottom: 6px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-row input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 14px;
            padding: 10px 12px;
            color: white;
            font-size: 13px;
        }

        .small-btn {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 11px;
            cursor: pointer;
            color: #D4AF37;
            transition: 0.2s;
        }

        .effect-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .effect-chip {
            background: rgba(212, 175, 55, 0.12);
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 500;
            color: #D4AF37;
            cursor: pointer;
        }

        .effect-chip.active {
            background: #D4AF37;
            color: #050508;
        }

        /* Text Items Manager (Multiple texts) */
        .text-items-list {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 8px;
            margin-top: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .text-item-card {
            background: rgba(25, 25, 35, 0.8);
            border-radius: 16px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #D4AF37;
        }

        .text-item-info {
            flex: 1;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .text-item-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn-sm {
            background: rgba(212, 175, 55, 0.2);
            border: none;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            color: #D4AF37;
        }

        /* Canvas area */
        .canvas-area {
            text-align: center;
        }

        .side-switcher {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .side-btn {
            background: rgba(20, 20, 30, 0.8);
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            color: #aaa;
        }

        .side-btn.active {
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            color: #050508;
        }

        .canvas-container {
            background: #1a1a24;
            border-radius: 24px;
            display: inline-block;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
        }

        #tshirtCanvas {
            border-radius: 20px;
            width: 100%;
            height: auto;
            cursor: crosshair;
        }

        /* Tshirt color row compact */
        .color-strip {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .color-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid transparent;
        }

        .color-chip.active {
            border-color: #D4AF37;
            background: rgba(212, 175, 55, 0.15);
        }

        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .color-label {
            font-size: 9px;
            font-weight: 500;
        }

        /* Order invoice panel */
        .invoice-panel {
            background: rgba(15, 15, 22, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 18px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            position: sticky;
            top: 80px;
        }

        .invoice-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .invoice-total {
            font-size: 20px;
            font-weight: 800;
            color: #D4AF37;
            padding: 14px 0;
        }

        .action-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .btn-cart, .btn-buy {
            flex: 1;
            padding: 12px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
        }

        .btn-cart {
            background: rgba(212, 175, 55, 0.15);
            border: 1.5px solid #D4AF37;
            color: #D4AF37;
        }

        .btn-buy {
            background: linear-gradient(135deg, #FF4500, #FF8C00);
            border: none;
            color: white;
        }

        /* Cart sidebar remains but smaller */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100vh;
            background: rgba(8, 8, 15, 0.98);
            backdrop-filter: blur(20px);
            border-left: 2px solid rgba(212, 175, 55, 0.4);
            z-index: 15000;
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        @media (max-width: 480px) {
            .cart-sidebar {
                width: 100%;
                right: -100%;
            }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #D4AF37;
            color: #050508;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 13px;
            z-index: 10000;
            display: none;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            z-index: 30000;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
        }

        .loading-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 20000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #111118;
            border-radius: 28px;
            padding: 24px;
            width: 90%;
            max-width: 340px;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <div>
            <div class="logo">VEDANTA</div>
            <div class="tagline-sm">✦ CUSTOM STUDIO ✦</div>
        </div>
        <div class="cart-icon-header" id="cartIconBtn">
            <i class="fas fa-shopping-cart"></i> <span id="cartCount">0</span>
        </div>
    </div>

    <!-- Scrollable Style Collection -->
    <div class="style-scroll">
        <div class="style-row" id="styleRow"></div>
    </div>

    <!-- Main 3-col layout -->
    <div class="designer-layout">
        <!-- Left Tools -->
        <div class="tools-panel">
            <div class="panel-title"><i class="fas fa-magic"></i> DESIGN TOOLS</div>
            <div class="tool-group">
                <label>✏️ Add Text</label>
                <div class="input-row">
                    <input type="text" id="newTextInput" placeholder="Enter text...">
                    <button class="small-btn" id="addTextBtn">+ Add</button>
                </div>
            </div>

            <!-- Multiple Text Manager -->
            <div class="tool-group">
                <label>📋 Text Layers</label>
                <div id="textLayersContainer" class="text-items-list">
                    <div style="font-size: 11px; color: #888; padding: 8px;">No text added</div>
                </div>
            </div>

            <div class="tool-group">
                <label>🎨 Text Color</label>
                <div class="color-grid" id="colorPalette" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
            </div>

            <div class="tool-group">
                <label>✨ Text Effects</label>
                <div class="effect-buttons">
                    <button class="effect-chip" id="glowBtn">Glow</button>
                    <button class="effect-chip" id="roundedBtn">Rounded</button>
                    <button class="effect-chip" id="borderBtn">Border</button>
                </div>
            </div>

            <div class="tool-group">
                <label>🔤 Font</label>
                <select id="fontSelect" style="width: 100%; padding: 8px; border-radius: 14px; background: #1a1a2a; color: white;">
                    <option>Space Grotesk</option><option>Poppins</option><option>Montserrat</option><option>Playfair Display</option>
                    <option>Dancing Script</option><option>Pacifico</option><option>Oswald</option><option>Great Vibes</option>
                </select>
            </div>

            <div class="tool-group">
                <label>📏 Size</label>
                <input type="range" id="fontSizeSlider" min="12" max="100" step="1" value="36">
            </div>

            <div class="tool-group">
                <label>🖼️ Upload Image</label>
                <div class="upload-area" id="uploadArea" style="border: 2px dashed rgba(212,175,55,0.4); border-radius: 16px; padding: 12px; text-align: center; font-size:12px;">
                    <i class="fas fa-cloud-upload-alt"></i> Tap to upload
                    <input type="file" id="imageUpload" accept="image/*" style="display:none">
                </div>
            </div>
            <div class="effect-buttons" style="margin-top: 8px;">
                <button class="small-btn" id="deleteSelectedBtn">🗑 Delete Sel</button>
                <button class="small-btn" id="clearSideBtn">🧹 Clear Side</button>
            </div>
        </div>

        <!-- Canvas & Color Area -->
        <div class="canvas-area">
            <div class="side-switcher">
                <button class="side-btn active" id="frontSideBtn"><i class="fas fa-tshirt"></i> Front</button>
                <button class="side-btn" id="backSideBtn"><i class="fas fa-undo-alt"></i> Back</button>
            </div>
            <div class="canvas-container">
                <canvas id="tshirtCanvas" width="500" height="540" style="width:100%; height:auto; max-width:500px;"></canvas>
            </div>
            <div class="color-strip" id="tshirtColorStrip"></div>
            <div style="font-size: 10px; color: #aaa; margin-top: 12px;">
                <i class="fas fa-arrows-alt"></i> Tap to select | Drag | Double-click text
            </div>
        </div>

        <!-- Invoice / Order Panel -->
        <div class="invoice-panel">
            <div class="panel-title"><i class="fas fa-receipt"></i> Order Summary</div>
            <div class="invoice-row"><span>Style</span><span id="summaryStyle">Sweatshirt</span></div>
            <div class="invoice-row"><span>Color</span><span id="summaryColor">White</span></div>
            <div class="invoice-row"><span>Size</span><span id="summarySize">--</span></div>
            <div class="invoice-row"><span>Print</span><span id="summaryPrintMethod">Transparent</span></div>
            <div class="invoice-row"><span>Front</span><span id="summaryFront">None</span></div>
            <div class="invoice-row"><span>Back</span><span id="summaryBack">None</span></div>
            <div class="invoice-total"><span>Total</span><span id="totalPrice">₹1,999</span></div>
            <select id="sizeSelect" style="width:100%; padding: 10px; border-radius: 30px; background:#111; color:white; margin: 10px 0;">
                <option value="" disabled selected>Select Size</option>
                <option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
            </select>
            <div class="action-group">
                <button class="btn-cart" id="addToCartBtn">🛒 ADD TO CART</button>
                <button class="btn-buy" id="buyNowBtn">⚡ BUY NOW</button>
            </div>
        </div>
    </div>
</div>

<div class="cart-sidebar" id="cartSidebar"><div class="cart-header" style="padding:20px; display:flex; justify-content:space-between;"><h3>Cart</h3><i class="fas fa-times" id="closeCartBtn"></i></div><div id="cartItemsList" class="cart-items" style="flex:1; padding:16px;"></div><div class="cart-total" style="padding:16px;"><div>Subtotal: <span id="cartSubtotal">₹0</span></div><button class="checkout-btn" id="cartCheckoutBtn" style="width:100%; margin-top:12px;">Checkout</button></div></div>
<div class="toast" id="toastMsg"></div>
<div class="loading-overlay" id="globalLoadingOverlay"><div class="loading-spinner"></div><div class="loading-text">Processing...</div></div>
<div class="modal" id="loginModal"><div class="modal-content"><span id="closeModalBtn" style="float:right;">&times;</span><h3>Login</h3><input type="tel" id="loginPhone" placeholder="+91 9876543210"><button id="sendOtpBtn">Send OTP</button><div id="otpSection"><input type="text" id="otpInput" placeholder="OTP"><button id="verifyOtpBtn">Verify</button></div></div></div>

<script>
    // FIREBASE CONFIG (unchanged)
    const firebaseConfig = { apiKey: "AIzaSyCBZuwN4SKkXX1fEriYEwWDyTm-3uZnrKI", authDomain: "nexi-53897.firebaseapp.com", projectId: "nexi-53897", storageBucket: "nexi-53897.firebasestorage.app", messagingSenderId: "337349382612", appId: "1:337349382612:web:ae3c9b3d0fbf69f0e38641" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(), storage = firebase.storage(), auth = firebase.auth();
    const IMAGE_PATH = "";
    const tshirtStyles = [
        { id: 'sweatshirt', name: 'sweatshirt', displayName: 'Sweatshirt', price: 1999, previewImg: 'sweatshirt white color frunt t shirt.jpeg', colors: ['white', 'warm grey', 'cream', 'black'] },
        { id: 'regularfit', name: 'regular fit', displayName: 'Regular Fit', price: 1699, previewImg: 'regular fit white color frunt t shirt.jpg', colors: ['white', 'grey', 'cream', 'blue', 'black'] },
        { id: 'polo', name: 'polo', displayName: 'Polo', price: 1599, previewImg: 'polo white color frunt t shirt.jpeg', colors: ['white', 'grey', 'blue', 'black'] },
        { id: 'oversized', name: 'oversized', displayName: 'Oversized', price: 1499, previewImg: 'oversized white color frunt t shirt.jpg', colors: ['white', 'warm grey', 'cream', 'black'] },
        { id: 'acidwash', name: 'acid wash', displayName: 'Acid Wash', price: 1799, previewImg: 'acid wash green color frunt t shirt.jpeg', colors: ['green', 'black'] },
        { id: 'hoodie', name: 'hoodie', displayName: 'Hoodie', price: 2499, previewImg: 'hoodie olive green color frunt t shirt.jpg', colors: ['olive green', 'dark brown', 'blue', 'black'] }
    ];
    let currentStyle = tshirtStyles[0], currentSize = null, currentPrintMethod = 'transparent', fabricCanvas = null, currentSide = 'front', frontDesignJSON = null, backDesignJSON = null, selectedColor = 'white', selectedColorDisplay = 'White', cart = [];
    let textObjectsList = []; // store fabric objects references

    // Helper functions
    function showToast(msg, isErr = false) { const t = document.getElementById('toastMsg'); t.innerText = msg; t.style.background = isErr ? '#F44336' : '#D4AF37'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
    function showLoading(txt) { const ov = document.getElementById('globalLoadingOverlay'); ov.querySelector('.loading-text').innerText = txt; ov.classList.add('active'); }
    function hideLoading() { document.getElementById('globalLoadingOverlay').classList.remove('active'); }
    
    function getDynamicImagePath(product, color, side) { return `${product} ${color} color ${side === 'front' ? 'frunt t shirt.jpeg' : 'back t shirt.jpeg'}`.replace(/\s+/g, ' '); }
    function loadTshirtImage() { if (!fabricCanvas) return; const path = getDynamicImagePath(currentStyle.name, selectedColor, currentSide); fabric.Image.fromURL(path, (img) => { const scale = Math.max(fabricCanvas.width / img.width, fabricCanvas.height / img.height); fabricCanvas.setBackgroundImage(img, () => fabricCanvas.renderAll(), { scaleX: scale, scaleY: scale }); }, { crossOrigin: 'Anonymous' }); }

    function updateTextLayersUI() {
        const container = document.getElementById('textLayersContainer');
        if (!container) return;
        const objects = fabricCanvas.getObjects().filter(obj => obj.type === 'i-text' || obj.type === 'text');
        if (objects.length === 0) { container.innerHTML = '<div style="font-size: 11px; color: #888; padding: 8px;">No text layers</div>'; return; }
        container.innerHTML = '';
        objects.forEach((obj, idx) => {
            const div = document.createElement('div'); div.className = 'text-item-card';
            div.innerHTML = `<div class="text-item-info">✏️ ${obj.text?.substring(0, 20) || 'Text'}</div>
            <div class="text-item-actions"><button class="icon-btn-sm edit-text-btn" data-idx="${idx}"><i class="fas fa-edit"></i></button>
            <button class="icon-btn-sm delete-text-btn" data-idx="${idx}"><i class="fas fa-trash"></i></button></div>`;
            container.appendChild(div);
        });
        document.querySelectorAll('.edit-text-btn').forEach(btn => btn.addEventListener('click', (e) => { const idx = parseInt(btn.dataset.idx); const target = fabricCanvas.getObjects().filter(o => o.type === 'i-text' || o.type === 'text')[idx]; if (target) { fabricCanvas.setActiveObject(target); target.enterEditing(); target.selectAll(); fabricCanvas.renderAll(); } }));
        document.querySelectorAll('.delete-text-btn').forEach(btn => btn.addEventListener('click', (e) => { const idx = parseInt(btn.dataset.idx); const target = fabricCanvas.getObjects().filter(o => o.type === 'i-text' || o.type === 'text')[idx]; if (target) fabricCanvas.remove(target); fabricCanvas.renderAll(); updateTextLayersUI(); updateSummaryIcons(); }));
    }

    function addTextLayer(content = null) {
        const textVal = content || document.getElementById('newTextInput').value.trim();
        if (!textVal) { showToast('Enter text first', true); return; }
        const text = new fabric.IText(textVal, { left: fabricCanvas.width/2, top: fabricCanvas.height/2, fontFamily: document.getElementById('fontSelect').value, fill: '#D4AF37', fontSize: 36, originX: 'center', originY: 'center' });
        fabricCanvas.add(text); fabricCanvas.setActiveObject(text); fabricCanvas.renderAll();
        document.getElementById('newTextInput').value = '';
        updateTextLayersUI(); updateSummaryIcons();
    }

    function applyToActive(callback) { const active = fabricCanvas.getActiveObject(); if(active && (active.type==='i-text'||active.type==='text')) { callback(active); fabricCanvas.renderAll(); updateTextLayersUI(); } else showToast('Select a text first', true); }
    function applyTextColor(color) { applyToActive(obj => obj.set('fill', color)); }
    let glowActive=false, roundedActive=false, borderActive=false;
    function applyGlow() { applyToActive(obj => { glowActive=!glowActive; obj.set('shadow', glowActive ? '#D4AF37 0px 0px 8px' : null); }); }
    function applyRounded() { applyToActive(obj => { roundedActive=!roundedActive; if(roundedActive) { obj.set('rx', 30); obj.set('ry', 30); } else { obj.set('rx', 0); obj.set('ry', 0); } }); }
    function applyBorder() { applyToActive(obj => { borderActive=!borderActive; obj.set('stroke', borderActive ? '#D4AF37' : null); obj.set('strokeWidth', borderActive ? 2 : 0); }); }
    function updateSelectedFont() { applyToActive(obj => obj.set('fontFamily', document.getElementById('fontSelect').value)); }
    function updateFontSize() { applyToActive(obj => obj.set('fontSize', parseInt(document.getElementById('fontSizeSlider').value))); }
    function updateSummaryIcons() { const hasFront = fabricCanvas.getObjects().length > 0; document.getElementById('summaryFront').innerHTML = hasFront ? '<i class="fas fa-check-circle"></i> Custom' : 'None'; if(currentSide==='front') frontDesignJSON = fabricCanvas.toJSON(); else backDesignJSON = fabricCanvas.toJSON(); }
    function updateSummary() { document.getElementById('summaryStyle').innerText = currentStyle.displayName; document.getElementById('summaryColor').innerText = selectedColorDisplay; document.getElementById('summarySize').innerText = currentSize || '--'; document.getElementById('totalPrice').innerHTML = `₹${currentStyle.price}`; }
    function changeTShirtColor(color) { selectedColor = color; const map={'white':'White','warm grey':'Warm Grey','cream':'Cream','black':'Black','grey':'Grey','blue':'Blue','green':'Green','olive green':'Olive Green','dark brown':'Dark Brown'}; selectedColorDisplay = map[color]||color; document.getElementById('summaryColor').innerText = selectedColorDisplay; loadTshirtImage(); }

    function renderStyles() { const row = document.getElementById('styleRow'); row.innerHTML = tshirtStyles.map(s => `<div class="style-card ${s.id===currentStyle.id?'active':''}" data-id="${s.id}"><img class="style-img" src="${IMAGE_PATH}${s.previewImg}" onerror="this.src='https://placehold.co/100x100/1a1a2e/D4AF37?text=${s.displayName}'"><div class="style-name">${s.displayName}</div><div class="style-price">₹${s.price}</div></div>`).join(''); document.querySelectorAll('.style-card').forEach(c => c.addEventListener('click', () => { const id = c.dataset.id; const selected = tshirtStyles.find(s => s.id === id); if(selected) { currentStyle = selected; selectedColor = currentStyle.colors[0]; renderStyles(); renderColorStrip(); loadTshirtImage(); updateSummary(); showToast(`${selected.displayName} selected`); } })); }
    function renderColorStrip() { const container = document.getElementById('tshirtColorStrip'); const colorMap = { white:'#f5f5f5','warm grey':'#a9a9a9',cream:'#fffdd0',black:'#1a1a1a',grey:'#808080',blue:'#1e3a5f',green:'#4a5d23','olive green':'#556b2f','dark brown':'#5c4033'}; container.innerHTML = currentStyle.colors.map(c => `<div class="color-chip ${selectedColor===c?'active':''}" data-color="${c}"><div class="color-dot" style="background:${colorMap[c]||'#888'}"></div><span class="color-label">${c}</span></div>`).join(''); document.querySelectorAll('.color-chip').forEach(el => el.addEventListener('click', () => changeTShirtColor(el.dataset.color))); }
    function renderColorPalette() { const colors = ['#FF6633','#FFB399','#FF33FF','#FFFF99','#00B3E6','#E6B333','#3366E6','#999966','#99FF99','#B34D4D']; const container = document.getElementById('colorPalette'); container.innerHTML = colors.map(c => `<div class="color-swatch" style="width:28px;height:28px;border-radius:12px;background:${c};cursor:pointer;"></div>`).join(''); document.querySelectorAll('.color-swatch').forEach(sw => sw.addEventListener('click', () => applyTextColor(sw.style.backgroundColor))); }
    function switchFront() { if(currentSide==='front') return; backDesignJSON = fabricCanvas.toJSON(); currentSide='front'; fabricCanvas.clear(); loadTshirtImage(); if(frontDesignJSON) fabricCanvas.loadFromJSON(frontDesignJSON, () => { fabricCanvas.renderAll(); updateTextLayersUI(); }); document.getElementById('frontSideBtn').classList.add('active'); document.getElementById('backSideBtn').classList.remove('active'); updateSummaryIcons(); }
    function switchBack() { if(currentSide==='back') return; frontDesignJSON = fabricCanvas.toJSON(); currentSide='back'; fabricCanvas.clear(); loadTshirtImage(); if(backDesignJSON) fabricCanvas.loadFromJSON(backDesignJSON, () => { fabricCanvas.renderAll(); updateTextLayersUI(); }); document.getElementById('backSideBtn').classList.add('active'); document.getElementById('frontSideBtn').classList.remove('active'); updateSummaryIcons(); }
    function saveDesignAndCart() { if(!currentSize) { showToast('Select size', true); return false; } return true; }
    async function addToCartLogic() { if(!currentSize) { showToast('Select size first', true); return; } showLoading('Adding...'); if(currentSide==='front') frontDesignJSON = fabricCanvas.toJSON(); else backDesignJSON = fabricCanvas.toJSON(); cart.push({ id: Date.now(), styleName: currentStyle.displayName, price: currentStyle.price, frontDesignJSON: frontDesignJSON, backDesignJSON: backDesignJSON, size: currentSize, selectedColor: selectedColorDisplay, quantity: 1 }); localStorage.setItem('vedanta_custom_cart', JSON.stringify(cart)); updateCartCount(); showToast('Added to cart'); hideLoading(); }
    function updateCartCount() { document.getElementById('cartCount').innerText = cart.reduce((s,i)=>s+i.quantity,0); }
    function initCanvas() { fabricCanvas = new fabric.Canvas('tshirtCanvas', { width: 500, height: 540 }); fabricCanvas.on('selection:created', updateTextLayersUI); fabricCanvas.on('selection:cleared', updateTextLayersUI); fabricCanvas.on('object:modified', () => { updateTextLayersUI(); updateSummaryIcons(); }); loadTshirtImage(); frontDesignJSON = fabricCanvas.toJSON(); }
    
    // Event bindings & initialization
    document.getElementById('addTextBtn').onclick = () => addTextLayer();
    document.getElementById('glowBtn').onclick = applyGlow;
    document.getElementById('roundedBtn').onclick = applyRounded;
    document.getElementById('borderBtn').onclick = applyBorder;
    document.getElementById('fontSelect').onchange = updateSelectedFont;
    document.getElementById('fontSizeSlider').oninput = updateFontSize;
    document.getElementById('deleteSelectedBtn').onclick = () => { const obj = fabricCanvas.getActiveObject(); if(obj) fabricCanvas.remove(obj); fabricCanvas.renderAll(); updateTextLayersUI(); updateSummaryIcons(); };
    document.getElementById('clearSideBtn').onclick = () => { fabricCanvas.getObjects().forEach(o => fabricCanvas.remove(o)); fabricCanvas.renderAll(); updateTextLayersUI(); updateSummaryIcons(); };
    document.getElementById('frontSideBtn').onclick = switchFront;
    document.getElementById('backSideBtn').onclick = switchBack;
    document.getElementById('sizeSelect').onchange = (e) => { currentSize = e.target.value; updateSummary(); };
    document.getElementById('addToCartBtn').onclick = addToCartLogic;
    document.getElementById('buyNowBtn').onclick = () => { if(!currentSize){showToast('Select size',true);return;} window.location.href='secure-checkout.html'; };
    document.getElementById('uploadArea').onclick = () => document.getElementById('imageUpload').click();
    document.getElementById('imageUpload').onchange = (e) => { if(e.target.files[0]){ const reader=new FileReader(); reader.onload=(ev)=>{ fabric.Image.fromURL(ev.target.result, (img)=>{ img.scaleToWidth(180); img.set({ left:fabricCanvas.width/2, top:fabricCanvas.height/2, originX:'center', originY:'center' }); fabricCanvas.add(img); fabricCanvas.renderAll(); updateSummaryIcons(); }); }; reader.readAsDataURL(e.target.files[0]); } };
    document.getElementById('cartIconBtn').onclick = () => document.getElementById('cartSidebar').classList.add('open');
    document.getElementById('closeCartBtn').onclick = () => document.getElementById('cartSidebar').classList.remove('open');
    document.getElementById('cartCheckoutBtn').onclick = () => { if(cart.length) window.location.href='secure-checkout.html'; else showToast('Cart empty', true); };
    
    // Load cart from local
    const savedCart = localStorage.getItem('vedanta_custom_cart'); if(savedCart) cart = JSON.parse(savedCart);
    updateCartCount();
    renderStyles();
    renderColorStrip();
    renderColorPalette();
    initCanvas();
    updateSummary();
    if (window.location.protocol === 'file:') document.getElementById('corsWarning')?.remove();
</script>
</body>
</html>
