<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VEDANTA | Custom T-Shirt Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050508;
            color: #FFFFFF;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.08), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .header {
            text-align: center;
            padding: 25px 20px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .logo {
            font-size: 44px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FFD700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .tagline {
            font-size: 12px;
            letter-spacing: 4px;
            color: #D4AF37;
            margin-top: 5px;
        }

        .designer-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .style-section {
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #D4AF37;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .style-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 22px;
        }
        .style-card {
            background: rgba(20,20,30,0.75);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .style-card.active {
            border-color: #D4AF37;
            background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(255,140,0,0.1));
            box-shadow: 0 0 25px rgba(212,175,55,0.3);
            transform: translateY(-3px);
        }
        .style-img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 12px;
            background: #1a1a2e;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .style-name {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 5px;
        }
        .style-price {
            color: #D4AF37;
            font-size: 14px;
            font-weight: 700;
        }

        .designer-grid {
            display: grid;
            grid-template-columns: 300px 1fr 280px;
            gap: 25px;
        }
        @media (max-width: 1100px) {
            .designer-grid { grid-template-columns: 1fr; gap: 25px; }
        }

        .tools-panel {
            background: rgba(15,15,22,0.92);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 22px;
            border: 1px solid rgba(212,175,55,0.25);
            max-height: 85vh;
            overflow-y: auto;
        }
        .tools-panel h3 {
            color: #D4AF37;
            margin-bottom: 18px;
            font-size: 18px;
        }
        .tool-group {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .tool-group label {
            display: block;
            font-size: 11px;
            color: #D4AF37;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .tool-group input, .tool-group select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 14px;
            color: white;
            font-size: 13px;
        }
        .color-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .color-swatch.active {
            border-color: white;
            transform: scale(1.1);
        }
        .btn-icon {
            background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.4);
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            color: #D4AF37;
            margin-top: 8px;
            display: inline-block;
            margin-right: 6px;
            transition: 0.2s;
        }
        .btn-icon:hover {
            background: #D4AF37;
            color: #050508;
        }
        .upload-area {
            border: 2px dashed rgba(212,175,55,0.4);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .upload-area:hover {
            border-color: #D4AF37;
            background: rgba(212,175,55,0.05);
        }

        .editor-panel {
            background: rgba(10,10,18,0.6);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 20px;
            text-align: center;
        }
        .canvas-container {
            background: #1a1a24;
            border-radius: 24px;
            display: inline-block;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        #tshirtCanvas {
            border-radius: 20px;
            cursor: crosshair;
        }

        .order-panel {
            background: rgba(15,15,22,0.92);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 22px;
            border: 1px solid rgba(212,175,55,0.25);
            position: sticky;
            top: 20px;
        }
        .order-detail {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .order-total {
            padding: 18px 0;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: 800;
            color: #D4AF37;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn-add, .btn-buy {
            flex: 1;
            padding: 14px;
            border-radius: 50px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
        }
        .btn-add {
            background: rgba(212,175,55,0.15);
            border: 1.5px solid #D4AF37;
            color: #D4AF37;
        }
        .btn-buy {
            background: linear-gradient(135deg, #FF4500, #FF8C00);
            border: none;
            color: white;
        }
        .btn-add:hover, .btn-buy:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #D4AF37;
            color: #050508;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 10000;
            display: none;
        }
        .toast.show { display: block; animation: fade 2.5s ease; }
        @keyframes fade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        .instruction-text {
            font-size: 11px;
            color: #888;
            margin-top: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 20000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: rgba(15,15,22,0.98);
            border-radius: 28px;
            padding: 30px;
            max-width: 380px;
            width: 90%;
            border: 1px solid rgba(212,175,55,0.3);
            text-align: center;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 16px;
            color: white;
        }
        .modal-content button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            border: none;
            border-radius: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 28px;
            cursor: pointer;
            color: white;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">VEDANTA</div>
    <div class="tagline">✦ CUSTOM T-SHIRT STUDIO ✦</div>
</div>

<div class="designer-container">
    <div class="style-section">
        <div class="section-title"><i class="fas fa-tshirt"></i> Choose Your Style</div>
        <div class="style-grid" id="styleGrid"></div>
    </div>

    <div class="designer-grid">
        <div class="tools-panel">
            <h3><i class="fas fa-magic"></i> Design Tools</h3>
            
            <div class="tool-group">
                <label>📝 Add Text</label>
                <input type="text" id="textInput" placeholder="Enter your text...">
                <button class="btn-icon" id="addTextBtn"><i class="fas fa-plus"></i> Add Text</button>
            </div>
            
            <div class="tool-group">
                <label>🎨 Text Color</label>
                <div class="color-row" id="textColorOptions">
                    <div class="color-swatch" style="background:#FFFFFF;" data-color="#FFFFFF"></div>
                    <div class="color-swatch" style="background:#000000;" data-color="#000000"></div>
                    <div class="color-swatch active" style="background:#D4AF37;" data-color="#D4AF37"></div>
                    <div class="color-swatch" style="background:#FF4500;" data-color="#FF4500"></div>
                    <div class="color-swatch" style="background:#00BFFF;" data-color="#00BFFF"></div>
                    <div class="color-swatch" style="background:#FF69B4;" data-color="#FF69B4"></div>
                </div>
                <button class="btn-icon" id="applyColorBtn">Apply to Selected</button>
            </div>
            
            <div class="tool-group">
                <label>🔤 Font & Size</label>
                <select id="fontSelect">
                    <option value="Arial">Arial</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Impact">Impact</option>
                    <option value="Space Grotesk">Space Grotesk</option>
                </select>
                <input type="range" id="fontSizeSlider" min="12" max="80" step="1" value="36">
                <span id="fontSizeValue">36px</span>
                <button class="btn-icon" id="applyFontBtn">Apply</button>
            </div>
            
            <div class="tool-group">
                <label>🖼️ Upload Your Design</label>
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt" style="font-size:24px;"></i>
                    <p>Click to upload PNG/JPG</p>
                    <input type="file" id="imageUpload" accept="image/*" style="display:none">
                </div>
            </div>
            
            <div class="tool-group">
                <label>📏 Size & Fabric</label>
                <select id="sizeSelect">
                    <option>S</option><option>M</option><option>L</option><option selected>XL</option><option>XXL</option><option>3XL</option>
                </select>
                <select id="gsmSelect" style="margin-top:8px;">
                    <option>180 GSM</option><option selected>220 GSM</option><option>260 GSM</option><option>300 GSM</option>
                </select>
            </div>
            
            <div class="tool-group">
                <label>🔧 Manage</label>
                <button class="btn-icon" id="deleteBtn">Delete Selected</button>
                <button class="btn-icon" id="clearBtn">Clear All</button>
            </div>
        </div>
        
        <div class="editor-panel">
            <div class="canvas-container">
                <canvas id="tshirtCanvas" width="550" height="600"></canvas>
            </div>
            <p class="instruction-text">
                <i class="fas fa-arrows-alt"></i> Click to select | Drag to move | Double-click text to edit
            </p>
        </div>
        
        <div class="order-panel">
            <h3><i class="fas fa-shopping-bag"></i> Order Summary</h3>
            <div class="order-detail"><span>Style:</span><span id="summaryStyle">Full Sleeve T-Shirt</span></div>
            <div class="order-detail"><span>Size:</span><span id="summarySize">XL</span></div>
            <div class="order-detail"><span>GSM:</span><span id="summaryGSM">220 GSM</span></div>
            <div class="order-detail"><span>Design:</span><span id="summaryElements">None</span></div>
            <div class="order-total"><span>Total:</span><span id="totalPrice">₹1,699</span></div>
            <div class="action-buttons">
                <button class="btn-add" id="addToCartBtn"><i class="fas fa-cart-plus"></i> ADD TO CART</button>
                <button class="btn-buy" id="buyNowBtn"><i class="fas fa-bolt"></i> BUY NOW</button>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toastMsg"></div>
<div class="modal" id="loginModal">
    <div class="modal-content">
        <span class="close-modal" id="closeModalBtn">&times;</span>
        <h3 style="color:#D4AF37;">Login to Continue</h3>
        <input type="tel" id="loginPhone" placeholder="+91 9876543210">
        <button id="sendOtpBtn">Send OTP</button>
        <div id="otpSection" style="display:none; margin-top:15px;">
            <input type="text" id="otpInput" placeholder="Enter OTP">
            <button id="verifyOtpBtn">Verify</button>
        </div>
        <p style="font-size:11px; color:#888; margin-top:12px;">Demo OTP: 123456</p>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCBZuwN4SKkXX1fEriYEwWDyTm-3uZnrKI",
        authDomain: "nexi-53897.firebaseapp.com",
        projectId: "nexi-53897",
        storageBucket: "nexi-53897.firebasestorage.app",
        messagingSenderId: "337349382612",
        appId: "1:337349382612:web:ae3c9b3d0fbf69f0e38641"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================================
    // 🔥 IMPORTANT: Sabse pehle ye image paths apne hisaab se set karein
    // Apni images ka FULL PATH yahan likhein
    // Example: "C:/Users/Sanjeshkar/Vedanta/full sleeve oversized T shirt.jpeg"
    // Ya agar same folder mein hai toh sirf naam likhein
    // ============================================================
    const tshirtStyles = [
        { id: 'fullsleeve', name: 'Full Sleeve T-Shirt', img: 'full sleeve oversized T shirt.jpeg', price: 1699 },
        { id: 'oversized', name: 'Oversized T-Shirt', img: 'full sleeve oversized T shirt.jpeg', price: 1499 },
        { id: 'sweatshirt', name: 'Sweatshirt', img: 'sweatshirt T shirt.jpeg', price: 1999 },
        { id: 'oversized_hoodie', name: 'Oversized Hoodie', img: 'oversized hoodie.jpeg', price: 2499 },
        { id: 'polo', name: 'Polo T-Shirt', img: 'Polo T shirt.jpeg', price: 1599 },
        { id: 'dropshoulder', name: 'Drop Shoulder', img: 'drop shoulder T shirt.jpeg', price: 1699 },
        { id: 'acidwash', name: 'Acid Wash', img: 'acid wash T shirt.jpeg', price: 1799 }
    ];
    
    let currentStyle = tshirtStyles[0];
    let currentSize = 'XL';
    let currentGSM = '220 GSM';
    let fabricCanvas = null;
    let pendingOrder = null;

    // Ye function select kiye gaye t-shirt ki image ko canvas mein load karega
    function loadTshirtIntoCanvas(style) {
        if (!fabricCanvas) return;
        
        showToast(`Loading ${style.name}...`);
        
        // Image load karne ka tareeka - CORS error se bachne ke liye
        const img = new Image();
        img.crossOrigin = "Anonymous";
        
        img.onload = () => {
            const scaleX = fabricCanvas.width / img.width;
            const scaleY = fabricCanvas.height / img.height;
            const scale = Math.max(scaleX, scaleY);
            
            fabricCanvas.setBackgroundImage(img, fabricCanvas.renderAll.bind(fabricCanvas), {
                scaleX: scale,
                scaleY: scale,
                originX: 'center',
                originY: 'center',
                left: fabricCanvas.width / 2,
                top: fabricCanvas.height / 2
            });
            
            showToast(`✓ ${style.name} loaded - Ab design karein!`);
        };
        
        img.onerror = (err) => {
            console.error("Image load error:", style.img, err);
            fabricCanvas.setBackgroundColor('#1a1a2e', fabricCanvas.renderAll.bind(fabricCanvas));
            showToast(`⚠️ Image not found: "${style.img}"`, true);
        };
        
        img.src = style.img;
    }
    
    function initCanvas() {
        fabricCanvas = new fabric.Canvas('tshirtCanvas');
        fabricCanvas.setWidth(550);
        fabricCanvas.setHeight(600);
        fabricCanvas.selection = true;
        fabricCanvas.renderAll();
        loadTshirtIntoCanvas(currentStyle);
    }
    
    function addText() {
        const textValue = document.getElementById('textInput').value;
        if (!textValue.trim()) {
            showToast('Pehle text likhein', true);
            return;
        }
        const text = new fabric.IText(textValue, {
            left: fabricCanvas.width / 2,
            top: fabricCanvas.height / 2,
            fontFamily: 'Arial',
            fill: '#D4AF37',
            fontSize: 36,
            originX: 'center',
            originY: 'center',
            hasControls: true,
            hasBorders: true
        });
        fabricCanvas.add(text);
        fabricCanvas.setActiveObject(text);
        fabricCanvas.renderAll();
        showToast('Text added! Double-click to edit');
        updateSummaryElements();
    }
    
    function applyColor() {
        const active = fabricCanvas.getActiveObject();
        const color = document.querySelector('#textColorOptions .color-swatch.active')?.dataset.color || '#D4AF37';
        if (active) {
            active.set('fill', color);
            fabricCanvas.renderAll();
            showToast('Color applied');
        } else {
            showToast('Pehle text select karein', true);
        }
    }
    
    function applyFontAndSize() {
        const active = fabricCanvas.getActiveObject();
        const font = document.getElementById('fontSelect').value;
        const size = parseInt(document.getElementById('fontSizeSlider').value);
        if (active && active.type === 'i-text') {
            active.set('fontFamily', font);
            active.set('fontSize', size);
            fabricCanvas.renderAll();
            showToast('Font & size applied');
        } else {
            showToast('Pehle text select karein', true);
        }
    }
    
    function addImage(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            fabric.Image.fromURL(e.target.result, (img) => {
                img.scaleToWidth(200);
                img.set({ left: fabricCanvas.width / 2, top: fabricCanvas.height / 2, originX: 'center', originY: 'center' });
                fabricCanvas.add(img);
                fabricCanvas.setActiveObject(img);
                fabricCanvas.renderAll();
                showToast('Design image added! Drag to position');
                updateSummaryElements();
            });
        };
        reader.readAsDataURL(file);
    }
    
    function updateSummaryElements() {
        const has = fabricCanvas && fabricCanvas.getObjects().length > 0;
        document.getElementById('summaryElements').innerHTML = has ? '<i class="fas fa-check-circle"></i> Custom' : 'None';
    }
    
    function updateSummary() {
        document.getElementById('summaryStyle').innerText = currentStyle.name;
        document.getElementById('summarySize').innerText = currentSize;
        document.getElementById('summaryGSM').innerText = currentGSM;
        document.getElementById('totalPrice').innerHTML = `₹${currentStyle.price}`;
        updateSummaryElements();
    }
    
    async function saveOrder(orderType) {
        const user = JSON.parse(localStorage.getItem('vedantaUser'));
        if (!user) return null;
        const designJSON = fabricCanvas ? JSON.stringify(fabricCanvas.toJSON()) : null;
        const orderData = {
            style: currentStyle.name,
            price: currentStyle.price,
            size: currentSize,
            gsm: currentGSM,
            designJSON: designJSON,
            orderType: orderType,
            userId: user.uid,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        try {
            const doc = await db.collection('custom_orders').add(orderData);
            return doc.id;
        } catch(e) { return null; }
    }
    
    async function addToCart() {
        const user = JSON.parse(localStorage.getItem('vedantaUser'));
        if (!user) { showToast('Pehle login karein', true); openLoginModal(); return; }
        showToast('Saving...');
        const id = await saveOrder('cart');
        if (id) {
            let cart = JSON.parse(localStorage.getItem('vedantaCart')) || [];
            cart.push({ id: id, name: `Custom ${currentStyle.name}`, price: currentStyle.price, quantity: 1 });
            localStorage.setItem('vedantaCart', JSON.stringify(cart));
            showToast('Cart mein add ho gaya!');
        } else { showToast('Failed', true); }
    }
    
    async function buyNow() {
        const user = JSON.parse(localStorage.getItem('vedantaUser'));
        if (!user) { openLoginModal(); pendingOrder = 'buy'; return; }
        showToast('Processing...');
        const id = await saveOrder('buy');
        if (id) {
            localStorage.setItem('vedantaCart', JSON.stringify([{ id: id, name: `Custom ${currentStyle.name}`, price: currentStyle.price, quantity: 1 }]));
            window.location.href = 'secure-checkout.html';
        } else { showToast('Failed', true); }
    }
    
    function showToast(msg, isErr = false) {
        const t = document.getElementById('toastMsg');
        t.innerText = msg;
        t.style.background = isErr ? '#F44336' : '#D4AF37';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }
    
    // Style Grid Render - Yahan click karne par image change hogi
    function renderStyles() {
        const grid = document.getElementById('styleGrid');
        grid.innerHTML = tshirtStyles.map(style => `
            <div class="style-card ${style.id === currentStyle.id ? 'active' : ''}" data-id="${style.id}">
                <img class="style-img" src="${style.img}" alt="${style.name}" 
                     onerror="this.src='https://placehold.co/300x300/1a1a2e/D4AF37?text=${encodeURIComponent(style.name)}'">
                <div class="style-name">${style.name}</div>
                <div class="style-price">₹${style.price}</div>
            </div>
        `).join('');
        
        document.querySelectorAll('.style-card').forEach(card => {
            card.addEventListener('click', () => {
                const id = card.dataset.id;
                const selectedStyle = tshirtStyles.find(s => s.id === id);
                if (selectedStyle) {
                    currentStyle = selectedStyle;
                    renderStyles(); // Active highlight update
                    loadTshirtIntoCanvas(currentStyle); // Selected image load in canvas
                    updateSummary();
                    showToast(`${currentStyle.name} selected - Ab design karein!`);
                }
            });
        });
    }
    
    function openLoginModal() { document.getElementById('loginModal').classList.add('show'); }
    function closeLoginModal() { document.getElementById('loginModal').classList.remove('show'); document.getElementById('otpSection').style.display = 'none'; }
    
    document.getElementById('sendOtpBtn')?.addEventListener('click', () => {
        const phone = document.getElementById('loginPhone').value;
        if (phone.length < 10) { showToast('Sahi phone number daalein', true); return; }
        showToast('Demo OTP: 123456');
        document.getElementById('otpSection').style.display = 'block';
    });
    document.getElementById('verifyOtpBtn')?.addEventListener('click', () => {
        const otp = document.getElementById('otpInput').value;
        if (otp === '123456') {
            localStorage.setItem('vedantaUser', JSON.stringify({ uid: Date.now(), phone: document.getElementById('loginPhone').value }));
            closeLoginModal();
            showToast('Login successful!');
            if (pendingOrder === 'buy') { pendingOrder = null; buyNow(); }
        } else { showToast('Wrong OTP', true); }
    });
    document.getElementById('closeModalBtn')?.addEventListener('click', closeLoginModal);
    
    document.getElementById('addTextBtn')?.addEventListener('click', addText);
    document.getElementById('applyColorBtn')?.addEventListener('click', applyColor);
    document.getElementById('applyFontBtn')?.addEventListener('click', applyFontAndSize);
    document.getElementById('deleteBtn')?.addEventListener('click', () => {
        const obj = fabricCanvas.getActiveObject();
        if (obj) { fabricCanvas.remove(obj); fabricCanvas.renderAll(); updateSummaryElements(); showToast('Deleted'); }
        else showToast('Kuch select karein', true);
    });
    document.getElementById('clearBtn')?.addEventListener('click', () => {
        fabricCanvas.getObjects().forEach(obj => fabricCanvas.remove(obj));
        fabricCanvas.renderAll();
        updateSummaryElements();
        showToast('Sab clear ho gaya');
    });
    document.getElementById('addToCartBtn')?.addEventListener('click', addToCart);
    document.getElementById('buyNowBtn')?.addEventListener('click', buyNow);
    document.getElementById('sizeSelect')?.addEventListener('change', (e) => { currentSize = e.target.value; updateSummary(); });
    document.getElementById('gsmSelect')?.addEventListener('change', (e) => { currentGSM = e.target.value; updateSummary(); });
    document.getElementById('fontSizeSlider')?.addEventListener('input', (e) => { document.getElementById('fontSizeValue').innerText = e.target.value + 'px'; });
    
    document.querySelectorAll('#textColorOptions .color-swatch').forEach(sw => {
        sw.addEventListener('click', () => {
            document.querySelectorAll('#textColorOptions .color-swatch').forEach(s => s.classList.remove('active'));
            sw.classList.add('active');
        });
    });
    
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('imageUpload');
    uploadArea?.addEventListener('click', () => fileInput.click());
    fileInput?.addEventListener('change', (e) => { if (e.target.files[0]) addImage(e.target.files[0]); });
    
    initCanvas();
    renderStyles();
    updateSummary();
</script>
</body>
</html>
