<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VEDANTA | Custom T-Shirt Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display&family=Montserrat&family=Dancing+Script&family=Pacifico&family=Oswald&family=Raleway&family=Lobster&family=Bebas+Neue&family=Great+Vibes&family=Caveat&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050508;
            color: #FFFFFF;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.08), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* APP-LIKE HEADER */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
            position: sticky;
            top: 0;
            background: rgba(5,5,8,0.92);
            backdrop-filter: blur(12px);
            z-index: 100;
        }
        .logo-small {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FFD700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .cart-icon-header {
            cursor: pointer;
            background: rgba(212,175,55,0.15);
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid rgba(212,175,55,0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .cart-count {
            background: #D4AF37;
            color: #050508;
            border-radius: 30px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
        }

        /* HORIZONTAL SCROLLABLE STYLE COLLECTION (APP-STYLE) */
        .style-strip {
            padding: 12px 0 16px 0;
            border-bottom: 1px solid rgba(212,175,55,0.15);
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .style-strip::-webkit-scrollbar {
            height: 4px;
        }
        .style-strip::-webkit-scrollbar-track {
            background: #1a1a2e;
            border-radius: 4px;
        }
        .style-strip::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 4px;
        }
        .style-scroll-container {
            display: inline-flex;
            gap: 14px;
            padding: 0 16px;
        }
        .mini-style-card {
            width: 110px;
            background: rgba(20,20,30,0.8);
            border-radius: 24px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
            display: inline-block;
            white-space: normal;
        }
        .mini-style-card.active {
            border-color: #D4AF37;
            background: rgba(212,175,55,0.2);
        }
        .mini-style-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 16px;
            margin: 0 auto 6px;
            background: #1a1a2e;
        }
        .mini-style-name {
            font-size: 12px;
            font-weight: 600;
        }
        .mini-style-price {
            font-size: 11px;
            color: #D4AF37;
        }

        /* MAIN GRID: LEFT TOOLS | CENTER CANVAS | RIGHT BILL */
        .main-app-grid {
            max-width: 1400px;
            margin: 16px auto;
            padding: 0 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        /* LEFT TOOLS COLUMN (compact) */
        .tools-column {
            flex: 1.2;
            min-width: 220px;
            background: rgba(15,15,22,0.8);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 16px;
            border: 1px solid rgba(212,175,55,0.2);
            height: fit-content;
        }
        /* CENTER CANVAS */
        .canvas-column {
            flex: 2;
            min-width: 300px;
            text-align: center;
        }
        /* RIGHT BILL COLUMN */
        .bill-column {
            flex: 1;
            min-width: 240px;
            background: rgba(15,15,22,0.9);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 18px;
            border: 1px solid rgba(212,175,55,0.25);
            height: fit-content;
            position: sticky;
            top: 80px;
        }
        @media (max-width: 960px) {
            .main-app-grid { flex-direction: column; }
            .bill-column { position: static; margin-top: 0; }
            .tools-column { order: 2; }
            .canvas-column { order: 1; }
            .bill-column { order: 3; }
        }

        .tool-section {
            margin-bottom: 24px;
        }
        .tool-title {
            color: #D4AF37;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-left: 3px solid #D4AF37;
            padding-left: 10px;
        }
        /* TEXT BLOCKS MANAGER */
        .text-blocks-manager {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 12px;
            margin-top: 10px;
        }
        .text-block-item {
            background: rgba(212,175,55,0.1);
            border-radius: 16px;
            padding: 8px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .text-block-item.active-block {
            background: rgba(212,175,55,0.3);
            border-color: #D4AF37;
        }
        .text-block-preview {
            max-width: 120px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        .text-block-actions {
            display: flex;
            gap: 10px;
        }
        .text-block-actions i {
            cursor: pointer;
            font-size: 14px;
            color: #aaa;
            transition: 0.1s;
        }
        .text-block-actions i:hover { color: #D4AF37; }
        .delete-text-icon:hover { color: #ff7777 !important; }

        .add-text-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .add-text-row input {
            flex: 1;
            padding: 10px;
            background: #1a1a24;
            border: 1px solid #333;
            border-radius: 40px;
            color: white;
            font-size: 13px;
        }
        .add-text-row button {
            background: #D4AF37;
            border: none;
            border-radius: 40px;
            padding: 0 16px;
            font-weight: bold;
            color: #050508;
        }
        .effect-btn-sm {
            background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.4);
            padding: 5px 10px;
            border-radius: 30px;
            font-size: 10px;
            cursor: pointer;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .slider-row input { flex: 1; }
        .color-swatch-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            margin-top: 8px;
        }
        .color-swatch {
            aspect-ratio: 1/1;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .upload-mini {
            border: 1px dashed rgba(212,175,55,0.5);
            border-radius: 40px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
        .btn-mini {
            background: rgba(212,175,55,0.2);
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: #D4AF37;
            margin-top: 6px;
        }
        .canvas-container {
            background: #1a1a24;
            border-radius: 28px;
            display: inline-block;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }
        #tshirtCanvas {
            border-radius: 20px;
            cursor: crosshair;
            width: 100%;
            height: auto;
            max-width: 500px;
        }
        .side-switcher {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .side-btn {
            background: #1a1a2e;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #ccc;
        }
        .side-btn.active {
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            color: #050508;
        }
        .order-detail {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .order-total {
            font-size: 20px;
            font-weight: 800;
            color: #D4AF37;
            margin: 12px 0;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .btn-add, .btn-buy {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
        }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #D4AF37; color: #050508; padding: 8px 20px; border-radius: 40px; z-index: 10000; display: none; font-weight: bold; }
        .cart-sidebar { position: fixed; top: 0; right: -100%; width: 85%; max-width: 400px; height: 100vh; background: #0b0b12; z-index: 2000; transition: 0.3s; padding: 20px; overflow-y: auto; }
        .cart-sidebar.open { right: 0; }
        .loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 3000; display: flex; align-items: center; justify-content: center; visibility: hidden; }
        .loading-overlay.active { visibility: visible; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.96); z-index: 4000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: #1a1a2e; border-radius: 32px; padding: 24px; width: 280px; }
        @media (max-width: 600px) {
            .mini-style-card { width: 90px; }
            .mini-style-img { width: 65px; height: 65px; }
            .tools-column { padding: 12px; }
        }
    </style>
</head>
<body>

<div class="app-header">
    <div class="logo-small">VEDANTA</div>
    <div class="cart-icon-header" id="cartIconBtn">
        <i class="fas fa-shopping-cart"></i> <span class="cart-count" id="cartCount">0</span>
    </div>
</div>

<!-- Horizontal scrollable style collection (App style) -->
<div class="style-strip" id="styleStrip"></div>

<div class="main-app-grid">
    <!-- LEFT: Compact Tools + Text Manager -->
    <div class="tools-column">
        <div class="tool-section">
            <div class="tool-title"><i class="fas fa-i-cursor"></i> TEXT MANAGER</div>
            <div class="add-text-row">
                <input type="text" id="newTextInput" placeholder="Write something...">
                <button id="addTextBlockBtn">+ Add</button>
            </div>
            <div id="textBlocksList" class="text-blocks-manager">
                <!-- dynamic text blocks will appear here -->
                <div style="font-size:12px; color:#666; text-align:center;">No texts added. Click + Add</div>
            </div>
        </div>

        <div class="tool-section">
            <div class="tool-title"><i class="fas fa-palette"></i> TEXT STYLE</div>
            <select id="fontSelect" style="width:100%; padding:8px; border-radius:40px; background:#1a1a24; color:white; border:1px solid #333; margin-bottom:8px;">
                <option value="Space Grotesk">Space Grotesk</option><option value="Poppins">Poppins</option><option value="Dancing Script">Dancing Script</option><option value="Pacifico">Pacifico</option><option value="Bebas Neue">Bebas Neue</option>
            </select>
            <div class="slider-row"><span>Size</span><input type="range" id="fontSizeSlider" min="16" max="100" value="36"><span id="fontSizeValue">36</span></div>
            <div class="color-swatch-grid" id="colorPalette"></div>
            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;">
                <button class="effect-btn-sm" id="glowBtn"><i class="fas fa-magic"></i> Glow</button>
                <button class="effect-btn-sm" id="borderBtn"><i class="fas fa-border-all"></i> Border</button>
                <button class="effect-btn-sm" id="boldBtn"><i class="fas fa-bold"></i> B</button>
                <button class="effect-btn-sm" id="italicBtn"><i class="fas fa-italic"></i> I</button>
            </div>
        </div>

        <div class="tool-section">
            <div class="tool-title"><i class="fas fa-image"></i> UPLOAD IMAGE</div>
            <div class="upload-mini" id="uploadArea">
                <i class="fas fa-cloud-upload-alt"></i> Tap to upload PNG/JPG
                <input type="file" id="imageUpload" accept="image/*" style="display:none">
            </div>
            <button class="btn-mini" id="deleteSelectedBtn" style="margin-top:10px;"><i class="fas fa-trash"></i> Delete Selected</button>
            <button class="btn-mini" id="clearSideBtn">Clear Current Side</button>
        </div>
    </div>

    <!-- CENTER: Canvas + Side Switcher -->
    <div class="canvas-column">
        <div class="side-switcher">
            <button class="side-btn active" id="frontSideBtn"><i class="fas fa-tshirt"></i> Front</button>
            <button class="side-btn" id="backSideBtn"><i class="fas fa-undo-alt"></i> Back</button>
        </div>
        <div class="canvas-container">
            <canvas id="tshirtCanvas" width="550" height="600" style="width:100%; height:auto; max-width:550px; aspect-ratio:550/600"></canvas>
        </div>
        <div class="color-options" id="colorOptionsContainer" style="display:flex; gap:12px; justify-content:center; margin-top:16px; flex-wrap:wrap;"></div>
        <p class="instruction-text" style="font-size:10px; margin-top:12px;"><i class="fas fa-hand-pointer"></i> Tap text to edit | Drag to move</p>
    </div>

    <!-- RIGHT: BILL / INVOICE -->
    <div class="bill-column">
        <h4 style="color:#D4AF37; margin-bottom:12px;"><i class="fas fa-receipt"></i> Order Summary</h4>
        <div class="order-detail"><span>Style:</span><span id="summaryStyle">Sweatshirt</span></div>
        <div class="order-detail"><span>Color:</span><span id="summaryColor">White</span></div>
        <div class="order-detail"><span>Size:</span><span id="summarySize">--</span></div>
        <div class="order-detail"><span>Print Method:</span><span id="summaryPrintMethod">Transparent</span></div>
        <div class="order-detail"><span>Front Design:</span><span id="summaryFront">None</span></div>
        <div class="order-detail"><span>Back Design:</span><span id="summaryBack">None</span></div>
        <div class="order-total"><span>Total:</span><span id="totalPrice">₹1,999</span></div>
        <div class="tool-group" style="margin:10px 0;">
            <label>📏 Size (Required)</label>
            <select id="sizeSelect" style="width:100%; padding:8px; border-radius:40px;">
                <option value="" disabled selected>-- Select --</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
            </select>
        </div>
        <div class="print-method-group">
            <div class="print-option" data-method="transparent" style="display:flex; align-items:center; gap:8px; margin:6px 0;">
                <input type="radio" name="printMethod" value="transparent" checked> <label>✨ Transparent Print</label>
            </div>
            <div class="print-option" data-method="fullbg" style="display:flex; align-items:center; gap:8px;">
                <input type="radio" name="printMethod" value="fullbg"> <label>🖼️ Print with BG</label>
            </div>
        </div>
        <div class="action-buttons">
            <button class="btn-add" id="addToCartBtn"><i class="fas fa-cart-plus"></i> Add</button>
            <button class="btn-buy" id="buyNowBtn"><i class="fas fa-bolt"></i> Buy</button>
        </div>
    </div>
</div>

<!-- CART SIDEBAR + MODAL + TOAST -->
<div id="cartSidebar" class="cart-sidebar"><div style="display:flex; justify-content:space-between;"><h3>Cart</h3><i class="fas fa-times" id="closeCartBtn" style="cursor:pointer;"></i></div><div id="cartItemsList"></div><div id="cartTotal"></div><button id="cartCheckoutBtn" style="background:#D4AF37; width:100%; padding:12px; border-radius:40px;">Checkout</button></div>
<div class="toast" id="toastMsg"></div>
<div class="modal" id="loginModal"><div class="modal-content"><span class="close-modal" id="closeModalBtn">&times;</span><h3>Login</h3><input type="tel" id="loginPhone" placeholder="+91 9876543210"><button id="sendOtpBtn">Send OTP</button><div id="otpSection" style="display:none;"><input type="text" id="otpInput" placeholder="OTP"><button id="verifyOtpBtn">Verify</button></div></div></div>
<div class="loading-overlay" id="globalLoadingOverlay"><div class="loading-spinner"></div><div class="loading-text">Processing...</div></div>

<script>
    // Firebase init (unchanged)
    const firebaseConfig = { apiKey: "AIzaSyCBZuwN4SKkXX1fEriYEwWDyTm-3uZnrKI", authDomain: "nexi-53897.firebaseapp.com", projectId: "nexi-53897", storageBucket: "nexi-53897.firebasestorage.app", messagingSenderId: "337349382612", appId: "1:337349382612:web:ae3c9b3d0fbf69f0e38641" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(), storage = firebase.storage(), auth = firebase.auth();
    const tshirtStyles = [
        { id: 'sweatshirt', name: 'sweatshirt', displayName: 'Sweatshirt', price: 1999, previewImg: 'sweatshirt white color frunt t shirt.jpeg', colors: ['white','warm grey','cream','black'] },
        { id: 'regularfit', name: 'regular fit', displayName: 'Regular Fit', price: 1699, previewImg: 'regular fit white color frunt t shirt.jpg', colors: ['white','grey','cream','blue','black'] },
        { id: 'polo', name: 'polo', displayName: 'Polo', price: 1599, previewImg: 'polo white color frunt t shirt.jpeg', colors: ['white','grey','blue','black'] },
        { id: 'oversized', name: 'oversized', displayName: 'Oversized', price: 1499, previewImg: 'oversized white color frunt t shirt.jpg', colors: ['white','warm grey','cream','black'] },
        { id: 'acidwash', name: 'acid wash', displayName: 'Acid Wash', price: 1799, previewImg: 'acid wash green color frunt t shirt.jpeg', colors: ['green','black'] },
        { id: 'hoodie', name: 'hoodie', displayName: 'Hoodie', price: 2499, previewImg: 'hoodie olive green color frunt t shirt.jpg', colors: ['olive green','dark brown','blue','black'] }
    ];
    let currentStyle = tshirtStyles[0], currentSize = null, currentPrintMethod = 'transparent', fabricCanvas = null, currentSide = 'front', frontDesignJSON = null, backDesignJSON = null, selectedColor = 'white', selectedColorDisplay = 'White';
    let cart = [], textObjectsMap = new Map(); // store fabric objects references for management
    let glowActive = false, borderActive = false;

    // Helper functions (image loading etc)
    function getDynamicImagePath(product, color, side) { return `${product} ${color} color ${side === 'front' ? 'frunt t shirt.jpeg' : 'back t shirt.jpeg'}`.replace(/\s+/g,' '); }
    function loadTshirtImage() { if(!fabricCanvas) return; const path = getDynamicImagePath(currentStyle.name, selectedColor, currentSide); const img = new Image(); img.crossOrigin = "Anonymous"; img.onload = () => { const bgImg = new fabric.Image(img); bgImg.scaleToWidth(fabricCanvas.width); bgImg.scaleToHeight(fabricCanvas.height); fabricCanvas.setBackgroundImage(bgImg, fabricCanvas.renderAll.bind(fabricCanvas)); }; img.src = path; }
    function updateSummaryUI() { document.getElementById('summaryStyle').innerText = currentStyle.displayName; document.getElementById('summaryColor').innerText = selectedColorDisplay; document.getElementById('summarySize').innerText = currentSize || '--'; document.getElementById('totalPrice').innerHTML = `₹${currentStyle.price}`; document.getElementById('summaryPrintMethod').innerHTML = currentPrintMethod === 'transparent' ? 'Transparent' : 'Full BG'; const hasFront = frontDesignJSON?.objects?.length > 0; const hasBack = backDesignJSON?.objects?.length > 0; document.getElementById('summaryFront').innerHTML = hasFront ? '✓ Custom' : 'None'; document.getElementById('summaryBack').innerHTML = hasBack ? '✓ Custom' : 'None'; }
    function showToast(msg,err=false) { const t=document.getElementById('toastMsg'); t.innerText=msg; t.style.background=err?'#e53935':'#D4AF37'; t.style.display='block'; setTimeout(()=>t.style.display='none',2000); }
    function saveCart() { localStorage.setItem('vedanta_custom_cart', JSON.stringify(cart)); updateCartUI(); document.getElementById('cartCount').innerText = cart.reduce((s,i)=>s+i.quantity,0); }
    function updateCartUI(){ const container=document.getElementById('cartItemsList'); if(!container) return; if(cart.length===0){ container.innerHTML='<div>Cart empty</div>'; document.getElementById('cartTotal').innerHTML=''; return; } let html='',sub=0; cart.forEach((item,idx)=>{ sub+=item.price*item.quantity; html+=`<div class="cart-item"><div>${item.styleName}</div><div>₹${item.price} x${item.quantity}</div><button class="remove-cart" data-idx="${idx}">Remove</button></div>`; }); container.innerHTML=html; document.getElementById('cartTotal').innerHTML=`<strong>Total: ₹${sub}</strong>`; document.querySelectorAll('.remove-cart').forEach(btn=>btn.onclick=()=>{ cart.splice(parseInt(btn.dataset.idx),1); saveCart(); updateCartUI(); showToast('Removed'); }); }
    // --- TEXT BLOCKS MANAGER ---
    function refreshTextBlocksList() {
        const container = document.getElementById('textBlocksList');
        if(!container) return;
        const allTexts = fabricCanvas.getObjects().filter(obj => obj.type === 'i-text' || obj.type === 'text');
        if(allTexts.length === 0) { container.innerHTML = '<div style="font-size:12px; color:#666; text-align:center;">No texts. + Add</div>'; return; }
        container.innerHTML = '';
        allTexts.forEach((txtObj, idx) => {
            const div = document.createElement('div'); div.className = 'text-block-item';
            if(fabricCanvas.getActiveObject() === txtObj) div.classList.add('active-block');
            const preview = document.createElement('span'); preview.className = 'text-block-preview'; preview.innerText = txtObj.text?.substring(0,20) || 'Text';
            const actions = document.createElement('div'); actions.className = 'text-block-actions';
            const editIcon = document.createElement('i'); editIcon.className = 'fas fa-edit'; editIcon.style.cursor='pointer';
            const delIcon = document.createElement('i'); delIcon.className = 'fas fa-trash-alt delete-text-icon'; delIcon.style.cursor='pointer';
            editIcon.onclick = (e) => { e.stopPropagation(); txtObj.enterEditing(); txtObj.selectAll(); fabricCanvas.renderAll(); };
            delIcon.onclick = (e) => { e.stopPropagation(); fabricCanvas.remove(txtObj); fabricCanvas.renderAll(); refreshTextBlocksList(); updateSideJSON(); showToast('Text removed'); };
            actions.append(editIcon, delIcon);
            div.append(preview, actions);
            div.onclick = () => { fabricCanvas.setActiveObject(txtObj); fabricCanvas.renderAll(); refreshTextBlocksList(); };
            container.appendChild(div);
        });
    }
    function addNewTextBlock() { const input = document.getElementById('newTextInput'); const val = input.value.trim(); if(!val) { showToast('Enter text',true); return; } const text = new fabric.IText(val, { left: fabricCanvas.width/2, top: fabricCanvas.height/2, fontFamily: document.getElementById('fontSelect').value, fill: '#D4AF37', fontSize: parseInt(document.getElementById('fontSizeSlider').value), originX:'center', originY:'center' }); fabricCanvas.add(text); fabricCanvas.setActiveObject(text); fabricCanvas.renderAll(); input.value = ''; refreshTextBlocksList(); updateSideJSON(); showToast('Text added'); }
    function updateSideJSON() { if(currentSide === 'front') frontDesignJSON = fabricCanvas.toJSON(); else backDesignJSON = fabricCanvas.toJSON(); updateSummaryUI(); }
    function applyStyleToActive(styleFn) { const active = fabricCanvas.getActiveObject(); if(active && (active.type==='i-text'||active.type==='text')) { styleFn(active); fabricCanvas.renderAll(); refreshTextBlocksList(); updateSideJSON(); } else showToast('Select a text block first', true); }
    function applyColorToActive(color) { applyStyleToActive(obj => obj.set('fill',color)); }
    function applyGlow() { applyStyleToActive(obj => { glowActive = !glowActive; obj.set('shadow', glowActive ? 'rgba(212,175,55,0.8) 0px 0px 8px' : null); }); }
    function applyBorder() { applyStyleToActive(obj => { borderActive = !borderActive; obj.set('stroke', borderActive ? '#D4AF37' : null); obj.set('strokeWidth', borderActive?1.5:0); }); }
    function updateFontAndSize() { const active=fabricCanvas.getActiveObject(); if(active && (active.type==='i-text'||active.type==='text')){ active.set('fontFamily',document.getElementById('fontSelect').value); active.set('fontSize',parseInt(document.getElementById('fontSizeSlider').value)); fabricCanvas.renderAll(); refreshTextBlocksList(); updateSideJSON(); } }
    // --- end text manager ---
    
    function renderStyleStrip() { const container = document.getElementById('styleStrip'); container.innerHTML = `<div class="style-scroll-container">${tshirtStyles.map(style => `<div class="mini-style-card ${style.id===currentStyle.id?'active':''}" data-id="${style.id}"><img class="mini-style-img" src="${style.previewImg}" onerror="this.src='https://placehold.co/100x100/1a1a2e/D4AF37?text=${style.displayName}'"><div class="mini-style-name">${style.displayName}</div><div class="mini-style-price">₹${style.price}</div></div>`).join('')}</div>`; document.querySelectorAll('.mini-style-card').forEach(card=>card.addEventListener('click',()=>{ const id = card.dataset.id; const selected=tshirtStyles.find(s=>s.id===id); if(selected){ currentStyle=selected; selectedColor=currentStyle.colors[0]; const map={'white':'White','warm grey':'Warm Grey','cream':'Cream','black':'Black','grey':'Grey','blue':'Blue','green':'Green','olive green':'Olive Green','dark brown':'Dark Brown'}; selectedColorDisplay=map[selectedColor]||selectedColor; renderStyleStrip(); renderColorOptions(); loadTshirtImage(); updateSummaryUI(); showToast(`${selected.displayName} selected`); } })); }
    function renderColorOptions() { const container = document.getElementById('colorOptionsContainer'); const colors=currentStyle.colors; const codeMap={'white':'#f5f5f5','warm grey':'#a9a9a9','cream':'#fffdd0','black':'#1a1a1a','grey':'#808080','blue':'#1e3a5f','green':'#4a5d23','olive green':'#556b2f','dark brown':'#5c4033'}; container.innerHTML=colors.map(c=>`<div class="color-option ${selectedColor===c?'active':''}" data-color="${c}"><div style="width:36px;height:36px;border-radius:50%;background:${codeMap[c]||'#888'};border:2px solid ${selectedColor===c?'#D4AF37':'#444'};"></div><span style="font-size:10px;">${c}</span></div>`).join(''); document.querySelectorAll('.color-option').forEach(opt=>opt.addEventListener('click',()=>{ selectedColor=opt.dataset.color; const m={'white':'White','warm grey':'Warm Grey','cream':'Cream','black':'Black','grey':'Grey','blue':'Blue','green':'Green','olive green':'Olive Green','dark brown':'Dark Brown'}; selectedColorDisplay=m[selectedColor]||selectedColor; renderColorOptions(); loadTshirtImage(); updateSummaryUI(); })); }
    function generateColorPalette() { return ['#FF6633','#FFB399','#FF33FF','#FFFF99','#00B3E6','#E6B333','#3366E6','#999966','#99FF99','#B34D4D','#D4AF37','#FFFFFF','#000000']; }
    function renderColorPalette() { const pal=generateColorPalette(); const grid=document.getElementById('colorPalette'); grid.innerHTML=pal.map(col=>`<div class="color-swatch" style="background:${col};" data-color="${col}"></div>`).join(''); document.querySelectorAll('.color-swatch').forEach(sw=>sw.addEventListener('click',()=>applyColorToActive(sw.dataset.color))); }
    async function saveDesignAndAddToCart(isBuyNow=false) { if(!currentSize){ showToast('Select size',true); return false; } if(currentSide==='front') frontDesignJSON=fabricCanvas.toJSON(); else backDesignJSON=fabricCanvas.toJSON(); showLoading(true); try { const frontUrl=null, backUrl=null; cart.push({ id:Date.now(), styleId:currentStyle.id, styleName:currentStyle.displayName, price:currentStyle.price, size:currentSize, selectedColor:selectedColorDisplay, quantity:1, printMethod:currentPrintMethod, frontDesignJSON, backDesignJSON }); saveCart(); showToast('Added to cart'); if(isBuyNow) window.location.href='secure-checkout.html'; return true; } catch(e){ showToast('Error',true); } finally{ showLoading(false); } }
    function showLoading(show){ document.getElementById('globalLoadingOverlay').classList.toggle('active',show); }
    function initCanvas() { fabricCanvas = new fabric.Canvas('tshirtCanvas'); fabricCanvas.setWidth(550); fabricCanvas.setHeight(600); fabricCanvas.on('object:modified', () => { refreshTextBlocksList(); updateSideJSON(); }); fabricCanvas.on('selection:created', () => refreshTextBlocksList()); fabricCanvas.on('selection:cleared', () => refreshTextBlocksList()); fabricCanvas.on('object:added', () => { refreshTextBlocksList(); updateSideJSON(); }); fabricCanvas.on('object:removed', () => { refreshTextBlocksList(); updateSideJSON(); }); loadTshirtImage(); frontDesignJSON = fabricCanvas.toJSON(); backDesignJSON = null; refreshTextBlocksList(); }
    function switchSide(side){ if(currentSide===side) return; if(currentSide==='front') frontDesignJSON=fabricCanvas.toJSON(); else backDesignJSON=fabricCanvas.toJSON(); currentSide=side; if(side==='front' && frontDesignJSON) fabricCanvas.loadFromJSON(frontDesignJSON,()=>{ loadTshirtImage(); refreshTextBlocksList(); }); else if(side==='back' && backDesignJSON) fabricCanvas.loadFromJSON(backDesignJSON,()=>{ loadTshirtImage(); refreshTextBlocksList(); }); else { fabricCanvas.getObjects().forEach(o=>fabricCanvas.remove(o)); loadTshirtImage(); } updateSideJSON(); document.getElementById('frontSideBtn').classList.toggle('active',side==='front'); document.getElementById('backSideBtn').classList.toggle('active',side==='back'); }
    
    // Event binding
    document.getElementById('addTextBlockBtn').addEventListener('click', addNewTextBlock);
    document.getElementById('glowBtn').addEventListener('click', applyGlow);
    document.getElementById('borderBtn').addEventListener('click', applyBorder);
    document.getElementById('boldBtn').addEventListener('click', () => applyStyleToActive(obj => obj.set('fontWeight', obj.fontWeight==='bold'?'normal':'bold')));
    document.getElementById('italicBtn').addEventListener('click', () => applyStyleToActive(obj => obj.set('fontStyle', obj.fontStyle==='italic'?'normal':'italic')));
    document.getElementById('fontSelect').addEventListener('change', updateFontAndSize);
    document.getElementById('fontSizeSlider').addEventListener('input', (e) => { document.getElementById('fontSizeValue').innerText=e.target.value; updateFontAndSize(); });
    document.getElementById('deleteSelectedBtn').addEventListener('click', () => { const act=fabricCanvas.getActiveObject(); if(act){ fabricCanvas.remove(act); fabricCanvas.renderAll(); refreshTextBlocksList(); updateSideJSON(); showToast('Deleted'); } else showToast('Select an element',true); });
    document.getElementById('clearSideBtn').addEventListener('click', () => { fabricCanvas.getObjects().forEach(o=>fabricCanvas.remove(o)); fabricCanvas.renderAll(); refreshTextBlocksList(); updateSideJSON(); showToast('Side cleared'); });
    document.getElementById('uploadArea').addEventListener('click', () => document.getElementById('imageUpload').click());
    document.getElementById('imageUpload').addEventListener('change', (e) => { if(e.target.files[0]){ const reader=new FileReader(); reader.onload=(ev)=>{ fabric.Image.fromURL(ev.target.result, (img)=>{ img.scaleToWidth(200); img.set({ left:fabricCanvas.width/2, top:fabricCanvas.height/2, originX:'center', originY:'center' }); fabricCanvas.add(img); fabricCanvas.renderAll(); updateSideJSON(); showToast('Image added'); }); }; reader.readAsDataURL(e.target.files[0]); } });
    document.getElementById('frontSideBtn').addEventListener('click', () => switchSide('front'));
    document.getElementById('backSideBtn').addEventListener('click', () => switchSide('back'));
    document.getElementById('sizeSelect').addEventListener('change', (e) => { currentSize = e.target.value; updateSummaryUI(); });
    document.querySelectorAll('.print-option input').forEach(r => r.addEventListener('change', (e) => { if(e.target.checked) currentPrintMethod = e.target.value; updateSummaryUI(); }));
    document.getElementById('addToCartBtn').addEventListener('click', () => saveDesignAndAddToCart(false));
    document.getElementById('buyNowBtn').addEventListener('click', () => saveDesignAndAddToCart(true));
    document.getElementById('cartIconBtn').addEventListener('click', () => document.getElementById('cartSidebar').classList.add('open'));
    document.getElementById('closeCartBtn').addEventListener('click', () => document.getElementById('cartSidebar').classList.remove('open'));
    document.getElementById('cartCheckoutBtn').addEventListener('click', () => { if(cart.length===0) showToast('Cart empty',true); else window.location.href='secure-checkout.html'; });
    
    renderStyleStrip(); renderColorPalette(); renderColorOptions(); initCanvas(); updateSummaryUI(); loadCart();
</script>
</body>
</html>
