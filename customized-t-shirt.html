<body>
    <div id="app"></div>
    <div class="toast" id="toast"></div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCBZuwN4SKkXX1fEriYEwWDyTm-3uZnrKI",
            authDomain: "nexi-53897.firebaseapp.com",
            projectId: "nexi-53897",
            storageBucket: "nexi-53897.firebasestorage.app",
            messagingSenderId: "337349382612",
            appId: "1:337349382612:web:ae3c9b3d0fbf69f0e38641"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const ADMIN_USERNAME = "vedanta";
        const ADMIN_PASSWORD = "king@63061";
        
        let isLoggedIn = localStorage.getItem('adminLoggedIn') === 'true';
        let products = [];
        let allOrders = [];
        let regularOrders = [];
        let customOrders = [];
        
        let currentDateFilter = 'all';
        let currentStatusFilter = 'all';
        let customStartDate = '', customEndDate = '', tempStartDate = '', tempEndDate = '';
        
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.background = isError ? '#F44336' : '#D4AF37';
            toast.style.color = isError ? 'white' : '#050508';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
        
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m)); }
        
        function getPrintMethodBadge(printMethod) {
            if (printMethod === 'transparent') {
                return '<span class="print-method-badge"><i class="fas fa-eye"></i> ✨ Transparent Print (No Background)</span>';
            } else if (printMethod === 'fullbg') {
                return '<span class="print-method-badge"><i class="fas fa-fill-drip"></i> 🖼️ Print with Background</span>';
            }
            return '<span class="print-method-badge"><i class="fas fa-question-circle"></i> Not specified</span>';
        }
        
        async function loadOrders() {
            try {
                const snap = await db.collection('orders').orderBy('orderDate', 'desc').get();
                allOrders = [];
                snap.forEach(doc => allOrders.push({ id: doc.id, ...doc.data() }));
                // Identify custom orders: has frontDesignImage OR backDesignImage OR customDesignImage OR isCustomized OR isCustomOrder
                regularOrders = allOrders.filter(o => !o.frontDesignImage && !o.backDesignImage && !o.customDesignImage && !o.isCustomized && !o.isCustomOrder);
                customOrders = allOrders.filter(o => o.frontDesignImage || o.backDesignImage || o.customDesignImage || o.isCustomized === true || o.isCustomOrder === true);
                console.log("✅ Custom orders loaded:", customOrders.length);
                saveCache();
                renderOrdersTables();
                updateStats();
            } catch(e) { console.error("Failed to load orders", e); showToast("Error loading orders", true); }
        }
        
        function saveCache() {
            localStorage.setItem('admin_regular_cache', JSON.stringify(regularOrders));
            localStorage.setItem('admin_custom_cache', JSON.stringify(customOrders));
        }
        
        async function loadProducts() {
            try {
                const snap = await db.collection('products').orderBy('createdAt', 'desc').get();
                products = [];
                snap.forEach(doc => products.push({ id: doc.id, ...doc.data() }));
                renderProducts();
                updateStats();
            } catch(e) { console.log(e); }
        }
        
        function calculateSplitRevenue() {
            let regularTotal = 0, customTotal = 0;
            regularOrders.forEach(o => { if (o.status !== 'cancelled') regularTotal += (o.total || 0); });
            customOrders.forEach(o => { if (o.status !== 'cancelled') customTotal += (o.total || 0); });
            return { regularTotal, customTotal };
        }
        
        function updateStats() {
            const totalProducts = document.getElementById('totalProducts');
            const totalOrdersSpan = document.getElementById('totalOrders');
            const totalRevenueSpan = document.getElementById('totalRevenue');
            const totalCustomersSpan = document.getElementById('totalCustomers');
            const regularRevenueSpan = document.getElementById('regularRevenue');
            const customRevenueSpan = document.getElementById('customRevenue');
            if (totalProducts) totalProducts.innerText = products.length;
            const activeOrders = allOrders.filter(o => o.status !== 'cancelled').length;
            if (totalOrdersSpan) totalOrdersSpan.innerText = activeOrders;
            const totalRev = allOrders.filter(o => o.status !== 'cancelled').reduce((s,o) => s+(o.total||0),0);
            if (totalRevenueSpan) totalRevenueSpan.innerText = '₹' + totalRev.toLocaleString('en-IN');
            if (totalCustomersSpan) {
                const unique = new Set(allOrders.filter(o => o.status !== 'cancelled').map(o => o.customerEmail).filter(Boolean)).size;
                totalCustomersSpan.innerText = unique;
            }
            const revs = calculateSplitRevenue();
            if (regularRevenueSpan) regularRevenueSpan.innerText = '₹' + revs.regularTotal.toLocaleString('en-IN');
            if (customRevenueSpan) customRevenueSpan.innerText = '₹' + revs.customTotal.toLocaleString('en-IN');
        }
        
        function filterByDateAndStatus(ordersArray) {
            let filtered = [...ordersArray];
            if (currentStatusFilter !== 'all') filtered = filtered.filter(o => o.status === currentStatusFilter);
            filtered = filtered.filter(o => {
                const orderDate = o.orderDate ? new Date(o.orderDate) : null;
                if (!orderDate) return currentDateFilter === 'all';
                const today = new Date();
                if (currentDateFilter === 'today') return orderDate.toDateString() === today.toDateString();
                if (currentDateFilter === 'week') {
                    const start = new Date(today); start.setDate(today.getDate() - today.getDay()); start.setHours(0,0,0,0);
                    const end = new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59,999);
                    return orderDate >= start && orderDate <= end;
                }
                if (currentDateFilter === 'month') return orderDate.getMonth() === today.getMonth() && orderDate.getFullYear() === today.getFullYear();
                if (currentDateFilter === 'custom' && customStartDate) {
                    const [dS,mS,yS] = customStartDate.split('/');
                    const startD = new Date(parseInt(yS), parseInt(mS)-1, parseInt(dS)); startD.setHours(0,0,0,0);
                    if (customEndDate) {
                        const [dE,mE,yE] = customEndDate.split('/');
                        const endD = new Date(parseInt(yE), parseInt(mE)-1, parseInt(dE)); endD.setHours(23,59,59,999);
                        return orderDate >= startD && orderDate <= endD;
                    }
                    return orderDate.toDateString() === startD.toDateString();
                }
                return true;
            });
            filtered.sort((a,b) => new Date(b.orderDate) - new Date(a.orderDate));
            return filtered;
        }
        
        function renderOrdersTables() {
            const regularContainer = document.getElementById('regularOrdersList');
            const customContainer = document.getElementById('customOrdersList');
            if (!regularContainer || !customContainer) return;
            const filteredRegular = filterByDateAndStatus(regularOrders);
            const filteredCustom = filterByDateAndStatus(customOrders);
            regularContainer.innerHTML = filteredRegular.length ? filteredRegular.map(o => renderOrderRow(o, false)).join('') : '<tr><td colspan="7" style="text-align:center;padding:40px;">📭 No regular orders</td></tr>';
            customContainer.innerHTML = filteredCustom.length ? filteredCustom.map(o => renderOrderRow(o, true)).join('') : '<tr><td colspan="7" style="text-align:center;padding:40px;">🎨 No custom design orders yet</td></tr>';
            updateStats();
        }
        
        function renderOrderRow(order, isCustom) {
            const statusClass = (() => {
                switch(order.status) {
                    case 'confirmed': return 'status-confirmed';
                    case 'processing': return 'status-processing';
                    case 'shipped': return 'status-shipped';
                    case 'delivered': return 'status-delivered';
                    case 'cancelled': return 'status-cancelled';
                    default: return 'status-confirmed';
                }
            })();
            const customFlag = isCustom ? `<span class="custom-badge"><i class="fas fa-paintbrush"></i> CUSTOM DESIGN</span>` : '';
            return `
                <tr>
                    <td>${order.orderId || order.id} ${customFlag}</td>
                    <td>${order.orderDate ? new Date(order.orderDate).toLocaleDateString('en-IN') : 'N/A'}</td>
                    <td>${escapeHtml(order.customerName || 'Guest')}</td>
                    <td>₹${(order.total || 0).toLocaleString('en-IN')}</td>
                    <td><span class="status-badge ${statusClass}">${order.status || 'Confirmed'}</span></td>
                    <td><select class="status-select" onchange="updateOrderStatus('${order.id}', this.value)">
                        <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                        <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>Processing</option>
                        <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                        <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                        <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                    </select></td>
                    <td><button class="view-details" onclick="viewOrderDetails('${order.id}')"><i class="fas fa-eye"></i> View</button>
                    <button class="delete-order-btn" onclick="deleteOrder('${order.id}')"><i class="fas fa-trash"></i> Delete</button></td>
                </tr>
            `;
        }
        
        async function updateOrderStatus(orderId, newStatus) {
            try {
                await db.collection('orders').doc(orderId).update({ status: newStatus, updatedAt: new Date().toISOString() });
                showToast(`✅ Status updated to ${newStatus}`);
                await loadOrders();
                if (document.querySelector('.tab-btn.active')?.dataset.tab === 'orders') renderOrdersTables();
            } catch(e) { showToast('Update failed', true); }
        }
        
        async function deleteOrder(orderId) {
            if (confirm('⚠️ Permanently delete this order?')) {
                try {
                    await db.collection('orders').doc(orderId).delete();
                    showToast('✅ Order deleted');
                    await loadOrders();
                    if (document.querySelector('.tab-btn.active')?.dataset.tab === 'orders') renderOrdersTables();
                } catch(e) { showToast('Delete failed', true); }
            }
        }
        
        function downloadImageFromUrl(url, filename) {
            if (!url) { showToast("No image available", true); return; }
            fetch(url, { mode: 'cors' })
                .then(res => res.blob())
                .then(blob => {
                    const link = document.createElement('a');
                    const objectUrl = URL.createObjectURL(blob);
                    link.href = objectUrl;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(objectUrl);
                    showToast(`Downloading ${filename}`);
                })
                .catch(err => { console.error("Download error", err); showToast("Download failed", true); });
        }
        
        function viewOrderDetails(orderId) {
            const order = allOrders.find(o => o.id == orderId);
            if (!order) return;
            
            const isCustom = !!(order.frontDesignImage || order.backDesignImage || order.customDesignImage || order.isCustomized || order.isCustomOrder);
            const frontImage = order.frontDesignImage || order.customDesignImage || null;
            const backImage = order.backDesignImage || null;
            const selectedColor = order.selectedColor || order.tshirtColor || order.color || 'Black';
            const printMethod = order.printMethod || order.items?.[0]?.printMethod || null;
            
            let itemsHtml = '';
            if (order.items && order.items.length) {
                itemsHtml = order.items.map(item => {
                    const product = products.find(p => p.id == item.id);
                    const imgUrl = (product && product.images && product.images[0]) ? product.images[0] : null;
                    return `<div style="display:flex; gap:12px; margin-bottom:14px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:12px;">
                        <div style="width:55px;height:55px;background:#0E0E14;border-radius:12px;overflow:hidden;">${imgUrl ? `<img src="${imgUrl}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-tshirt" style="font-size:28px;margin:14px;"></i>'}</div>
                        <div style="flex:1;"><strong>${escapeHtml(item.name)}</strong><br>Qty: ${item.quantity} × ₹${(item.price||0).toLocaleString()}<br>Size: ${item.size || item.selectedSize || 'N/A'} | Color: ${item.selectedColor || item.color || selectedColor}</div>
                        <div>₹${((item.price||0)*(item.quantity||1)).toLocaleString()}</div>
                    </div>`;
                }).join('');
            }
            
            let customBlock = '';
            if (isCustom && (frontImage || backImage)) {
                customBlock = `
                    <div class="custom-design-preview">
                        <div class="custom-image-grid">
                            ${frontImage ? `
                            <div class="custom-image-card">
                                <h4><i class="fas fa-tshirt"></i> 👕 FRONT DESIGN - Print File</h4>
                                <img src="${frontImage}" class="preview-img" alt="Front Design" onerror="this.src='https://placehold.co/400x400?text=Front+Design+Preview'">
                                <button class="download-btn" onclick="downloadImageFromUrl('${frontImage}', 'front_design_${order.orderId || order.id}.png')"><i class="fas fa-download"></i> Download Front Design</button>
                            </div>
                            ` : ''}
                            ${backImage ? `
                            <div class="custom-image-card">
                                <h4><i class="fas fa-undo-alt"></i> 🔙 BACK DESIGN - Print File</h4>
                                <img src="${backImage}" class="preview-img" alt="Back Design" onerror="this.src='https://placehold.co/400x400?text=Back+Design+Preview'">
                                <button class="download-btn" onclick="downloadImageFromUrl('${backImage}', 'back_design_${order.orderId || order.id}.png')"><i class="fas fa-download"></i> Download Back Design</button>
                            </div>
                            ` : ''}
                        </div>
                        <div style="margin-top:16px; padding:12px; background:rgba(0,0,0,0.3); border-radius:20px;">
                            ${selectedColor ? `<span class="design-attr"><i class="fas fa-palette"></i> T-Shirt Base Color: ${escapeHtml(selectedColor)}</span>` : ''}
                            ${order.size ? `<span class="design-attr"><i class="fas fa-ruler"></i> Size: ${escapeHtml(order.size)}</span>` : ''}
                            ${printMethod ? getPrintMethodBadge(printMethod) : '<span class="print-method-badge"><i class="fas fa-question-circle"></i> Print Method: Not specified</span>'}
                            ${order.printMethod ? '' : (order.items?.[0]?.printMethod ? getPrintMethodBadge(order.items[0].printMethod) : '')}
                        </div>
                    </div>
                `;
            } else if (isCustom && !frontImage && !backImage) {
                customBlock = `<div class="custom-design-preview"><strong>🎨 Custom order (design details pending)</strong></div>`;
            }
            
            document.getElementById('orderDetailContent').innerHTML = `
                <div class="order-detail-row"><strong>📋 Order ID:</strong> ${order.orderId || order.id} ${isCustom ? '<span class="custom-badge">CUSTOM DESIGN</span>' : ''}</div>
                <div class="order-detail-row"><strong>📅 Date:</strong> ${new Date(order.orderDate).toLocaleString()}</div>
                <div class="order-detail-row"><strong>📊 Status:</strong> <span class="status-badge status-${order.status || 'confirmed'}">${order.status || 'Confirmed'}</span></div>
                <div class="order-detail-row"><strong>💳 Payment:</strong> ${order.paymentMethod || 'Cash on Delivery'}</div>
                <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
                <strong>👤 Customer Details</strong>
                <div class="order-detail-row"><strong>Name:</strong> ${escapeHtml(order.customerName || 'Guest')}</div>
                <div class="order-detail-row"><strong>📞 Phone:</strong> ${order.customerPhone || 'N/A'}</div>
                <div class="order-detail-row"><strong>✉️ Email:</strong> ${order.customerEmail || 'N/A'}</div>
                <div class="order-detail-row"><strong>📍 Address:</strong> ${order.shippingAddress?.address || 'N/A'}, ${order.shippingAddress?.city || ''}, ${order.shippingAddress?.state || ''} - ${order.shippingAddress?.pincode || ''}</div>
                <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
                <strong>🛍️ Items Ordered</strong>
                ${itemsHtml || '<div class="order-detail-row">No product items</div>'}
                ${customBlock}
                <div style="margin-top:16px; border-top:1px solid #D4AF37;"></div>
                <div class="order-detail-row"><strong>💰 Grand Total:</strong> <span style="color:#D4AF37; font-size:20px;">₹${(order.total || 0).toLocaleString('en-IN')}</span></div>
            `;
            document.getElementById('orderModal').classList.add('show');
        }
        
        function closeOrderModal() { document.getElementById('orderModal').classList.remove('show'); }
        
        function renderProducts() {
            const container = document.getElementById('productsList');
            if (!container) return;
            if (!products.length) { container.innerHTML = '<div style="text-align:center;padding:40px;">📦 No products</div>'; return; }
            container.innerHTML = products.map(p => `
                <div class="product-item">
                    <div class="product-img-preview">${p.images && p.images[0] ? `<img src="${p.images[0]}">` : `<i class="fas fa-gem"></i>`}</div>
                    <h4>${escapeHtml(p.name)}</h4>
                    <div class="product-price">₹${(p.price||0).toLocaleString()}</div>
                    <div class="product-actions"><button class="edit-btn" onclick="alert('Edit product feature coming soon')">Edit</button><button class="delete-btn" onclick="alert('Delete disabled in demo')">Delete</button></div>
                </div>
            `).join('');
        }
        
        function applyDateFilter(filter) { currentDateFilter = filter; if(filter !== 'custom') { customStartDate=''; customEndDate=''; } renderOrdersTables(); }
        function applyStatusFilter(filter) { currentStatusFilter = filter; renderOrdersTables(); }
        function openDatePicker() { document.getElementById('datepickerModal').classList.add('show'); }
        function closeDatePicker() { document.getElementById('datepickerModal').classList.remove('show'); }
        function setStartDate() { const d = prompt("Start date (dd/mm/yyyy)"); if(d && d.match(/^\d{2}\/\d{2}\/\d{4}$/)) { tempStartDate = d; document.getElementById('startDateDisplay').innerHTML = `<span class="selected-date">${tempStartDate}</span>`; } }
        function setEndDate() { const d = prompt("End date (dd/mm/yyyy) optional"); if(d && d.match(/^\d{2}\/\d{2}\/\d{4}$/)) { tempEndDate = d; document.getElementById('endDateDisplay').innerHTML = `<span class="selected-date">${tempEndDate}</span>`; } }
        function applyDateRange() { if(!tempStartDate) { showToast("Start date required",true); return; } customStartDate=tempStartDate; customEndDate=tempEndDate||''; currentDateFilter='custom'; closeDatePicker(); renderOrdersTables(); showToast(`Custom range: ${customStartDate} ${customEndDate ? '→ '+customEndDate : ''}`); }
        function clearDateRange() { customStartDate=''; customEndDate=''; tempStartDate=''; tempEndDate=''; currentDateFilter='all'; renderOrdersTables(); showToast("Date filter cleared"); }
        function goToAddProduct() { window.location.href = 'admin-add-product.html'; }
        function openReturnManagement() { window.location.href = 'return.html'; }
        
        function renderDashboard() {
            document.getElementById('app').innerHTML = `
                <div class="header"><div class="logo"><h1>VEDANTA ADMIN | CUSTOM + REGULAR</h1></div><div class="header-buttons"><button class="return-manage-btn" id="returnManageBtn"><i class="fas fa-undo-alt"></i> Returns</button><button class="logout-btn" id="logoutBtn">Logout</button></div></div>
                <div class="stats-grid">${['totalProducts','totalOrders','totalRevenue','totalCustomers','regularRevenue','customRevenue'].map(id => `<div class="stat-card"><i class="${id==='regularRevenue'?'fas fa-store':id==='customRevenue'?'fas fa-paintbrush':id==='totalProducts'?'fas fa-box':id==='totalOrders'?'fas fa-shopping-cart':id==='totalRevenue'?'fas fa-rupee-sign':'fas fa-users'}"></i><div class="stat-number" id="${id}">0</div><div class="stat-label">${id==='regularRevenue'?'Regular Revenue':id==='customRevenue'?'Custom Revenue':id==='totalProducts'?'Products':id==='totalOrders'?'Total Orders':id==='totalRevenue'?'Total Revenue':'Customers'}</div></div>`).join('')}</div>
                <div class="tabs"><button class="tab-btn active" data-tab="products">📦 Products</button><button class="tab-btn" data-tab="orders">📋 Orders</button></div>
                <div class="tab-content active" id="productsTab"><div class="add-product-header"><h3>All Products</h3><button class="add-product-link" id="addProductBtn">+ Add New Product</button></div><div class="products-list" id="productsList"></div></div>
                <div class="tab-content" id="ordersTab"><div class="order-filters"><div class="filter-group"><span>📅 Date:</span><button onclick="applyDateFilter('all')">All</button><button onclick="applyDateFilter('today')">Today</button><button onclick="applyDateFilter('week')">Week</button><button onclick="applyDateFilter('month')">Month</button><div class="date-range-box" onclick="openDatePicker()"><i class="fas fa-calendar-alt"></i><span class="date-range-text">Custom range</span></div><button onclick="clearDateRange()">Clear</button></div><div class="filter-group"><span>Status:</span><button onclick="applyStatusFilter('all')">All</button><button onclick="applyStatusFilter('confirmed')">Confirmed</button><button onclick="applyStatusFilter('processing')">Processing</button><button onclick="applyStatusFilter('shipped')">Shipped</button><button onclick="applyStatusFilter('delivered')">Delivered</button><button onclick="applyStatusFilter('cancelled')">Cancelled</button></div></div>
                    <div class="section-title"><i class="fas fa-box-open"></i> Regular Orders</div><div class="orders-table"><table><thead><tr><th>Order ID</th><th>Date</th><th>Customer</th><th>Amount</th><th>Status</th><th>Update</th><th>Actions</th></tr></thead><tbody id="regularOrdersList"></tbody></table></div>
                    <div class="section-title"><i class="fas fa-paintbrush"></i> Custom T-Shirt / Design Orders (Front + Back Designs)</div><div class="orders-table"><table><thead><tr><th>Order ID</th><th>Date</th><th>Customer</th><th>Amount</th><th>Status</th><th>Update</th><th>Actions</th></tr></thead><tbody id="customOrdersList"></tbody></table></div>
                </div>
                <div id="orderModal" class="order-modal"><div class="order-modal-content"><div class="order-modal-header"><h3>📄 Order Details</h3><button class="close-order-modal" onclick="closeOrderModal()">&times;</button></div><div id="orderDetailContent"></div></div></div>
                <div id="datepickerModal" class="datepicker-modal"><div class="datepicker-content"><h3>Custom Range</h3><div class="datepicker-input-group"><label>Start Date</label><div class="clickable-date-input" onclick="setStartDate()"><span id="startDateDisplay"><span class="placeholder-text">dd/mm/yyyy</span></span><i class="fas fa-calendar"></i></div></div><div class="datepicker-input-group"><label>End Date</label><div class="clickable-date-input" onclick="setEndDate()"><span id="endDateDisplay"><span class="placeholder-text">dd/mm/yyyy</span></span><i class="fas fa-calendar"></i></div></div><div class="datepicker-buttons"><button class="datepicker-cancel" onclick="closeDatePicker()">Cancel</button><button class="datepicker-apply" onclick="applyDateRange()">Apply</button></div></div></div>
            `;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
                document.getElementById(`${btn.dataset.tab}Tab`).classList.add('active');
                if(btn.dataset.tab === 'orders') renderOrdersTables();
            }));
            document.getElementById('addProductBtn')?.addEventListener('click', goToAddProduct);
            document.getElementById('logoutBtn')?.addEventListener('click', () => { localStorage.removeItem('adminLoggedIn'); isLoggedIn=false; renderLoginPage(); });
            document.getElementById('returnManageBtn')?.addEventListener('click', openReturnManagement);
            loadProducts(); loadOrders();
        }
        
        function renderLoginPage() {
            document.getElementById('app').innerHTML = `<div class="login-container"><div class="login-card"><h2>VEDANTA ADMIN</h2><p>Login</p><div class="input-group"><label>Username</label><input type="text" id="adminUsername"></div><div class="input-group"><label>Password</label><input type="password" id="adminPassword"></div><button class="login-btn" id="loginBtn">Login</button><div id="errorMsg" style="color:#F44336;text-align:center;display:none;margin-top:15px;">Invalid credentials</div></div></div>`;
            document.getElementById('loginBtn').addEventListener('click', () => {
                const u = document.getElementById('adminUsername').value.trim();
                const p = document.getElementById('adminPassword').value.trim();
                if(u===ADMIN_USERNAME && p===ADMIN_PASSWORD) { localStorage.setItem('adminLoggedIn','true'); showToast("Welcome Admin!"); renderDashboard(); }
                else { document.getElementById('errorMsg').style.display='block'; setTimeout(()=>document.getElementById('errorMsg').style.display='none',2000); }
            });
        }
        
        window.updateOrderStatus = updateOrderStatus;
        window.deleteOrder = deleteOrder;
        window.viewOrderDetails = viewOrderDetails;
        window.closeOrderModal = closeOrderModal;
        window.applyDateFilter = applyDateFilter;
        window.applyStatusFilter = applyStatusFilter;
        window.openDatePicker = openDatePicker;
        window.closeDatePicker = closeDatePicker;
        window.applyDateRange = applyDateRange;
        window.clearDateRange = clearDateRange;
        window.setStartDate = setStartDate;
        window.setEndDate = setEndDate;
        window.downloadImageFromUrl = downloadImageFromUrl;
        
        if(isLoggedIn) renderDashboard(); else renderLoginPage();
        if(typeof db !== 'undefined') {
            db.collection('orders').onSnapshot(() => { if(isLoggedIn) { loadOrders(); if(document.querySelector('.tab-btn.active')?.dataset.tab === 'orders') renderOrdersTables(); } });
            db.collection('products').onSnapshot(() => { if(isLoggedIn) loadProducts(); });
        }
    </script>
</body>
</html>
