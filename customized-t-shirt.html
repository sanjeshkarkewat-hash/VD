            padding: 0;
            box-sizing: border-box;
        }

        }

            display: flex;
            flex-direction: column;
        }

        /* Header */

        }

            font-weight: 800;

            background-clip: text;
            color: transparent;

            min-width: 360px;

            flex-direction: column;
            align-items: center;
            gap: 18px;

            font-weight: 700;
            margin-bottom: 16px;
            color: #D4AF37;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .style-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
        }

        .style-card {
            background: rgba(30, 30, 42, 0.7);
            border-radius: 20px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: 0.2s;
        }

        .style-card.active {
            border-color: #D4AF37;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(255, 140, 0, 0.1));
            box-shadow: 0 6px 14px rgba(212, 175, 55, 0.2);
        }

        .style-img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 10px;
            background: #1a1a2a;
        }

        .style-name {
            font-weight: 600;
            font-size: 14px;
        }

        .style-price {
            color: #D4AF37;
            font-size: 13px;
            font-weight: 700;
        }

        .tool-group {
            margin-bottom: 20px;
        }

        .tool-group label {
            font-size: 12px;
            font-weight: 600;
            color: #D4AF37;
            display: block;
            margin-bottom: 8px;
        }

        .effect-btn.active, .btn-icon:hover {
            background: #D4AF37;
            color: #050508;

        .upload-area {

        .print-option {

            gap: 5px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.3);

        .color-option.active {
            border-color: #D4AF37;
            background: rgba(212, 175, 55, 0.2);
        }

        .color-swatch-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }

        .order-detail {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
        }

        .order-total {
            font-size: 22px;
            font-weight: 800;
            color: #D4AF37;
            margin: 15px 0;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .btn-add, .btn-buy {
            flex: 1;
            padding: 12px;
            border-radius: 50px;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
        }

        .btn-add {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #D4AF37;
            color: #D4AF37;
        }

        .btn-buy {
            background: linear-gradient(135deg, #FF4500, #FF8C00);
            border: none;
            color: white;
        }

        /* cart sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -440px;
            width: 400px;
            height: 100vh;
            background: rgba(12, 12, 20, 0.98);
            backdrop-filter: blur(24px);
            border-left: 2px solid #D4AF37;
            z-index: 2000;
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #D4AF37;
            color: #0A0A0F;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: bold;
            z-index: 10000;
            display: none;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(12px);
            z-index: 30000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            flex-direction: column;
        }

        .loading-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top: 4px solid #D4AF37;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 20000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #15151f;
            border-radius: 32px;
            padding: 28px;
            width: 90%;
            max-width: 360px;
            border: 1px solid #D4AF37;
        }

        @media (max-width: 1000px) {
            .dashboard {
                flex-direction: column;
            }

            .tools-panel, .order-panel-modern {
                position: static;
            }
        }

        .instruction-text {
            font-size: 11px;
            color: #aaa;
            margin-top: 8px;
            text-align: center;
        }

        .slider-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
    </style>
</head>

    function getDynamicImagePath(product, color, side){ return `${product} ${color} color ${side==='front'?'frunt t shirt.jpeg':'back t shirt.jpeg'}`.replace(/\s+/g,' '); }
    function loadTshirtImage(product, color, side, preserve=true){ let path=getDynamicImagePath(product,color,side); let curObjects=preserve?fabricCanvas.getObjects():[]; let img=new Image(); img.crossOrigin="Anonymous"; img.onload=()=>{ let bgImg=new fabric.Image(img); let scale=Math.max(fabricCanvas.width/bgImg.width, fabricCanvas.height/bgImg.height); fabricCanvas.setBackgroundImage(bgImg,()=>{ if(preserve) curObjects.forEach(o=>fabricCanvas.add(o)); fabricCanvas.renderAll();},{scaleX:scale,scaleY:scale}); }; img.src=path; img.onerror=()=>{ fabricCanvas.setBackgroundColor('#1a1a2e',()=>{if(preserve) curObjects.forEach(o=>fabricCanvas.add(o)); fabricCanvas.renderAll();}); }; }
    async function saveDesignToFirebase(side, designJSON){ if(!designJSON) return null; try{ let tempCanvas=document.createElement('canvas'); tempCanvas.width=550;tempCanvas.height=600; let tempFabric=new fabric.Canvas(tempCanvas); let path=getDynamicImagePath(currentStyle.name,selectedColor,side); await new Promise((res)=>{ let imgEl=new Image(); imgEl.crossOrigin="Anonymous"; imgEl.onload=()=>{ let fImg=new fabric.Image(imgEl); let s=Math.max(tempCanvas.width/fImg.width, tempCanvas.height/fImg.height); tempFabric.setBackgroundImage(fImg,()=>{ tempFabric.loadFromJSON(designJSON,()=>{tempFabric.renderAll();res();});},{scaleX:s,scaleY:s});}; imgEl.src=path; imgEl.onerror=()=>{ tempFabric.setBackgroundColor('#1a1a2e',()=>{tempFabric.loadFromJSON(designJSON,()=>{tempFabric.renderAll();res();});});};}); let dataURL=tempFabric.toDataURL({format:'png',multiplier:2}); let blob=await (await fetch(dataURL)).blob(); let ref=storage.ref(`custom/${side}_${Date.now()}.png`); await ref.put(blob); let url=await ref.getDownloadURL(); tempFabric.dispose(); return url; }catch(e){ console.warn(e); return null; } }
    async function saveBothSides(){ if(currentSide==='front') frontDesignJSON=fabricCanvas.toJSON(); else backDesignJSON=fabricCanvas.toJSON(); let frontURL=await saveDesignToFirebase('front',frontDesignJSON); let backURL=await saveDesignToFirebase('back',backDesignJSON); if(frontURL) document.getElementById('summaryFront').innerHTML='<i class="fas fa-check-circle"></i> Custom'; if(backURL) document.getElementById('summaryBack').innerHTML='<i class="fas fa-check-circle"></i> Custom'; return {frontURL,backURL}; }
    async function addToCartHandler(){ if(!currentSize){ showToast('Select size',true); return false; } showLoading('Adding...'); try{ if(currentSide==='front') frontDesignJSON=fabricCanvas.toJSON(); else backDesignJSON=fabricCanvas.toJSON(); let {frontURL,backURL}=await saveBothSides(); if(!frontURL||!backURL) throw new Error('upload fail'); cart.push({id:Date.now(), styleName:currentStyle.displayName, price:currentStyle.price, frontDesignImage:frontURL, backDesignImage:backURL, size:currentSize, printMethod:currentPrintMethod, selectedColor:selectedColorDisplay, quantity:1}); localStorage.setItem('vedanta_custom_cart',JSON.stringify(cart)); updateCartUI(); showToast('Added to cart'); return true; }catch(e){ showToast('Failed',true); return false; }finally{ hideLoading(); } }
    async function buyNowAction(){ if(!currentSize){ showToast('Select size',true); return; } if(!auth.currentUser && !localStorage.getItem('vedantaUser')){ pendingBuyAfterLogin=true; document.getElementById('loginModal').classList.add('show'); showToast('Login required'); return; } showLoading('Preparing...'); try{ if(currentSide==='front') frontDesignJSON=fabricCanvas.toJSON(); else backDesignJSON=fabricCanvas.toJSON(); let {frontURL,backURL}=await saveBothSides(); localStorage.setItem('customCheckoutData',JSON.stringify({isCustomized:true,frontDesignImage:frontURL,backDesignImage:backURL,tshirtType:currentStyle.displayName,selectedColor:selectedColorDisplay,size:currentSize,price:currentStyle.price})); window.location.href='secure-checkout.html'; }catch(e){ showToast('Error',true); hideLoading(); } }
    function updateCartUI(){ let cartArr=JSON.parse(localStorage.getItem('vedanta_custom_cart')||'[]'); document.getElementById('cartCount').innerText=cartArr.reduce((a,b)=>a+b.quantity,0); let container=document.getElementById('cartItemsList'); if(cartArr.length===0){ container.innerHTML='<div style="text-align:center;">Empty cart</div>'; document.getElementById('cartSubtotal').innerText='₹0'; return; } let sub=0; container.innerHTML=''; cartArr.forEach((it,idx)=>{ sub+=it.price*it.quantity; container.innerHTML+=`<div style="background:#1e1e2e; margin-bottom:12px; border-radius:20px; padding:12px;"><div><b>${it.styleName}</b> ₹${it.price}</div><div>${it.size} | ${it.selectedColor}</div><div style="display:flex; gap:8px; margin-top:8px;"><button data-idx="${idx}" class="qty-dec">-</button><span>${it.quantity}</span><button data-idx="${idx}" class="qty-inc">+</button><button data-idx="${idx}" class="remove-item">Remove</button></div></div>`; }); document.getElementById('cartSubtotal').innerText=`₹${sub}`; document.querySelectorAll('.qty-dec').forEach(b=>b.onclick=()=>{ let i=parseInt(b.dataset.idx); let c=JSON.parse(localStorage.getItem('vedanta_custom_cart')||'[]'); if(c[i].quantity>1)c[i].quantity--; else c.splice(i,1); localStorage.setItem('vedanta_custom_cart',JSON.stringify(c)); updateCartUI(); }); document.querySelectorAll('.qty-inc').forEach(b=>b.onclick=()=>{ let i=parseInt(b.dataset.idx); let c=JSON.parse(localStorage.getItem('vedanta_custom_cart')||'[]'); c[i].quantity++; localStorage.setItem('vedanta_custom_cart',JSON.stringify(c)); updateCartUI(); }); document.querySelectorAll('.remove-item').forEach(b=>b.onclick=()=>{ let i=parseInt(b.dataset.idx); let c=JSON.parse(localStorage.getItem('vedanta_custom_cart')||'[]'); c.splice(i,1); localStorage.setItem('vedanta_custom_cart',JSON.stringify(c)); updateCartUI(); }); }
    function initCanvas(){ fabricCanvas=new fabric.Canvas('tshirtCanvas'); fabricCanvas.setWidth(550); fabricCanvas.setHeight(600); loadTshirtImage(currentStyle.name,selectedColor,currentSide,false); frontDesignJSON=fabricCanvas.toJSON(); }
    function switchSide(side){ if(currentSide===side) return; if(currentSide==='front') frontDesignJSON=fabricCanvas.toJSON(); else backDesignJSON=fabricCanvas.toJSON(); currentSide=side; if(side==='front' && frontDesignJSON) fabricCanvas.loadFromJSON(frontDesignJSON,()=>loadTshirtImage(currentStyle.name,selectedColor,'front',false)); else if(side==='back' && backDesignJSON) fabricCanvas.loadFromJSON(backDesignJSON,()=>loadTshirtImage(currentStyle.name,selectedColor,'back',false)); else { fabricCanvas.clear(); loadTshirtImage(currentStyle.name,selectedColor,side,false); } document.getElementById('frontSideBtn').classList.toggle('active',side==='front'); document.getElementById('backSideBtn').classList.toggle('active',side==='back'); }
    function renderColorSelector(){ let container=document.getElementById('colorOptionsContainer'); container.innerHTML=currentStyle.colors.map(c=>`<div class="color-option ${selectedColor===c?'active':''}" data-color="${c}"><div class="color-swatch-circle" style="background:${colorCodeMap[c]||'#aaa'}"></div><span>${colorDisplayMap[c]||c}</span></div>`).join(''); document.querySelectorAll('.color-option').forEach(el=>el.addEventListener('click',()=>{ selectedColor=el.dataset.color; selectedColorDisplay=colorDisplayMap[selectedColor]||selectedColor; renderColorSelector(); loadTshirtImage(currentStyle.name,selectedColor,currentSide,true); document.getElementById('summaryColor').innerText=selectedColorDisplay; })); }
    function renderStyles(){ let grid=document.getElementById('styleGrid'); if(grid){ grid.innerHTML=tshirtStyles.map(s=>`<div class="style-card ${currentStyle.id===s.id?'active':''}" data-id="${s.id}"><img class="style-img" src="${s.previewImg}" onerror="this.src='https://placehold.co/300x300/1a1a2e/D4AF37?text=${s.displayName}'"><div>${s.displayName}</div><div class="style-price">₹${s.price}</div></div>`).join(''); document.querySelectorAll('.style-card').forEach(c=>c.addEventListener('click',()=>{ let found=tshirtStyles.find(ss=>ss.id===c.dataset.id); if(found){ currentStyle=found; selectedColor=currentStyle.colors[0]; selectedColorDisplay=colorDisplayMap[selectedColor]||selectedColor; renderStyles(); renderColorSelector(); loadTshirtImage(currentStyle.name,selectedColor,currentSide,true); document.getElementById('summaryStyle').innerText=currentStyle.displayName; document.getElementById('totalPrice').innerHTML=`₹${currentStyle.price}`; } })); } }
    function addText(){ let val=document.getElementById('textInput').value.trim(); if(!val) return; let txt=new fabric.IText(val,{left:fabricCanvas.width/2,top:fabricCanvas.height/2,fontFamily:document.getElementById('fontSelect').value,fill:'#D4AF37',fontSize:parseInt(document.getElementById('fontSizeSlider').value),originX:'center',originY:'center'}); fabricCanvas.add(txt); fabricCanvas.setActiveObject(txt); fabricCanvas.renderAll(); }
    function generatePalette(){ return ['#FF6633','#FFB399','#D4AF37','#00B3E6','#3366E6','#99FF99','#B34D4D','#FF33FF']; }
    function renderPalette(){ let container=document.getElementById('colorPalette'); container.innerHTML=''; generatePalette().forEach(c=>{ let swatch=document.createElement('div'); swatch.className='color-swatch'; swatch.style.backgroundColor=c; swatch.onclick=()=>{ let act=fabricCanvas.getActiveObject(); if(act&&(act.type==='i-text'||act.type==='text')){ act.set('fill',c); fabricCanvas.renderAll(); showToast('Color applied'); }else showToast('Select text first',true); }; container.appendChild(swatch); }); }
    document.getElementById('addTextBtn').onclick=addText; document.getElementById('frontSideBtn').onclick=()=>switchSide('front'); document.getElementById('backSideBtn').onclick=()=>switchSide('back'); document.getElementById('sizeSelect').onchange=e=>{currentSize=e.target.value; document.getElementById('summarySize').innerHTML=currentSize;}; document.querySelectorAll('.print-option input').forEach(r=>r.onchange=e=>{if(e.target.checked)currentPrintMethod=e.target.value;document.getElementById('summaryPrintMethod').innerHTML=currentPrintMethod==='transparent'?'Transparent':'Full BG';}); document.getElementById('addToCartBtn').onclick=addToCartHandler; document.getElementById('buyNowBtn').onclick=buyNowAction; document.getElementById('saveImageBtn').onclick=async()=>{ showLoading('Saving images...'); await saveBothSides(); hideLoading(); showToast('Designs saved'); }; document.getElementById('cartIconBtn').onclick=()=>document.getElementById('cartSidebar').classList.add('open'); document.getElementById('closeCartBtn').onclick=()=>document.getElementById('cartSidebar').classList.remove('open'); document.getElementById('cartCheckoutBtn').onclick=()=>{ if(JSON.parse(localStorage.getItem('vedanta_custom_cart')||'[]').length===0) showToast('Cart empty',true); else window.location.href='secure-checkout.html'; }; document.getElementById('uploadArea').onclick=()=>document.getElementById('imageUpload').click(); document.getElementById('imageUpload').onchange=e=>{ if(e.target.files[0]){ let reader=new FileReader(); reader.onload=ev=>{ fabric.Image.fromURL(ev.target.result,img=>{ img.scaleToWidth(180); img.set({left:fabricCanvas.width/2,top:fabricCanvas.height/2,originX:'center',originY:'center'}); fabricCanvas.add(img); fabricCanvas.renderAll(); }); }; reader.readAsDataURL(e.target.files[0]); } }; document.getElementById('deleteBtn').onclick=()=>{ let act=fabricCanvas.getActiveObject(); if(act){ fabricCanvas.remove(act); fabricCanvas.renderAll(); }else showToast('Select element',true);}; document.getElementById('clearBtn').onclick=()=>{ fabricCanvas.getObjects().forEach(o=>fabricCanvas.remove(o)); fabricCanvas.renderAll(); if(currentSide==='front')frontDesignJSON=fabricCanvas.toJSON(); else backDesignJSON=fabricCanvas.toJSON(); showToast('Side cleared');}; document.getElementById('glowBtn').onclick=()=>{let act=fabricCanvas.getActiveObject(); if(act&&(act.type==='i-text')){ let shadow=act.shadow?null:`${document.getElementById('glowColorPicker').value} 0px 0px ${document.getElementById('glowSizeSlider').value}px`; act.set('shadow',shadow); fabricCanvas.renderAll(); document.getElementById('glowControls').style.display=shadow?'block':'none';}}; document.getElementById('roundedBtn').onclick=()=>{let act=fabricCanvas.getActiveObject(); if(act&&act.type==='i-text'){act.set('rx',act.rx?0:50);act.set('ry',act.ry?0:50);fabricCanvas.renderAll();}}; document.getElementById('borderBtn').onclick=()=>{let act=fabricCanvas.getActiveObject(); if(act){act.set('stroke',act.stroke?null:'#D4AF37');act.set('strokeWidth',act.strokeWidth?0:2);fabricCanvas.renderAll();}}; document.getElementById('flipHorizontalBtn').onclick=()=>{let o=fabricCanvas.getActiveObject(); if(o){o.set('flipX',!o.flipX);fabricCanvas.renderAll();}}; document.getElementById('flipVerticalBtn').onclick=()=>{let o=fabricCanvas.getActiveObject(); if(o){o.set('flipY',!o.flipY);fabricCanvas.renderAll();}}; document.getElementById('boldBtn').onclick=()=>{let o=fabricCanvas.getActiveObject(); if(o&&o.type==='i-text'){o.set('fontWeight',o.fontWeight==='bold'?'normal':'bold');fabricCanvas.renderAll();}}; document.getElementById('fontSizeSlider').oninput=e=>{document.getElementById('fontSizeValue').innerText=e.target.value+'px'; let o=fabricCanvas.getActiveObject(); if(o&&(o.type==='i-text')){o.set('fontSize',parseInt(e.target.value));fabricCanvas.renderAll();}}; document.getElementById('fontSelect').onchange=()=>{ let o=fabricCanvas.getActiveObject(); if(o&&o.type==='i-text'){o.set('fontFamily',document.getElementById('fontSelect').value);fabricCanvas.renderAll();}};
    // login handlers
    let recaptchaVerifier=null; function setupRecaptcha(){ if(!recaptchaVerifier) recaptchaVerifier=new firebase.auth.RecaptchaVerifier('sendOtpBtn',{size:'invisible'}); }
    document.getElementById('sendOtpBtn').onclick=async()=>{ let phone=document.getElementById('loginPhone').value; if(phone.length<10){showToast('Valid phone',true);return;} setupRecaptcha(); showLoading('Sending OTP'); try{ let conf=await auth.signInWithPhoneNumber(phone.startsWith('+')?phone:'+91'+phone,recaptchaVerifier); globalConfirmationResult=conf; hideLoading(); document.getElementById('otpSection').style.display='block'; showToast('OTP sent'); }catch(e){hideLoading();showToast(e.message,true);} }; document.getElementById('verifyOtpBtn').onclick=async()=>{ let otp=document.getElementById('otpInput').value; if(!otp){showToast('Enter OTP',true);return;} showLoading('Verifying'); try{ await globalConfirmationResult.confirm(otp); localStorage.setItem('vedantaUser',JSON.stringify({uid:auth.currentUser?.uid})); hideLoading(); document.getElementById('loginModal').classList.remove('show'); showToast('Login success'); if(pendingBuyAfterLogin){pendingBuyAfterLogin=false;buyNowAction();}}catch(e){hideLoading();showToast('Invalid OTP',true);} }; document.getElementById('closeModalBtn').onclick=()=>document.getElementById('loginModal').classList.remove('show');

    initCanvas(); renderStyles(); renderColorSelector(); renderPalette(); updateCartUI(); setInterval(()=>updateCartUI(),500);
    if(window.location.protocol==='file:') console.warn("local images warning");
</script>
