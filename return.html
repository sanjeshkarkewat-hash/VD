<!DOCTYPE html>
<html lang="hi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Return Order - Vedanta</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050508;
            color: #FFFFFF;
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.08), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(212,175,55,0.3);
            background: rgba(5,5,8,0.98);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FF8C00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .back-btn {
            background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.3);
            padding: 6px 14px;
            border-radius: 40px;
            color: #D4AF37;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        .card {
            background: rgba(15,15,22,0.7);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(212,175,55,0.2);
            margin-bottom: 16px;
        }
        .card h3 {
            font-size: 18px;
            color: #D4AF37;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .order-select {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 16px;
            color: white;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .order-details {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            display: none;
        }
        .order-details.show { display: block; }
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .return-reason {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 16px;
            color: white;
            font-size: 14px;
            margin-bottom: 16px;
            font-family: inherit;
        }
        .condition-check {
            background: rgba(76,175,80,0.1);
            border: 1px solid rgba(76,175,80,0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .condition-check label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .condition-check input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .condition-check p {
            font-size: 12px;
            color: #ccc;
            margin-top: 8px;
            margin-left: 32px;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            color: #050508;
            cursor: pointer;
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .info-text {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 12px;
        }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #D4AF37;
            color: #050508;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 10000;
            font-size: 12px;
            display: none;
            text-align: center;
        }
        .toast.show { display: block; animation: fadeInOut 2.5s ease; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 6px 16px;
            display: flex;
            gap: 20px;
            z-index: 1000;
            border: 1px solid rgba(212,175,55,0.4);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 40px;
            text-decoration: none;
        }
        .nav-item i { font-size: 18px; color: #ccc; }
        .nav-item span { font-size: 9px; color: #ccc; }
        .nav-item.active i, .nav-item.active span { color: #D4AF37; }
        .loader {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #050508;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }
        .status-delivered { background: rgba(76,175,80,0.2); color: #4CAF50; }
        .rejected-warning {
            background: rgba(244,67,54,0.15);
            border: 1px solid rgba(244,67,54,0.3);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #FF8888;
        }
        .rejected-warning i { font-size: 18px; }
        .preselected-badge {
            background: rgba(212,175,55,0.2);
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo"><h1>VEDANTA</h1></div>
    <div class="back-btn" onclick="window.location.href='booking.html'"><i class="fas fa-arrow-left"></i> Back</div>
</div>

<div class="container" id="container">
    <div style="text-align: center; padding: 40px;">
        <div class="loader" style="border-color: #D4AF37; border-top-color: transparent;"></div>
        <p style="margin-top: 12px;">Loading your orders...</p>
    </div>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item" id="navHome"><i class="fas fa-home"></i><span>HOME</span></a>
    <a href="booking.html" class="nav-item" id="navBooking"><i class="fas fa-calendar-alt"></i><span>BOOKING</span></a>
    <a href="profile.html" class="nav-item" id="navProfile"><i class="fas fa-user-circle"></i><span>PROFILE</span></a>
</div>

<div class="toast" id="toast"></div>

<script>
    // ========== 🔥 FIREBASE CONFIGURATION - UPDATED (NEW CONFIG) ==========
    const firebaseConfig = {
        apiKey: "AIzaSyCBZuwN4SKkXX1fEriYEwWDyTm-3uZnrKI",
        authDomain: "nexi-53897.firebaseapp.com",
        projectId: "nexi-53897",
        storageBucket: "nexi-53897.firebasestorage.app",
        messagingSenderId: "337349382612",
        appId: "1:337349382612:web:ae3c9b3d0fbf69f0e38641",
        measurementId: "G-W6N519LBPH"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    let currentUser = JSON.parse(localStorage.getItem('vedantaUser'));
    let eligibleOrders = [];
    let preselectedOrderId = null;
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.background = isError ? '#F44336' : '#D4AF37';
        toast.style.color = isError ? 'white' : '#050508';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    // Get orderId from URL (for "Request Return Again" feature)
    function getOrderIdFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('orderId');
    }
    
    // Check if order can be returned based on delivery date (within 7 days)
    function isWithinReturnWindow(order) {
        if (!order.deliveredDate) {
            const orderDate = new Date(order.orderDate);
            const daysSinceOrder = (Date.now() - orderDate) / (1000 * 3600 * 24);
            return daysSinceOrder <= 7;
        }
        const deliveredDate = new Date(order.deliveredDate);
        const daysSinceDelivery = (Date.now() - deliveredDate) / (1000 * 3600 * 24);
        return daysSinceDelivery <= 7;
    }
    
    // Load eligible orders - INCLUDING rejected ones for re-request
    async function loadEligibleOrders() {
        if (!currentUser || !currentUser.email) {
            return [];
        }
        
        try {
            // Get all orders for this user
            const snapshot = await db.collection('orders')
                .where('customerEmail', '==', currentUser.email)
                .get();
            
            const snapshot2 = await db.collection('orders')
                .where('userEmail', '==', currentUser.email)
                .get();
            
            const ordersMap = new Map();
            
            snapshot.forEach(doc => {
                ordersMap.set(doc.id, { id: doc.id, ...doc.data() });
            });
            snapshot2.forEach(doc => {
                if (!ordersMap.has(doc.id)) {
                    ordersMap.set(doc.id, { id: doc.id, ...doc.data() });
                }
            });
            
            const orders = Array.from(ordersMap.values());
            const eligible = [];
            
            for (const order of orders) {
                const returnStatus = order.returnStatus;
                
                // Skip if already returned or approved
                if (returnStatus === 'returned' || returnStatus === 'approved') {
                    continue;
                }
                
                // Skip if already pending (already requested)
                if (returnStatus === 'pending') {
                    continue;
                }
                
                // REJECTED orders - ALWAYS eligible for re-request (even if window expired)
                if (returnStatus === 'rejected') {
                    eligible.push({
                        ...order,
                        _isRejectedReturn: true,
                        _rejectReason: order.adminNotes || order.returnRejectReason || 'Not specified'
                    });
                    continue;
                }
                
                // Delivered orders within 7 days
                if (order.status === 'delivered' && isWithinReturnWindow(order)) {
                    eligible.push({
                        ...order,
                        _isRejectedReturn: false
                    });
                }
            }
            
            eligible.sort((a, b) => new Date(b.orderDate) - new Date(a.orderDate));
            eligibleOrders = eligible;
            return eligible;
            
        } catch (error) {
            console.error("Error loading orders:", error);
            return [];
        }
    }
    
    // Submit return request
    async function submitReturnRequest() {
        const orderSelect = document.getElementById('orderSelect');
        const reason = document.getElementById('returnReason').value;
        const conditionCheck = document.getElementById('conditionCheck');
        
        let selectedOrderId = orderSelect ? orderSelect.value : preselectedOrderId;
        
        if (!selectedOrderId) {
            showToast('❌ Please select an order', true);
            return;
        }
        
        if (!reason) {
            showToast('❌ Please select a return reason', true);
            return;
        }
        
        if (!conditionCheck.checked) {
            showToast('❌ Please confirm the return conditions', true);
            return;
        }
        
        const order = eligibleOrders.find(o => o.orderId === selectedOrderId);
        
        if (!order) {
            showToast('❌ Order not found', true);
            return;
        }
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span>Submitting...';
        
        try {
            const returnData = {
                orderId: order.orderId,
                customerName: order.customerName,
                customerEmail: order.customerEmail,
                customerPhone: order.customerPhone,
                items: order.items,
                totalAmount: order.total,
                returnReason: reason,
                returnStatus: 'pending',
                requestedDate: new Date().toISOString(),
                status: 'return_requested',
                isReRequest: order._isRejectedReturn || false,
                previousRejectReason: order._isRejectedReturn ? (order._rejectReason || null) : null
            };
            
            const returnId = `RET_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
            await db.collection('returns').doc(returnId).set(returnData);
            
            await db.collection('orders').doc(order.id).update({
                returnStatus: 'pending',
                returnReason: reason,
                returnRequestedDate: new Date().toISOString(),
                status: 'return_requested',
                adminNotes: null,
                returnRejectReason: null,
                returnProcessedDate: null,
                isReRequest: true,
                previousReturnStatus: order.returnStatus || null
            });
            
            showToast('✅ Return request submitted successfully! We will contact you within 24 hours.');
            
            setTimeout(() => {
                window.location.href = 'booking.html';
            }, 2000);
            
        } catch (error) {
            console.error("Return submission error:", error);
            showToast('❌ Failed to submit return request. Please try again.', true);
            btn.disabled = false;
            btn.innerHTML = 'Submit Return Request';
        }
    }
    
    // Show order details
    function showOrderDetails() {
        const select = document.getElementById('orderSelect');
        const orderId = select ? select.value : preselectedOrderId;
        const detailsDiv = document.getElementById('orderDetails');
        
        if (!orderId) {
            if (detailsDiv) detailsDiv.classList.remove('show');
            return;
        }
        
        const order = eligibleOrders.find(o => o.orderId === orderId);
        if (!order) return;
        
        const isRejectedCase = order._isRejectedReturn === true;
        
        let warningHtml = '';
        if (isRejectedCase) {
            warningHtml = `
                <div class="rejected-warning">
                    <i class="fas fa-exclamation-triangle"></i>
                    <div>
                        <strong>Previous return request was rejected</strong><br>
                        Reason: ${escapeHtml(order._rejectReason)}<br>
                        <span style="font-size: 10px;">You can submit a new return request now.</span>
                    </div>
                </div>
            `;
        }
        
        detailsDiv.innerHTML = `
            ${warningHtml}
            <h4 style="margin-bottom: 12px; color: #D4AF37;">Order Items</h4>
            ${order.items.map(item => `
                <div class="order-item">
                    <span>${escapeHtml(item.name)} x ${item.quantity}</span>
                    <span>₹${(item.price * item.quantity).toLocaleString('en-IN')}</span>
                </div>
            `).join('')}
            <div class="order-item" style="border-bottom: none; font-weight: bold;">
                <span>Total Amount</span>
                <span style="color: #D4AF37;">₹${order.total.toLocaleString('en-IN')}</span>
            </div>
            <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1);">
                <p><i class="fas fa-calendar"></i> Order Date: ${new Date(order.orderDate).toLocaleDateString('en-IN')}</p>
                <p><i class="fas fa-truck"></i> Status: <span class="status-badge status-delivered">Delivered</span></p>
                ${isRejectedCase ? 
                    `<p style="color: #4CAF50; margin-top: 8px;"><i class="fas fa-redo-alt"></i> Re-request eligible - You can submit a new return request</p>` : 
                    `<p style="color: #4CAF50; margin-top: 8px;"><i class="fas fa-check-circle"></i> Eligible for return</p>`
                }
            </div>
        `;
        detailsDiv.classList.add('show');
    }
    
    // Main render function
    async function renderReturnPage() {
        const container = document.getElementById('container');
        
        // Update active nav based on current page
        const currentPath = window.location.pathname.split('/').pop();
        document.querySelectorAll('.nav-item').forEach(item => {
            const href = item.getAttribute('href');
            if (href && currentPath.includes(href.replace('.html', ''))) {
                item.classList.add('active');
            } else if (currentPath === 'return.html' && item.getAttribute('href') === 'profile.html') {
                // On return page, profile is active
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
        
        if (!currentUser || !currentUser.email) {
            container.innerHTML = `
                <div class="card" style="text-align: center;">
                    <i class="fas fa-lock" style="font-size: 48px; color: #D4AF37; margin-bottom: 16px;"></i>
                    <h3>Please Login First</h3>
                    <p style="color: #888; margin-bottom: 20px;">You need to be logged in to request a return</p>
                    <button class="submit-btn" onclick="window.location.href='profile.html'">Go to Login</button>
                </div>
            `;
            return;
        }
        
        await loadEligibleOrders();
        
        // Check if an orderId was passed in URL (for "Request Return Again")
        const urlOrderId = getOrderIdFromUrl();
        if (urlOrderId) {
            const matchingOrder = eligibleOrders.find(o => o.orderId === urlOrderId || o.id === urlOrderId);
            if (matchingOrder) {
                preselectedOrderId = matchingOrder.orderId;
            }
        }
        
        if (eligibleOrders.length === 0) {
            container.innerHTML = `
                <div class="card" style="text-align: center;">
                    <i class="fas fa-box-open" style="font-size: 48px; color: #D4AF37; margin-bottom: 16px;"></i>
                    <h3>No Eligible Orders</h3>
                    <p style="color: #888;">You don't have any orders that can be returned.</p>
                    <p style="color: #888; font-size: 12px; margin-top: 8px;">• Delivered orders within 7 days are eligible</p>
                    <p style="color: #888; font-size: 12px;">• Previously rejected returns can be requested again</p>
                    <button class="submit-btn" style="margin-top: 20px;" onclick="window.location.href='booking.html'">View My Orders</button>
                </div>
            `;
            return;
        }
        
        // Build dropdown options
        let dropdownHtml = '<option value="">Select Order to Return</option>';
        for (const order of eligibleOrders) {
            const isRejected = order._isRejectedReturn === true;
            const orderDate = new Date(order.orderDate).toLocaleDateString('en-IN');
            const badge = isRejected ? ' [REJECTED - RE-REQUEST]' : '';
            const selectedAttr = (preselectedOrderId === order.orderId) ? 'selected' : '';
            dropdownHtml += `<option value="${order.orderId}" ${selectedAttr}>${order.orderId} - ₹${order.total} (${orderDate})${badge}</option>`;
        }
        
        // If preselected, show pre-selection message
        let preselectedHtml = '';
        if (preselectedOrderId) {
            const preselectedOrder = eligibleOrders.find(o => o.orderId === preselectedOrderId);
            if (preselectedOrder && preselectedOrder._isRejectedReturn) {
                preselectedHtml = `
                    <div class="preselected-badge">
                        <i class="fas fa-redo-alt"></i> Re-requesting return for rejected order: ${preselectedOrderId}
                    </div>
                `;
            } else if (preselectedOrder) {
                preselectedHtml = `
                    <div class="preselected-badge">
                        <i class="fas fa-undo-alt"></i> Return request for order: ${preselectedOrderId}
                    </div>
                `;
            }
        }
        
        container.innerHTML = `
            <div class="card">
                <h3><i class="fas fa-undo-alt"></i> Return Request</h3>
                
                ${preselectedHtml}
                
                <select id="orderSelect" class="order-select" onchange="showOrderDetails()">
                    ${dropdownHtml}
                </select>
                
                <div id="orderDetails" class="order-details"></div>
                
                <select id="returnReason" class="return-reason">
                    <option value="">Select Return Reason</option>
                    <option value="Damaged Product">Damaged Product</option>
                    <option value="Wrong Size">Wrong Size</option>
                    <option value="Wrong Product">Wrong Product Received</option>
                    <option value="Quality Issue">Quality Issue</option>
                    <option value="Different from Description">Different from Description</option>
                    <option value="Defective Item">Defective Item</option>
                    <option value="Other">Other</option>
                </select>
                
                <div class="condition-check">
                    <label>
                        <input type="checkbox" id="conditionCheck">
                        <span>I confirm the return conditions:</span>
                    </label>
                    <p>✓ Product must be unused and in original packaging<br>
                       ✓ Return request within 7 days of delivery (or re-request after rejection)<br>
                       ✓ Original invoice/tag must be attached<br>
                       ✓ Refund will be processed after quality check</p>
                </div>
                
                <button class="submit-btn" id="submitBtn" onclick="submitReturnRequest()">Submit Return Request</button>
                <div class="info-text">
                    <i class="fas fa-clock"></i> Return requests are processed within 24-48 hours
                </div>
            </div>
        `;
        
        // If preselected, auto-show details
        if (preselectedOrderId) {
            showOrderDetails();
            // Scroll to make it visible
            setTimeout(() => {
                document.getElementById('orderDetails')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }
        
        // Attach change event for reason dropdown if needed
        const reasonSelect = document.getElementById('returnReason');
        if (reasonSelect) {
            reasonSelect.addEventListener('change', () => {});
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m));
    }
    
    // Expose functions globally
    window.submitReturnRequest = submitReturnRequest;
    window.showOrderDetails = showOrderDetails;
    
    renderReturnPage();
</script>
</body>
</html>
