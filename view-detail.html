<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Order Details - Vedanta</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050508;
            color: #FFFFFF;
            overflow-x: hidden;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.08), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(10,10,18,0.95);
            border-bottom: 1px solid rgba(212,175,55,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FF8C00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .back-btn {
            background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.3);
            padding: 8px 20px;
            border-radius: 40px;
            color: #D4AF37;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Order Status Bar */
        .status-bar {
            background: rgba(15,15,22,0.6);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .status-steps {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 20px 0;
        }
        .status-steps::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 10%;
            right: 10%;
            height: 2px;
            background: rgba(255,255,255,0.1);
            z-index: 0;
        }
        .step {
            text-align: center;
            flex: 1;
            position: relative;
            z-index: 1;
        }
        .step-icon {
            width: 40px;
            height: 40px;
            background: #1A1A1A;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            border: 2px solid rgba(212,175,55,0.3);
        }
        .step.completed .step-icon {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        .step.active .step-icon {
            background: #D4AF37;
            border-color: #D4AF37;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(212,175,55,0.4); }
            70% { box-shadow: 0 0 0 10px rgba(212,175,55,0); }
            100% { box-shadow: 0 0 0 0 rgba(212,175,55,0); }
        }
        .step-icon i { font-size: 18px; color: #050508; }
        .step-label { font-size: 11px; color: #888; }
        .step.completed .step-label { color: #4CAF50; }
        .step.active .step-label { color: #D4AF37; font-weight: 600; }
        
        /* Order Info Card */
        .info-card {
            background: rgba(15,15,22,0.6);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #D4AF37;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #888;
            font-size: 13px;
        }
        .info-value {
            color: #FFFFFF;
            font-weight: 500;
            font-size: 13px;
        }
        .price-highlight {
            color: #D4AF37;
            font-weight: 700;
        }
        
        /* Order Items */
        .order-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .order-item-img {
            width: 70px;
            height: 70px;
            background: #0E0E14;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .order-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .order-item-img i {
            font-size: 32px;
            color: #D4AF37;
        }
        .order-item-info {
            flex: 1;
        }
        .order-item-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .order-item-size {
            display: inline-block;
            background: rgba(212,175,55,0.15);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #D4AF37;
            margin-top: 4px;
        }
        .order-item-price {
            font-weight: 700;
            color: #D4AF37;
            text-align: right;
        }
        .order-item-qty {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        
        /* Total Section */
        .total-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(212,175,55,0.3);
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }
        .grand-total {
            font-size: 18px;
            font-weight: 800;
            color: #D4AF37;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn-primary {
            flex: 1;
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            color: #050508;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-secondary {
            flex: 1;
            background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.5);
            padding: 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            color: #D4AF37;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-cancel {
            background: rgba(244,67,54,0.15);
            border: 1px solid rgba(244,67,54,0.5);
            color: #F44336;
        }
        .btn-cancel:hover {
            background: rgba(244,67,54,0.3);
        }
        .btn-cancel.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        /* Confirmation Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: rgba(15,15,22,0.95);
            backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 28px;
            max-width: 350px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .modal-content i {
            font-size: 60px;
            color: #F44336;
            margin-bottom: 20px;
        }
        .modal-content h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .modal-content p {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }
        .modal-confirm {
            background: #F44336;
            color: white;
        }
        .modal-cancel {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #D4AF37;
            color: #050508;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 10000;
            display: none;
        }
        .toast.show { display: block; animation: fadeInOut 2s ease; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        
        .error-state {
            text-align: center;
            padding: 60px 20px;
        }
        .error-state i {
            font-size: 60px;
            color: #F44336;
            margin-bottom: 20px;
        }
        
        @media (max-width: 600px) {
            .container { padding: 16px; }
            .status-steps { flex-wrap: wrap; gap: 15px; }
            .status-steps::before { display: none; }
            .step { flex: auto; min-width: 80px; }
            .action-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo"><h1>VEDANTA</h1></div>
    <a href="booking.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Bookings</a>
</div>

<div class="container" id="app"></div>

<!-- Confirmation Modal -->
<div class="modal" id="cancelModal">
    <div class="modal-content">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>Cancel Order?</h3>
        <p>Are you sure you want to cancel this order? This action cannot be undone.</p>
        <div class="modal-buttons">
            <button class="modal-btn modal-cancel" id="modalCancelBtn">No, Go Back</button>
            <button class="modal-btn modal-confirm" id="modalConfirmBtn">Yes, Cancel Order</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ========== 🔥 FIREBASE CONFIGURATION ==========
    const firebaseConfig = {
        apiKey: "AIzaSyCMPUAV50FOsqpyTKY3lioeAgbQvxQzLnM",
        authDomain: "vedanta-d0199.firebaseapp.com",
        projectId: "vedanta-d0199",
        storageBucket: "vedanta-d0199.firebasestorage.app",
        messagingSenderId: "761061711987",
        appId: "1:761061711987:web:d59ff32fd53057c395ca06",
        measurementId: "G-RQMQZVGK75"
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    console.log("🔥 Firebase Connected!");
    
    let currentOrder = null;
    let productsMap = new Map();
    let currentUser = null;
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.background = isError ? '#F44336' : '#D4AF37';
        toast.style.color = isError ? 'white' : '#050508';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    function getOrderIdFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('orderId');
    }
    
    function getCurrentUser() {
        const user = localStorage.getItem('vedantaUser');
        if (user) {
            try {
                return JSON.parse(user);
            } catch(e) {
                return null;
            }
        }
        return null;
    }
    
    // Load products from cache (instant)
    function loadProductsFromCache() {
        const cachedProducts = localStorage.getItem('vedantaProducts');
        if (cachedProducts) {
            try {
                const products = JSON.parse(cachedProducts);
                products.forEach(p => {
                    productsMap.set(p.id, { images: p.images || [], icon: p.icon || 'fa-gem', name: p.name });
                });
                return true;
            } catch(e) {}
        }
        return false;
    }
    
    // Get cached orders
    function getCachedOrders() {
        const cached = localStorage.getItem('vedantaOrders_cache');
        if (cached) {
            try {
                const cacheData = JSON.parse(cached);
                if (cacheData.orders && cacheData.orders.length > 0) {
                    return cacheData.orders;
                }
            } catch(e) {}
        }
        return [];
    }
    
    // 🔥 INSTANT LOAD FROM CACHE
    function loadOrderFromCache() {
        const orderId = getOrderIdFromUrl();
        
        if (!orderId) {
            showError("No order ID found");
            return false;
        }
        
        // Try to get from cached orders
        const cachedOrders = getCachedOrders();
        const cachedOrder = cachedOrders.find(o => o.orderId === orderId);
        
        if (cachedOrder) {
            currentOrder = cachedOrder;
            renderOrderDetails();
            console.log("✅ Instant load from cache");
            return true;
        }
        
        return false;
    }
    
    // 🔥 FETCH FRESH IN BACKGROUND
    async function fetchFreshOrder() {
        const orderId = getOrderIdFromUrl();
        
        if (!orderId) return;
        
        try {
            const doc = await db.collection('orders').doc(orderId).get();
            
            if (doc.exists) {
                const freshOrder = { id: doc.id, ...doc.data() };
                
                // Check if order changed
                if (JSON.stringify(currentOrder) !== JSON.stringify(freshOrder)) {
                    currentOrder = freshOrder;
                    renderOrderDetails();
                    console.log("🔄 Background update - order refreshed");
                }
            }
        } catch (error) {
            console.error("Error fetching order:", error);
        }
    }
    
    // Load products for images
    async function loadProducts() {
        // First from cache
        loadProductsFromCache();
        
        // Then fetch fresh
        try {
            const snapshot = await db.collection('products').get();
            snapshot.forEach(doc => {
                const p = doc.data();
                productsMap.set(p.id, { images: p.images || [], icon: p.icon || 'fa-gem', name: p.name });
            });
            // Re-render if needed
            if (currentOrder) {
                renderOrderDetails();
            }
        } catch(e) {
            console.log("Error loading products:", e);
        }
    }
    
    function canCancelOrder() {
        if (!currentOrder) return false;
        const cancellableStatuses = ['pending', 'confirmed', 'processing'];
        return cancellableStatuses.includes(currentOrder.status);
    }
    
    async function cancelOrder() {
        if (!canCancelOrder()) {
            showToast("This order cannot be cancelled at this stage", true);
            return;
        }
        
        try {
            await db.collection('orders').doc(currentOrder.id).update({
                status: 'cancelled',
                cancelledAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            });
            
            currentOrder.status = 'cancelled';
            showToast("✅ Order cancelled successfully!");
            renderOrderDetails();
            
        } catch (error) {
            console.error("Error cancelling order:", error);
            showToast("❌ Failed to cancel order. Please try again.", true);
        }
    }
    
    function showCancelConfirmation() {
        if (!canCancelOrder()) {
            showToast("This order cannot be cancelled at this stage", true);
            return;
        }
        document.getElementById('cancelModal').classList.add('show');
    }
    
    function hideModal() {
        document.getElementById('cancelModal').classList.remove('show');
    }
    
    function getProductImage(productId) {
        const prod = productsMap.get(productId);
        if (prod && prod.images && prod.images.length > 0) return prod.images[0];
        return null;
    }
    
    function getProductIcon(productId) {
        const prod = productsMap.get(productId);
        return (prod && prod.icon) ? prod.icon : 'fa-gem';
    }
    
    function getStatusLabel(status) {
        const map = {
            'pending': 'Pending',
            'confirmed': 'Confirmed',
            'processing': 'Processing',
            'shipped': 'Shipped',
            'delivered': 'Delivered',
            'cancelled': 'Cancelled'
        };
        return map[status] || status || 'Pending';
    }
    
    function getStatusStep(status) {
        const steps = ['pending', 'confirmed', 'processing', 'shipped', 'delivered'];
        
        if (status === 'cancelled') {
            return steps.map(step => ({
                name: step,
                label: getStatusLabel(step),
                completed: false,
                active: false
            }));
        }
        
        const currentIndex = steps.indexOf(status);
        const completedStatuses = steps.slice(0, currentIndex + 1);
        
        return steps.map((step, index) => ({
            name: step,
            label: getStatusLabel(step),
            completed: completedStatuses.includes(step),
            active: step === status
        }));
    }
    
    function renderOrderDetails() {
        if (!currentOrder) return;
        
        const container = document.getElementById('app');
        const statusSteps = getStatusStep(currentOrder.status);
        const orderDate = currentOrder.orderDate ? new Date(currentOrder.orderDate).toLocaleString() : 'N/A';
        const isCancelled = currentOrder.status === 'cancelled';
        const canCancel = canCancelOrder();
        
        const itemsHtml = (currentOrder.items || []).map(item => {
            const productImg = getProductImage(item.id);
            const iconClass = getProductIcon(item.id);
            const itemSize = item.size || 'Not Selected';
            
            return `
                <div class="order-item">
                    <div class="order-item-img">
                        ${productImg ? `<img src="${productImg}" alt="${escapeHtml(item.name)}" loading="lazy">` : `<i class="fas ${iconClass}"></i>`}
                    </div>
                    <div class="order-item-info">
                        <div class="order-item-name">${escapeHtml(item.name)}</div>
                        ${itemSize !== 'Not Selected' ? `<div class="order-item-size"><i class="fas fa-tshirt"></i> Size: ${escapeHtml(itemSize)}</div>` : ''}
                        <div class="order-item-qty">Quantity: ${item.quantity}</div>
                    </div>
                    <div class="order-item-price">
                        ₹${(item.price * item.quantity).toLocaleString('en-IN')}
                    </div>
                </div>
            `;
        }).join('');
        
        let statusHtml = '';
        if (isCancelled) {
            statusHtml = `
                <div style="text-align: center; padding: 20px;">
                    <i class="fas fa-times-circle" style="font-size: 48px; color: #F44336;"></i>
                    <p style="margin-top: 10px; color: #F44336; font-weight: 600;">Order Cancelled</p>
                </div>
            `;
        } else {
            statusHtml = `
                <div class="status-steps">
                    ${statusSteps.map(step => `
                        <div class="step ${step.completed ? 'completed' : ''} ${step.active ? 'active' : ''}">
                            <div class="step-icon">
                                <i class="fas ${step.name === 'pending' ? 'fa-clock' : (step.name === 'confirmed' ? 'fa-check' : (step.name === 'processing' ? 'fa-cogs' : (step.name === 'shipped' ? 'fa-truck' : 'fa-check-circle')))}"></i>
                            </div>
                            <div class="step-label">${step.label}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        const cancelButtonHtml = canCancel ? `
            <button class="btn-secondary btn-cancel" id="cancelOrderBtn">
                <i class="fas fa-times-circle"></i> Cancel Order
            </button>
        ` : (isCancelled ? `
            <div style="text-align: center; padding: 10px; background: rgba(244,67,54,0.1); border-radius: 16px;">
                <i class="fas fa-ban"></i> This order has been cancelled
            </div>
        ` : `
            <div style="text-align: center; padding: 10px; background: rgba(255,152,0,0.1); border-radius: 16px;">
                <i class="fas fa-truck"></i> Order cannot be cancelled at this stage
            </div>
        `);
        
        container.innerHTML = `
            <div class="status-bar">
                <div class="card-title">
                    <i class="fas fa-chart-line"></i> Order Status
                </div>
                ${statusHtml}
            </div>
            
            <div class="info-card">
                <div class="card-title">
                    <i class="fas fa-receipt"></i> Order Information
                </div>
                <div class="info-row">
                    <span class="info-label">Order ID</span>
                    <span class="info-value">${currentOrder.orderId || currentOrder.id}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Order Date</span>
                    <span class="info-value">${orderDate}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Payment Method</span>
                    <span class="info-value">${currentOrder.paymentMethod || 'Cash on Delivery'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Order Status</span>
                    <span class="info-value price-highlight" style="color: ${isCancelled ? '#F44336' : '#D4AF37'}">${getStatusLabel(currentOrder.status)}</span>
                </div>
                ${currentOrder.cancelledAt ? `
                <div class="info-row">
                    <span class="info-label">Cancelled On</span>
                    <span class="info-value">${new Date(currentOrder.cancelledAt).toLocaleString()}</span>
                </div>
                ` : ''}
            </div>
            
            <div class="info-card">
                <div class="card-title">
                    <i class="fas fa-user-circle"></i> Customer Details
                </div>
                <div class="info-row">
                    <span class="info-label">Full Name</span>
                    <span class="info-value">${escapeHtml(currentOrder.customerName || 'Guest')}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Email Address</span>
                    <span class="info-value">${escapeHtml(currentOrder.customerEmail || 'N/A')}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Phone Number</span>
                    <span class="info-value">${escapeHtml(currentOrder.customerPhone || 'N/A')}</span>
                </div>
            </div>
            
            <div class="info-card">
                <div class="card-title">
                    <i class="fas fa-map-marker-alt"></i> Shipping Address
                </div>
                <div class="info-row">
                    <span class="info-label">Address</span>
                    <span class="info-value">${escapeHtml(currentOrder.shippingAddress?.address || 'N/A')}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">City</span>
                    <span class="info-value">${escapeHtml(currentOrder.shippingAddress?.city || 'N/A')}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">State</span>
                    <span class="info-value">${escapeHtml(currentOrder.shippingAddress?.state || 'N/A')}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">PIN Code</span>
                    <span class="info-value">${escapeHtml(currentOrder.shippingAddress?.pincode || 'N/A')}</span>
                </div>
            </div>
            
            <div class="info-card">
                <div class="card-title">
                    <i class="fas fa-shopping-bag"></i> Order Items (${currentOrder.items?.length || 0})
                </div>
                ${itemsHtml || '<div class="info-row"><span class="info-label">No items found</span></div>'}
                
                <div class="total-section">
                    <div class="total-row">
                        <span>Subtotal</span>
                        <span>₹${(currentOrder.subtotal || currentOrder.total || 0).toLocaleString('en-IN')}</span>
                    </div>
                    <div class="total-row grand-total">
                        <span>Total Amount</span>
                        <span>₹${(currentOrder.total || 0).toLocaleString('en-IN')}</span>
                    </div>
                </div>
            </div>
            
            <div class="action-buttons">
                ${cancelButtonHtml}
                <button class="btn-secondary" onclick="window.location.href='booking.html'">
                    <i class="fas fa-arrow-left"></i> All Orders
                </button>
                <button class="btn-primary" onclick="window.location.href='index.html'">
                    <i class="fas fa-shopping-cart"></i> Continue Shopping
                </button>
            </div>
        `;
        
        const cancelBtn = document.getElementById('cancelOrderBtn');
        if (cancelBtn) {
            cancelBtn.addEventListener('click', showCancelConfirmation);
        }
    }
    
    function showError(message) {
        const container = document.getElementById('app');
        container.innerHTML = `
            <div class="error-state">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>${message}</h3>
                <p style="color: #888; margin-top: 10px;">The order you're looking for could not be found.</p>
                <button class="btn-primary" onclick="window.location.href='booking.html'" style="margin-top: 20px;">
                    <i class="fas fa-arrow-left"></i> Back to Bookings
                </button>
            </div>
        `;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Modal event listeners
    document.getElementById('modalCancelBtn')?.addEventListener('click', hideModal);
    document.getElementById('modalConfirmBtn')?.addEventListener('click', async () => {
        hideModal();
        await cancelOrder();
    });
    
    window.addEventListener('click', (e) => {
        const modal = document.getElementById('cancelModal');
        if (e.target === modal) {
            hideModal();
        }
    });
    
    // 🔥 INIT - Instant from cache, then background update
    (async function init() {
        // STEP 1: Load products from cache
        loadProductsFromCache();
        
        // STEP 2: Load order from cache (instant)
        const hasCached = loadOrderFromCache();
        
        if (!hasCached) {
            // Show loading only if no cache
            document.getElementById('app').innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Loading order details...</p>
                </div>
            `;
        }
        
        // STEP 3: Fetch fresh products in background
        await loadProducts();
        
        // STEP 4: Fetch fresh order in background
        await fetchFreshOrder();
    })();
</script>
</body>
</html>
