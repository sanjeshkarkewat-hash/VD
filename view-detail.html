<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Order Details - Vedanta</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050508;
            color: #FFFFFF;
            overflow-x: hidden;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.08), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(10,10,18,0.95);
            border-bottom: 1px solid rgba(212,175,55,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FF8C00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .back-btn {
            background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.3);
            padding: 8px 20px;
            border-radius: 40px;
            color: #D4AF37;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: rgba(212,175,55,0.25);
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Skeleton Loading */
        .skeleton-card {
            background: rgba(15,15,22,0.6);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(212,175,55,0.1);
        }
        .skeleton-title {
            height: 24px;
            width: 40%;
            background: linear-gradient(90deg, #1a1a24 25%, #2a2a35 50%, #1a1a24 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #1a1a24 25%, #2a2a35 50%, #1a1a24 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            margin: 12px 0;
        }
        .skeleton-steps {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }
        .skeleton-step {
            flex: 1;
            text-align: center;
        }
        .skeleton-step-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(90deg, #1a1a24 25%, #2a2a35 50%, #1a1a24 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 50%;
            margin: 0 auto 10px;
        }
        .skeleton-step-label {
            height: 10px;
            width: 50px;
            margin: 0 auto;
            background: linear-gradient(90deg, #1a1a24 25%, #2a2a35 50%, #1a1a24 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        .skeleton-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
        }
        .skeleton-img {
            width: 80px;
            height: 80px;
            background: linear-gradient(90deg, #1a1a24 25%, #2a2a35 50%, #1a1a24 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 16px;
            flex-shrink: 0;
        }
        .skeleton-text {
            flex: 1;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .status-bar {
            background: rgba(15,15,22,0.6);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .status-steps {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 20px 0;
        }
        .status-steps::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 10%;
            right: 10%;
            height: 2px;
            background: rgba(255,255,255,0.1);
            z-index: 0;
        }
        .step {
            text-align: center;
            flex: 1;
            position: relative;
            z-index: 1;
        }
        .step-icon {
            width: 40px;
            height: 40px;
            background: #1A1A1A;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            border: 2px solid rgba(212,175,55,0.3);
            transition: all 0.3s ease;
        }
        .step.completed .step-icon {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        .step.active .step-icon {
            background: #D4AF37;
            border-color: #D4AF37;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(212,175,55,0.4); }
            70% { box-shadow: 0 0 0 10px rgba(212,175,55,0); }
            100% { box-shadow: 0 0 0 0 rgba(212,175,55,0); }
        }
        .step-icon i { font-size: 18px; color: #050508; }
        .step-label { font-size: 11px; color: #888; }
        .step.completed .step-label { color: #4CAF50; }
        .step.active .step-label { color: #D4AF37; font-weight: 600; }
        
        .info-card {
            background: rgba(15,15,22,0.6);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(212,175,55,0.2);
            transition: transform 0.2s;
        }
        .info-card:hover {
            transform: translateY(-2px);
            border-color: rgba(212,175,55,0.4);
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #D4AF37;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #888;
            font-size: 13px;
        }
        .info-value {
            color: #FFFFFF;
            font-weight: 500;
            font-size: 13px;
        }
        .price-highlight {
            color: #D4AF37;
            font-weight: 700;
        }
        .discount-badge {
            background: #4CAF50;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 8px;
            display: inline-block;
        }
        
        .order-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            transition: background 0.2s;
        }
        .order-item:hover {
            background: rgba(212,175,55,0.05);
            border-radius: 16px;
            padding-left: 10px;
            padding-right: 10px;
        }
        .order-item-img {
            width: 80px;
            height: 80px;
            background: #0E0E14;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .order-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .order-item-img i {
            font-size: 32px;
            color: #D4AF37;
        }
        .order-item-info {
            flex: 1;
        }
        .order-item-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .item-attributes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0;
        }
        .size-badge {
            background: rgba(212,175,55,0.15);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #D4AF37;
        }
        .color-dot-small {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            vertical-align: middle;
        }
        .color-badge {
            background: rgba(212,175,55,0.15);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #D4AF37;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .order-item-price {
            text-align: right;
            min-width: 100px;
        }
        .original-price {
            font-size: 12px;
            color: #888;
            text-decoration: line-through;
        }
        .final-price {
            font-weight: 700;
            color: #D4AF37;
            font-size: 16px;
        }
        .order-item-qty {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        
        .total-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(212,175,55,0.3);
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }
        .grand-total {
            font-size: 18px;
            font-weight: 800;
            color: #D4AF37;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .offer-card {
            background: rgba(76,175,80,0.1);
            border: 1px solid rgba(76,175,80,0.3);
            border-radius: 16px;
            padding: 12px 15px;
            margin: 10px 0;
        }
        .offer-card i {
            color: #4CAF50;
            margin-right: 8px;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn-primary {
            flex: 1;
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            color: #050508;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212,175,55,0.3);
        }
        .btn-secondary {
            flex: 1;
            background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.5);
            padding: 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            color: #D4AF37;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background: rgba(212,175,55,0.25);
            transform: translateY(-2px);
        }
        .btn-cancel {
            background: rgba(244,67,54,0.15);
            border: 1px solid rgba(244,67,54,0.5);
            color: #F44336;
        }
        .btn-cancel:hover {
            background: rgba(244,67,54,0.25);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: rgba(15,15,22,0.95);
            backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 28px;
            max-width: 350px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.3);
            animation: modalSlideIn 0.3s ease;
        }
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-content i { font-size: 60px; color: #F44336; margin-bottom: 20px; }
        .modal-content h3 { font-size: 24px; margin-bottom: 10px; }
        .modal-content p { color: #888; font-size: 14px; margin-bottom: 25px; }
        .modal-buttons { display: flex; gap: 15px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 30px; font-weight: 700; cursor: pointer; border: none; transition: transform 0.2s; }
        .modal-btn:hover { transform: scale(0.98); }
        .modal-confirm { background: #F44336; color: white; }
        .modal-cancel { background: rgba(255,255,255,0.1); color: white; }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #D4AF37;
            color: #050508;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 10000;
            display: none;
            animation: fadeInOut 2s ease;
        }
        .toast.show { display: block; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        
        .error-state { text-align: center; padding: 60px 20px; }
        .error-state i { font-size: 60px; color: #F44336; margin-bottom: 20px; }
        
        @media (max-width: 600px) {
            .container { padding: 16px; }
            .status-steps { flex-wrap: wrap; gap: 15px; }
            .status-steps::before { display: none; }
            .step { flex: auto; min-width: 80px; }
            .action-buttons { flex-direction: column; }
            .order-item { flex-wrap: wrap; }
            .order-item-price { text-align: left; margin-top: 5px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo"><h1>VEDANTA</h1></div>
    <a href="booking.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Bookings</a>
</div>

<div class="container" id="app">
    <!-- Skeleton Loaders - Shows instantly -->
    <div class="skeleton-card">
        <div class="skeleton-title"></div>
        <div class="skeleton-steps">
            <div class="skeleton-step"><div class="skeleton-step-icon"></div><div class="skeleton-step-label"></div></div>
            <div class="skeleton-step"><div class="skeleton-step-icon"></div><div class="skeleton-step-label"></div></div>
            <div class="skeleton-step"><div class="skeleton-step-icon"></div><div class="skeleton-step-label"></div></div>
            <div class="skeleton-step"><div class="skeleton-step-icon"></div><div class="skeleton-step-label"></div></div>
            <div class="skeleton-step"><div class="skeleton-step-icon"></div><div class="skeleton-step-label"></div></div>
        </div>
    </div>
    <div class="skeleton-card">
        <div class="skeleton-title" style="width: 30%;"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
    </div>
    <div class="skeleton-card">
        <div class="skeleton-title" style="width: 35%;"></div>
        <div class="skeleton-item">
            <div class="skeleton-img"></div>
            <div class="skeleton-text"><div class="skeleton-line" style="width: 70%;"></div><div class="skeleton-line" style="width: 50%;"></div><div class="skeleton-line" style="width: 40%;"></div></div>
        </div>
        <div class="skeleton-item">
            <div class="skeleton-img"></div>
            <div class="skeleton-text"><div class="skeleton-line" style="width: 70%;"></div><div class="skeleton-line" style="width: 50%;"></div><div class="skeleton-line" style="width: 40%;"></div></div>
        </div>
    </div>
</div>

<div class="modal" id="cancelModal">
    <div class="modal-content">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>Cancel Order?</h3>
        <p>Are you sure you want to cancel this order? This action cannot be undone.</p>
        <div class="modal-buttons">
            <button class="modal-btn modal-cancel" id="modalCancelBtn">No, Go Back</button>
            <button class="modal-btn modal-confirm" id="modalConfirmBtn">Yes, Cancel Order</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ========== FIREBASE CONFIGURATION ==========
    const firebaseConfig = {
        apiKey: "AIzaSyCMPUAV50FOsqpyTKY3lioeAgbQvxQzLnM",
        authDomain: "vedanta-d0199.firebaseapp.com",
        projectId: "vedanta-d0199",
        storageBucket: "vedanta-d0199.firebasestorage.app",
        messagingSenderId: "761061711987",
        appId: "1:761061711987:web:d59ff32fd53057c395ca06"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // Enable offline persistence for faster subsequent loads
    db.enablePersistence({ synchronizeTabs: true }).catch(err => {
        console.log("Persistence (non-critical):", err);
    });
    
    let currentOrder = null;
    let productsCache = new Map();
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.background = isError ? '#F44336' : '#D4AF37';
        toast.style.color = isError ? 'white' : '#050508';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    
    function getOrderIdFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('orderId');
    }
    
    // Load products from cache or Firebase
    async function loadProductsFast() {
        // Check sessionStorage cache first
        const cached = sessionStorage.getItem('vedanta_products_cache');
        if (cached) {
            try {
                const parsed = JSON.parse(cached);
                if (parsed && Date.now() - parsed.timestamp < 3600000) { // 1 hour cache
                    productsCache = new Map(parsed.data);
                    console.log("✅ Products from cache:", productsCache.size);
                    return;
                }
            } catch(e) {}
        }
        
        // If not cached, fetch from Firebase
        try {
            const snapshot = await db.collection('products').get();
            const productsArray = [];
            snapshot.forEach(doc => {
                const p = doc.data();
                productsCache.set(p.id, {
                    name: p.name,
                    images: p.images || [],
                    icon: p.icon || 'fa-gem',
                    sizes: p.sizes || [],
                    colors: p.colors || [],
                    combos: p.combos || [],
                    bulkDiscounts: p.bulkDiscounts || {},
                    price: p.price,
                    comparePrice: p.comparePrice
                });
                productsArray.push([p.id, {
                    name: p.name, images: p.images || [], icon: p.icon || 'fa-gem',
                    sizes: p.sizes || [], colors: p.colors || [], combos: p.combos || [],
                    bulkDiscounts: p.bulkDiscounts || {}, price: p.price, comparePrice: p.comparePrice
                }]);
            });
            
            // Cache in sessionStorage
            sessionStorage.setItem('vedanta_products_cache', JSON.stringify({
                timestamp: Date.now(),
                data: productsArray
            }));
            console.log("✅ Products from Firestore:", productsCache.size);
        } catch(e) {
            console.log("Products fetch error:", e);
        }
    }
    
    // Get order from cache or Firebase
    async function loadOrderFast() {
        const orderId = getOrderIdFromUrl();
        if (!orderId) {
            showError("No order ID found");
            return false;
        }
        
        // Try to get from sessionStorage first (cached from booking page)
        const cachedOrders = sessionStorage.getItem('vedanta_orders_fast');
        if (cachedOrders) {
            try {
                const orders = JSON.parse(cachedOrders);
                const cachedOrder = orders.find(o => (o.orderId === orderId || o.id === orderId));
                if (cachedOrder) {
                    currentOrder = cachedOrder;
                    return true;
                }
            } catch(e) {}
        }
        
        // Try localStorage backup
        const localOrders = localStorage.getItem('vedantaOrders_cache');
        if (localOrders) {
            try {
                const cacheData = JSON.parse(localOrders);
                if (cacheData.orders) {
                    const cachedOrder = cacheData.orders.find(o => (o.orderId === orderId || o.id === orderId));
                    if (cachedOrder) {
                        currentOrder = cachedOrder;
                        return true;
                    }
                }
            } catch(e) {}
        }
        
        // Finally fetch from Firebase
        try {
            const doc = await db.collection('orders').doc(orderId).get();
            if (doc.exists) {
                currentOrder = { id: doc.id, ...doc.data() };
                return true;
            }
        } catch (error) {
            console.error("Error fetching order:", error);
        }
        
        return false;
    }
    
    // Update from Firebase in background (real-time)
    async function updateOrderFromFirebase() {
        const orderId = getOrderIdFromUrl();
        if (!orderId || !currentOrder) return;
        
        try {
            const doc = await db.collection('orders').doc(orderId).get();
            if (doc.exists) {
                const freshOrder = { id: doc.id, ...doc.data() };
                if (JSON.stringify(currentOrder) !== JSON.stringify(freshOrder)) {
                    currentOrder = freshOrder;
                    renderOrderDetails();
                }
            }
        } catch (error) {
            console.error("Background update error:", error);
        }
    }
    
    // Set up real-time listener for status updates
    function setupRealtimeListener() {
        const orderId = getOrderIdFromUrl();
        if (!orderId) return;
        
        db.collection('orders').doc(orderId).onSnapshot((doc) => {
            if (doc.exists) {
                const updatedOrder = { id: doc.id, ...doc.data() };
                if (JSON.stringify(currentOrder) !== JSON.stringify(updatedOrder)) {
                    currentOrder = updatedOrder;
                    renderOrderDetails();
                    if (updatedOrder.status === 'cancelled') {
                        showToast("Order status updated: Cancelled");
                    } else if (updatedOrder.status === 'shipped') {
                        showToast("🎉 Great news! Your order has been shipped!");
                    } else if (updatedOrder.status === 'delivered') {
                        showToast("✅ Order delivered! Thank you for shopping with Vedanta!");
                    }
                }
            }
        });
    }
    
    function canCancelOrder() {
        if (!currentOrder) return false;
        const cancellableStatuses = ['pending', 'confirmed', 'processing'];
        return cancellableStatuses.includes(currentOrder.status);
    }
    
    async function cancelOrder() {
        if (!canCancelOrder()) {
            showToast("This order cannot be cancelled at this stage", true);
            return;
        }
        
        try {
            await db.collection('orders').doc(currentOrder.id).update({
                status: 'cancelled',
                cancelledAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            });
            currentOrder.status = 'cancelled';
            showToast("✅ Order cancelled successfully!");
            renderOrderDetails();
        } catch (error) {
            showToast("❌ Failed to cancel order", true);
        }
    }
    
    function showCancelConfirmation() {
        if (!canCancelOrder()) {
            showToast("This order cannot be cancelled at this stage", true);
            return;
        }
        document.getElementById('cancelModal').classList.add('show');
    }
    
    function hideModal() {
        document.getElementById('cancelModal').classList.remove('show');
    }
    
    function getProductImage(productId) {
        const prod = productsCache.get(productId);
        if (prod && prod.images && prod.images.length > 0) return prod.images[0];
        return null;
    }
    
    function getProductDetails(productId) {
        return productsCache.get(productId) || { sizes: [], colors: [], combos: [] };
    }
    
    function getStatusLabel(status) {
        const map = {
            'pending': 'Pending', 'confirmed': 'Confirmed', 'processing': 'Processing',
            'shipped': 'Shipped', 'delivered': 'Delivered', 'cancelled': 'Cancelled'
        };
        return map[status] || status || 'Pending';
    }
    
    function getStatusStep(status) {
        const steps = ['pending', 'confirmed', 'processing', 'shipped', 'delivered'];
        if (status === 'cancelled') {
            return steps.map(step => ({ name: step, label: getStatusLabel(step), completed: false, active: false }));
        }
        const currentIndex = steps.indexOf(status);
        const completedStatuses = steps.slice(0, currentIndex + 1);
        return steps.map((step, index) => ({
            name: step, label: getStatusLabel(step),
            completed: completedStatuses.includes(step), active: step === status
        }));
    }
    
    function renderOrderDetails() {
        if (!currentOrder) return;
        
        const container = document.getElementById('app');
        const statusSteps = getStatusStep(currentOrder.status);
        const orderDate = currentOrder.orderDate ? new Date(currentOrder.orderDate).toLocaleString() : 'N/A';
        const isCancelled = currentOrder.status === 'cancelled';
        const canCancel = canCancelOrder();
        
        const itemsHtml = (currentOrder.items || []).map(item => {
            const productImg = getProductImage(item.id);
            const productDetails = getProductDetails(item.id);
            const iconClass = productDetails.icon || 'fa-gem';
            
            // Get selected size and color
            const selectedSize = item.size || item.selectedSize || '';
            const selectedColor = item.color || item.selectedColor || '';
            
            let colorCode = '#D4AF37';
            if (selectedColor && productDetails.colors) {
                const colorObj = productDetails.colors.find(c => c.name === selectedColor || c === selectedColor);
                if (colorObj) {
                    colorCode = colorObj.code || (typeof colorObj === 'object' ? colorObj.code : '#D4AF37');
                }
            }
            
            return `
                <div class="order-item">
                    <div class="order-item-img">
                        ${productImg ? `<img src="${productImg}" alt="${escapeHtml(item.name)}" loading="lazy">` : `<i class="fas ${iconClass}"></i>`}
                    </div>
                    <div class="order-item-info">
                        <div class="order-item-name">${escapeHtml(item.name)}</div>
                        <div class="item-attributes">
                            ${selectedSize ? `<span class="size-badge"><i class="fas fa-tshirt"></i> Size: ${escapeHtml(selectedSize)}</span>` : ''}
                            ${selectedColor ? `<span class="color-badge"><span class="color-dot-small" style="background: ${colorCode};"></span> Color: ${escapeHtml(selectedColor)}</span>` : ''}
                        </div>
                        <div class="order-item-qty">Quantity: ${item.quantity}</div>
                    </div>
                    <div class="order-item-price">
                        <div class="final-price">₹${(item.price * item.quantity).toLocaleString('en-IN')}</div>
                    </div>
                </div>
            `;
        }).join('');
        
        let statusHtml = '';
        if (isCancelled) {
            statusHtml = `<div style="text-align: center; padding: 20px;"><i class="fas fa-times-circle" style="font-size: 48px; color: #F44336;"></i><p style="margin-top: 10px; color: #F44336; font-weight: 600;">Order Cancelled</p></div>`;
        } else {
            statusHtml = `<div class="status-steps">${statusSteps.map(step => `
                <div class="step ${step.completed ? 'completed' : ''} ${step.active ? 'active' : ''}">
                    <div class="step-icon"><i class="fas ${step.name === 'pending' ? 'fa-clock' : (step.name === 'confirmed' ? 'fa-check' : (step.name === 'processing' ? 'fa-cogs' : (step.name === 'shipped' ? 'fa-truck' : 'fa-check-circle')))}"></i></div>
                    <div class="step-label">${step.label}</div>
                </div>`).join('')}</div>`;
        }
        
        const hasComboOffer = currentOrder.comboApplied || (currentOrder.items && currentOrder.items.length > 1);
        
        const cancelButtonHtml = canCancel ? `
            <button class="btn-secondary btn-cancel" id="cancelOrderBtn">
                <i class="fas fa-times-circle"></i> Cancel Order
            </button>
        ` : (isCancelled ? `
            <div style="text-align: center; padding: 10px; background: rgba(244,67,54,0.1); border-radius: 16px;">
                <i class="fas fa-ban"></i> This order has been cancelled
            </div>
        ` : ``);
        
        container.innerHTML = `
            <div class="status-bar">
                <div class="card-title"><i class="fas fa-chart-line"></i> Order Status</div>
                ${statusHtml}
            </div>
            
            <div class="info-card">
                <div class="card-title"><i class="fas fa-receipt"></i> Order Information</div>
                <div class="info-row"><span class="info-label">Order ID</span><span class="info-value">${currentOrder.orderId || currentOrder.id}</span></div>
                <div class="info-row"><span class="info-label">Order Date</span><span class="info-value">${orderDate}</span></div>
                <div class="info-row"><span class="info-label">Payment Method</span><span class="info-value">${currentOrder.paymentMethod || 'Cash on Delivery'}</span></div>
                <div class="info-row"><span class="info-label">Order Status</span><span class="info-value price-highlight" style="color: ${isCancelled ? '#F44336' : '#D4AF37'}">${getStatusLabel(currentOrder.status)}</span></div>
                ${currentOrder.cancelledAt ? `<div class="info-row"><span class="info-label">Cancelled On</span><span class="info-value">${new Date(currentOrder.cancelledAt).toLocaleString()}</span></div>` : ''}
            </div>
            
            <div class="info-card">
                <div class="card-title"><i class="fas fa-user-circle"></i> Customer Details</div>
                <div class="info-row"><span class="info-label">Full Name</span><span class="info-value">${escapeHtml(currentOrder.customerName || 'Guest')}</span></div>
                <div class="info-row"><span class="info-label">Email Address</span><span class="info-value">${escapeHtml(currentOrder.customerEmail || 'N/A')}</span></div>
                <div class="info-row"><span class="info-label">Phone Number</span><span class="info-value">${escapeHtml(currentOrder.customerPhone || 'N/A')}</span></div>
            </div>
            
            <div class="info-card">
                <div class="card-title"><i class="fas fa-map-marker-alt"></i> Shipping Address</div>
                <div class="info-row"><span class="info-label">Address</span><span class="info-value">${escapeHtml(currentOrder.shippingAddress?.address || 'N/A')}</span></div>
                <div class="info-row"><span class="info-label">City</span><span class="info-value">${escapeHtml(currentOrder.shippingAddress?.city || 'N/A')}</span></div>
                <div class="info-row"><span class="info-label">State</span><span class="info-value">${escapeHtml(currentOrder.shippingAddress?.state || 'N/A')}</span></div>
                <div class="info-row"><span class="info-label">PIN Code</span><span class="info-value">${escapeHtml(currentOrder.shippingAddress?.pincode || 'N/A')}</span></div>
            </div>
            
            ${hasComboOffer ? `
            <div class="offer-card">
                <i class="fas fa-gift"></i> <strong>Special Offer Applied!</strong>
                <span style="font-size: 12px; margin-left: 8px;">You saved extra on this combo purchase!</span>
            </div>
            ` : ''}
            
            <div class="info-card">
                <div class="card-title"><i class="fas fa-shopping-bag"></i> Order Items (${currentOrder.items?.length || 0})</div>
                ${itemsHtml || '<div class="info-row"><span class="info-label">No items found</span></div>'}
                
                <div class="total-section">
                    <div class="total-row"><span>Subtotal</span><span>₹${(currentOrder.subtotal || currentOrder.total || 0).toLocaleString('en-IN')}</span></div>
                    ${currentOrder.discount ? `<div class="total-row"><span>Discount</span><span style="color: #4CAF50;">-₹${currentOrder.discount.toLocaleString('en-IN')}</span></div>` : ''}
                    ${currentOrder.shippingCharge ? `<div class="total-row"><span>Shipping</span><span>₹${currentOrder.shippingCharge.toLocaleString('en-IN')}</span></div>` : '<div class="total-row"><span>Shipping</span><span style="color: #4CAF50;">FREE</span></div>'}
                    <div class="total-row grand-total"><span>Total Amount</span><span>₹${(currentOrder.total || 0).toLocaleString('en-IN')}</span></div>
                </div>
            </div>
            
            <div class="action-buttons">
                ${cancelButtonHtml}
                <button class="btn-secondary" onclick="window.location.href='booking.html'"><i class="fas fa-arrow-left"></i> All Orders</button>
                <button class="btn-primary" onclick="window.location.href='index.html'"><i class="fas fa-shopping-cart"></i> Continue Shopping</button>
            </div>
        `;
        
        const cancelBtn = document.getElementById('cancelOrderBtn');
        if (cancelBtn) cancelBtn.addEventListener('click', showCancelConfirmation);
    }
    
    function showError(message) {
        const container = document.getElementById('app');
        container.innerHTML = `<div class="error-state"><i class="fas fa-exclamation-triangle"></i><h3>${message}</h3><p style="color: #888; margin-top: 10px;">The order you're looking for could not be found.</p><button class="btn-primary" onclick="window.location.href='booking.html'" style="margin-top: 20px;"><i class="fas fa-arrow-left"></i> Back to Bookings</button></div>`;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Event listeners
    document.getElementById('modalCancelBtn')?.addEventListener('click', hideModal);
    document.getElementById('modalConfirmBtn')?.addEventListener('click', async () => { hideModal(); await cancelOrder(); });
    window.addEventListener('click', (e) => { if (e.target === document.getElementById('cancelModal')) hideModal(); });
    
    // Main initialization - FAST parallel loading
    (async function init() {
        // Load products and order in parallel
        const [_, orderLoaded] = await Promise.all([
            loadProductsFast(),
            loadOrderFast()
        ]);
        
        if (!orderLoaded || !currentOrder) {
            showError("Order not found");
            return;
        }
        
        // Render immediately with cached data
        renderOrderDetails();
        
        // Then update from Firebase in background (for latest status)
        await updateOrderFromFirebase();
        
        // Set up real-time listener for live status updates
        setupRealtimeListener();
    })();
</script>
</body>
</html>
