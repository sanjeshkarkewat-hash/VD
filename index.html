<script>
    // ========== FIREBASE CONFIGURATION ==========
    const firebaseConfig = {
        apiKey: "AIzaSyCBZuwN4SKkXX1fEriYEwWDyTm-3uZnrKI",
        authDomain: "nexi-53897.firebaseapp.com",
        projectId: "nexi-53897",
        storageBucket: "nexi-53897.firebasestorage.app",
        messagingSenderId: "337349382612",
        appId: "1:337349382612:web:ae3c9b3d0fbf69f0e38641",
        measurementId: "G-W6N519LBPH"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let allProducts = [];
    let cart = JSON.parse(localStorage.getItem('vedantaCart')) || [];
    let activeCategory = "all";
    let currentLanguage = "english";
    let unsubscribeProducts = null;
    
    // Modal variables
    let modalRecaptchaVerifier = null;
    let modalConfirmationResult = null;
    let pendingBuyProduct = null;
    let modalCountdownTimer = null;
    let isModalOtpSent = false;
    
    function showToastMessage(msg, isError = false) {
        let toast = document.getElementById('toastMsg');
        if (toast) {
            toast.innerText = msg;
            toast.style.background = isError ? '#F44336' : '#D4AF37';
            toast.style.color = isError ? 'white' : '#050508';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function formatPhoneNumber(number) {
        let num = number.trim();
        if (!num.startsWith('+')) {
            if (num.startsWith('0')) {
                num = '+91' + num.substring(1);
            } else if (num.length === 10) {
                num = '+91' + num;
            }
        }
        return num;
    }
    
    // ========== CHECK IF USER HAS SAVED ADDRESS ==========
    async function checkUserHasSavedAddress() {
        const currentUser = JSON.parse(localStorage.getItem('vedantaUser'));
        
        if (!currentUser || !currentUser.uid) {
            return false;
        }
        
        try {
            // First check addresses collection
            const addrSnapshot = await db.collection('addresses')
                .where('userId', '==', currentUser.uid)
                .limit(1)
                .get();
            
            if (!addrSnapshot.empty) {
                console.log("✅ User has saved address in addresses collection");
                return true;
            }
            
            // Then check if user has placed any order before
            const orderSnapshot = await db.collection('orders')
                .where('customerPhone', '==', currentUser.phone)
                .limit(1)
                .get();
            
            if (!orderSnapshot.empty) {
                console.log("✅ User has placed previous orders");
                return true;
            }
            
            console.log("❌ First time user - no saved address");
            return false;
        } catch(e) {
            console.error("Error checking saved address:", e);
            return false;
        }
    }
    
    // ========== LOGIN MODAL FUNCTIONS ==========
    function setupModalRecaptcha() {
        return new Promise((resolve, reject) => {
            if (modalRecaptchaVerifier) {
                modalRecaptchaVerifier.clear();
            }
            try {
                modalRecaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container-modal', {
                    size: 'invisible',
                    callback: () => resolve(true)
                });
                resolve(true);
            } catch(e) {
                reject(e);
            }
        });
    }
    
    async function modalSendOTP() {
        const phoneInput = document.getElementById('modalPhoneInput');
        const phone = phoneInput.value.trim();
        const sendBtn = document.getElementById('modalSendOtpBtn');
        
        if (!phone || phone.length < 10) {
            showToastMessage('❌ Please enter valid phone number', true);
            return;
        }
        
        const formattedPhone = formatPhoneNumber(phone);
        
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
        
        try {
            await setupModalRecaptcha();
            modalConfirmationResult = await auth.signInWithPhoneNumber(formattedPhone, modalRecaptchaVerifier);
            
            isModalOtpSent = true;
            showToastMessage('✅ OTP sent successfully!');
            
            document.getElementById('modalPhoneSection').style.display = 'none';
            document.getElementById('modalOtpSection').classList.add('show');
            
            startModalTimer();
            
        } catch(error) {
            console.error("Error sending OTP:", error);
            let errorMsg = 'Failed to send OTP';
            if (error.code === 'auth/invalid-phone-number') errorMsg = 'Invalid phone number';
            else if (error.code === 'auth/too-many-requests') errorMsg = 'Too many requests. Try later';
            showToastMessage(errorMsg, true);
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerHTML = 'Send OTP';
        }
    }
    
    function startModalTimer() {
        let timeLeft = 60;
        const timerSpan = document.getElementById('modalTimer');
        const resendBtn = document.getElementById('modalResendBtn');
        
        if (modalCountdownTimer) clearInterval(modalCountdownTimer);
        
        modalCountdownTimer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(modalCountdownTimer);
                if (timerSpan) timerSpan.textContent = '';
                if (resendBtn) {
                    resendBtn.style.display = 'inline-block';
                    resendBtn.disabled = false;
                }
            } else {
                if (timerSpan) timerSpan.textContent = `Resend available in ${timeLeft}s`;
                if (resendBtn) resendBtn.style.display = 'none';
                timeLeft--;
            }
        }, 1000);
    }
    
    async function modalVerifyOTP() {
        const otpInput = document.getElementById('modalOtpInput');
        const otp = otpInput.value.trim();
        const verifyBtn = document.getElementById('modalVerifyBtn');
        
        if (!otp || otp.length < 6) {
            showToastMessage('❌ Please enter 6-digit OTP', true);
            return;
        }
        
        verifyBtn.disabled = true;
        verifyBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Verifying...';
        
        try {
            const result = await modalConfirmationResult.confirm(otp);
            const user = result.user;
            
            const userData = {
                uid: user.uid,
                phone: user.phoneNumber,
                name: `User${user.phoneNumber.slice(-4)}`,
                email: `${user.uid}@vedanta.com`,
                joinDate: new Date().toISOString()
            };
            
            localStorage.setItem('vedantaUser', JSON.stringify(userData));
            await db.collection('users').doc(user.uid).set(userData, { merge: true });
            
            showToastMessage(`✅ Welcome! Redirecting...`);
            closeLoginModal();
            
            if (pendingBuyProduct) {
                const tempCart = [{ 
                    id: pendingBuyProduct.id, 
                    name: pendingBuyProduct.name, 
                    price: pendingBuyProduct.price, 
                    quantity: 1 
                }];
                localStorage.setItem('vedantaCart', JSON.stringify(tempCart));
                setTimeout(() => {
                    window.location.href = 'secure-checkout.html';
                }, 500);
            }
            
        } catch(error) {
            console.error("OTP verification error:", error);
            let errorMsg = 'Invalid OTP. Please try again.';
            if (error.code === 'auth/code-expired') errorMsg = 'OTP expired. Request new OTP.';
            else if (error.code === 'auth/invalid-verification-code') errorMsg = 'Invalid OTP code';
            showToastMessage(errorMsg, true);
        } finally {
            verifyBtn.disabled = false;
            verifyBtn.innerHTML = 'Verify & Continue';
        }
    }
    
    async function modalResendOTP() {
        const phoneInput = document.getElementById('modalPhoneInput');
        const phone = phoneInput.value.trim();
        const formattedPhone = formatPhoneNumber(phone);
        
        const resendBtn = document.getElementById('modalResendBtn');
        resendBtn.disabled = true;
        resendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
        
        try {
            modalConfirmationResult = await auth.signInWithPhoneNumber(formattedPhone, modalRecaptchaVerifier);
            showToastMessage('✅ OTP resent!');
            startModalTimer();
        } catch(error) {
            showToastMessage('Failed to resend OTP', true);
        }
        resendBtn.disabled = false;
        resendBtn.innerHTML = 'Resend OTP';
    }
    
    function modalBackToPhone() {
        document.getElementById('modalPhoneSection').style.display = 'block';
        document.getElementById('modalOtpSection').classList.remove('show');
        document.getElementById('modalOtpInput').value = '';
        if (modalCountdownTimer) clearInterval(modalCountdownTimer);
        isModalOtpSent = false;
    }
    
    function openLoginModal(product) {
        pendingBuyProduct = product;
        const modal = document.getElementById('loginModal');
        document.getElementById('modalPhoneSection').style.display = 'block';
        document.getElementById('modalOtpSection').classList.remove('show');
        document.getElementById('modalPhoneInput').value = '';
        document.getElementById('modalOtpInput').value = '';
        if (modalCountdownTimer) clearInterval(modalCountdownTimer);
        isModalOtpSent = false;
        modal.classList.add('show');
    }
    
    function closeLoginModal() {
        const modal = document.getElementById('loginModal');
        modal.classList.remove('show');
        pendingBuyProduct = null;
        if (modalCountdownTimer) clearInterval(modalCountdownTimer);
    }
    
    // ========== SMART BUY NOW FUNCTION ==========
    async function buyNowWithSmartRedirect(product) {
        const currentUser = JSON.parse(localStorage.getItem('vedantaUser'));
        
        if (currentUser && currentUser.email) {
            const hasSavedAddress = await checkUserHasSavedAddress();
            
            const tempCart = [{ id: product.id, name: product.name, price: product.price, quantity: 1 }];
            localStorage.setItem('vedantaCart', JSON.stringify(tempCart));
            
            if (hasSavedAddress) {
                showToastMessage(`💳 Redirecting to secure checkout (Saved address)`);
                setTimeout(() => { window.location.href = 'secure-checkout2.html'; }, 300);
            } else {
                showToastMessage(`💳 Proceeding to checkout with ${product.name}`);
                setTimeout(() => { window.location.href = 'secure-checkout.html'; }, 300);
            }
        } else {
            openLoginModal(product);
        }
    }
    
    async function checkoutWithSmartRedirect() {
        const currentUser = JSON.parse(localStorage.getItem('vedantaUser'));
        const currentCart = JSON.parse(localStorage.getItem('vedantaCart')) || [];
        
        if (currentCart.length === 0) { 
            showToastMessage('🛒 Cart is empty!', true); 
            return; 
        }
        
        if (currentUser && currentUser.email) {
            const hasSavedAddress = await checkUserHasSavedAddress();
            
            if (hasSavedAddress) {
                window.location.href = 'secure-checkout2.html';
            } else {
                window.location.href = 'secure-checkout.html';
            }
        } else { 
            showToastMessage('🔐 Please login to checkout');
            setTimeout(() => { window.location.href = 'profile.html'; }, 800);
        }
    }
    
    // ========== CHATBOT FUNCTIONS ==========
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    const translations = { /* keep your existing translations */ };
    function t(key) { return translations[currentLanguage][key] || translations.english[key] || key; }
    function getDetailedAnswer(optionKey) { return translations[currentLanguage].detailedAnswers[optionKey] || translations.english.detailedAnswers[optionKey]; }
    
    function addMessage(text, isUser = false, isHtml = false) {
        const chatMessages = document.getElementById('chatMessages');
        if (!chatMessages) return;
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
        if (isHtml) { messageDiv.innerHTML = text; } 
        else { messageDiv.innerHTML = text.replace(/\n/g, '<br>'); }
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function showTypingIndicator() {
        const chatMessages = document.getElementById('chatMessages');
        if (!chatMessages) return;
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot typing-indicator';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        chatMessages.appendChild(typingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
    }
    
    function showLanguageSelector() {
        addMessage(t('selectLanguage'), false);
        const lastMsg = document.getElementById('chatMessages')?.lastChild;
        if (lastMsg) {
            const langHtml = `<div class="language-selector"><button class="lang-btn" onclick="window.setLanguage('english')">🇬🇧 English</button><button class="lang-btn" onclick="window.setLanguage('hindi')">🇮🇳 हिंदी</button></div>`;
            lastMsg.innerHTML = t('selectLanguage') + langHtml;
        }
    }
    
    function setLanguage(lang) {
        currentLanguage = lang;
        addMessage(`✅ Language set to ${lang === 'english' ? 'English' : 'हिंदी'}`, false);
        setTimeout(() => { showMainMenu(); }, 500);
    }
    
    function showMainMenu() {
        const options = t('options');
        const mainMenuHtml = `<div class="message bot">${t('mainMenu')}<div class="options-container" id="mainOptionsContainer"><button class="option-btn" data-option="orderStatus">${options.orderStatus}</button><button class="option-btn" data-option="returnPolicy">${options.returnPolicy}</button><button class="option-btn" data-option="shipping">${options.shipping}</button><button class="option-btn" data-option="payment">${options.payment}</button><button class="option-btn" data-option="quality">${options.quality}</button><button class="option-btn" data-option="cancelOrder">${options.cancelOrder}</button><button class="option-btn" data-option="coupon">${options.coupon}</button><button class="option-btn" data-option="trackOrder">${options.trackOrder}</button><button class="option-btn" data-option="exchange">${options.exchange}</button><button class="option-btn" data-option="contact">${options.contact}</button><button class="option-btn" data-option="refund">${options.refund}</button><button class="option-btn" data-option="cod">${options.cod}</button></div></div>`;
        addMessage('', false, true);
        const lastMsg = document.getElementById('chatMessages')?.lastChild;
        if (lastMsg) { lastMsg.innerHTML = mainMenuHtml; }
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.removeEventListener('click', handleOptionClick);
            btn.addEventListener('click', handleOptionClick);
        });
    }
    
    function handleOptionClick(e) {
        const option = e.target.getAttribute('data-option');
        const selectedText = e.target.innerText;
        addMessage(selectedText, true);
        const optionsContainer = document.getElementById('mainOptionsContainer');
        if (optionsContainer) { optionsContainer.style.display = 'none'; }
        showTypingIndicator();
        setTimeout(() => {
            removeTypingIndicator();
            const answer = getDetailedAnswer(option);
            const whatsappNumber = "916306128837";
            const encodedQuestion = encodeURIComponent(selectedText);
            const whatsappUrl = `https://wa.me/${whatsappNumber}?text=Hello%20Vedanta%20Team!%20I%20need%20help%20regarding%3A%20${encodedQuestion}`;
            const solutionHtml = `<div class="message bot">${answer.replace(/\n/g, '<br>')}<div class="action-buttons"><button class="action-btn" onclick="window.goBackToMenu()">${t('backToMenu')}</button><a href="${whatsappUrl}" target="_blank" class="action-btn agent" style="display:inline-flex; align-items:center; gap:6px; text-decoration:none;"><i class="fab fa-whatsapp"></i> ${t('talkToAgent')}</a></div></div>`;
            addMessage('', false, true);
            const lastMsg = document.getElementById('chatMessages')?.lastChild;
            if (lastMsg) { lastMsg.innerHTML = solutionHtml; }
        }, 800);
    }
    
    function goBackToMenu() {
        addMessage(t('backToMenu'), true);
        showTypingIndicator();
        setTimeout(() => { removeTypingIndicator(); showMainMenu(); }, 500);
    }
    
    function resetChat() {
        const chatMessages = document.getElementById('chatMessages');
        if (chatMessages) chatMessages.innerHTML = '';
        addMessage(t('welcome'), false);
        showLanguageSelector();
    }
    
    function toggleChatbot() {
        const chatbotWindow = document.getElementById('chatbotWindow');
        if (chatbotWindow) {
            chatbotWindow.classList.toggle('open');
            if (chatbotWindow.classList.contains('open') && document.getElementById('chatMessages')?.children.length === 0) { resetChat(); }
        }
    }
    
    window.goBackToMenu = goBackToMenu;
    window.setLanguage = setLanguage;
    window.goToProductDetail = goToProductDetail;
    
    // ========== CART FUNCTIONS ==========
    function saveCart() { localStorage.setItem('vedantaCart', JSON.stringify(cart)); updateCartUI(); }
    
    function addToCart(product) {
        const existing = cart.find(item => item.id == product.id && !item.isCombo);
        if (existing) { existing.quantity++; } 
        else { cart.push({ ...product, quantity: 1, isCombo: false }); }
        saveCart();
        showToastMessage(`🛍️ ${product.name} added!`);
    }
    
    function updateCartQuantity(index, newQuantity) {
        const item = cart[index];
        if (item.isCombo && item.comboMultiplier) {
            const newMultiples = newQuantity / item.comboMultiplier;
            if (newMultiples < 1) { cart.splice(index, 1); } 
            else { item.quantity = newMultiples * item.comboMultiplier; }
        } else {
            if (newQuantity < 1) { cart.splice(index, 1); } 
            else { cart[index].quantity = newQuantity; }
        }
        saveCart();
    }
    
    function removeFromCart(index) { cart.splice(index, 1); saveCart(); }
    
    function updateCartUI() {
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        const cartCountEl = document.getElementById('cartCount');
        if (cartCountEl) cartCountEl.innerText = totalItems;
        const cartItemsDiv = document.getElementById('cartItems');
        const cartTotalSpan = document.getElementById('cartTotal');
        if (cart.length === 0) {
            if (cartItemsDiv) cartItemsDiv.innerHTML = '<div class="empty-cart">🛒 Your cart is empty</div>';
            if (cartTotalSpan) cartTotalSpan.innerText = '₹0';
            return;
        }
        let total = 0;
        cartItemsDiv.innerHTML = '';
        cart.forEach((item, idx) => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            cartItemsDiv.innerHTML += `<div class="cart-item"><div class="cart-item-info"><h4>${escapeHtml(item.name)}</h4>${item.combo ? `<div class="combo-tag"><i class="fas fa-gift"></i> ${escapeHtml(item.combo)}</div>` : ''}<p>₹${item.price} x ${item.quantity} = ₹${itemTotal}</p></div><div class="cart-item-actions"><button class="cart-qty-btn" data-action="decr" data-index="${idx}">-</button><span class="cart-qty">${item.quantity}</span><button class="cart-qty-btn" data-action="incr" data-index="${idx}">+</button><button class="cart-item-remove" data-index="${idx}"><i class="fas fa-trash"></i></button></div></div>`;
        });
        cartItemsDiv.querySelectorAll('.cart-qty-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.getAttribute('data-index'));
                const action = btn.getAttribute('data-action');
                const item = cart[idx];
                if (action === 'incr') {
                    if (item.isCombo && item.comboMultiplier) { updateCartQuantity(idx, item.quantity + item.comboMultiplier); } 
                    else { updateCartQuantity(idx, item.quantity + 1); }
                } else if (action === 'decr') {
                    if (item.isCombo && item.comboMultiplier) { updateCartQuantity(idx, item.quantity - item.comboMultiplier); } 
                    else { updateCartQuantity(idx, item.quantity - 1); }
                }
            });
        });
        cartItemsDiv.querySelectorAll('.cart-item-remove').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                removeFromCart(parseInt(btn.getAttribute('data-index')));
            });
        });
        if (cartTotalSpan) cartTotalSpan.innerText = `₹${total}`;
    }
    
    function openCart() { document.getElementById('cartSidebar').classList.add('open'); document.getElementById('cartOverlay').classList.add('show'); }
    function closeCart() { document.getElementById('cartSidebar').classList.remove('open'); document.getElementById('cartOverlay').classList.remove('show'); }
    function goToProductDetail(productId) { localStorage.setItem('vedanta_selected_product_id', productId); window.location.href = `product-detail.html`; }
    
    // ========== PRODUCT FUNCTIONS ==========
    function renderProducts() {
        const container = document.getElementById('productsContainer');
        const resultSpan = document.getElementById('resultCount');
        if (!container) return;
        
        let filtered = [...allProducts];
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        if (searchTerm) { filtered = filtered.filter(p => p.name && p.name.toLowerCase().includes(searchTerm)); }
        if (activeCategory !== 'all') { filtered = filtered.filter(p => p.category === activeCategory); }
        
        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:40px;"><i class="fas fa-search"></i><br>No products found ✨</div>`;
            if (resultSpan) resultSpan.innerText = '0';
            return;
        }
        
        container.innerHTML = '';
        filtered.forEach(p => {
            const hasImage = p.images && p.images.length > 0;
            const firstImage = hasImage ? p.images[0] : null;
            container.innerHTML += `<div class="product-card" onclick="goToProductDetail('${p.id}')"><div class="product-img">${hasImage ? `<img src="${firstImage}" alt="${escapeHtml(p.name)}" loading="lazy">` : `<i class="fas ${p.icon || 'fa-gem'}"></i>`}<div class="badge-offer">${p.badge || 'New'}</div></div><div class="product-info"><div class="product-title">${escapeHtml(p.name)}</div><div class="product-category">${p.category || 'General'}</div><div class="product-price">₹${(p.price || 0).toLocaleString('en-IN')}</div><div class="product-buttons"><button class="buynow-btn" data-id="${p.id}" data-name="${escapeHtml(p.name)}" data-price="${p.price || 0}"><i class="fas fa-bolt"></i> BUY NOW</button><button class="cart-btn" data-id="${p.id}" data-name="${escapeHtml(p.name)}" data-price="${p.price || 0}"><i class="fa-regular fa-bag-shopping"></i> ADD</button></div></div></div>`;
        });
        
        if (resultSpan) resultSpan.innerText = filtered.length;
        
        document.querySelectorAll('.cart-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                addToCart({ id: btn.dataset.id, name: btn.dataset.name, price: parseInt(btn.dataset.price) }); 
            });
        });
        
        // SMART BUY NOW BUTTON - with redirect logic
        document.querySelectorAll('.buynow-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                buyNowWithSmartRedirect({ 
                    id: btn.dataset.id, 
                    name: btn.dataset.name, 
                    price: parseInt(btn.dataset.price) 
                }); 
            });
        });
    }
    
    function startLiveRealtimeSync() {
        if (unsubscribeProducts) {
            unsubscribeProducts();
        }
        
        const query = db.collection('products').where('status', '==', 'active');
        
        unsubscribeProducts = query.onSnapshot((snapshot) => {
            const newProducts = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                newProducts.push({
                    id: doc.id,
                    name: data.name,
                    category: data.category,
                    price: data.price,
                    icon: data.icon || 'fa-gem',
                    badge: data.badge || 'New',
                    images: data.images || []
                });
            });
            
            allProducts = newProducts;
            localStorage.setItem('vedantaProducts', JSON.stringify(allProducts));
            renderProducts();
            console.log(`🔥 LIVE SYNC: ${allProducts.length} products`);
        }, (error) => {
            console.error("Firestore listener error:", error);
        });
    }
    
    function loadCachedProducts() {
        const cached = localStorage.getItem('vedantaProducts');
        if (cached) {
            try {
                const parsed = JSON.parse(cached);
                if (parsed && parsed.length > 0) {
                    allProducts = parsed;
                    renderProducts();
                    console.log("📦 Loaded from cache:", allProducts.length);
                }
            } catch(e) {}
        }
    }
    
    // Event Listeners
    document.getElementById('searchInput')?.addEventListener('input', () => { renderProducts(); });
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeCategory = btn.getAttribute('data-cat');
            renderProducts();
        });
    });
    
    document.getElementById('floatingCart')?.addEventListener('click', openCart);
    document.getElementById('closeCartBtn')?.addEventListener('click', closeCart);
    document.getElementById('cartOverlay')?.addEventListener('click', closeCart);
    document.getElementById('checkoutBtn')?.addEventListener('click', checkoutWithSmartRedirect);
    document.getElementById('chatbotBtn')?.addEventListener('click', toggleChatbot);
    document.getElementById('closeChatBtn')?.addEventListener('click', toggleChatbot);
    
    // Modal Event Listeners
    document.getElementById('modalSendOtpBtn')?.addEventListener('click', modalSendOTP);
    document.getElementById('modalVerifyBtn')?.addEventListener('click', modalVerifyOTP);
    document.getElementById('modalResendBtn')?.addEventListener('click', modalResendOTP);
    document.getElementById('modalBackBtn')?.addEventListener('click', modalBackToPhone);
    document.getElementById('closeModalBtn')?.addEventListener('click', closeLoginModal);
    
    document.getElementById('loginModal')?.addEventListener('click', (e) => {
        if (e.target === document.getElementById('loginModal')) {
            closeLoginModal();
        }
    });
    
    // Initialize
    loadCachedProducts();
    startLiveRealtimeSync();
    updateCartUI();
    
    window.addEventListener('pageshow', function(event) { if (event.persisted && allProducts.length > 0) { renderProducts(); } });
    window.addComboToCart = function(product, comboQty, comboPrice) {
        const finalPrice = comboPrice / comboQty;
        const comboInfo = `${comboQty} for ₹${comboPrice}`;
        const existing = cart.find(item => item.id == product.id && item.combo === comboInfo);
        if (existing) { existing.quantity += comboQty; } 
        else { cart.push({ id: product.id, name: product.name, price: finalPrice, quantity: comboQty, combo: comboInfo, isCombo: true, comboMultiplier: comboQty }); }
        saveCart();
        showToastMessage(`🎉 Combo: ${comboQty} items for ₹${comboPrice} added!`);
    };
</script>
