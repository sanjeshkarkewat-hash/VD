<script>
  const firebaseConfig = { apiKey: "AIzaSyCBZuwN4SKkXX1fEriYEwWDyTm-3uZnrKI", authDomain: "nexi-53897.firebaseapp.com", projectId: "nexi-53897", storageBucket: "nexi-53897.firebasestorage.app", messagingSenderId: "337349382612", appId: "1:337349382612:web:ae3c9b3d0fbf69f0e38641" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const RAZORPAY_KEY_ID = "rzp_live_Sdj7MbKcJRZhnI";
  const ONLINE_DISCOUNT = 5;
  
  let cart = [], cartTotal = 0, discountedTotal = 0, discountAmount = 0, isProcessing = false;
  let selectedPaymentMethod = 'cod', currentUser = null;
  let selectedAddress = null;
  let shippingCharge = 97;
  let isCustomizedOrder = false, frontDesignImageURL = null, backDesignImageURL = null;
  
  // Map variables
  let mapInstance = null, mapMarker = null, userLiveLocation = null, currentDraggedLocation = null;
  let watchId = null;

  function showToast(msg, isErr = false) { let t = document.getElementById('toast'); t.innerText = msg; t.style.background = isErr ? '#F44336' : '#D4AF37'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2800); }
  function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('show', show); }
  
  function calculateShippingCharge(state) { if(!state) return 97; let s = state.toLowerCase(); if(s.includes('maharashtra')) return 97; if(s.includes('gujarat')||s.includes('mp')||s.includes('goa')) return 101; if(s.includes('delhi')||s.includes('rajasthan')||s.includes('punjab')||s.includes('haryana')) return 104; if(s.includes('karnataka')||s.includes('tamil')||s.includes('kerala')||s.includes('telangana')) return 110; return 107; }

  async function getFullAddressFromLatLng(lat, lng) {
    return new Promise((resolve) => {
      const geocoder = new google.maps.Geocoder();
      geocoder.geocode({ location: { lat, lng } }, (results, status) => {
        if(status === 'OK' && results[0]) {
          let street = "", city = "", state = "", pincode = "", landmark = "";
          for(let comp of results[0].address_components) {
            if(comp.types.includes('route')) street = comp.long_name;
            if(comp.types.includes('locality')) city = comp.long_name;
            if(comp.types.includes('administrative_area_level_1')) state = comp.long_name;
            if(comp.types.includes('postal_code')) pincode = comp.long_name;
            if(comp.types.includes('sublocality_level_1')) landmark = comp.long_name;
          }
          let fullStreet = results[0].formatted_address.split(',')[0];
          if(street) fullStreet = street;
          resolve({ street: fullStreet, city, state, pincode, landmark });
        } else resolve(null);
      });
    });
  }

  // Haversine distance calculation (km)
  function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  // CORE: Open Map Picker with LIVE LOCATION PIN + DRAG DISTANCE UPDATE
  function openMapPicker() {
    const modal = document.getElementById('mapPickerModal');
    modal.classList.add('active');
    const mapContainer = document.getElementById('mapContainer');
    mapContainer.innerHTML = '<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#D4AF37;"><i class="fas fa-spinner fa-pulse"></i> Getting your live location...</div>';
    
    // Get live location first
    if(navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLiveLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          currentDraggedLocation = { ...userLiveLocation };
          initMapAndMarker(userLiveLocation);
          updateDistanceDisplay(userLiveLocation, currentDraggedLocation);
        },
        (err) => {
          showToast('⚠️ Location access denied. Using default Mumbai center.', true);
          userLiveLocation = { lat: 19.0760, lng: 72.8777 };
          currentDraggedLocation = { ...userLiveLocation };
          initMapAndMarker(userLiveLocation);
          updateDistanceDisplay(userLiveLocation, currentDraggedLocation);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    } else {
      userLiveLocation = { lat: 19.0760, lng: 72.8777 };
      currentDraggedLocation = { ...userLiveLocation };
      initMapAndMarker(userLiveLocation);
    }
    
    function initMapAndMarker(centerLoc) {
      setTimeout(() => {
        const mapDiv = document.createElement('div');
        mapDiv.style.width = '100%';
        mapDiv.style.height = '100%';
        mapContainer.innerHTML = '';
        mapContainer.appendChild(mapDiv);
        
        mapInstance = new google.maps.Map(mapDiv, { center: centerLoc, zoom: 16, mapTypeId: 'roadmap' });
        
        // Create draggable marker at live location
        mapMarker = new google.maps.Marker({
          map: mapInstance,
          position: centerLoc,
          draggable: true,
          animation: google.maps.Animation.DROP,
          title: "Drag to set exact address"
        });
        
        // Distance update on drag end
        mapMarker.addListener('dragend', () => {
          const newPos = mapMarker.getPosition();
          currentDraggedLocation = { lat: newPos.lat(), lng: newPos.lng() };
          updateDistanceDisplay(userLiveLocation, currentDraggedLocation);
          showToast(`📍 Pin moved! Distance: ${getDistanceFromLatLonInKm(userLiveLocation.lat, userLiveLocation.lng, currentDraggedLocation.lat, currentDraggedLocation.lng).toFixed(2)} km from your live location`, false);
        });
        
        // Also update if user clicks on map
        mapInstance.addListener('click', (e) => {
          mapMarker.setPosition(e.latLng);
          currentDraggedLocation = { lat: e.latLng.lat(), lng: e.latLng.lng() };
          updateDistanceDisplay(userLiveLocation, currentDraggedLocation);
          showToast(`📍 Location updated. Distance: ${getDistanceFromLatLonInKm(userLiveLocation.lat, userLiveLocation.lng, currentDraggedLocation.lat, currentDraggedLocation.lng).toFixed(2)} km`);
        });
        
        // initial distance display
        updateDistanceDisplay(userLiveLocation, currentDraggedLocation);
      }, 100);
    }
  }
  
  function updateDistanceDisplay(origin, current) {
    if(!origin || !current) return;
    const distanceKm = getDistanceFromLatLonInKm(origin.lat, origin.lng, current.lat, current.lng);
    document.getElementById('distanceValue').innerText = distanceKm.toFixed(2);
    // Add color effect if distance is far
    const badge = document.getElementById('liveDistanceBadge');
    if(distanceKm > 5) badge.style.background = "#FF5722";
    else if(distanceKm > 2) badge.style.background = "#FF9800";
    else badge.style.background = "#4CAF50";
    badge.style.color = "white";
  }
  
  // Confirm and fill address from dragged location (NO additional drag needed)
  async function confirmAndFillAddress() {
    if(!currentDraggedLocation) {
      showToast('❌ Please wait for location detection', true);
      return;
    }
    showLoading(true);
    showToast('📍 Fetching complete address from selected pin...');
    const addrData = await getFullAddressFromLatLng(currentDraggedLocation.lat, currentDraggedLocation.lng);
    showLoading(false);
    
    if(addrData && addrData.street) {
      // Fill the new address form fields if visible
      if(document.getElementById('newStreet')) {
        document.getElementById('newStreet').value = addrData.street || '';
        document.getElementById('newCity').value = addrData.city || '';
        document.getElementById('newState').value = addrData.state || '';
        document.getElementById('newPincode').value = addrData.pincode || '';
        if(addrData.landmark) document.getElementById('newLandmark').value = addrData.landmark;
        
        const newShipping = calculateShippingCharge(addrData.state);
        shippingCharge = newShipping;
        updateTotalDisplay();
        showToast(`✅ Address set: ${addrData.city}, ${addrData.state} | Shipping: ₹${shippingCharge}`);
      } else {
        // fallback: if form not present, create address object
        selectedAddress = { fullName: currentUser?.name || "Customer", phone: currentUser?.phone, address: addrData.street, city: addrData.city, state: addrData.state, pincode: addrData.pincode, landmark: addrData.landmark };
        shippingCharge = calculateShippingCharge(addrData.state);
        updateTotalDisplay();
        displaySelectedAddressCard(selectedAddress);
        showToast(`✅ Address updated from map!`);
      }
      document.getElementById('mapPickerModal').classList.remove('active');
    } else {
      showToast('❌ Could not fetch address details. Please try again or fill manually.', true);
    }
  }
  
  function closeMapModal() { document.getElementById('mapPickerModal').classList.remove('active'); }
  
  // ---------- Address & Firebase helpers ----------
  async function fetchSavedAddressFromPhone() { if(!currentUser?.phone) return null; try { let snap = await db.collection('orders').where('customerPhone','==',currentUser.phone).orderBy('orderDate','desc').limit(1).get(); if(!snap.empty) { let data=snap.docs[0].data(); return { fullName:data.customerName, street:data.shippingAddress.address, city:data.shippingAddress.city, state:data.shippingAddress.state, pincode:data.shippingAddress.pincode, landmark:data.shippingAddress.landmark||'', phone:data.customerPhone }; } } catch(e){} return null; }
  async function saveNewAddressToFirebase(addr) { if(!currentUser) return; try { await db.collection('addresses').add({ userId:currentUser.uid, name:addr.fullName, street:addr.address, city:addr.city, state:addr.state, pincode:addr.pincode, landmark:addr.landmark||'', phone:addr.phone, isDefault:true }); } catch(e){} }
  
  function showNewAddressForm() {
    const container = document.getElementById('addressSelectionArea');
    container.innerHTML = `
      <div class="new-address-form show">
        <div class="form-group"><label>Full Name</label><input type="text" id="newFullName" value="${escapeHtml(currentUser?.name || '')}"></div>
        <div class="form-group"><label>Street Address</label><input type="text" id="newStreet" placeholder="House / Building / Street"></div>
        <div class="form-row"><div class="form-group"><label>City</label><input type="text" id="newCity"></div><div class="form-group"><label>State</label><input type="text" id="newState"></div></div>
        <div class="form-row"><div class="form-group"><label>Pincode</label><input type="text" id="newPincode" maxlength="6"></div><div class="form-group"><label>Landmark</label><input type="text" id="newLandmark"></div></div>
        <button class="location-btn map-pin-btn" id="openMapPickerFromNewBtn"><i class="fas fa-map-marked-alt"></i> 🗺️ Open Map & Pick Location (Live Pin + Distance)</button>
        <div class="action-buttons-row"><button class="save-address-btn" id="saveNewAddressBtn">✅ Use This Address</button><button class="cancel-address-btn" id="cancelNewAddressBtn">Cancel</button></div>
      </div>
    `;
    document.getElementById('saveNewAddressBtn')?.addEventListener('click', saveNewAddressAndUse);
    document.getElementById('cancelNewAddressBtn')?.addEventListener('click', () => { if(savedAddressFromDb) showSavedAddressOptions(); else showNewAddressForm(); });
    document.getElementById('openMapPickerFromNewBtn')?.addEventListener('click', openMapPicker);
  }
  
  let savedAddressFromDb = null;
  async function loadAndRenderAddressSelection() { showLoading(true); const addr = await fetchSavedAddressFromPhone(); savedAddressFromDb = addr; showLoading(false); if(addr && !selectedAddress) showSavedAddressOptions(); else showNewAddressForm(); }
  
  function showSavedAddressOptions() {
    const addr = savedAddressFromDb;
    const container = document.getElementById('addressSelectionArea');
    container.innerHTML = `<div><div class="selected-address-card" id="useSavedAddressBtn"><div class="address-name"><i class="fas fa-history"></i> Previously Used</div><div class="address-detail">${escapeHtml(addr.fullName)}</div><div class="address-detail">${escapeHtml(addr.street)}, ${escapeHtml(addr.city)} - ${escapeHtml(addr.pincode)}</div></div><button class="add-new-address-btn" id="showNewAddressFormBtn"><i class="fas fa-plus"></i> Add New Address</button></div>`;
    document.getElementById('useSavedAddressBtn')?.addEventListener('click', () => { selectedAddress = { fullName:addr.fullName, phone:addr.phone, address:addr.street, city:addr.city, state:addr.state, pincode:addr.pincode, landmark:addr.landmark }; shippingCharge=calculateShippingCharge(addr.state); updateTotalDisplay(); displaySelectedAddressCard(selectedAddress); });
    document.getElementById('showNewAddressFormBtn')?.addEventListener('click', showNewAddressForm);
  }
  
  function displaySelectedAddressCard(addr) {
    const container = document.getElementById('addressSelectionArea');
    container.innerHTML = `<div class="selected-address-card"><div class="address-detail"><i class="fas fa-check-circle" style="color:#4CAF50;"></i> ${escapeHtml(addr.fullName)}</div><div class="address-detail">${escapeHtml(addr.address)}</div><div class="address-detail">${escapeHtml(addr.city)}, ${escapeHtml(addr.state)} - ${escapeHtml(addr.pincode)}</div><div class="address-detail">📞 ${escapeHtml(addr.phone)}</div><button class="add-new-address-btn" id="changeAddressBtn" style="margin-top:12px;"><i class="fas fa-edit"></i> Change Address</button></div>`;
    document.getElementById('changeAddressBtn')?.addEventListener('click', showNewAddressForm);
  }
  
  async function saveNewAddressAndUse() {
    const fullName = document.getElementById('newFullName').value.trim();
    const street = document.getElementById('newStreet').value.trim();
    const city = document.getElementById('newCity').value.trim();
    const state = document.getElementById('newState').value.trim();
    const pincode = document.getElementById('newPincode').value.trim();
    const landmark = document.getElementById('newLandmark').value.trim();
    if(!fullName || !street || !city || !state || !pincode) { showToast('Please fill required fields', true); return; }
    if(!/^\d{6}$/.test(pincode)) { showToast('Invalid pincode', true); return; }
    selectedAddress = { fullName, phone: currentUser.phone, address: street, city, state, pincode, landmark };
    shippingCharge = calculateShippingCharge(state);
    updateTotalDisplay();
    await saveNewAddressToFirebase(selectedAddress);
    displaySelectedAddressCard(selectedAddress);
    showToast(`Address saved. Shipping ₹${shippingCharge}`);
  }
  
  // Order & Payment
  async function saveOrderToFirebase(paymentMethod, txId=null) { if(!selectedAddress) return {success:false}; let items=cart.map(i=>({...i, total:i.price*i.quantity})); let finalTotal = (paymentMethod==='Razorpay' && discountAmount>0) ? discountedTotal+shippingCharge : cartTotal+shippingCharge; let orderId='ORD'+Date.now()+Math.floor(Math.random()*1000); let data={ orderId, customerName:selectedAddress.fullName, customerPhone:selectedAddress.phone, shippingAddress:{address:selectedAddress.address, city:selectedAddress.city, state:selectedAddress.state, pincode:selectedAddress.pincode, landmark:selectedAddress.landmark}, items, paymentMethod, paymentStatus:paymentMethod==='Razorpay'?'paid':'pending', status:paymentMethod==='Razorpay'?'confirmed':'pending', transactionId:txId, subtotal:cartTotal, shippingCharge, discountApplied:discountAmount, total:finalTotal, orderDate:new Date().toISOString(), userId:currentUser?.uid, isCustomized:isCustomizedOrder, frontDesignImage:frontDesignImageURL, backDesignImage:backDesignImageURL }; await db.collection('orders').doc(orderId).set(data); return {success:true, orderId}; }
  async function saveOrderCOD() { if(!selectedAddress) { showToast('Add shipping address first', true); return; } if(isProcessing) return; isProcessing=true; showLoading(true); let res=await saveOrderToFirebase('Cash on Delivery'); showLoading(false); if(res.success){ showToast(`Order placed! ${res.orderId}`); localStorage.clear(); setTimeout(()=> window.location.href=`order-success.html?orderId=${res.orderId}`,1500); } else { showToast('Failed', true); } isProcessing=false; }
  async function initiateRazorpayPayment() { if(!selectedAddress) { showToast('Add address', true); return; } if(isProcessing) return; isProcessing=true; showLoading(true); let finalAmt=discountedTotal+shippingCharge; if(finalAmt<=0) return; let options={ key:RAZORPAY_KEY_ID, amount:Math.round(finalAmt)*100, currency:'INR', name:'VEDANTA', description:'Order', prefill:{ name:selectedAddress.fullName, contact:selectedAddress.phone }, theme:{color:'#D4AF37'}, handler:async (response)=>{ let res=await saveOrderToFirebase('Razorpay', response.razorpay_payment_id); showLoading(false); if(res.success){ showToast(`Payment success!`); localStorage.clear(); setTimeout(()=> window.location.href=`order-success.html?orderId=${res.orderId}`,1500); } else { showToast('Order save issue', true); } isProcessing=false; }, modal:{ ondismiss:()=>{ showLoading(false); showToast('Payment cancelled', true); isProcessing=false; } } }; let rzp=new Razorpay(options); rzp.open(); }
  
  function loadCart() { let saved=localStorage.getItem('vedantaCart'); if(saved) cart=JSON.parse(saved); if(cart.length===0) cart=[{ id:'tshirt1', name:'Premium Cotton T-Shirt', price:1299, quantity:1, size:'M', color:'Black' }]; cartTotal=cart.reduce((s,i)=>s+(i.price*i.quantity),0); renderOrderSummary(); calculateDiscount(); }
  function calculateDiscount() { if(selectedPaymentMethod==='razorpay'){ discountAmount=Math.round(cartTotal*ONLINE_DISCOUNT/100); discountedTotal=cartTotal-discountAmount; } else { discountAmount=0; discountedTotal=cartTotal; } updateTotalDisplay(); }
  function updateTotalDisplay() { document.getElementById('subtotal').innerHTML=`₹${cartTotal.toLocaleString()}`; document.getElementById('shippingCharge').innerHTML=`₹${shippingCharge}`; let final; if(selectedPaymentMethod==='razorpay' && discountAmount>0){ document.getElementById('discountRow').style.display='flex'; document.getElementById('discountAmount').innerHTML=`-₹${discountAmount}`; final=discountedTotal+shippingCharge; } else { document.getElementById('discountRow').style.display='none'; final=cartTotal+shippingCharge; } document.getElementById('grandTotal').innerHTML=`₹${final.toLocaleString()}`; }
  function renderOrderSummary() { let container=document.getElementById('orderItemsList'); container.innerHTML=''; cart.forEach(item=>{ let div=document.createElement('div'); div.className='order-item'; div.innerHTML=`<div class="order-item-img"><i class="fas fa-tshirt"></i></div><div class="order-item-info"><h4>${escapeHtml(item.name)}</h4><p>Qty:${item.quantity} x ₹${item.price}</p><p>Size:${item.size}</p></div><div class="order-item-price">₹${(item.price*item.quantity).toLocaleString()}</div>`; container.appendChild(div); }); }
  
  function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  
  async function init() {
    let storedUser = JSON.parse(localStorage.getItem('vedantaUser'));
    if(storedUser) currentUser = storedUser;
    else { let phone = localStorage.getItem('userPhone'); if(phone) currentUser={ uid:'guest_'+Date.now(), phone, name:'' }; else { showToast('Please login', true); setTimeout(()=> window.location.href='profile.html',1500); return; } }
    document.getElementById('displayPhone')?.setAttribute?.('style','display:none');
    await loadAndRenderAddressSelection();
    loadCart();
    document.getElementById('codOption')?.addEventListener('click',()=>{ document.querySelectorAll('.payment-option').forEach(o=>o.classList.remove('selected')); document.getElementById('codOption').classList.add('selected'); selectedPaymentMethod='cod'; document.getElementById('codDetails').classList.add('show'); document.getElementById('razorpaySection').classList.remove('show'); calculateDiscount(); });
    document.getElementById('razorpayOption')?.addEventListener('click',()=>{ document.querySelectorAll('.payment-option').forEach(o=>o.classList.remove('selected')); document.getElementById('razorpayOption').classList.add('selected'); selectedPaymentMethod='razorpay'; document.getElementById('codDetails').classList.remove('show'); document.getElementById('razorpaySection').classList.add('show'); calculateDiscount(); });
    document.getElementById('placeOrderCodBtn')?.addEventListener('click', saveOrderCOD);
    document.getElementById('payRazorpayBtn')?.addEventListener('click', initiateRazorpayPayment);
    document.getElementById('backToShopBtn')?.addEventListener('click', (e) => { e.preventDefault(); window.location.href='index.html'; });
    document.getElementById('confirmMapBtn')?.addEventListener('click', confirmAndFillAddress);
    document.getElementById('closeMapModalBtn')?.addEventListener('click', closeMapModal);
    document.getElementById('cancelMapBtn')?.addEventListener('click', closeMapModal);
    document.getElementById('codOption').click();
  }
  
  init();
</script>
</body>
</html>
