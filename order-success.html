<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Order Success - Vedanta</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050508;
            color: #FFFFFF;
            overflow-x: hidden;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.08), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success-card {
            background: rgba(15,15,22,0.7);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 28px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.3);
            width: 100%;
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            animation: scaleIn 0.5s ease 0.3s both;
        }
        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        .success-icon i { font-size: 50px; color: white; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 10px; color: #D4AF37; }
        .order-id {
            background: rgba(212,175,55,0.15);
            padding: 12px 20px;
            border-radius: 50px;
            display: inline-block;
            margin: 15px 0;
            font-size: 14px;
            font-weight: 600;
        }
        .order-id span { color: #D4AF37; font-weight: 800; }
        .message { color: #ccc; font-size: 14px; line-height: 1.6; margin: 20px 0; }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .btn-primary, .btn-secondary {
            flex: 1;
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            color: #050508;
            border: none;
        }
        .btn-secondary {
            background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.5);
            color: #D4AF37;
        }
        .btn-primary:active, .btn-secondary:active { transform: scale(0.97); }
        .tracking-info {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            color: #888;
        }
        .tracking-info i { color: #D4AF37; margin-right: 6px; }
        @media (max-width: 480px) {
            .container { padding: 16px; }
            .success-card { padding: 30px 20px; }
            h1 { font-size: 24px; }
            .success-icon { width: 80px; height: 80px; }
            .success-icon i { font-size: 40px; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="success-card" id="successCard">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>Order Confirmed! 🎉</h1>
        <p style="color: #888;">Thank you for shopping with Vedanta</p>
        
        <div class="order-id" id="orderIdDisplay">
            <span id="orderIdText">Loading...</span>
        </div>
        
        <div class="message" id="messageText">
            We have received your order and will process it soon.<br>
            You will receive a confirmation email with tracking details.
        </div>
        
        <div class="button-group">
            <a href="booking.html" class="btn-secondary">
                <i class="fas fa-box"></i> My Orders
            </a>
            <a href="index.html" class="btn-primary">
                <i class="fas fa-shopping-cart"></i> Continue Shopping
            </a>
        </div>
        
        <div class="tracking-info">
            <i class="fas fa-envelope"></i> Order details sent to your email<br>
            <i class="fas fa-headset"></i> Need help? Call us: +91 63061 28837
        </div>
    </div>
</div>

<script>
    function getOrderIdFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('orderId');
    }
    
    function showOrderDetails() {
        const orderId = getOrderIdFromUrl();
        const orderIdSpan = document.getElementById('orderIdText');
        const messageDiv = document.getElementById('messageText');
        
        if (orderId) {
            orderIdSpan.innerHTML = `Order ID: ${orderId}`;
            messageDiv.innerHTML = `Your order <strong style="color:#D4AF37;">${orderId}</strong> has been confirmed.<br>We will notify you once it's shipped.`;
        } else {
            // Try to get from localStorage
            const lastOrder = localStorage.getItem('lastOrder');
            if (lastOrder) {
                try {
                    const order = JSON.parse(lastOrder);
                    orderIdSpan.innerHTML = `Order ID: ${order.orderId}`;
                    messageDiv.innerHTML = `Your order <strong style="color:#D4AF37;">${order.orderId}</strong> has been confirmed.<br>We will notify you once it's shipped.`;
                } catch(e) {
                    orderIdSpan.innerHTML = `Order Placed Successfully!`;
                }
            } else {
                orderIdSpan.innerHTML = `Order Placed Successfully!`;
            }
        }
        
        // Clear cart from localStorage to avoid duplicate
        localStorage.removeItem('vedantaCart');
    }
    
    showOrderDetails();
</script>
</body>
</html>
