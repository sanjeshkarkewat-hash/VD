<script>
    // ========== 🔥 FIREBASE CONFIGURATION ==========
    const firebaseConfig = {
        apiKey: "AIzaSyCBZuwN4SKkXX1fEriYEwWDyTm-3uZnrKI",
        authDomain: "nexi-53897.firebaseapp.com",
        projectId: "nexi-53897",
        storageBucket: "nexi-53897.firebasestorage.app",
        messagingSenderId: "337349382612",
        appId: "1:337349382612:web:ae3c9b3d0fbf69f0e38641",
        measurementId: "G-W6N519LBPH"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    // Enable phone auth persistence
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    
    let currentUserData = JSON.parse(localStorage.getItem('vedantaUser')) || null;
    let userOrders = [];
    let countdownTimer = null;
    let recaptchaVerifier = null;
    let confirmationResult = null;
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.background = isError ? '#F44336' : '#D4AF37';
        toast.style.color = isError ? 'white' : '#050508';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    // Format phone number to E.164 format
    function formatPhoneNumber(number) {
        let num = number.trim();
        // Remove any spaces or special characters
        num = num.replace(/[\s\-\(\)]/g, '');
        if (!num.startsWith('+')) {
            if (num.startsWith('0')) {
                num = '+91' + num.substring(1);
            } else if (num.length === 10) {
                num = '+91' + num;
            } else if (num.length === 12 && num.startsWith('91')) {
                num = '+' + num;
            }
        }
        return num;
    }
    
    // Setup reCAPTCHA - FIXED VERSION
    function setupRecaptcha() {
        return new Promise((resolve, reject) => {
            try {
                // Clear existing verifier if any
                if (recaptchaVerifier) {
                    recaptchaVerifier.clear();
                }
                // Create new verifier with the container
                recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                    size: 'invisible',
                    callback: () => {
                        console.log("reCAPTCHA resolved");
                        resolve(true);
                    }
                });
                // Render the reCAPTCHA
                recaptchaVerifier.render().then(() => {
                    console.log("reCAPTCHA rendered successfully");
                    resolve(true);
                }).catch(reject);
            } catch(e) {
                console.error("reCAPTCHA setup error:", e);
                reject(e);
            }
        });
    }
    
    // Send OTP
    async function sendOTP() {
        const phoneInput = document.getElementById('phoneInput');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const phone = phoneInput.value.trim();
        
        if (!phone || phone.length < 10) {
            showToast('❌ Please enter valid phone number', true);
            return;
        }
        
        const formattedPhone = formatPhoneNumber(phone);
        console.log("Sending OTP to:", formattedPhone);
        
        sendOtpBtn.disabled = true;
        sendOtpBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
        
        try {
            // Setup reCAPTCHA first
            await setupRecaptcha();
            
            // Send OTP
            confirmationResult = await auth.signInWithPhoneNumber(formattedPhone, recaptchaVerifier);
            console.log("OTP sent successfully");
            showToast('✅ OTP sent successfully!');
            
            // Show OTP input section
            document.getElementById('otpSection').style.display = 'block';
            document.getElementById('phoneSection').style.display = 'none';
            
            // Start timer
            startTimer();
            
        } catch(error) {
            console.error("Error sending OTP:", error);
            let errorMsg = 'Failed to send OTP';
            if (error.code === 'auth/invalid-phone-number') {
                errorMsg = 'Invalid phone number format';
            } else if (error.code === 'auth/too-many-requests') {
                errorMsg = 'Too many requests. Please try again later';
            } else if (error.code === 'auth/network-request-failed') {
                errorMsg = 'Network error. Check your connection';
            }
            showToast(errorMsg, true);
            sendOtpBtn.disabled = false;
            sendOtpBtn.innerHTML = 'Send OTP';
        }
    }
    
    // Start countdown timer for resend
    function startTimer() {
        let timeLeft = 60;
        const timerSpan = document.getElementById('timer');
        const resendBtn = document.getElementById('resendOtpBtn');
        
        if (countdownTimer) clearInterval(countdownTimer);
        
        countdownTimer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdownTimer);
                if (timerSpan) timerSpan.textContent = '';
                if (resendBtn) {
                    resendBtn.style.display = 'inline-block';
                    resendBtn.disabled = false;
                }
            } else {
                if (timerSpan) timerSpan.textContent = `${timeLeft}s`;
                if (resendBtn) resendBtn.style.display = 'none';
                timeLeft--;
            }
        }, 1000);
    }
    
    // Verify OTP and Login
    async function verifyOTP() {
        const otpInput = document.getElementById('otpInput');
        const otp = otpInput.value.trim();
        const verifyBtn = document.getElementById('verifyBtn');
        
        if (!otp || otp.length < 6) {
            showToast('❌ Please enter 6-digit OTP', true);
            return;
        }
        
        verifyBtn.disabled = true;
        verifyBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Verifying...';
        
        try {
            const result = await confirmationResult.confirm(otp);
            const user = result.user;
            console.log("User verified:", user.uid);
            
            // Save user data
            const userData = {
                uid: user.uid,
                phone: user.phoneNumber,
                name: `User${user.phoneNumber.slice(-4)}`,
                email: `${user.uid}@vedanta.com`,
                joinDate: new Date().toISOString()
            };
            
            localStorage.setItem('vedantaUser', JSON.stringify(userData));
            currentUserData = userData;
            
            // Save to Firestore
            try {
                await db.collection('users').doc(user.uid).set(userData, { merge: true });
            } catch(e) {
                console.log("Firestore save error:", e);
            }
            
            showToast(`✅ Welcome ${userData.name}!`);
            renderProfilePage();
            
        } catch(error) {
            console.error("OTP verification error:", error);
            let errorMsg = 'Invalid OTP. Please try again.';
            if (error.code === 'auth/code-expired') {
                errorMsg = 'OTP expired. Request new OTP.';
            } else if (error.code === 'auth/invalid-verification-code') {
                errorMsg = 'Invalid OTP code';
            }
            showToast(errorMsg, true);
            verifyBtn.disabled = false;
            verifyBtn.innerHTML = 'Verify OTP';
        }
    }
    
    // Resend OTP
    async function resendOTP() {
        const phoneInput = document.getElementById('phoneInput');
        const phone = phoneInput.value.trim();
        const formattedPhone = formatPhoneNumber(phone);
        
        const resendBtn = document.getElementById('resendOtpBtn');
        resendBtn.disabled = true;
        resendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
        
        try {
            confirmationResult = await auth.signInWithPhoneNumber(formattedPhone, recaptchaVerifier);
            showToast('✅ OTP resent!');
            startTimer();
            resendBtn.style.display = 'none';
        } catch(error) {
            console.error("Resend error:", error);
            showToast('Failed to resend OTP', true);
        }
        resendBtn.disabled = false;
        resendBtn.innerHTML = 'Resend OTP';
    }
    
    // Go back to phone input
    function goBackToPhone() {
        document.getElementById('phoneSection').style.display = 'block';
        document.getElementById('otpSection').style.display = 'none';
        document.getElementById('otpInput').value = '';
        if (countdownTimer) clearInterval(countdownTimer);
    }
    
    // Logout function
    function logout() {
        auth.signOut().then(() => {
            localStorage.removeItem('vedantaUser');
            currentUserData = null;
            userOrders = [];
            showToast('👋 Logged out successfully');
            renderLoginPage();
        }).catch(() => {
            localStorage.removeItem('vedantaUser');
            currentUserData = null;
            userOrders = [];
            showToast('👋 Logged out');
            renderLoginPage();
        });
    }
    
    // Render Login Page with OTP
    function renderLoginPage() {
        const container = document.getElementById('profileContainer');
        container.innerHTML = `
            <div class="animated-logo">
                <div class="logo-glow">VEDANTA</div>
                <div class="logo-sub">✦ WHERE SOUL MEETS LUXURY ✦</div>

            <div class="card">

                <div class="login-subtitle">Verify your mobile number with OTP</div>
                
                <div id="phoneSection">

                </div>
                
                <div id="otpSection" style="display: none;">

                        <button class="login-btn" id="backToPhoneBtn" style="background: rgba(255,255,255,0.1); color: white;" onclick="goBackToPhone()">← Back</button>

                    <div class="timer-text"><i class="fas fa-clock"></i> Resend available in <span id="timer">60s</span></div>

                <div class="setup-info" style="margin-top: 16px; text-align: center; font-size: 11px; color: #D4AF37; background: rgba(212,175,55,0.08); padding: 10px; border-radius: 14px;">
                    <i class="fas fa-info-circle"></i> We'll send a 6-digit OTP to verify your number
                </div>
            </div>
            
            <div class="card">
                <div class="benefits-title"><i class="fas fa-crown"></i> Membership Benefits</div>
                <div class="benefits-list">

                    <div class="benefit-item"><i class="fas fa-gift"></i><div><h4>Birthday Surprise</h4><p>Special gift on your birthday</p></div></div>
                    <div class="benefit-item"><i class="fas fa-star"></i><div><h4>Early Access</h4><p>To new collections & sales</p></div></div>
                    <div class="benefit-item"><i class="fas fa-coins"></i><div><h4>Vedanta Coins</h4><p>Earn coins on every purchase</p></div></div>
                </div>
            </div>
        `;
        
        // Attach event listeners
        document.getElementById('sendOtpBtn')?.addEventListener('click', sendOTP);
        document.getElementById('verifyBtn')?.addEventListener('click', verifyOTP);
        document.getElementById('resendOtpBtn')?.addEventListener('click', resendOTP);
        
        document.getElementById('phoneInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendOTP();
        });
        document.getElementById('otpInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyOTP();
        });
    }
    
    // Load user orders from Firestore
    async function loadUserOrders() {
        if (!currentUserData || !currentUserData.phone) return;
        try {
            const snapshot = await db.collection('orders')
                .where('customerPhone', '==', currentUserData.phone)
                .orderBy('orderDate', 'desc')
                .get();
            
            userOrders = [];
            snapshot.forEach(doc => {
                userOrders.push({ id: doc.id, ...doc.data() });
            });
            renderProfilePage();
        } catch(e) {
            console.log("Orders load error:", e);
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m));
    }
    
    // Render Profile Page
    function renderProfilePage() {
        const container = document.getElementById('profileContainer');
        
        const totalOrders = userOrders.length;
        const activeOrders = userOrders.filter(o => o.status !== 'delivered' && o.status !== 'cancelled').length;
        const deliveredOrders = userOrders.filter(o => o.status === 'delivered').length;
        const totalSpent = userOrders.reduce((sum, o) => sum + (o.total || 0), 0);
        const coinsEarned = Math.floor(totalSpent / 100);
        const joinDate = currentUserData.joinDate ? new Date(currentUserData.joinDate).toLocaleDateString('en-IN') : 'Today';
        
        container.innerHTML = `
            <div class="card">
                <div class="profile-header">
                    <div class="profile-avatar"><i class="fas fa-user"></i></div>
                    <div class="profile-info">
                        <h3>${escapeHtml(currentUserData.name || 'Valued Customer')}</h3>
                        <p><i class="fas fa-phone"></i> ${escapeHtml(currentUserData.phone || 'No phone')}</p>
                        <p><i class="fas fa-envelope"></i> ${escapeHtml(currentUserData.email || 'No email')}</p>
                        <p><i class="fas fa-calendar"></i> Member since ${joinDate}</p>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-number">${totalOrders}</div><div class="stat-label">Total Orders</div></div>
                    <div class="stat-card"><div class="stat-number">${activeOrders}</div><div class="stat-label">Active Orders</div></div>
                    <div class="stat-card"><div class="stat-number">${deliveredOrders}</div><div class="stat-label">Delivered</div></div>
                </div>
            </div>
            
            <div class="card">
                <div class="benefits-title"><i class="fas fa-gem"></i> Member Benefits</div>
                <div class="benefits-list">
                    <div class="benefit-item"><i class="fas fa-tags"></i><div><h4>10% OFF on Next Order</h4><p>Use code: WELCOME10</p></div></div>
                    <div class="benefit-item"><i class="fas fa-truck-fast"></i><div><h4>Free Express Shipping</h4><p>On all orders above ₹2999</p></div></div>
                    <div class="benefit-item"><i class="fas fa-coins"></i><div><h4>Vedanta Coins</h4><p>${coinsEarned} coins = ₹${coinsEarned} value</p></div></div>
                </div>
            </div>
            
            <div class="card">
                <div class="menu-item" onclick="window.location.href='booking.html'">
                    <div class="menu-left"><i class="fas fa-box"></i><span>My Orders (${totalOrders})</span></div>
                    <i class="fas fa-chevron-right"></i>
                </div>
                <div class="menu-item" onclick="showToast('📍 Coming soon')">
                    <div class="menu-left"><i class="fas fa-map-marker-alt"></i><span>Saved Addresses</span></div>
                    <i class="fas fa-chevron-right"></i>
                </div>
                <div class="menu-item" onclick="showToast('💳 Coming soon')">
                    <div class="menu-left"><i class="fas fa-credit-card"></i><span>Payment Methods</span></div>
                    <i class="fas fa-chevron-right"></i>
                </div>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        `;
        
        document.getElementById('logoutBtn')?.addEventListener('click', logout);
    }
    
    // Make goBackToPhone global for onclick
    window.goBackToPhone = goBackToPhone;
    
    // Check if user is logged in
    auth.onAuthStateChanged((user) => {
        if (user) {
            const storedUser = localStorage.getItem('vedantaUser');
            if (storedUser) {
                currentUserData = JSON.parse(storedUser);
            } else {
                currentUserData = {
                    uid: user.uid,
                    phone: user.phoneNumber,
                    name: `User${user.phoneNumber.slice(-4)}`,
                    email: `${user.uid}@vedanta.com`,
                    joinDate: new Date().toISOString()
                };
                localStorage.setItem('vedantaUser', JSON.stringify(currentUserData));
            }
            loadUserOrders();
        } else {
            if (currentUserData) {
                currentUserData = null;
                userOrders = [];
            }
            renderLoginPage();
        }
    });
    
    // Initial render
    if (currentUserData) {
        renderProfilePage();
        loadUserOrders();
    } else {
        renderLoginPage();
    }
</script>
</body>
</html>
