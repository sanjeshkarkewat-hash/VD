<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050508;
            color: #FFFFFF;
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.1), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(212,175,55,0.3);
            background: rgba(5,5,8,0.98);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FF8C00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .back-btn {
            background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.3);
            padding: 6px 14px;
            border-radius: 40px;
            color: #D4AF37;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn i { font-size: 11px; }
        
        .profile-container { max-width: 500px; margin: 0 auto; padding: 16px 12px; padding-bottom: 20px; }
        
        .animated-logo { text-align: center; margin-bottom: 24px; animation: logoFloat 3s ease-in-out infinite; }
        @keyframes logoFloat { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
        .logo-glow {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF8E7, #D4AF37, #F5D742, #FF8C00);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 3s linear infinite;
            display: inline-block;
        }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        .logo-sub { font-size: 10px; color: #888; margin-top: 5px; letter-spacing: 1px; }
        
        .card {
            background: rgba(15,15,22,0.7);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px 16px;
            border: 1px solid rgba(212,175,55,0.2);
            margin-bottom: 12px;
        }
        .login-title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 6px; }
        .login-subtitle { text-align: center; color: #888; font-size: 11px; margin-bottom: 20px; }
        
        .email-input-group { display: flex; gap: 10px; margin-bottom: 16px; flex-direction: column; }
        .email-input-group input {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 18px;
            color: white;
            font-size: 15px;
            font-family: inherit;
            -webkit-appearance: none;
        }
        .email-input-group input:focus { outline: none; border-color: #D4AF37; }
        .send-otp-btn {
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            border: none;
            padding: 14px;
            border-radius: 18px;
            font-weight: 700;
            color: #050508;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
        
        .otp-group { margin-bottom: 16px; display: none; }
        .otp-group.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .otp-input {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 18px;
            color: white;
            font-size: 18px;
            text-align: center;
            letter-spacing: 6px;
            font-weight: 600;
            -webkit-appearance: none;
        }
        .verify-btn {
            width: 100%;
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            border: none;
            padding: 14px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 14px;
            color: #050508;
            cursor: pointer;
            margin-top: 12px;
        }
        .resend-otp { text-align: center; margin-top: 10px; }
        .resend-otp button { background: none; border: none; color: #D4AF37; font-size: 12px; cursor: pointer; padding: 8px; }
        
        .benefits-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .benefits-list { display: flex; flex-direction: column; gap: 8px; }
        .benefit-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 16px; }
        .benefit-item i { font-size: 18px; color: #D4AF37; min-width: 28px; }
        .benefit-item div h4 { font-size: 12px; margin-bottom: 2px; }
        .benefit-item div p { font-size: 10px; color: #888; }
        
        .profile-header { display: flex; align-items: center; gap: 14px; margin-bottom: 0; }
        .profile-avatar { width: 55px; height: 55px; background: linear-gradient(135deg, #D4AF37, #FF8C00); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .profile-avatar i { font-size: 28px; color: #050508; }
        .profile-info h3 { font-size: 16px; margin-bottom: 3px; }
        .profile-info p { font-size: 11px; color: #888; margin: 2px 0; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 0; }
        .stat-card { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 16px; text-align: center; }
        .stat-number { font-size: 18px; font-weight: 800; color: #D4AF37; }
        .stat-label { font-size: 10px; color: #888; margin-top: 3px; }
        
        .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .menu-left { display: flex; align-items: center; gap: 12px; }
        .menu-left i { font-size: 16px; color: #D4AF37; width: 24px; }
        .menu-left span { font-size: 13px; }
        .menu-item i.fa-chevron-right { font-size: 12px; color: #666; }
        
        .logout-btn {
            width: 100%;
            background: rgba(244,67,54,0.12);
            border: 1px solid rgba(244,67,54,0.3);
            padding: 12px;
            border-radius: 18px;
            font-weight: 600;
            font-size: 13px;
            color: #F44336;
            cursor: pointer;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .logout-btn:active { transform: scale(0.97); }
        
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #D4AF37;
            color: #050508;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 10000;
            font-size: 11px;
            display: none;
            white-space: nowrap;
            max-width: 90%;
            white-space: normal;
            text-align: center;
        }
        .toast.show { display: block; animation: fadeInOut 2s ease; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 6px 16px;
            display: flex;
            gap: 20px;
            z-index: 1000;
            border: 1px solid rgba(212,175,55,0.4);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 40px;
            transition: 0.2s;
        }
        .nav-item i { font-size: 18px; color: #ccc; }
        .nav-item span { font-size: 9px; color: #ccc; }
        .nav-item.active, .nav-item:active { background: rgba(212,175,55,0.2); }
        .nav-item.active i, .nav-item.active span { color: #D4AF37; }
        
        .loader {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #050508;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .setup-info {
            background: rgba(212,175,55,0.08);
            border-radius: 14px;
            padding: 10px;
            margin-top: 12px;
            text-align: center;
            font-size: 10px;
            color: #D4AF37;
        }
        .countdown {
            font-size: 11px;
            color: #888;
            margin-top: 8px;
            text-align: center;
        }
        
        button, .menu-item, .nav-item, .back-btn {
            cursor: pointer;
            transition: transform 0.05s;
        }
        button:active, .menu-item:active, .nav-item:active, .back-btn:active {
            transform: scale(0.97);
        }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        @media (min-width: 768px) {
            .profile-container { padding: 20px; }
            .email-input-group { flex-direction: row; }
            .send-otp-btn { width: auto; padding: 0 24px; }
            .bottom-nav { gap: 40px; padding: 8px 28px; }
            .nav-item { padding: 8px 20px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo"><h1>VEDANTA</h1></div>
    <div class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back</div>
</div>

<div class="profile-container" id="profileContainer">
    <div style="text-align: center; padding: 40px;">
        <div class="loader" style="border-color: #D4AF37; border-top-color: transparent;"></div>
        <p style="margin-top: 12px; font-size: 12px; color: #888;">Loading...</p>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i><span>HOME</span></div>

    <div class="nav-item active" onclick="window.location.href='profile.html'"><i class="fas fa-user-circle"></i><span>PROFILE</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ========== 🔥 FIREBASE CONFIGURATION ==========
    const firebaseConfig = {
        apiKey: "AIzaSyCMPUAV50FOsqpyTKY3lioeAgbQvxQzLnM",
        authDomain: "vedanta-d0199.firebaseapp.com",
        projectId: "vedanta-d0199",
        storageBucket: "vedanta-d0199.firebasestorage.app",
        messagingSenderId: "761061711987",
        appId: "1:761061711987:web:d59ff32fd53057c395ca06",
        measurementId: "G-RQMQZVGK75"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // ==================== 🔐 EMAILJS CONFIGURATION ====================
    const EMAILJS_PUBLIC_KEY = "5q9t5zkkRRxC2JvRD";
    const EMAILJS_SERVICE_ID = "service_6ucrgd9";
    const EMAILJS_TEMPLATE_ID = "template_kniixfj";
    
    emailjs.init(EMAILJS_PUBLIC_KEY);
    
    let currentUser = JSON.parse(localStorage.getItem('vedantaUser')) || null;
    let generatedOTP = null;
    let otpEmail = null;
    let countdownInterval = null;
    let resendCooldown = false;
    let userOrders = [];
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.background = isError ? '#F44336' : '#D4AF37';
        toast.style.color = isError ? 'white' : '#050508';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    
    // ✅ FIXED: Load ALL orders from Firebase (same as booking.html)
    async function loadUserOrdersFromFirebase(email) {
        if (!email) return [];
        
        try {
            console.log("Fetching orders for email:", email);
            
            // Query 1: By customerEmail
            const emailSnapshot = await db.collection('orders')
                .where('customerEmail', '==', email)
                .get();
            
            // Query 2: By userEmail (for older orders)
            const userEmailSnapshot = await db.collection('orders')
                .where('userEmail', '==', email)
                .get();
            
            // Query 3: By userId (for Firebase Auth users)
            let userIdSnapshot = { docs: [] };
            if (currentUser && currentUser.uid) {
                userIdSnapshot = await db.collection('orders')
                    .where('userId', '==', currentUser.uid)
                    .get();
            }
            
            // Merge all orders without duplicates
            const ordersMap = new Map();
            
            emailSnapshot.forEach(doc => {
                ordersMap.set(doc.id, { id: doc.id, ...doc.data() });
            });
            
            userEmailSnapshot.forEach(doc => {
                if (!ordersMap.has(doc.id)) {
                    ordersMap.set(doc.id, { id: doc.id, ...doc.data() });
                }
            });
            
            userIdSnapshot.forEach(doc => {
                if (!ordersMap.has(doc.id)) {
                    ordersMap.set(doc.id, { id: doc.id, ...doc.data() });
                }
            });
            
            // Convert to array and sort by date (newest first)
            let orders = Array.from(ordersMap.values());
            orders.sort((a, b) => {
                const dateA = a.orderDate ? new Date(a.orderDate) : new Date(0);
                const dateB = b.orderDate ? new Date(b.orderDate) : new Date(0);
                return dateB - dateA;
            });
            
            console.log("Total orders found:", orders.length);
            console.log("Orders:", orders.map(o => ({ id: o.orderId, status: o.status, total: o.total })));
            
            return orders;
            
        } catch (error) {
            console.error("Error loading orders:", error);
            return [];
        }
    }
    
    // Send OTP via EmailJS
    async function sendEmailOTP(email) {
        try {
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            otpEmail = email;
            
            const templateParams = {
                to_email: email,
                otp_code: generatedOTP,
                app_name: "Vedanta",
                expiry_time: "5 minutes"
            };
            
            await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
            
            showToast(`✅ OTP sent to ${email}`);
            return { success: true };
            
        } catch (error) {
            console.error("EmailJS Error:", error);
            showToast(`❌ Failed to send OTP. Please try again.`, true);
            return { success: false };
        }
    }
    
    // Verify OTP
    async function verifyEmailOTP(enteredOTP) {
        if (!generatedOTP) {
            showToast("❌ Please request OTP first", true);
            return false;
        }
        
        if (enteredOTP === generatedOTP) {
            const userData = {
                uid: `email_${Date.now()}`,
                email: otpEmail,
                name: otpEmail.split('@')[0],
                joinDate: new Date().toISOString(),
                phone: ''
            };
            
            localStorage.setItem('vedantaUser', JSON.stringify(userData));
            currentUser = userData;
            
            showToast("✅ Login successful! Welcome!");
            await renderProfilePage();
            return true;
        } else {
            showToast("❌ Invalid OTP. Please try again.", true);
            return false;
        }
    }
    
    async function resendEmailOTP(email) {
        if (resendCooldown) {
            showToast("⏳ Please wait 30 seconds", true);
            return false;
        }
        
        if (!email) {
            showToast("❌ Please enter email first", true);
            return false;
        }
        
        resendCooldown = true;
        startCountdown(30);
        return await sendEmailOTP(email);
    }
    
    function startCountdown(seconds) {
        const countdownEl = document.getElementById('countdown');
        if (!countdownEl) return;
        
        let remaining = seconds;
        countdownEl.style.display = 'block';
        countdownEl.innerHTML = `Resend available in ${remaining}s`;
        
        if (countdownInterval) clearInterval(countdownInterval);
        
        countdownInterval = setInterval(() => {
            remaining--;
            if (remaining <= 0) {
                clearInterval(countdownInterval);
                countdownEl.style.display = 'none';
                resendCooldown = false;
            } else {
                countdownEl.innerHTML = `Resend available in ${remaining}s`;
            }
        }, 1000);
    }
    
    function renderLoginPage() {
        const container = document.getElementById('profileContainer');
        container.innerHTML = `
            <div class="animated-logo">
                <div class="logo-glow">VEDANTA</div>
                <div class="logo-sub">✦ WHERE SOUL MEETS LUXURY ✦</div>
            </div>
            
            <div class="card">
                <div class="login-title">🔐 Email OTP Login</div>
                <div class="login-subtitle">Enter your email to receive OTP</div>
                
                <div class="email-input-group">
                    <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email">
                    <button class="send-otp-btn" id="sendOtpBtn">Send OTP</button>
                </div>
                
                <div class="otp-group" id="otpGroup">
                    <input type="tel" id="otpInput" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*">
                    <button class="verify-btn" id="verifyBtn">Verify & Login</button>
                    <div class="resend-otp"><button id="resendOtpBtn">Resend OTP</button></div>
                    <div id="countdown" class="countdown" style="display:none"></div>
                </div>
                
                <div class="setup-info">
                    <i class="fas fa-envelope"></i> OTP will be sent to your email inbox
                </div>
            </div>
            
            <div class="card">
                <div class="benefits-title"><i class="fas fa-crown"></i> Membership Benefits</div>
                <div class="benefits-list">
                    <div class="benefit-item"><i class="fas fa-tags"></i><div><h4>Exclusive Discounts</h4><p>10% off on first order</p></div></div>
                    <div class="benefit-item"><i class="fas fa-truck-fast"></i><div><h4>Free Priority Shipping</h4><p>On orders above ₹2999</p></div></div>
                    <div class="benefit-item"><i class="fas fa-gift"></i><div><h4>Birthday Surprise</h4><p>Special gift on your birthday</p></div></div>
                    <div class="benefit-item"><i class="fas fa-star"></i><div><h4>Early Access</h4><p>To new collections & sales</p></div></div>
                    <div class="benefit-item"><i class="fas fa-coins"></i><div><h4>Vedanta Coins</h4><p>Earn coins on every purchase</p></div></div>
                </div>
            </div>
        `;

        let currentEmail = '';

        document.getElementById('sendOtpBtn')?.addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value.trim();
            if (!email || !email.includes('@')) {
                showToast('❌ Please enter a valid email', true);
                return;
            }
            
            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span>Sending...';
            
            currentEmail = email;
            const result = await sendEmailOTP(email);
            
            btn.disabled = false;
            btn.innerHTML = 'Send OTP';
            
            if (result.success) {
                document.getElementById('otpGroup').classList.add('show');
                startCountdown(30);
            }
        });

        document.getElementById('verifyBtn')?.addEventListener('click', async () => {
            const otp = document.getElementById('otpInput').value.trim();
            if (!otp) { showToast('❌ Please enter OTP', true); return; }
            if (otp.length !== 6) { showToast('❌ Enter 6-digit OTP', true); return; }
            
            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span>Verifying...';
            
            await verifyEmailOTP(otp);
            
            btn.disabled = false;
            btn.innerHTML = 'Verify & Login';
        });

        document.getElementById('resendOtpBtn')?.addEventListener('click', async () => {
            if (!currentEmail) {
                const email = document.getElementById('emailInput').value.trim();
                if (!email || !email.includes('@')) {
                    showToast('❌ Enter valid email first', true);
                    return;
                }
                currentEmail = email;
            }
            
            const btn = document.getElementById('resendOtpBtn');
            btn.disabled = true;
            btn.innerHTML = 'Sending...';
            
            await resendEmailOTP(currentEmail);
            
            btn.disabled = false;
            btn.innerHTML = 'Resend OTP';
        });
        
        setTimeout(() => {
            document.getElementById('emailInput')?.focus();
        }, 100);
    }
    
    // ✅ FIXED: Render Profile Page with CORRECT statistics
    async function renderProfilePage() {
        const container = document.getElementById('profileContainer');
        
        container.innerHTML = `<div style="text-align: center; padding: 40px;"><div class="loader" style="border-color: #D4AF37; border-top-color: transparent;"></div><p style="margin-top: 12px; font-size: 12px;">Loading profile...</p></div>`;
        
        if (currentUser && currentUser.email) {
            userOrders = await loadUserOrdersFromFirebase(currentUser.email);
        }
        
        // ✅ CORRECT ORDER STATUS CALCULATION
        // Total Orders = All orders in Firebase for this user
        const totalOrders = userOrders.length;
        
        // Active Orders = Orders that are NOT cancelled and NOT delivered
        // Statuses: pending, confirmed, processing, shipped, paid
        const activeStatuses = ['pending', 'confirmed', 'processing', 'shipped', 'paid'];
        const activeOrders = userOrders.filter(o => {
            const status = o.status?.toLowerCase() || '';
            return activeStatuses.includes(status);
        }).length;
        
        // Cancelled Orders
        const cancelledOrders = userOrders.filter(o => o.status?.toLowerCase() === 'cancelled').length;
        
        // Delivered Orders
        const deliveredOrders = userOrders.filter(o => o.status?.toLowerCase() === 'delivered' || o.status?.toLowerCase() === 'completed').length;
        
        // Total Spent (excluding cancelled orders)
        const totalSpent = userOrders
            .filter(o => o.status?.toLowerCase() !== 'cancelled')
            .reduce((sum, o) => sum + (o.total || 0), 0);
        
        // Coins = totalSpent / 100
        const coinsEarned = Math.floor(totalSpent / 100);
        
        const joinDate = currentUser.joinDate ? new Date(currentUser.joinDate).toLocaleDateString('en-IN') : 'Today';
        
        console.log("Profile Stats:", {
            totalOrders,
            activeOrders,
            cancelledOrders,
            deliveredOrders,
            totalSpent,
            coinsEarned,
            allOrders: userOrders.map(o => ({ id: o.orderId, status: o.status }))
        });

        container.innerHTML = `
            <div class="card">
                <div class="profile-header">
                    <div class="profile-avatar"><i class="fas fa-user"></i></div>
                    <div class="profile-info">
                        <h3>${escapeHtml(currentUser.name || 'Valued Customer')}</h3>
                        <p><i class="fas fa-envelope"></i> ${escapeHtml(currentUser.email || 'No email')}</p>
                        <p><i class="fas fa-calendar"></i> Joined ${joinDate}</p>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-number">${totalOrders}</div><div class="stat-label">Total Orders</div></div>
                    <div class="stat-card"><div class="stat-number">${activeOrders}</div><div class="stat-label">Active Orders</div></div>
                    <div class="stat-card"><div class="stat-number">${deliveredOrders}</div><div class="stat-label">Delivered</div></div>
                </div>
            </div>
            
            <div class="card">
                <div class="benefits-title"><i class="fas fa-gem"></i> Member Benefits</div>
                <div class="benefits-list">
                    <div class="benefit-item"><i class="fas fa-tags"></i><div><h4>10% OFF on Next Order</h4><p>Use code: WELCOME10</p></div></div>
                    <div class="benefit-item"><i class="fas fa-truck-fast"></i><div><h4>Free Express Shipping</h4><p>On all orders above ₹2999</p></div></div>
                    <div class="benefit-item"><i class="fas fa-coins"></i><div><h4>Vedanta Coins</h4><p>${coinsEarned} coins = ₹${coinsEarned} value</p></div></div>
                </div>
            </div>
            
            <div class="card">
                <div class="menu-item" onclick="window.location.href='booking.html'">
                    <div class="menu-left"><i class="fas fa-box"></i><span>My Orders (${totalOrders})</span></div>
                    <i class="fas fa-chevron-right"></i>
                </div>
                <div class="menu-item" onclick="showToast('📍 Coming soon')">
                    <div class="menu-left"><i class="fas fa-map-marker-alt"></i><span>Saved Addresses</span></div>
                    <i class="fas fa-chevron-right"></i>
                </div>
                <div class="menu-item" onclick="showToast('💳 Coming soon')">
                    <div class="menu-left"><i class="fas fa-credit-card"></i><span>Payment Methods</span></div>
                    <i class="fas fa-chevron-right"></i>
                </div>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        `;
        
        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem('vedantaUser');
            currentUser = null;
            generatedOTP = null;
            otpEmail = null;
            userOrders = [];
            if (countdownInterval) clearInterval(countdownInterval);
            showToast('👋 Logged out successfully');
            renderLoginPage();
        });
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m));
    }
    
    if (currentUser && currentUser.email) {
        renderProfilePage();
    } else {
        renderLoginPage();
    }
</script>
</body>
</html>
