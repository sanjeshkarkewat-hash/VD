<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Secure Checkout - Vedanta</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #050508;
      color: #FFFFFF;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.1), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    /* Login Overlay */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }
    .login-overlay.hide {
      display: none;
    }
    .login-card {
      background: rgba(15,15,22,0.95);
      border-radius: 32px;
      padding: 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 1px solid rgba(212,175,55,0.3);
    }
    .login-card h2 {
      font-size: 28px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #D4AF37, #FF8C00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .login-card p {
      color: #888;
      font-size: 13px;
      margin-bottom: 25px;
    }
    .login-input-group {
      margin-bottom: 20px;
    }
    .login-input-group input {
      width: 100%;
      padding: 16px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 20px;
      color: white;
      font-size: 16px;
    }
    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #D4AF37, #FF8C00);
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-weight: 700;
      color: #050508;
      cursor: pointer;
      margin-bottom: 15px;
    }
    .otp-section {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .otp-section.show {
      display: block;
    }
    .otp-input {
      text-align: center;
      letter-spacing: 4px;
      font-size: 20px;
    }
    .resend-link {
      background: none;
      border: none;
      color: #D4AF37;
      font-size: 12px;
      cursor: pointer;
      margin-top: 10px;
    }
    .error-text {
      color: #F44336;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }
    .error-text.show {
      display: block;
    }

    .checkout-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    .checkout-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(212,175,55,0.3);
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .logo h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FF8C00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .user-info {
      background: rgba(212,175,55,0.15);
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-info i {
      color: #D4AF37;
    }
    .logout-link {
      background: none;
      border: none;
      color: #F44336;
      cursor: pointer;
      margin-left: 10px;
      font-size: 12px;
    }

    .checkout-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    @media (max-width: 900px) {
      .checkout-main { grid-template-columns: 1fr; }
    }

    .checkout-form {
      background: rgba(15,15,22,0.6);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 28px;
      border: 1px solid rgba(212,175,55,0.2);
    }
    .form-section {
      margin-bottom: 30px;
      padding-bottom: 25px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .form-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    .form-section h3 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #D4AF37;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #CCCCCC;
    }
    .form-group label .required {
      color: #FF4500;
      margin-left: 4px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 16px;
      color: white;
      font-size: 14px;
      font-family: inherit;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .location-btn {
      background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(255,140,0,0.2));
      border: 1px solid rgba(212,175,55,0.4);
      padding: 12px;
      border-radius: 16px;
      width: 100%;
      color: #D4AF37;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .cod-option {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 15px;
    }
    .cod-option.selected {
      border-color: #4CAF50;
      background: rgba(76,175,80,0.1);
    }
    .cod-option i {
      font-size: 32px;
      color: #4CAF50;
    }
    .cod-option .radio-circle {
      width: 24px;
      height: 24px;
      border: 2px solid #888;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
    }
    .cod-option.selected .radio-circle {
      border-color: #4CAF50;
    }
    .cod-option.selected .radio-circle::after {
      content: '';
      width: 14px;
      height: 14px;
      background: #4CAF50;
      border-radius: 50%;
    }
    .order-summary {
      background: linear-gradient(135deg, rgba(15,15,22,0.7), rgba(10,10,18,0.8));
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 28px;
      border: 1px solid rgba(212,175,55,0.2);
      position: sticky;
      top: 20px;
    }
    .order-item {
      display: flex;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .order-item-img {
      width: 70px;
      height: 70px;
      background: #0E0E14;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .order-item-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .order-item-img i {
      font-size: 32px;
      color: #D4AF37;
    }
    .order-item-info {
      flex: 1;
    }
    .order-item-info h4 {
      font-size: 15px;
      margin-bottom: 5px;
    }
    .order-item-size {
      background: rgba(212,175,55,0.15);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      color: #D4AF37;
      display: inline-block;
      margin-top: 4px;
    }
    .order-item-price {
      font-weight: 700;
      color: #D4AF37;
      text-align: right;
      min-width: 80px;
    }
    .order-total {
      padding: 20px 0;
      border-top: 2px solid rgba(212,175,55,0.3);
      margin-top: 10px;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .total-row.grand-total {
      font-size: 22px;
      font-weight: 800;
      color: #D4AF37;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .free-shipping-badge {
      background: rgba(76,175,80,0.15);
      padding: 10px;
      border-radius: 12px;
      text-align: center;
      margin: 15px 0;
      color: #4CAF50;
      font-size: 13px;
    }
    .place-order-btn {
      width: 100%;
      background: linear-gradient(135deg, #D4AF37, #FF8C00);
      border: none;
      padding: 18px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 18px;
      color: #050508;
      cursor: pointer;
      margin-top: 20px;
    }
    .place-order-btn.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .back-to-shop {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #888;
      text-decoration: none;
      font-size: 14px;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #D4AF37;
      color: #050508;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: bold;
      z-index: 10000;
      display: none;
    }
    .toast.show {
      display: block;
      animation: fadeInOut 2s ease;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }
  </style>
</head>
<body>

<div class="checkout-container" id="checkoutContainer" style="display: none;">
  <!-- Checkout content will be shown after login -->
</div>

<div class="toast" id="toast"></div>

<script>
  // ========== 🔥 FIREBASE CONFIGURATION ==========
  const firebaseConfig = {
    apiKey: "AIzaSyCMPUAV50FOsqpyTKY3lioeAgbQvxQzLnM",
    authDomain: "vedanta-d0199.firebaseapp.com",
    projectId: "vedanta-d0199",
    storageBucket: "vedanta-d0199.firebasestorage.app",
    messagingSenderId: "761061711987",
    appId: "1:761061711987:web:d59ff32fd53057c395ca06",
    measurementId: "G-RQMQZVGK75"
  };
  
  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  console.log("🔥 Firebase Connected!");
  
  // ========== 🔐 EMAILJS CONFIGURATION ==========
  const EMAILJS_PUBLIC_KEY = "5q9t5zkkRRxC2JvRD";
  const EMAILJS_SERVICE_ID = "service_6ucrgd9";
  const EMAILJS_TEMPLATE_ID = "template_kniixfj";
  
  emailjs.init(EMAILJS_PUBLIC_KEY);
  console.log("✅ EmailJS initialized");
  
  let currentUser = JSON.parse(localStorage.getItem('vedantaUser')) || null;
  let generatedOTP = null;
  let otpEmail = null;
  let countdownInterval = null;
  let resendCooldown = false;
  let cart = JSON.parse(localStorage.getItem('vedantaCart')) || [];
  let allProducts = [];
  let isPaymentSelected = false;
  
  function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.background = isError ? '#F44336' : '#D4AF37';
    toast.style.color = isError ? 'white' : '#050508';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }
  
  // ========== LOAD PRODUCTS FROM FIREBASE ==========
  async function loadProducts() {
    try {
      const snapshot = await db.collection('products').get();
      const products = [];
      snapshot.forEach(doc => {
        products.push({ id: doc.id, ...doc.data() });
      });
      allProducts = products;
    } catch (error) {
      console.error("Error loading products:", error);
      const saved = localStorage.getItem('vedantaProducts');
      if (saved) allProducts = JSON.parse(saved);
    }
  }
  
  function getProductImage(productId) {
    const product = allProducts.find(p => p.id == productId);
    if (product && product.images && product.images.length > 0) return product.images[0];
    return null;
  }
  
  function getProductIcon(productId) {
    const product = allProducts.find(p => p.id == productId);
    return (product && product.icon) ? product.icon : 'fa-shopping-bag';
  }
  
  // ========== LOGIN FUNCTIONS ==========
  async function sendOTP(email) {
    try {
      generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
      otpEmail = email;
      
      console.log(`OTP for ${email}: ${generatedOTP}`);
      
      const templateParams = {
        to_email: email,
        otp_code: generatedOTP,
        app_name: "Vedanta",
        expiry_time: "5 minutes"
      };
      
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
      showToast(`✅ OTP sent to ${email}`);
      return true;
    } catch (error) {
      console.error("EmailJS Error:", error);
      showToast("❌ Failed to send OTP", true);
      return false;
    }
  }
  
  function startCountdown(seconds) {
    const countdownEl = document.getElementById('countdownTimer');
    if (!countdownEl) return;
    
    let remaining = seconds;
    countdownEl.style.display = 'block';
    countdownEl.innerHTML = `Resend available in ${remaining}s`;
    
    if (countdownInterval) clearInterval(countdownInterval);
    
    countdownInterval = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(countdownInterval);
        countdownEl.style.display = 'none';
        resendCooldown = false;
      } else {
        countdownEl.innerHTML = `Resend available in ${remaining}s`;
      }
    }, 1000);
  }
  
  function showLoginModal() {
    const container = document.getElementById('checkoutContainer');
    container.style.display = 'none';
    
    const loginHTML = `
      <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
          <h2>VEDANTA</h2>
          <p>Login to continue with your order</p>
          <div class="login-input-group">
            <input type="email" id="loginEmail" placeholder="Enter your email">
          </div>
          <button class="login-btn" id="sendOtpBtn">Send OTP</button>
          <div class="otp-section" id="otpSection">
            <div class="login-input-group">
              <input type="text" id="otpCode" class="otp-input" placeholder="Enter 6-digit OTP" maxlength="6">
            </div>
            <button class="login-btn" id="verifyOtpBtn">Verify & Login</button>
            <button class="resend-link" id="resendOtpBtn">Resend OTP</button>
            <div id="countdownTimer" class="countdown" style="display:none; font-size:12px; color:#888; margin-top:10px;"></div>
          </div>
          <div class="error-text" id="errorMsg"></div>
        </div>
      </div>
    `;
    
    document.body.insertAdjacentHTML('afterbegin', loginHTML);
    
    let currentEmail = '';
    
    document.getElementById('sendOtpBtn').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      if (!email || !email.includes('@')) {
        document.getElementById('errorMsg').innerText = '❌ Please enter valid email';
        document.getElementById('errorMsg').classList.add('show');
        return;
      }
      currentEmail = email;
      const success = await sendOTP(email);
      if (success) {
        document.getElementById('otpSection').classList.add('show');
        document.getElementById('errorMsg').classList.remove('show');
        startCountdown(30);
      }
    });
    
    document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
      const otp = document.getElementById('otpCode').value.trim();
      if (!otp || otp.length !== 6) {
        document.getElementById('errorMsg').innerText = '❌ Enter valid 6-digit OTP';
        document.getElementById('errorMsg').classList.add('show');
        return;
      }
      
      if (otp === generatedOTP) {
        const userData = {
          uid: `user_${Date.now()}`,
          email: currentEmail,
          name: currentEmail.split('@')[0],
          joinDate: new Date().toISOString()
        };
        localStorage.setItem('vedantaUser', JSON.stringify(userData));
        currentUser = userData;
        document.getElementById('loginOverlay').remove();
        container.style.display = 'block';
        renderCheckoutPage();
        showToast('✅ Login successful!');
      } else {
        document.getElementById('errorMsg').innerText = '❌ Invalid OTP. Please try again.';
        document.getElementById('errorMsg').classList.add('show');
      }
    });
    
    document.getElementById('resendOtpBtn').addEventListener('click', async () => {
      if (resendCooldown) {
        showToast('⏳ Please wait 30 seconds before resending', true);
        return;
      }
      resendCooldown = true;
      await sendOTP(currentEmail);
      startCountdown(30);
    });
  }
  
  // ========== CHECKOUT FUNCTIONS ==========
  function calculateTotals() {
    let subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    return { subtotal, grandTotal: subtotal };
  }
  
  function renderOrderItems() {
    const container = document.getElementById('orderItemsList');
    if (!container) return;
    
    container.innerHTML = '';
    cart.forEach(item => {
      const productImage = getProductImage(item.id);
      const productIcon = getProductIcon(item.id);
      const itemTotal = item.price * item.quantity;
      const itemSize = item.size || 'Not Selected';
      
      container.innerHTML += `
        <div class="order-item">
          <div class="order-item-img">
            ${productImage ? `<img src="${productImage}" alt="${escapeHtml(item.name)}">` : `<i class="fas ${productIcon}"></i>`}
          </div>
          <div class="order-item-info">
            <h4>${escapeHtml(item.name)}</h4>
            ${itemSize !== 'Not Selected' ? `<div class="order-item-size">Size: ${escapeHtml(itemSize)}</div>` : ''}
            <p>Qty: ${item.quantity} × ₹${item.price.toLocaleString()}</p>
          </div>
          <div class="order-item-price">₹${itemTotal.toLocaleString()}</div>
        </div>
      `;
    });
    
    const { subtotal, grandTotal } = calculateTotals();
    document.getElementById('subtotal').innerText = `₹${subtotal.toLocaleString()}`;
    document.getElementById('grandTotal').innerText = `₹${grandTotal.toLocaleString()}`;
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
  }
  
  function validateForm() {
    const fullName = document.getElementById('fullName')?.value.trim();
    const phone = document.getElementById('phone')?.value.trim();
    const address = document.getElementById('address')?.value.trim();
    const city = document.getElementById('city')?.value.trim();
    const state = document.getElementById('state')?.value.trim();
    const pincode = document.getElementById('pincode')?.value.trim();
    
    if (!fullName) { showToast('❌ Please enter your full name', true); return false; }
    if (!phone) { showToast('❌ Please enter phone number', true); return false; }
    if (!/^\d{10}$/.test(phone)) { showToast('❌ Enter valid 10-digit phone number', true); return false; }
    if (!address) { showToast('❌ Enter street address', true); return false; }
    if (!city) { showToast('❌ Enter city', true); return false; }
    if (!state) { showToast('❌ Enter state', true); return false; }
    if (!pincode) { showToast('❌ Enter pincode', true); return false; }
    if (!/^\d{6}$/.test(pincode)) { showToast('❌ Enter valid 6-digit pincode', true); return false; }
    
    return true;
  }
  
  async function saveOrderToFirebase() {
    const fullName = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email')?.value.trim() || currentUser.email;
    const address = document.getElementById('address').value;
    const city = document.getElementById('city').value;
    const state = document.getElementById('state').value;
    const pincode = document.getElementById('pincode').value;
    const { subtotal, grandTotal } = calculateTotals();
    
    const itemsWithSize = cart.map(item => ({
      id: item.id,
      name: item.name,
      price: item.price,
      quantity: item.quantity,
      size: item.size || 'Not Selected',
      total: item.price * item.quantity
    }));
    
    const orderId = 'ORD' + Date.now();
    const orderData = {
      orderId: orderId,
      customerName: fullName,
      customerPhone: phone,
      customerEmail: email,
      shippingAddress: { address, city, state, pincode },
      items: itemsWithSize,
      paymentMethod: 'Cash on Delivery',
      subtotal: subtotal,
      total: grandTotal,
      status: 'pending',
      orderDate: new Date().toISOString(),
      userId: currentUser.uid,
      userEmail: currentUser.email
    };
    
    try {
      await db.collection('orders').doc(orderId).set(orderData);
      localStorage.setItem('lastOrder', JSON.stringify(orderData));
      return { success: true, orderId: orderId };
    } catch (error) {
      console.error("Firebase Error:", error);
      return { success: false, error: error.message };
    }
  }
  
  async function placeOrder() {
    if (!isPaymentSelected) {
      showToast('❌ Please select payment method first', true);
      return;
    }
    if (!validateForm()) return;
    
    const btn = document.getElementById('placeOrderBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Placing Order...';
    
    const result = await saveOrderToFirebase();
    
    if (result.success) {
      localStorage.setItem('vedantaCart', JSON.stringify([]));
      showToast(`✅ Order placed! ID: ${result.orderId}`);
      setTimeout(() => {
        window.location.href = 'order-success.html';
      }, 1500);
    } else {
      showToast('❌ Failed to place order', true);
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check-circle"></i> PLACE ORDER (COD)';
    }
  }
  
  function renderCheckoutPage() {
    if (cart.length === 0) {
      window.location.href = 'index.html';
      return;
    }
    
    const container = document.getElementById('checkoutContainer');
    container.innerHTML = `
      <div class="checkout-header">
        <div class="logo"><h1>VEDANTA</h1><p style="font-size:12px; color:#888;">secure checkout</p></div>
        <div class="user-info"><i class="fas fa-user-circle"></i> ${currentUser.email} <button class="logout-link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button></div>
      </div>
      <div class="checkout-main">
        <div class="checkout-form">
          <div class="form-section">
            <h3><i class="fas fa-user-circle"></i> Contact Information</h3>
            <div class="form-group"><label>Full Name <span class="required">*</span></label><input type="text" id="fullName" placeholder="Enter your full name"></div>
            <div class="form-group"><label>Phone Number <span class="required">*</span></label><input type="tel" id="phone" placeholder="10-digit mobile number"></div>
            <div class="form-group"><label>Email Address</label><input type="email" id="email" value="${currentUser.email}" readonly style="background:rgba(0,0,0,0.3);"></div>
          </div>
          <div class="form-section">
            <h3><i class="fas fa-map-marker-alt"></i> Shipping Address</h3>
            <div class="form-group"><label>Street Address <span class="required">*</span></label><input type="text" id="address" placeholder="House number, street"></div>
            <div class="form-row"><div class="form-group"><label>City <span class="required">*</span></label><input type="text" id="city" placeholder="City"></div><div class="form-group"><label>State <span class="required">*</span></label><input type="text" id="state" placeholder="State"></div></div>
            <div class="form-row"><div class="form-group"><label>Pincode <span class="required">*</span></label><input type="text" id="pincode" placeholder="6-digit pincode"></div><div class="form-group"><label>Landmark</label><input type="text" id="landmark" placeholder="Near..."></div></div>
            <button class="location-btn" id="getLocationBtn"><i class="fas fa-location-dot"></i> Use My Location</button>
          </div>
          <div class="form-section">
            <h3><i class="fas fa-credit-card"></i> Payment Method</h3>
            <div class="cod-option" id="codOption"><i class="fas fa-money-bill-wave"></i><div class="option-text"><h4>Cash on Delivery</h4><p>Pay when you receive</p></div><div class="radio-circle"></div></div>
          </div>
        </div>
        <div class="order-summary">
          <h3><i class="fas fa-shopping-bag"></i> Order Summary</h3>
          <div id="orderItemsList"></div>
          <div class="free-shipping-badge"><i class="fas fa-truck"></i> FREE SHIPPING on all orders!</div>
          <div class="order-total"><div class="total-row"><span>Subtotal</span><span id="subtotal">₹0</span></div><div class="total-row grand-total"><span>Total Amount</span><span id="grandTotal">₹0</span></div></div>
          <button class="place-order-btn" id="placeOrderBtn"><i class="fas fa-check-circle"></i> PLACE ORDER (COD)</button>
          <a href="index.html" class="back-to-shop"><i class="fas fa-arrow-left"></i> Back to Shopping</a>
        </div>
      </div>
    `;
    
    renderOrderItems();
    
    // COD Option
    const codOption = document.getElementById('codOption');
    const placeOrderBtn = document.getElementById('placeOrderBtn');
    
    codOption?.addEventListener('click', () => {
      if (codOption.classList.contains('selected')) {
        codOption.classList.remove('selected');
        isPaymentSelected = false;
        placeOrderBtn.classList.add('disabled');
        placeOrderBtn.disabled = true;
      } else {
        codOption.classList.add('selected');
        isPaymentSelected = true;
        placeOrderBtn.classList.remove('disabled');
        placeOrderBtn.disabled = false;
      }
    });
    
    // Location
    document.getElementById('getLocationBtn')?.addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async (position) => {
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${position.coords.latitude}&lon=${position.coords.longitude}`);
            const data = await res.json();
            if (data.address) {
              if (data.address.city) document.getElementById('city').value = data.address.city;
              if (data.address.state) document.getElementById('state').value = data.address.state;
              if (data.address.postcode) document.getElementById('pincode').value = data.address.postcode;
              showToast('✅ Location filled!');
            }
          } catch(e) { showToast('⚠️ Could not get address', true); }
        }, () => showToast('⚠️ Location permission denied', true));
      } else { showToast('⚠️ Geolocation not supported', true); }
    });
    
    // Logout
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
      localStorage.removeItem('vedantaUser');
      window.location.reload();
    });
    
    placeOrderBtn?.addEventListener('click', placeOrder);
  }
  
  // Initialize
  async function init() {
    await loadProducts();
    if (currentUser && currentUser.email) {
      document.getElementById('checkoutContainer').style.display = 'block';
      renderCheckoutPage();
    } else {
      showLoginModal();
    }
  }
  
  init();
</script>
</body>
</html>
