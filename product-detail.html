<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Product Detail - Vedanta</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #050508;
      color: #FFFFFF;
      overflow-x: hidden;
      padding-bottom: 20px;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.08), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }
    .container { width: 100%; max-width: 100%; margin: 0; padding: 0; }

    .floating-cart {
      position: fixed;
      bottom: 30px;
      right: 16px;
      z-index: 1001;
      cursor: pointer;
    }
    .cart-icon-container {
      background: linear-gradient(135deg, #D4AF37, #FF8C00);
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
      transition: transform 0.3s;
    }
    .cart-icon-container:hover { transform: scale(1.05); }
    .cart-icon-container i { font-size: 26px; color: #050508; }
    .cart-count {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #FF4500;
      color: white;
      font-size: 11px;
      font-weight: bold;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-sidebar {
      position: fixed;
      top: 0;
      right: -100%;
      width: 85%;
      max-width: 380px;
      height: 100%;
      background: rgba(10,10,18,0.98);
      backdrop-filter: blur(20px);
      z-index: 2000;
      transition: 0.3s ease;
      border-left: 1px solid rgba(212,175,55,0.3);
      display: flex;
      flex-direction: column;
    }
    .cart-sidebar.open { right: 0; }
    .cart-header {
      padding: 20px;
      border-bottom: 1px solid rgba(212,175,55,0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-header h3 { font-size: 20px; color: #D4AF37; }
    .close-cart {
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .cart-item-info h4 { font-size: 14px; margin-bottom: 4px; }
    .cart-item-info p { color: #D4AF37; font-weight: bold; font-size: 14px; }
    .combo-tag {
      background: #4CAF50;
      color: white;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 4px;
    }
    .cart-item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cart-qty-btn {
      background: rgba(212,175,55,0.2);
      border: 1px solid rgba(212,175,55,0.3);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      color: #D4AF37;
      font-size: 16px;
    }
    .cart-qty {
      font-size: 14px;
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }
    .cart-item-remove {
      background: rgba(255,69,0,0.2);
      border: none;
      color: #FF4500;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
    }
    .cart-footer {
      padding: 20px;
      border-top: 1px solid rgba(212,175,55,0.3);
      background: rgba(10,10,18,0.95);
    }
    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .checkout-btn {
      width: 100%;
      background: linear-gradient(135deg, #D4AF37, #FF8C00);
      border: none;
      padding: 14px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .empty-cart { text-align: center; padding: 40px; color: #888; }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1999;
      display: none;
    }
    .overlay.show { display: block; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(212,175,55,0.3);
      background: rgba(5,5,8,0.98);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo h1 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FF8C00); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .back-btn { background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.3); padding: 6px 14px; border-radius: 40px; color: #D4AF37; text-decoration: none; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    .product-gallery {
      background: rgba(15,15,22,0.6);
      padding: 16px;
      position: relative;
    }
    .main-image-container {
      position: relative;
      background: #0E0E14;
      border-radius: 24px;
      width: 100%;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .main-image-slider {
      width: 100%;
      display: flex;
      transition: transform 0.3s ease;
    }
    .slide {
      min-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .slide img {
      width: 100%;
      height: auto;
      max-height: 400px;
      object-fit: contain;
      background: #0E0E14;
      display: block;
    }
    .slide i { font-size: 80px; color: #D4AF37; }
    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: white;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
    }
    .slider-prev { left: 8px; }
    .slider-next { right: 8px; }
    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #FF4500;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      z-index: 5;
    }
    .thumbnail-list {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
      overflow-x: auto;
      padding: 6px 4px;
    }
    .thumbnail {
      width: 55px;
      height: 55px;
      background: #1A1A1A;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid transparent;
      overflow: hidden;
      flex-shrink: 0;
    }
    .thumbnail.active { border-color: #D4AF37; }
    .thumbnail img { width: 100%; height: 100%; object-fit: contain; background: #0E0E14; }
    .thumbnail i { font-size: 24px; color: #D4AF37; }

    @media (min-width: 768px) {
      .slide img { max-height: 500px; }
      .main-image-container { min-height: 450px; }
    }

    .product-info {
      background: rgba(15,15,22,0.6);
      padding: 20px 16px;
      margin: 12px;
      border-radius: 28px;
      border: 1px solid rgba(212,175,55,0.2);
    }
    .product-brand { color: #D4AF37; font-size: 11px; letter-spacing: 2px; margin-bottom: 6px; }
    .product-name { font-size: 22px; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
    @media (min-width: 768px) { .product-name { font-size: 28px; } }
    
    .rating {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .stars { color: #FFB800; font-size: 13px; letter-spacing: 2px; }
    .review-count { color: #888; font-size: 12px; }
    .rating-badge { background: rgba(76,175,80,0.15); padding: 2px 8px; border-radius: 20px; font-size: 10px; color: #4CAF50; }
    
    .price-section {
      margin-bottom: 16px;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }
    .current-price { font-size: 32px; font-weight: 800; color: #D4AF37; }
    .original-price { font-size: 16px; color: #888; text-decoration: line-through; }
    .discount { background: #FF4500; padding: 3px 8px; border-radius: 25px; font-size: 11px; font-weight: 600; }
    .tax-info { font-size: 11px; color: #888; width: 100%; margin-top: 4px; }
    
    .trust-badges {
      background: linear-gradient(135deg, rgba(212,175,55,0.08), rgba(76,175,80,0.05));
      border-radius: 20px;
      padding: 16px;
      margin: 16px 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 768px) { .trust-badges { grid-template-columns: repeat(4, 1fr); } }
    .trust-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 16px;
      transition: 0.2s;
    }
    .trust-item:hover { background: rgba(212,175,55,0.1); transform: translateY(-2px); }
    .trust-item i { font-size: 20px; color: #4CAF50; min-width: 32px; }
    .trust-item div h4 { font-size: 11px; font-weight: 700; color: #D4AF37; margin-bottom: 2px; }
    .trust-item div p { font-size: 9px; color: #888; }
    
    .delivery-info {
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 12px 16px;
      margin: 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .delivery-date {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .delivery-date i { font-size: 20px; color: #D4AF37; }
    .delivery-date .date-text { font-size: 14px; font-weight: 600; color: #4CAF50; }
    .delivery-date .pincode-text { font-size: 11px; color: #888; }
    .stock-status { font-size: 12px; color: #4CAF50; display: flex; align-items: center; gap: 5px; }
    
    /* Product Specifications - Points Style with View More */
    .specifications-section {
      background: rgba(0,0,0,0.2);
      border-radius: 20px;
      padding: 16px;
      margin: 16px 0;
    }
    .spec-title {
      font-size: 16px;
      font-weight: 700;
      color: #D4AF37;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 3px solid #D4AF37;
      padding-left: 12px;
    }
    .specs-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .spec-point {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 6px 0;
    }
    .spec-point i {
      color: #D4AF37;
      font-size: 14px;
      margin-top: 2px;
      min-width: 20px;
    }
    .spec-point strong {
      color: #D4AF37;
      font-weight: 600;
      min-width: 120px;
    }
    .spec-point span {
      color: #cccccc;
      font-size: 13px;
    }
    .spec-point.hidden {
      display: none;
    }
    .specs-view-more-btn {
      background: none;
      border: none;
      color: #D4AF37;
      font-size: 12px;
      font-weight: 600;
      margin-top: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .size-section, .color-section, .combo-section {
      margin: 16px 0;
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 12px;
    }
    .size-title, .color-title, .combo-title {
      font-size: 13px;
      font-weight: 600;
      color: #D4AF37;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .size-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .size-btn {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.3);
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #FFFFFF;
      transition: 0.2s;
    }
    .size-btn.active, .size-btn:hover { background: #D4AF37; color: #050508; border-color: #D4AF37; }
    
    .color-options {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .color-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 5px;
      border-radius: 12px;
      transition: all 0.2s ease;
      min-width: 60px;
    }
    .color-btn.active { background: rgba(212,175,55,0.25); transform: scale(1.05); }
    .color-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .color-btn.active .color-circle { border-color: #D4AF37; box-shadow: 0 0 15px rgba(212,175,55,0.6); transform: scale(1.05); }
    .color-name { font-size: 11px; color: #aaa; font-weight: 500; }
    .color-btn.active .color-name { color: #D4AF37; font-weight: 700; }

    .combo-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .combo-item {
      background: rgba(0,0,0,0.4);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 2px solid rgba(212,175,55,0.2);
      transition: all 0.3s ease;
      position: relative;
    }
    .combo-item.selected {
      border-color: #D4AF37;
      background: linear-gradient(135deg, rgba(212,175,55,0.25), rgba(76,175,80,0.15));
    }
    .combo-quantity { font-size: 16px; font-weight: 800; color: #4CAF50; display: flex; align-items: center; gap: 8px; }
    .combo-save { font-size: 11px; color: #FFB800; background: rgba(255,184,0,0.15); padding: 2px 8px; border-radius: 20px; display: inline-block; margin-top: 4px; }
    .combo-price .price-big { font-size: 18px; font-weight: 800; color: #D4AF37; }
    .combo-price .per-piece { font-size: 10px; color: #4CAF50; }
    .combo-select-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(212,175,55,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 12px;
    }
    .combo-item.selected .combo-select-icon { background: #4CAF50; }
    .combo-select-icon i { font-size: 14px; color: white; }
    .combo-badge { position: absolute; top: -8px; right: 12px; background: #FF4500; color: white; font-size: 9px; padding: 2px 8px; border-radius: 20px; }

    .product-detail-section {
      margin: 20px 0;
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 16px;
    }
    .detail-title {
      font-size: 16px;
      font-weight: 700;
      color: #D4AF37;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 3px solid #D4AF37;
      padding-left: 12px;
    }
    .full-description { color: #CCCCCC; line-height: 1.7; font-size: 14px; text-align: justify; }
    
    /* Description with line clamp - 5 lines */
    .desc-short {
      display: -webkit-box;
      -webkit-line-clamp: 5;
      line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .desc-full {
      display: none;
    }
    .desc-full.show {
      display: block;
    }
    .view-more-btn {
      background: none;
      border: none;
      color: #D4AF37;
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .features-list {
      margin-top: 16px;
      background: rgba(212,175,55,0.05);
      border-radius: 16px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 768px) { .features-list { grid-template-columns: repeat(2, 1fr); } }
    .feature-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .feature-item i { width: 24px; color: #D4AF37; font-size: 14px; }
    .feature-item span { font-size: 12px; color: #AAAAAA; }

    .care-section {
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 16px;
      margin: 16px 0;
    }
    .care-title {
      font-size: 14px;
      font-weight: 700;
      color: #D4AF37;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .care-items {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .care-item {
      background: rgba(212,175,55,0.1);
      border: 1px solid rgba(212,175,55,0.2);
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 11px;
      color: #ccc;
    }

    .size-guide-btn {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.3);
      padding: 8px 20px;
      border-radius: 40px;
      color: #D4AF37;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .size-guide-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 20001;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .size-guide-modal.show { display: flex; }
    .size-guide-modal-content {
      background: rgba(15,15,22,0.98);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 24px;
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid rgba(212,175,55,0.3);
    }
    .size-guide-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .size-guide-modal-header h3 { color: #D4AF37; }
    .close-size-modal {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }
    .size-table {
      width: 100%;
      border-collapse: collapse;
    }
    .size-table th, .size-table td {
      border: 1px solid rgba(212,175,55,0.2);
      padding: 10px;
      text-align: center;
      color: #ccc;
      font-size: 13px;
    }
    .size-table th {
      background: rgba(212,175,55,0.1);
      color: #D4AF37;
    }

    .quantity-selector {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 20px 0;
    }
    .qty-btn {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.3);
      width: 44px;
      height: 44px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      color: #D4AF37;
    }
    .qty-input {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(212,175,55,0.3);
      width: 60px;
      height: 44px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: white;
      border-radius: 14px;
    }

    .action-buttons {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 12px;
      margin-top: 20px;
      padding: 12px;
      background: rgba(5,5,8,0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(212,175,55,0.3);
      z-index: 99;
    }
    .add-cart-btn, .buy-btn {
      flex: 1;
      padding: 15px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 14px;

<script>
  // ========== FIREBASE CONFIGURATION ==========
  const firebaseConfig = {
    apiKey: "AIzaSyCBZuwN4SKkXX1fEriYEwWDyTm-3uZnrKI",

    measurementId: "G-W6N519LBPH"
  };
  
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch(err => console.log("Persistence:", err));
  
  let allProducts = [];

  let unsubscribeProduct = null;

  let productReviews = [

    { id: 2, userName: "Amit Kumar", userAvatar: "A", rating: 5, date: "10 Mar 2025", reviewText: "Worth every penny! Premium finish and very comfortable. The material quality is top-notch. Fast delivery and great customer service.", helpful: 89 },
    { id: 3, userName: "Neha Singh", userAvatar: "N", rating: 4, date: "05 Mar 2025", reviewText: "Very good product. Design is beautiful and exactly as shown in pictures. Slightly expensive but quality justifies the price.", helpful: 56 },
    { id: 4, userName: "Rajesh Gupta", userAvatar: "R", rating: 5, date: "28 Feb 2025", reviewText: "Excellent product! Very satisfied with my purchase. Will definitely buy again from Vedanta. The spiritual energy of this product is amazing.", helpful: 78 },
    { id: 5, userName: "Sneha Patel", userAvatar: "S", rating: 5, date: "20 Feb 2025", reviewText: "Beautiful craftsmanship! The details are perfect. Shipping was on time and packaging was impressive. 5 stars!", helpful: 45 }
  ];
  
  const INITIAL_REVIEWS_COUNT = 4;
  const INITIAL_SPECS_COUNT = 4; // Only show 4 specifications initially
  
  // Login Modal Variables
  let modalRecaptchaVerifier = null;
  let modalConfirmationResult = null;
  let pendingBuyProduct = null;
  let modalCountdownTimer = null;
  
  // ========== CHECK IF USER HAS SAVED ADDRESS ==========
  async function checkUserHasSavedAddress() {
    const currentUser = JSON.parse(localStorage.getItem('vedantaUser'));
    if (!currentUser || !currentUser.uid) return false;
    try {
      const addrSnapshot = await db.collection('addresses').where('userId', '==', currentUser.uid).limit(1).get();
      if (!addrSnapshot.empty) return true;
      const orderSnapshot = await db.collection('orders').where('customerPhone', '==', currentUser.phone).limit(1).get();
      return !orderSnapshot.empty;
    } catch(e) { return false; }
  }
  
  // ========== SMART BUY NOW ==========
  async function buyNowWithSmartRedirect(product, qty, size, color, combo) {
    const currentUser = JSON.parse(localStorage.getItem('vedantaUser'));
    let finalPrice = product.price, finalQty = qty, comboInfo = null, comboMultiplier = 1;
    if (combo) {
      finalPrice = combo.price / combo.quantity;
      comboInfo = `${combo.quantity} for ₹${combo.price}`;
      finalQty = combo.quantity;
      comboMultiplier = combo.quantity;
    }
    const tempCart = [{ id: product.id, name: product.name, price: finalPrice, quantity: finalQty, size: size || 'Default', color: color || '', combo: comboInfo, isCombo: !!combo, comboMultiplier: comboMultiplier }];
    localStorage.setItem('vedantaCart', JSON.stringify(tempCart));
    if (currentUser && currentUser.uid) {
      const hasSavedAddress = await checkUserHasSavedAddress();
      if (hasSavedAddress) {
        showToast(`💳 Redirecting to checkout`);
        setTimeout(() => { window.location.href = 'secure-checkout2.html'; }, 300);
      } else {
        showToast(`💳 Proceeding to checkout`);
        setTimeout(() => { window.location.href = 'secure-checkout.html'; }, 300);
      }
    } else {
      pendingBuyProduct = product;
      openLoginModal();
    }
  }
  
  // ========== LOGIN MODAL FUNCTIONS ==========
  function setupModalRecaptcha() {
    return new Promise((resolve, reject) => {
      if (modalRecaptchaVerifier) modalRecaptchaVerifier.clear();
      try {
        modalRecaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container-modal', { size: 'invisible', callback: () => resolve(true) });
        resolve(true);
      } catch(e) { reject(e); }
    });
  }
  
  async function modalSendOTP() {
    const phoneInput = document.getElementById('modalPhoneInput');
    const phone = phoneInput.value.trim();
    const sendBtn = document.getElementById('modalSendOtpBtn');
    if (!phone || phone.length < 10) { showToast('❌ Please enter valid phone number', true); return; }
    const formattedPhone = formatPhoneNumber(phone);
    sendBtn.disabled = true;
    sendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
    try {
      await setupModalRecaptcha();
      modalConfirmationResult = await auth.signInWithPhoneNumber(formattedPhone, modalRecaptchaVerifier);
      showToast('✅ OTP sent successfully!');
      document.getElementById('modalPhoneSection').style.display = 'none';
      document.getElementById('modalOtpSection').classList.add('show');
      startModalTimer();
    } catch(error) {
      let errorMsg = 'Failed to send OTP';
      if (error.code === 'auth/invalid-phone-number') errorMsg = 'Invalid phone number';
      else if (error.code === 'auth/too-many-requests') errorMsg = 'Too many requests. Try later';
      showToast(errorMsg, true);
    } finally {
      sendBtn.disabled = false;
      sendBtn.innerHTML = 'Send OTP';
    }
  }
  
  function startModalTimer() {
    let timeLeft = 60;
    const timerSpan = document.getElementById('modalTimer');
    const resendBtn = document.getElementById('modalResendBtn');
    if (modalCountdownTimer) clearInterval(modalCountdownTimer);
    modalCountdownTimer = setInterval(() => {
      if (timeLeft <= 0) {
        clearInterval(modalCountdownTimer);
        if (timerSpan) timerSpan.textContent = '';
        if (resendBtn) { resendBtn.style.display = 'inline-block'; resendBtn.disabled = false; }
      } else {
        if (timerSpan) timerSpan.textContent = `Resend available in ${timeLeft}s`;
        if (resendBtn) resendBtn.style.display = 'none';
        timeLeft--;
      }
    }, 1000);
  }
  
  async function modalVerifyOTP() {
    const otpInput = document.getElementById('modalOtpInput');
    const otp = otpInput.value.trim();
    const verifyBtn = document.getElementById('modalVerifyBtn');
    if (!otp || otp.length < 6) { showToast('❌ Please enter 6-digit OTP', true); return; }
    verifyBtn.disabled = true;
    verifyBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Verifying...';
    try {
      const result = await modalConfirmationResult.confirm(otp);
      const user = result.user;
      const userData = { uid: user.uid, phone: user.phoneNumber, name: `User${user.phoneNumber.slice(-4)}`, email: `${user.uid}@vedanta.com`, joinDate: new Date().toISOString() };
      localStorage.setItem('vedantaUser', JSON.stringify(userData));
      await db.collection('users').doc(user.uid).set(userData, { merge: true });
      showToast(`✅ Welcome! Redirecting...`);
      closeLoginModal();
      const hasSavedAddress = await checkUserHasSavedAddress();
      if (hasSavedAddress) { setTimeout(() => { window.location.href = 'secure-checkout2.html'; }, 500); }
      else { setTimeout(() => { window.location.href = 'secure-checkout.html'; }, 500); }
    } catch(error) {
      let errorMsg = 'Invalid OTP. Please try again.';
      if (error.code === 'auth/code-expired') errorMsg = 'OTP expired. Request new OTP.';
      else if (error.code === 'auth/invalid-verification-code') errorMsg = 'Invalid OTP code';
      showToast(errorMsg, true);
    } finally {
      verifyBtn.disabled = false;
      verifyBtn.innerHTML = 'Verify & Continue';
    }
  }
  
  async function modalResendOTP() {
    const phoneInput = document.getElementById('modalPhoneInput');
    const phone = phoneInput.value.trim();
    const formattedPhone = formatPhoneNumber(phone);
    const resendBtn = document.getElementById('modalResendBtn');
    resendBtn.disabled = true;
    resendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
    try {
      modalConfirmationResult = await auth.signInWithPhoneNumber(formattedPhone, modalRecaptchaVerifier);
      showToast('✅ OTP resent!');
      startModalTimer();
    } catch(error) { showToast('Failed to resend OTP', true); }
    resendBtn.disabled = false;
    resendBtn.innerHTML = 'Resend OTP';
  }
  
  function modalBackToPhone() {
    document.getElementById('modalPhoneSection').style.display = 'block';
    document.getElementById('modalOtpSection').classList.remove('show');
    document.getElementById('modalOtpInput').value = '';

  function formatPhoneNumber(number) {

  // ========== CART FUNCTIONS ==========
  function saveCart() { localStorage.setItem('vedantaCart', JSON.stringify(cart)); updateCartUI(); }
  
  function addToCart(product, qty, size, color, combo = null) {
    let finalPrice = product.price, comboInfo = null, comboQtyMultiplier = 1;
    if (combo) {
      finalPrice = combo.price / combo.quantity;
      comboInfo = `${combo.quantity} for ₹${combo.price}`;
      comboQtyMultiplier = combo.quantity;
      qty = combo.quantity;
    }
    const existingIndex = cart.findIndex(item => item.id === product.id && item.size === size && item.color === color && item.combo === comboInfo);
    if (existingIndex !== -1) {
      if (combo) cart[existingIndex].quantity += combo.quantity;
      else cart[existingIndex].quantity += qty;
    } else {
      cart.push({ id: product.id, name: product.name, price: finalPrice, quantity: qty, size: size || 'Default', color: color || '', combo: comboInfo, isCombo: !!combo, comboMultiplier: comboQtyMultiplier });
    }
    saveCart();
    showToast(combo ? `🎉 Combo Pack: ${combo.quantity} items for ₹${combo.price} added!` : `🛍️ ${product.name} added!`);
    if (combo) selectedCombo = null;
  }
  
  function updateCartQuantity(index, newQuantity) {
    const item = cart[index];
    if (item.isCombo && item.comboMultiplier) {
      const newMultiples = newQuantity / item.comboMultiplier;
      if (newMultiples < 1) cart.splice(index, 1);
      else item.quantity = newMultiples * item.comboMultiplier;
    } else {
      if (newQuantity < 1) cart.splice(index, 1);
      else cart[index].quantity = newQuantity;
    }
    saveCart();
  }
  
  function removeFromCart(index) { cart.splice(index, 1); saveCart(); }
  
  function updateCartUI() {
    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    const cartCountEl = document.getElementById('cartCount');
    if (cartCountEl) cartCountEl.innerText = totalItems;
    const cartItemsDiv = document.getElementById('cartItems');
    const cartTotalSpan = document.getElementById('cartTotal');
    if (cart.length === 0) {
      if (cartItemsDiv) cartItemsDiv.innerHTML = '<div class="empty-cart">🛒 Your cart is empty</div>';
      if (cartTotalSpan) cartTotalSpan.innerText = '₹0';
      return;
    }
    let total = 0;
    cartItemsDiv.innerHTML = '';
    cart.forEach((item, idx) => {
      const itemTotal = item.price * item.quantity;
      total += itemTotal;
      cartItemsDiv.innerHTML += `<div class="cart-item">
        <div class="cart-item-info">
          <h4>${escapeHtml(item.name)} ${item.size ? `(${item.size})` : ''} ${item.color ? `- ${item.color}` : ''}</h4>
          ${item.combo ? `<span class="combo-tag"><i class="fas fa-gift"></i> ${escapeHtml(item.combo)}</span>` : ''}
          <p>₹${item.price} x ${item.quantity} = ₹${itemTotal}</p>
        </div>
        <div class="cart-item-actions">
          <button class="cart-qty-btn" data-action="decr" data-index="${idx}">-</button>
          <span class="cart-qty">${item.quantity}</span>
          <button class="cart-qty-btn" data-action="incr" data-index="${idx}">+</button>
          <button class="cart-item-remove" data-index="${idx}"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
    });
    cartItemsDiv.querySelectorAll('.cart-qty-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.index);
        const action = btn.dataset.action;
        const item = cart[idx];
        if (action === 'incr') {
          if (item.isCombo && item.comboMultiplier) updateCartQuantity(idx, item.quantity + item.comboMultiplier);
          else updateCartQuantity(idx, item.quantity + 1);
        } else if (action === 'decr') {
          if (item.isCombo && item.comboMultiplier) updateCartQuantity(idx, item.quantity - item.comboMultiplier);
          else updateCartQuantity(idx, item.quantity - 1);
        }
      });
    });
    cartItemsDiv.querySelectorAll('.cart-item-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeFromCart(parseInt(btn.dataset.index));
      });
    });
    if (cartTotalSpan) cartTotalSpan.innerText = `₹${total}`;
  }

  // ========== REAL-TIME PRODUCT LISTENER ==========
  function startRealTimeProductSync() {
    if (unsubscribeProduct) unsubscribeProduct();
    if (!currentProductId) return;
    const productRef = db.collection('products').doc(currentProductId);
    unsubscribeProduct = productRef.onSnapshot({ includeMetadataChanges: true }, (docSnapshot) => {
      if (docSnapshot.exists) {
        const newData = docSnapshot.data();
        currentProduct = ensureProductFields({
          id: docSnapshot.id,
          name: newData.name,
          price: newData.price,
          originalPrice: newData.comparePrice || Math.round(newData.price * 1.6),
          category: newData.category,
          badge: newData.badge || 'New',
          images: newData.images || [],
          sizes: newData.sizes || [],
          colors: newData.colors || [],
          combos: newData.combos || [],
          fullDesc: newData.fullDesc || "Premium quality product from Vedanta.",
          benefits: newData.benefits || [],
          specifications: newData.specifications || [],
          sizeGuide: newData.sizeGuide || [],
          careInstructions: newData.careInstructions || [],
          status: newData.status
        });
        if (currentProduct.status !== 'active') {
          showToast("⚠️ This product is no longer available");
          setTimeout(() => window.location.href = 'index.html', 2000);
          return;
        }
        renderPageContent();
      } else {
        showToast("❌ Product not found");
        setTimeout(() => window.location.href = 'index.html', 2000);
      }
    }, (error) => { console.error("Real-time listener error:", error); });
  }

  function initSliderAfterRender() {
    const images = currentProduct.images || [];
    const totalSlides = images.length || 1;
    if (images.length <= 1) return;
    const slider = document.getElementById('imageSlider');
    const prevBtn = document.getElementById('prevSlide');
    const nextBtn = document.getElementById('nextSlide');
    const thumbnails = document.querySelectorAll('.thumbnail');
    if (!slider) return;
    function updateSlider(index) {
      if (index < 0) index = totalSlides - 1;
      if (index >= totalSlides) index = 0;
      currentSlide = index;
      if (slider) slider.style.transform = `translateX(-${currentSlide * 100}%)`;
      thumbnails.forEach((t, i) => i === currentSlide ? t.classList.add('active') : t.classList.remove('active'));
    }
    prevBtn?.addEventListener('click', () => updateSlider(currentSlide - 1));
    nextBtn?.addEventListener('click', () => updateSlider(currentSlide + 1));
    thumbnails.forEach((t, i) => t.addEventListener('click', () => updateSlider(i)));
    if (slideInterval) clearInterval(slideInterval);
    slideInterval = setInterval(() => updateSlider(currentSlide + 1), 5000);
  }

    if (!container) return;
    const related = (allProducts || []).filter(p => p.category === currentProduct?.category && p.id != currentProduct?.id && p.status === 'active').slice(0, 4);
    if (related.length === 0) { container.innerHTML = '<p style="color:#888; text-align:center;">No related products</p>'; return; }
    container.innerHTML = related.map(p => {
      const hasImage = p.images && p.images.length > 0;
      return `<div class="related-card" data-product-id="${p.id}">
        <div class="related-img">${hasImage ? `<img src="${p.images[0]}" loading="lazy">` : `<i class="fas fa-gem"></i>`}</div>
        <div class="related-name">${escapeHtml(p.name)}</div>
        <div class="related-price">₹${p.price.toLocaleString()}</div>
      </div>`;
    }).join('');
    document.querySelectorAll('.related-card').forEach(card => {
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        const productId = card.getAttribute('data-product-id');
        localStorage.setItem('vedanta_selected_product_id', productId);
        window.location.href = window.location.pathname + '?id=' + productId;
      });
    });
  }
  
  function renderFooterBenefits() {
    return `
      <div class="footer-benefits">
        <div class="footer-benefit-item"><i class="fas fa-truck-fast"></i><h4>Free Shipping</h4><p>On all orders</p></div>
        <div class="footer-benefit-item"><i class="fas fa-money-bill-wave"></i><h4>Cash on Delivery</h4><p>Pay at doorstep</p></div>
        <div class="footer-benefit-item"><i class="fas fa-undo-alt"></i><h4>15-Day Returns</h4><p>Easy return policy</p></div>
        <div class="footer-benefit-item"><i class="fas fa-lock"></i><h4>Secure Payment</h4><p>100% secure</p></div>
      </div>
    `;
  }
  
  function renderSocialLinks() {
    return `
      <div class="social-section">
        <h3><i class="fas fa-share-alt"></i> Connect With Us</h3>
        <div class="social-links">
          <a href="https://instagram.com/Vedanta_777" target="_blank" class="social-link">
            <div class="social-icon"><i class="fab fa-instagram"></i></div>
            <span>@Vedanta_777</span>
          </a>
          <a href="https://facebook.com/Vedanta_777" target="_blank" class="social-link">
            <div class="social-icon"><i class="fab fa-facebook-f"></i></div>
            <span>Vedanta_777</span>
          </a>
          <a href="https://youtube.com/@Vedanta_777" target="_blank" class="social-link">
            <div class="social-icon"><i class="fab fa-youtube"></i></div>
            <span>@Vedanta_777</span>
          </a>
          <a href="https://twitter.com/Vedanta_777" target="_blank" class="social-link">
            <div class="social-icon"><i class="fab fa-twitter"></i></div>
            <span>@Vedanta_777</span>
          </a>
        </div>
      </div>
    `;
  }
  
  function renderPageContent() {
    if (!currentProduct) return;
    
    const discountPercent = currentProduct.originalPrice > currentProduct.price ? Math.round(((currentProduct.originalPrice - currentProduct.price) / currentProduct.originalPrice) * 100) : 0;
    const galleryHtml = renderImageSlider();
    const sizesHtml = renderDynamicSizes(currentProduct.sizes);
    const colorsHtml = renderDynamicColors(currentProduct.colors);
    const combosHtml = renderDynamicCombos(currentProduct.combos);
    const specificationsHtml = renderDynamicSpecifications(currentProduct.specifications);
    const benefitsHtml = renderDynamicBenefits(currentProduct.benefits);
    const careHtml = renderDynamicCareInstructions(currentProduct.careInstructions);
    
    const deliveryDate = new Date();
    deliveryDate.setDate(deliveryDate.getDate() + 5);
    const deliveryDateStr = deliveryDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    
    // Description with 5-6 lines initially (approx 350 characters)
    const fullDescHtml = currentProduct.fullDesc || "<p>Premium quality product from Vedanta. Crafted with precision and care.</p>";
    const plainTextDesc = fullDescHtml.replace(/<[^>]*>/g, '');
    const shortDescText = plainTextDesc.length > 350 ? plainTextDesc.substring(0, 350) + '...' : plainTextDesc;
    const hasLongDesc = plainTextDesc.length > 350;
    
    const html = `<div class="header">
      <div class="logo"><h1>VEDANTA</h1></div>
      <div class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back</div>
    </div>
    ${galleryHtml}
    <div class="product-info">
      <div class="product-brand">VEDANTA EXCLUSIVE</div>
      <div class="product-name">${escapeHtml(currentProduct.name)}</div>
      <div class="rating">
        <div class="stars">★★★★★</div>
        <div class="review-count">${productReviews.length} reviews</div>
        <div class="rating-badge">⭐ 4.9 Rating</div>
      </div>
      <div class="price-section">
        <span class="current-price">₹${currentProduct.price.toLocaleString()}</span>
        ${currentProduct.originalPrice ? `<span class="original-price">₹${currentProduct.originalPrice.toLocaleString()}</span>` : ''}
        ${discountPercent > 0 ? `<span class="discount">${discountPercent}% OFF</span>` : ''}
        <div class="tax-info">Inclusive of all taxes</div>
      </div>
      
      <div class="trust-badges">
        <div class="trust-item"><i class="fas fa-truck-fast"></i><div><h4>Free Shipping</h4><p>On all orders</p></div></div>
        <div class="trust-item"><i class="fas fa-money-bill-wave"></i><div><h4>Cash on Delivery</h4><p>Pay at doorstep</p></div></div>
        <div class="trust-item"><i class="fas fa-undo-alt"></i><div><h4>15-Day Returns</h4><p>Easy return policy</p></div></div>
        <div class="trust-item"><i class="fas fa-lock"></i><div><h4>Secure Payment</h4><p>100% secure</p></div></div>
      </div>
      
      <div class="delivery-info">
        <div class="delivery-date">
          <i class="fas fa-calendar-check"></i>
          <div>
            <div class="date-text">Get it by ${deliveryDateStr}</div>
            <div class="pincode-text">Free Shipping • Free Returns</div>
          </div>
        </div>
        <div class="stock-status"><i class="fas fa-check-circle"></i> In Stock</div>
      </div>
      
      ${sizesHtml}
      ${colorsHtml}
      ${combosHtml}
      
      ${specificationsHtml}
      
      ${currentProduct.sizeGuide && currentProduct.sizeGuide.length > 0 ? `<div style="text-align: right; margin-top: -10px; margin-bottom: 10px;"><button class="size-guide-btn" id="showSizeGuideBtn"><i class="fas fa-chart-simple"></i> Show Size Guide</button></div>` : ''}
      
      <div class="product-detail-section">
        <div class="detail-title"><i class="fas fa-align-left"></i> Product Description</div>
        <div id="descriptionWrapper">
          <div id="descShort" class="full-description desc-short">${escapeHtml(shortDescText)}</div>
          <div id="descFull" class="full-description desc-full">${fullDescHtml}</div>
          ${hasLongDesc ? `<button id="toggleDescBtn" class="view-more-btn">View More <i class="fas fa-chevron-down"></i></button>` : ''}
        </div>
      </div>
      
      <div class="product-detail-section">
        <div class="detail-title"><i class="fas fa-star"></i> Key Features</div>
        ${benefitsHtml}
      </div>
      
      ${careHtml}
      
      <div class="offer-tag" style="background: rgba(212,175,55,0.1); padding: 12px; border-radius: 16px; margin: 16px 0; text-align: center; font-size: 12px;"><i class="fas fa-tags"></i> Free Shipping • COD Available • Easy Returns • 24/7 Customer Support</div>
      
      <div class="quantity-selector">
        <button class="qty-btn" id="qtyMinus">-</button>
        <input type="text" class="qty-input" id="qtyInput" value="1" readonly>
        <button class="qty-btn" id="qtyPlus">+</button>
      </div>
      
      <div class="action-buttons">
        <button class="add-cart-btn" id="addToCartBtn"><i class="fa-regular fa-bag-shopping"></i> ADD TO CART</button>
        <button class="buy-btn" id="buyNowBtn"><i class="fas fa-bolt"></i> BUY NOW</button>
      </div>
    </div>
    
    <div class="section-title"><span></span> Customer Reviews (${productReviews.length})</div>
    <div class="reviews-section" id="reviewsContainer"></div>
    
    <div class="section-title"><span></span> You May Also Like</div>
    <div class="related-products" id="relatedProducts"></div>
    
    ${renderFooterBenefits()}
    ${renderSocialLinks()}`;
    
    document.getElementById('app').innerHTML = html;
    
    setTimeout(() => {
      initSliderAfterRender();
      attachEventsAfterRender();
      renderRelatedProducts();
      renderReviews(false);
      
      // Description toggle - FIXED
      const toggleDescBtn = document.getElementById('toggleDescBtn');
      const descShortEl = document.getElementById('descShort');
      const descFullEl = document.getElementById('descFull');
      let expandedDesc = false;
      if (toggleDescBtn) {
        toggleDescBtn.addEventListener('click', () => {
          expandedDesc = !expandedDesc;
          if (expandedDesc) {
            descShortEl.style.display = 'none';
            descFullEl.classList.add('show');
            descFullEl.style.display = 'block';
            toggleDescBtn.innerHTML = 'View Less <i class="fas fa-chevron-up"></i>';
          } else {
            descShortEl.style.display = '-webkit-box';
            descFullEl.classList.remove('show');
            descFullEl.style.display = 'none';
            toggleDescBtn.innerHTML = 'View More <i class="fas fa-chevron-down"></i>';
          }
        });
      }
      
      // Size Guide Modal
      const showSizeGuideBtn = document.getElementById('showSizeGuideBtn');
      const sizeGuideModal = document.getElementById('sizeGuideModal');
      const closeSizeModalBtn = document.getElementById('closeSizeModalBtn');
      if (showSizeGuideBtn && sizeGuideModal) {
        const sizeGuideTable = currentProduct.sizeGuide && currentProduct.sizeGuide.length > 0 ? currentProduct.sizeGuide : [
          { size: "S", chest: "42\"", length: "27\"", shoulder: "20\"" },
          { size: "M", chest: "44\"", length: "28\"", shoulder: "21\"" },
          { size: "L", chest: "46\"", length: "29\"", shoulder: "22\"" },
          { size: "XL", chest: "48\"", length: "30\"", shoulder: "23\"" },
          { size: "XXL", chest: "50\"", length: "31\"", shoulder: "24\"" }
        ];
        const headers = Object.keys(sizeGuideTable[0]);
        let sizeGuideHtml = `<table class="size-table"><thead><tr>`;
        headers.forEach(h => { sizeGuideHtml += `<th>${h.toUpperCase()}</th>`; });
        sizeGuideHtml += `</thead><tbody>`;
        sizeGuideTable.forEach(row => {
          sizeGuideHtml += `<tr>`;
          headers.forEach(h => { sizeGuideHtml += `<td>${escapeHtml(row[h])}</td>`; });
          sizeGuideHtml += `</tr>`;
        });
        sizeGuideHtml += `</tbody></table>`;
        document.getElementById('sizeGuideTableContent').innerHTML = sizeGuideHtml;
        
        showSizeGuideBtn.addEventListener('click', () => {
          sizeGuideModal.classList.add('show');
        });
        closeSizeModalBtn?.addEventListener('click', () => {
          sizeGuideModal.classList.remove('show');
        });
        sizeGuideModal.addEventListener('click', (e) => {
          if (e.target === sizeGuideModal) sizeGuideModal.classList.remove('show');
        });
      }
    }, 50);
  }
  
  async function initialize() {
    const urlParams = new URLSearchParams(window.location.search);
    currentProductId = urlParams.get('id') || localStorage.getItem('vedanta_selected_product_id');
    if (!currentProductId) {
      document.getElementById('app').innerHTML = `<div class="loading-state"><p>Product ID not found. <a href="index.html" style="color:#D4AF37;">Go back to shop</a></p></div>`;
      return;
    }
    
    const cached = localStorage.getItem('vedantaProducts');
    if (cached) {
      allProducts = JSON.parse(cached);
      const cachedProduct = allProducts.find(p => p.id == currentProductId);
      if (cachedProduct && cachedProduct.status === 'active') {
        currentProduct = ensureProductFields(cachedProduct);
        renderPageContent();
      }
    }
    loadAllProductsForRelated();
    startRealTimeProductSync();
    if (sessionStorage.getItem('scrollToTop') === 'true') {
      sessionStorage.removeItem('scrollToTop');
      window.scrollTo(0, 0);
    }
  }
  
  function attachCartEvents() {
    document.getElementById('floatingCart')?.addEventListener('click', openCart);
    document.getElementById('closeCartBtn')?.addEventListener('click', closeCart);
    document.getElementById('cartOverlay')?.addEventListener('click', closeCart);
    document.getElementById('checkoutBtn')?.addEventListener('click', () => { 
      if (cart.length === 0) showToast('Cart is empty!');
      else {
        const currentUser = JSON.parse(localStorage.getItem('vedantaUser'));
        if (currentUser && currentUser.uid) {
          checkUserHasSavedAddress().then(hasSavedAddress => {
            if (hasSavedAddress) window.location.href = 'secure-checkout2.html';
            else window.location.href = 'secure-checkout.html';
          });
        } else {
          pendingBuyProduct = null;
          openLoginModal();
        }
      }
    });
  }
  
  document.getElementById('modalSendOtpBtn')?.addEventListener('click', modalSendOTP);
  document.getElementById('modalVerifyBtn')?.addEventListener('click', modalVerifyOTP);
  document.getElementById('modalResendBtn')?.addEventListener('click', modalResendOTP);
  document.getElementById('modalBackBtn')?.addEventListener('click', modalBackToPhone);
  document.getElementById('closeModalBtn')?.addEventListener('click', closeLoginModal);
  document.getElementById('closeReviewsModalBtn')?.addEventListener('click', closeReviewsModal);
  
  document.getElementById('loginModal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('loginModal')) closeLoginModal(); });
  document.getElementById('reviewsModal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('reviewsModal')) closeReviewsModal(); });
  
  initialize();
  updateCartUI();
  attachCartEvents();
</script>
</body>
</html>
