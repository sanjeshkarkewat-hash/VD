<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Vedanta | Product Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #050508;
      color: #FFFFFF;
      overflow-x: hidden;
      padding-bottom: 20px;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.08), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }
    .container { width: 100%; max-width: 100%; margin: 0; padding: 0; }

    /* Floating cart */
    .floating-cart {
      position: fixed;
      bottom: 30px;
      right: 16px;
      left: auto;
      z-index: 1001;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .cart-icon-container {
      background: linear-gradient(135deg, #D4AF37, #FF8C00);
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
      transition: transform 0.2s;
    }
    .cart-icon-container:active { transform: scale(0.95); }
    .cart-icon-container i { font-size: 26px; color: #050508; }
    .cart-count {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #FF4500;
      color: white;
      font-size: 11px;
      font-weight: bold;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Cart sidebar */
    .cart-sidebar {
      position: fixed;
      top: 0;
      right: -100%;
      left: auto;
      width: 85%;
      max-width: 380px;
      height: 100%;
      background: rgba(10,10,18,0.98);
      backdrop-filter: blur(20px);
      z-index: 2000;
      transition: 0.3s ease;
      border-left: 1px solid rgba(212,175,55,0.3);
      display: flex;
      flex-direction: column;
    }
    .cart-sidebar.open { right: 0; left: auto; }
    .cart-header {
      padding: 20px;
      border-bottom: 1px solid rgba(212,175,55,0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-header h3 { font-size: 20px; color: #D4AF37; }
    .close-cart {
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      padding: 5px;
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .cart-item-info h4 { font-size: 14px; margin-bottom: 4px; }
    .cart-item-info p { color: #D4AF37; font-weight: bold; font-size: 14px; }
    .combo-tag {
      background: #4CAF50;
      color: white;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 4px;
    }
    .cart-item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cart-qty-btn {
      background: rgba(212,175,55,0.2);
      border: 1px solid rgba(212,175,55,0.3);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      color: #D4AF37;
      font-size: 16px;
    }
    .cart-qty {
      font-size: 14px;
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }
    .cart-item-remove {
      background: rgba(255,69,0,0.2);
      border: none;
      color: #FF4500;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
    }
    .cart-footer {
      padding: 20px;
      border-top: 1px solid rgba(212,175,55,0.3);
      background: rgba(10,10,18,0.95);
    }
    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .checkout-btn {
      width: 100%;
      background: linear-gradient(135deg, #D4AF37, #FF8C00);
      border: none;
      padding: 14px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .empty-cart { text-align: center; padding: 40px; color: #888; }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1999;
      display: none;
    }
    .overlay.show { display: block; }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(212,175,55,0.3);
      background: rgba(5,5,8,0.98);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo h1 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FF8C00); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .back-btn { background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.3); padding: 6px 14px; border-radius: 40px; color: #D4AF37; text-decoration: none; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    /* ====== FIXED GALLERY: FULL IMAGE VISIBLE ON BOTH DESKTOP & MOBILE ====== */
    .product-gallery {
      background: rgba(15,15,22,0.6);
      padding: 16px;
      position: relative;
    }
    .main-image-container {
      position: relative;
      background: #0E0E14;
      border-radius: 24px;
      /* Responsive aspect ratio - works on all devices */
      aspect-ratio: 4 / 3;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .main-image-slider {
      width: 100%;
      height: 100%;
      display: flex;
      transition: transform 0.3s ease;
    }
    .slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* CRITICAL FIX: object-fit contain ensures FULL image visible without any cropping */
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #0E0E14;
      display: block;
      pointer-events: none;
    }
    /* For fallback icons */
    .slide i {
      font-size: 80px;
      color: #D4AF37;
    }
    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: white;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .slider-btn:hover {
      background: rgba(212,175,55,0.8);
      color: #050508;
    }
    .slider-prev { left: 8px; }
    .slider-next { right: 8px; }
    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #FF4500;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      z-index: 5;
    }
    .thumbnail-list {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
      overflow-x: auto;
      padding: 6px 4px;
      -webkit-overflow-scrolling: touch;
    }
    .thumbnail {
      width: 55px;
      height: 55px;
      background: #1A1A1A;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid transparent;
      overflow: hidden;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .thumbnail.active { border-color: #D4AF37; transform: scale(1.05); }
    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #0E0E14;
    }
    .thumbnail i { font-size: 24px; color: #D4AF37; }

    /* Rest of styles (product info, colors, combos etc) */
    .product-info {
      background: rgba(15,15,22,0.6);
      padding: 16px;
      margin: 12px;
      border-radius: 24px;
    }
    .product-brand { color: #D4AF37; font-size: 11px; letter-spacing: 2px; margin-bottom: 6px; }
    .product-name { font-size: 20px; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
    .rating { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .stars { color: #FFB800; font-size: 12px; letter-spacing: 2px; }
    .review-count { color: #888; font-size: 11px; }
    .price-section { margin-bottom: 16px; }
    .current-price { font-size: 28px; font-weight: 800; color: #D4AF37; }
    .original-price { font-size: 16px; color: #888; text-decoration: line-through; margin-left: 8px; }
    .discount { background: #FF4500; padding: 3px 8px; border-radius: 25px; font-size: 11px; font-weight: 600; margin-left: 8px; }
    
    .size-section, .color-section, .combo-section {
      margin: 16px 0;
      background: rgba(0,0,0,0.3);
      border-radius: 16px;
      padding: 12px;
    }
    .size-title, .color-title, .combo-title {
      font-size: 14px;
      font-weight: 600;
      color: #D4AF37;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .size-options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .size-btn {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.3);
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #FFFFFF;
      transition: all 0.2s;
    }
    .size-btn.active, .size-btn:active {
      background: #D4AF37;
      color: #050508;
      border-color: #D4AF37;
    }
    
    .color-options {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .color-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 5px;
      border-radius: 12px;
      transition: all 0.2s ease;
      min-width: 60px;
    }
    .color-btn.active {
      background: rgba(212,175,55,0.25);
      transform: scale(1.05);
    }
    .color-circle {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .color-btn.active .color-circle {
      border-color: #D4AF37;
      box-shadow: 0 0 15px rgba(212,175,55,0.6);
      transform: scale(1.05);
    }
    .color-name {
      font-size: 11px;
      color: #aaa;
      font-weight: 500;
    }
    .color-btn.active .color-name {
      color: #D4AF37;
      font-weight: 700;
    }

    .combo-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .combo-item {
      background: rgba(0,0,0,0.4);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 2px solid rgba(212,175,55,0.2);
      transition: all 0.3s ease;
      position: relative;
    }
    .combo-item.selected {
      border-color: #D4AF37;
      background: linear-gradient(135deg, rgba(212,175,55,0.25), rgba(76,175,80,0.15));
    }
    .combo-quantity { font-size: 18px; font-weight: 800; color: #4CAF50; display: flex; align-items: center; gap: 8px; }
    .combo-save { font-size: 11px; color: #FFB800; background: rgba(255,184,0,0.15); padding: 2px 8px; border-radius: 20px; display: inline-block; margin-top: 4px; }
    .combo-price { text-align: right; }
    .combo-price .price-big { font-size: 20px; font-weight: 800; color: #D4AF37; }
    .combo-price .per-piece { font-size: 10px; color: #4CAF50; }
    .combo-select-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(212,175,55,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 12px;
    }
    .combo-item.selected .combo-select-icon { background: #4CAF50; }
    .combo-select-icon i { font-size: 16px; color: white; }
    .combo-badge {
      position: absolute;
      top: -8px;
      right: 12px;
      background: #FF4500;
      color: white;
      font-size: 9px;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .product-detail-section {
      margin: 20px 0;
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 16px;
    }
    .detail-title {
      font-size: 18px;
      font-weight: 700;
      color: #D4AF37;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 3px solid #D4AF37;
      padding-left: 12px;
    }
    .full-description { color: #CCCCCC; line-height: 1.7; font-size: 14px; text-align: justify; }
    .features-list { margin-top: 16px; background: rgba(212,175,55,0.05); border-radius: 16px; padding: 12px; }
    .feature-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .feature-item:last-child { border-bottom: none; }
    .feature-item i { width: 24px; color: #D4AF37; font-size: 14px; }
    .feature-item span { font-size: 13px; color: #AAAAAA; }

    .offer-tag { background: rgba(212,175,55,0.1); padding: 12px; border-radius: 16px; margin: 16px 0; text-align: center; font-size: 13px; }
    .quantity-selector { display: flex; align-items: center; gap: 15px; margin: 20px 0; }
    .qty-btn {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.3);
      width: 44px;
      height: 44px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      color: #D4AF37;
    }
    .qty-input {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(212,175,55,0.3);
      width: 60px;
      height: 44px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: white;
      border-radius: 14px;
    }

    .action-buttons {
      position: sticky;
      bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
      padding: 12px;
      background: rgba(5,5,8,0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(212,175,55,0.3);
      z-index: 99;
    }
    .add-cart-btn, .buy-btn {
      width: 100%;
      padding: 15px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .add-cart-btn {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.5);
      color: #D4AF37;
    }
    .buy-btn {
      background: linear-gradient(135deg, #FF4500, #FF8C00);
      border: none;
      color: white;
    }
    .add-cart-btn:active, .buy-btn:active { transform: scale(0.98); }

    .section-title { font-size: 20px; font-weight: 700; margin: 24px 16px 16px; display: flex; align-items: center; gap: 10px; }
    .section-title span { background: #D4AF37; width: 30px; height: 3px; }

    .related-products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px;
      margin-bottom: 30px;
    }
    .related-card {
      background: rgba(15,15,22,0.6);
      border-radius: 20px;
      padding: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .related-card:active { transform: scale(0.97); }
    .related-img {
      height: 140px;
      background: #0E0E14;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .related-img img { width: 100%; height: 100%; object-fit: contain; background: #0E0E14; }
    .related-img i { font-size: 55px; color: #D4AF37; }
    .related-name { font-size: 13px; font-weight: 600; margin-top: 8px; }
    .related-price { font-size: 15px; font-weight: 800; color: #D4AF37; margin-top: 5px; }

    .reviews-section { padding: 0 16px; margin-bottom: 40px; }
    .review-card {
      background: rgba(15,15,22,0.4);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .reviewer { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .review-stars-small { color: #FFB800; font-size: 11px; margin-bottom: 8px; }
    .review-text { font-size: 12px; line-height: 1.5; color: #CCCCCC; }
    .review-date { font-size: 10px; color: #888; margin-top: 8px; }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #D4AF37;
      color: #050508;
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: bold;
      z-index: 10000;
      font-size: 12px;
      display: none;
    }
    .toast.show { display: block; animation: fadeInOut 2s ease; }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }
    
    .loading-state {
      text-align: center;
      padding: 60px 20px;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(212,175,55,0.3);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Desktop specific adjustments */
    @media (min-width: 768px) {
      .main-image-container {
        max-width: 700px;
        margin: 0 auto;
      }
      .product-info {
        max-width: 700px;
        margin: 20px auto;
      }
      .related-products {
        max-width: 700px;
        margin: 0 auto 30px;
        gap: 20px;
      }
      .reviews-section {
        max-width: 700px;
        margin: 0 auto 40px;
      }
      .section-title {
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>
<body>

<div class="floating-cart" id="floatingCart">
  <div class="cart-icon-container">
    <i class="fas fa-shopping-cart"></i>
    <span class="cart-count" id="cartCount">0</span>
  </div>
</div>

<div class="overlay" id="cartOverlay"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h3><i class="fas fa-shopping-bag"></i> Your Cart</h3>
    <button class="close-cart" id="closeCartBtn">&times;</button>
  </div>
  <div class="cart-items" id="cartItems"><div class="empty-cart">🛒 Your cart is empty</div></div>
  <div class="cart-footer">
    <div class="cart-total"><span>Total:</span><span id="cartTotal">₹0</span></div>
    <button class="checkout-btn" id="checkoutBtn">💰 Proceed to Checkout</button>
  </div>
</div>

<div class="container" id="app">
  <div class="loading-state">
    <div class="loading-spinner"></div>
    <p>Loading product details...</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCMPUAV50FOsqpyTKY3lioeAgbQvxQzLnM",
    authDomain: "vedanta-d0199.firebaseapp.com",
    projectId: "vedanta-d0199",
    storageBucket: "vedanta-d0199.firebasestorage.app",
    messagingSenderId: "761061711987",
    appId: "1:761061711987:web:d59ff32fd53057c395ca06"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch(err => console.log("Persistence:", err));
  
  let allProducts = [];
  let currentProductId = null;
  let currentProduct = null;
  let quantity = 1;
  let selectedSize = null;
  let selectedColor = null;
  let selectedCombo = null;
  let currentSlide = 0;
  let slideInterval = null;
  let cart = JSON.parse(localStorage.getItem('vedantaCart')) || [];
  
  function saveCart() { localStorage.setItem('vedantaCart', JSON.stringify(cart)); updateCartUI(); }
  
  function addToCart(product, qty, size, color, combo = null) {
    let finalPrice = product.price;
    let comboInfo = null;
    let comboQtyMultiplier = 1;
    
    if (combo) {
      finalPrice = combo.price / combo.quantity;
      comboInfo = `${combo.quantity} for ₹${combo.price}`;
      comboQtyMultiplier = combo.quantity;
      qty = combo.quantity;
    }
    
    const existingIndex = cart.findIndex(item => 
      item.id === product.id && 
      item.size === size && 
      item.color === color && 
      item.combo === comboInfo
    );
    
    if (existingIndex !== -1) {
      if (combo) {
        cart[existingIndex].quantity += combo.quantity;
      } else {
        cart[existingIndex].quantity += qty;
      }
    } else {
      cart.push({ 
        id: product.id, 
        name: product.name, 
        price: finalPrice, 
        quantity: qty, 
        size: size || 'Default', 
        color: color || '', 
        combo: comboInfo,
        isCombo: !!combo,
        comboMultiplier: comboQtyMultiplier
      });
    }
    saveCart();
    showToast(combo ? `🎉 Combo Pack: ${combo.quantity} items for ₹${combo.price} added!` : `🛍️ ${product.name} added!`);
    if (combo) selectedCombo = null;
  }
  
  function updateCartQuantity(index, newQuantity) {
    const item = cart[index];
    if (item.isCombo && item.comboMultiplier) {
      const currentMultiples = item.quantity / item.comboMultiplier;
      const newMultiples = newQuantity / item.comboMultiplier;
      if (newMultiples < 1) {
        cart.splice(index, 1);
      } else {
        item.quantity = newMultiples * item.comboMultiplier;
      }
    } else {
      if (newQuantity < 1) {
        cart.splice(index, 1);
      } else {
        cart[index].quantity = newQuantity;
      }
    }
    saveCart();
  }
  
  function removeFromCart(index) { cart.splice(index, 1); saveCart(); }
  
  function buyNowDirect(product, qty, size, color, combo = null) {
    const currentUser = JSON.parse(localStorage.getItem('vedantaUser'));
    if (!currentUser || !currentUser.email) {
      showToast('🔐 Please login first');
      setTimeout(() => window.location.href = 'profile.html', 800);
      return;
    }
    let finalPrice = product.price;
    let finalQty = qty;
    let comboInfo = null;
    let comboMultiplier = 1;
    
    if (combo) {
      finalPrice = combo.price / combo.quantity;
      comboInfo = `${combo.quantity} for ₹${combo.price}`;
      finalQty = combo.quantity;
      comboMultiplier = combo.quantity;
    }
    
    const tempCart = [{ 
      id: product.id, 
      name: product.name, 
      price: finalPrice, 
      quantity: finalQty, 
      size: size || 'Default', 
      color: color || '', 
      combo: comboInfo,
      isCombo: !!combo,
      comboMultiplier: comboMultiplier
    }];
    localStorage.setItem('vedantaCart', JSON.stringify(tempCart));
    showToast(`💳 Proceeding to checkout`);
    setTimeout(() => window.location.href = 'secure-checkout.html', 500);
  }
  
  function updateCartUI() {
    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    const cartCountEl = document.getElementById('cartCount');
    if (cartCountEl) cartCountEl.innerText = totalItems;
    const cartItemsDiv = document.getElementById('cartItems');
    const cartTotalSpan = document.getElementById('cartTotal');
    if (cart.length === 0) {
      if (cartItemsDiv) cartItemsDiv.innerHTML = '<div class="empty-cart">🛒 Your cart is empty</div>';
      if (cartTotalSpan) cartTotalSpan.innerText = '₹0';
      return;
    }
    let total = 0;
    cartItemsDiv.innerHTML = '';
    cart.forEach((item, idx) => {
      const itemTotal = item.price * item.quantity;
      total += itemTotal;
      cartItemsDiv.innerHTML += `<div class="cart-item">
        <div class="cart-item-info">
          <h4>${escapeHtml(item.name)} ${item.size ? `(${item.size})` : ''} ${item.color ? `- ${item.color}` : ''}</h4>
          ${item.combo ? `<span class="combo-tag"><i class="fas fa-gift"></i> ${escapeHtml(item.combo)}</span>` : ''}
          <p>₹${item.price} x ${item.quantity} = ₹${itemTotal}</p>
        </div>
        <div class="cart-item-actions">
          <button class="cart-qty-btn" data-action="decr" data-index="${idx}">-</button>
          <span class="cart-qty">${item.quantity}</span>
          <button class="cart-qty-btn" data-action="incr" data-index="${idx}">+</button>
          <button class="cart-item-remove" data-index="${idx}"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
    });
    cartItemsDiv.querySelectorAll('.cart-qty-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.index);
        const action = btn.dataset.action;
        const item = cart[idx];
        if (action === 'incr') {
          if (item.isCombo && item.comboMultiplier) {
            updateCartQuantity(idx, item.quantity + item.comboMultiplier);
          } else {
            updateCartQuantity(idx, item.quantity + 1);
          }
        } else if (action === 'decr') {
          if (item.isCombo && item.comboMultiplier) {
            updateCartQuantity(idx, item.quantity - item.comboMultiplier);
          } else {
            updateCartQuantity(idx, item.quantity - 1);
          }
        }
      });
    });
    cartItemsDiv.querySelectorAll('.cart-item-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeFromCart(parseInt(btn.dataset.index));
      });
    });
    if (cartTotalSpan) cartTotalSpan.innerText = `₹${total}`;
  }
  
  function openCart() { document.getElementById('cartSidebar').classList.add('open'); document.getElementById('cartOverlay').classList.add('show'); }
  function closeCart() { document.getElementById('cartSidebar').classList.remove('open'); document.getElementById('cartOverlay').classList.remove('show'); }
  function showToast(msg) { const toast = document.getElementById('toast'); toast.innerText = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2500); }
  function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m)); }
  
  function ensureProductFields(p) {
    if (!p.originalPrice) p.originalPrice = Math.round(p.price * 1.6);
    if (!p.rating) p.rating = 4.5;
    if (!p.reviewCount) p.reviewCount = 500;
    if (!p.fullDesc) p.fullDesc = "Premium quality product from Vedanta. Crafted with precision and care, this piece embodies luxury and elegance.";
    if (!p.sizes) p.sizes = [];
    if (!p.colors) p.colors = [];
    if (!p.combos) p.combos = [];
    if (!p.benefits) p.benefits = ["Premium Quality", "Handcrafted", "Made in India", "Eco-friendly"];
    if (!p.images) p.images = [];
    return p;
  }
  
  function setSelectedProductId(id) { localStorage.setItem('vedanta_selected_product_id', id); }
  
  function navigateToRelatedProduct(productId) {
    if (!productId) return;
    localStorage.setItem('vedanta_selected_product_id', productId);
    sessionStorage.setItem('scrollToTop', 'true');
    window.location.href = window.location.pathname + '?id=' + productId;
  }
  
  async function loadProductData() {
    const urlParams = new URLSearchParams(window.location.search);
    currentProductId = urlParams.get('id') || localStorage.getItem('vedanta_selected_product_id') || "1";
    
    const cached = localStorage.getItem('vedantaProducts');
    if (cached) {
      allProducts = JSON.parse(cached);
      currentProduct = allProducts.find(p => p.id == currentProductId);
      if (currentProduct) {
        currentProduct = ensureProductFields(currentProduct);
        renderPageContent();
      }
    }
    
    try {
      const snapshot = await db.collection('products').get();
      const products = [];
      snapshot.forEach(doc => products.push({ id: doc.id, ...doc.data() }));
      if (products.length > 0) {
        allProducts = products;
        localStorage.setItem('vedantaProducts', JSON.stringify(allProducts));
        const newProduct = allProducts.find(p => p.id == currentProductId);
        if (newProduct) {
          currentProduct = ensureProductFields(newProduct);
          renderPageContent();
        }
      }
    } catch (error) { console.error("Firebase error:", error); }
    
    if (sessionStorage.getItem('scrollToTop') === 'true') {
      sessionStorage.removeItem('scrollToTop');
      window.scrollTo(0, 0);
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
    }
  }
  
  function renderImageSlider() {
    const images = currentProduct.images || [];
    const hasImages = images.length > 0;
    let slidesHtml = hasImages ? images.map(img => `<div class="slide"><img src="${img}" loading="lazy" alt="${currentProduct.name}"></div>`).join('') : `<div class="slide"><i class="fas ${currentProduct.icon || 'fa-gem'}"></i></div>`;
    let thumbnailsHtml = hasImages ? images.map((img, idx) => `<div class="thumbnail ${idx === currentSlide ? 'active' : ''}" data-index="${idx}"><img src="${img}" alt="thumbnail ${idx+1}"></div>`).join('') : `<div class="thumbnail active"><i class="fas ${currentProduct.icon || 'fa-gem'}"></i></div>`;
    
    return `<div class="product-gallery">
      <div class="main-image-container">
        <div class="badge">${currentProduct.badge || 'New'}</div>
        <div class="main-image-slider" id="imageSlider" style="transform: translateX(-${currentSlide * 100}%);">${slidesHtml}</div>
        ${hasImages && images.length > 1 ? `<button class="slider-btn slider-prev" id="prevSlide"><i class="fas fa-chevron-left"></i></button><button class="slider-btn slider-next" id="nextSlide"><i class="fas fa-chevron-right"></i></button>` : ''}
      </div>
      <div class="thumbnail-list" id="thumbnailList">${thumbnailsHtml}</div>
    </div>`;
  }
  
  function initSlider() {
    const images = currentProduct.images || [];
    const totalSlides = images.length || 1;
    if (images.length <= 1) return;
    const slider = document.getElementById('imageSlider');
    const prevBtn = document.getElementById('prevSlide');
    const nextBtn = document.getElementById('nextSlide');
    const thumbnails = document.querySelectorAll('.thumbnail');
    
    function updateSlider(index) {
      if (index < 0) index = totalSlides - 1;
      if (index >= totalSlides) index = 0;
      currentSlide = index;
      if (slider) slider.style.transform = `translateX(-${currentSlide * 100}%)`;
      thumbnails.forEach((t, i) => i === currentSlide ? t.classList.add('active') : t.classList.remove('active'));
    }
    prevBtn?.addEventListener('click', () => updateSlider(currentSlide - 1));
    nextBtn?.addEventListener('click', () => updateSlider(currentSlide + 1));
    thumbnails.forEach((t, i) => t.addEventListener('click', () => updateSlider(i)));
    
    if (slideInterval) clearInterval(slideInterval);
    slideInterval = setInterval(() => updateSlider(currentSlide + 1), 5000);
  }
  
  function getColorCode(colorName) {
    const colorMap = {
      'Red': '#FF0000', 'Crimson': '#DC143C', 'Maroon': '#800000',
      'Orange': '#FFA500', 'Gold': '#FFD700', 'Yellow': '#FFFF00',
      'Lime': '#32CD32', 'Green': '#008000', 'Teal': '#008080',
      'Cyan': '#00FFFF', 'Blue': '#0000FF', 'Navy': '#000080',
      'Purple': '#800080', 'Magenta': '#FF00FF', 'Pink': '#FF69B4',
      'HotPink': '#FF1493', 'Brown': '#8B4513', 'Black': '#000000',
      'White': '#FFFFFF', 'Silver': '#C0C0C0', 'Lavender': '#E6E6FA',
      'Peach': '#FFDAB9', 'Mint': '#98FB98', 'Coral': '#FF7F50',
      'Turquoise': '#40E0D0', 'Indigo': '#4B0082', 'Violet': '#EE82EE',
      'Rose': '#FF007F', 'Chocolate': '#D2691E', 'Khaki': '#F0E68C',
      'Salmon': '#FA8072', 'Plum': '#DDA0DD', 'Tan': '#D2B48C',
      'Beige': '#F5F5DC', 'Ivory': '#FFFFF0', 'Linen': '#FAF0E6'
    };
    return colorMap[colorName] || '#D4AF37';
  }
  
  function renderColors() {
    const colors = currentProduct.colors || [];
    if (colors.length === 0) return '';
    
    return `<div class="color-section">
      <div class="color-title"><i class="fas fa-palette"></i> Select Color:</div>
      <div class="color-options" id="colorOptions">
        ${colors.map(color => {
          const colorName = typeof color === 'object' ? color.name : color;
          const colorCode = (typeof color === 'object' && color.code) ? color.code : getColorCode(colorName);
          return `<div class="color-btn ${selectedColor === colorName ? 'active' : ''}" data-color="${colorName}">
            <div class="color-circle" style="background: ${colorCode};"></div>
            <span class="color-name">${colorName}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  
  function attachColorEvents() {
    const colorBtns = document.querySelectorAll('.color-btn');
    colorBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        colorBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedColor = btn.getAttribute('data-color');
        showToast(`🎨 ${selectedColor} selected`);
      });
    });
    if (colorBtns.length > 0 && !selectedColor) {
      colorBtns[0].classList.add('active');
      selectedColor = colorBtns[0].getAttribute('data-color');
    }
  }
  
  function renderComboOffers() {
    const combos = currentProduct.combos || [];
    if (combos.length === 0) return '';
    
    return `<div class="combo-section">
      <div class="combo-title"><i class="fas fa-gift"></i> 🔥 SPECIAL COMBO OFFERS</div>
      <div class="combo-list" id="comboList">
        ${combos.map((combo, idx) => {
          const savePercent = Math.round(((combo.quantity * currentProduct.price) - combo.price) / (combo.quantity * currentProduct.price) * 100);
          const isSelected = selectedCombo && selectedCombo.quantity === combo.quantity && selectedCombo.price === combo.price;
          return `<div class="combo-item ${isSelected ? 'selected' : ''}" data-combo-index="${idx}" data-combo-qty="${combo.quantity}" data-combo-price="${combo.price}">
            <div class="combo-item-info">
              <div class="combo-quantity"><i class="fas fa-boxes"></i> Buy ${combo.quantity} Items</div>
              <div class="combo-save">🔥 Save ${savePercent}%</div>
            </div>
            <div class="combo-price">
              <div class="price-big">₹${combo.price}</div>
              <div class="per-piece">₹${Math.round(combo.price / combo.quantity)}/piece</div>
            </div>
            <div class="combo-select-icon"><i class="fas ${isSelected ? 'fa-check-circle' : 'fa-plus-circle'}"></i></div>
            <div class="combo-badge">BEST VALUE</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  
  function attachComboEvents() {
    const comboItems = document.querySelectorAll('.combo-item');
    comboItems.forEach(combo => {
      combo.addEventListener('click', (e) => {
        e.stopPropagation();
        const comboQty = parseInt(combo.getAttribute('data-combo-qty'));
        const comboPrice = parseInt(combo.getAttribute('data-combo-price'));
        
        if (selectedCombo && selectedCombo.quantity === comboQty && selectedCombo.price === comboPrice) {
          selectedCombo = null;
          combo.classList.remove('selected');
          const icon = combo.querySelector('.combo-select-icon i');
          if (icon) icon.className = 'fas fa-plus-circle';
          showToast(`✨ Combo offer removed! Regular price applied.`);
        } else {
          comboItems.forEach(c => {
            c.classList.remove('selected');
            const icon = c.querySelector('.combo-select-icon i');
            if (icon) icon.className = 'fas fa-plus-circle';
          });
          combo.classList.add('selected');
          const icon = combo.querySelector('.combo-select-icon i');
          if (icon) icon.className = 'fas fa-check-circle';
          selectedCombo = { quantity: comboQty, price: comboPrice };
          showToast(`🎉 Combo selected! ${comboQty} items for ₹${comboPrice}. Click "ADD TO CART" or "BUY NOW"!`);
        }
      });
    });
  }
  
  function attachSizeEvents() {
    const sizeBtns = document.querySelectorAll('.size-btn');
    if (sizeBtns.length > 0) {
      sizeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          sizeBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedSize = btn.dataset.size;
        });
      });
      if (!selectedSize) { sizeBtns[0].classList.add('active'); selectedSize = sizeBtns[0].dataset.size; }
    }
  }
  
  function renderRelatedProducts() {
    const related = allProducts.filter(p => p.category === currentProduct.category && p.id != currentProduct.id).slice(0, 4);
    const container = document.getElementById('relatedProducts');
    if (!container) return;
    if (related.length === 0) { container.innerHTML = '<p style="color:#888; text-align:center;">No related products</p>'; return; }
    container.innerHTML = related.map(p => {
      const hasImage = p.images && p.images.length > 0;
      return `<div class="related-card" data-product-id="${p.id}">
        <div class="related-img">${hasImage ? `<img src="${p.images[0]}" loading="lazy" alt="${p.name}">` : `<i class="fas ${p.icon || 'fa-gem'}"></i>`}</div>
        <div class="related-name">${escapeHtml(p.name)}</div>
        <div class="related-price">₹${p.price.toLocaleString()}</div>
      </div>`;
    }).join('');
    document.querySelectorAll('.related-card').forEach(card => {
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        const productId = card.getAttribute('data-product-id');
        navigateToRelatedProduct(productId);
      });
    });
  }
  
  function renderPageContent() {
    if (!currentProduct) return;
    
    const discountPercent = Math.round(((currentProduct.originalPrice - currentProduct.price) / currentProduct.originalPrice) * 100);
    const galleryHtml = renderImageSlider();
    const hasSizes = currentProduct.sizes && currentProduct.sizes.length > 0;
    const sizeHtml = hasSizes ? `<div class="size-section"><div class="size-title"><i class="fas fa-tshirt"></i> Select Size:</div><div class="size-options" id="sizeOptions">${currentProduct.sizes.map(size => `<button class="size-btn ${selectedSize === size ? 'active' : ''}" data-size="${size}">${size}</button>`).join('')}</div></div>` : '';
    const colorsHtml = renderColors();
    const combosHtml = renderComboOffers();
    const benefitsHtml = `<div class="features-list">${currentProduct.benefits.map(b => `<div class="feature-item"><i class="fas fa-check-circle"></i><span>${escapeHtml(b)}</span></div>`).join('')}</div>`;
    
    const html = `<div class="header">
      <div class="logo"><h1>VEDANTA</h1></div>
      <div class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back</div>
    </div>
    ${galleryHtml}
    <div class="product-info">
      <div class="product-brand">VEDANTA EXCLUSIVE</div>
      <div class="product-name">${escapeHtml(currentProduct.name)}</div>
      <div class="rating"><div class="stars">★★★★★</div><div class="review-count">${currentProduct.reviewCount} reviews</div></div>
      <div class="price-section"><span class="current-price">₹${currentProduct.price.toLocaleString()}</span><span class="original-price">₹${currentProduct.originalPrice.toLocaleString()}</span><span class="discount">${discountPercent}% OFF</span></div>
      ${sizeHtml}
      ${colorsHtml}
      ${combosHtml}
      <div class="product-detail-section"><div class="detail-title"><i class="fas fa-align-left"></i> Product Details</div><div class="full-description">${escapeHtml(currentProduct.fullDesc)}</div></div>
      ${benefitsHtml}
      <div class="offer-tag"><i class="fas fa-tags"></i> Free Shipping • COD Available • Easy Returns</div>
      <div class="quantity-selector"><button class="qty-btn" id="qtyMinus">-</button><input type="text" class="qty-input" id="qtyInput" value="1" readonly><button class="qty-btn" id="qtyPlus">+</button></div>
      <div class="action-buttons"><button class="add-cart-btn" id="addToCartBtn"><i class="fa-regular fa-bag-shopping"></i> ADD TO CART</button><button class="buy-btn" id="buyNowBtn"><i class="fas fa-bolt"></i> BUY NOW</button></div>
    </div>
    <div class="section-title"><span></span> You May Also Like</div>
    <div class="related-products" id="relatedProducts"></div>
    <div class="section-title"><span></span> Customer Reviews</div>
    <div class="reviews-section">
      <div class="review-card"><div class="reviewer"><i class="fas fa-user-circle"></i> Priya Sharma <span style="color:#4CAF50;">✓ Verified</span></div><div class="review-stars-small">★★★★★</div><div class="review-text">"Absolutely stunning product! The quality is amazing."</div><div class="review-date">15 Mar 2025</div></div>
      <div class="review-card"><div class="reviewer"><i class="fas fa-user-circle"></i> Amit Kumar <span style="color:#4CAF50;">✓ Verified</span></div><div class="review-stars-small">★★★★★</div><div class="review-text">"Worth every penny. Premium finish and fast delivery."</div><div class="review-date">10 Mar 2025</div></div>
    </div>`;
    
    document.getElementById('app').innerHTML = html;
    
    setTimeout(() => {
      initSlider();
      attachSizeEvents();
      attachColorEvents();
      attachComboEvents();
      renderRelatedProducts();
      
      let qty = 1;
      const qtyMinus = document.getElementById('qtyMinus');
      const qtyPlus = document.getElementById('qtyPlus');
      const qtyInput = document.getElementById('qtyInput');
      if (qtyMinus && qtyPlus && qtyInput) {
        qtyMinus.addEventListener('click', () => { if (qty > 1) { qty--; qtyInput.value = qty; } });
        qtyPlus.addEventListener('click', () => { qty++; qtyInput.value = qty; });
      }
      document.getElementById('addToCartBtn')?.addEventListener('click', () => { addToCart(currentProduct, qty, selectedSize, selectedColor, selectedCombo); if (selectedCombo) selectedCombo = null; });
      document.getElementById('buyNowBtn')?.addEventListener('click', () => { buyNowDirect(currentProduct, qty, selectedSize, selectedColor, selectedCombo); });
    }, 50);
  }
  
  function attachCartEvents() {
    document.getElementById('floatingCart')?.addEventListener('click', openCart);
    document.getElementById('closeCartBtn')?.addEventListener('click', closeCart);
    document.getElementById('cartOverlay')?.addEventListener('click', closeCart);
    document.getElementById('checkoutBtn')?.addEventListener('click', () => { if (cart.length === 0) showToast('Cart is empty!'); else window.location.href = 'secure-checkout.html'; });
  }
  
  loadProductData();
  updateCartUI();
  attachCartEvents();
</script>
</body>
</html>
