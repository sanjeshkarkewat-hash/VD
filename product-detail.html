<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Product Detail - Vedanta</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    /* ... existing styles ... */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #050508;
      color: #FFFFFF;
      overflow-x: hidden;
      padding-bottom: 20px;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.08), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }
    .container { width: 100%; max-width: 100%; margin: 0; padding: 0; }

    .floating-cart {
      position: fixed;
      bottom: 30px;
      right: 16px;
      left: auto;
      z-index: 1001;
      cursor: pointer;
    }
    .cart-icon-container {
      background: linear-gradient(135deg, #D4AF37, #FF8C00);
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
    }
    .cart-icon-container:active { transform: scale(0.95); }
    .cart-icon-container i { font-size: 26px; color: #050508; }
    .cart-count {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #FF4500;
      color: white;
      font-size: 11px;
      font-weight: bold;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-sidebar {
      position: fixed;
      top: 0;
      right: -100%;
      left: auto;
      width: 85%;
      max-width: 380px;
      height: 100%;
      background: rgba(10,10,18,0.98);
      backdrop-filter: blur(20px);
      z-index: 2000;
      transition: 0.3s ease;
      border-left: 1px solid rgba(212,175,55,0.3);
      display: flex;
      flex-direction: column;
    }
    .cart-sidebar.open { right: 0; left: auto; }
    .cart-header {
      padding: 20px;
      border-bottom: 1px solid rgba(212,175,55,0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-header h3 { font-size: 20px; color: #D4AF37; }
    .close-cart {
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .cart-item-info h4 { font-size: 14px; margin-bottom: 4px; }
    .cart-item-info p { color: #D4AF37; font-weight: bold; font-size: 14px; }
    .combo-tag {
      background: #4CAF50;
      color: white;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 4px;
    }
    .cart-item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cart-qty-btn {
      background: rgba(212,175,55,0.2);
      border: 1px solid rgba(212,175,55,0.3);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      color: #D4AF37;
      font-size: 16px;
    }
    .cart-qty {
      font-size: 14px;
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }
    .cart-item-remove {
      background: rgba(255,69,0,0.2);
      border: none;
      color: #FF4500;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
    }
    .cart-footer {
      padding: 20px;
      border-top: 1px solid rgba(212,175,55,0.3);
      background: rgba(10,10,18,0.95);
    }
    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .checkout-btn {
      width: 100%;
      background: linear-gradient(135deg, #D4AF37, #FF8C00);
      border: none;
      padding: 14px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .empty-cart { text-align: center; padding: 40px; color: #888; }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1999;
      display: none;
    }
    .overlay.show { display: block; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(212,175,55,0.3);
      background: rgba(5,5,8,0.98);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo h1 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FF8C00); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .back-btn { background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.3); padding: 6px 14px; border-radius: 40px; color: #D4AF37; text-decoration: none; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    .product-gallery {
      background: rgba(15,15,22,0.6);
      padding: 16px;
      position: relative;
    }
    .main-image-container {
      position: relative;
      background: #0E0E14;
      border-radius: 24px;
      width: 100%;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .main-image-slider {
      width: 100%;
      display: flex;
      transition: transform 0.3s ease;
    }
    .slide {
      min-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .slide img {
      width: 100%;
      height: auto;
      max-height: 400px;
      object-fit: contain;
      background: #0E0E14;
      display: block;
    }
    .slide i { font-size: 80px; color: #D4AF37; }
    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: white;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
    }
    .slider-prev { left: 8px; }
    .slider-next { right: 8px; }
    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #FF4500;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      z-index: 5;
    }
    .thumbnail-list {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
      overflow-x: auto;
      padding: 6px 4px;
    }
    .thumbnail {
      width: 55px;
      height: 55px;
      background: #1A1A1A;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid transparent;
      overflow: hidden;
      flex-shrink: 0;
    }
    .thumbnail.active { border-color: #D4AF37; }
    .thumbnail img { width: 100%; height: 100%; object-fit: contain; background: #0E0E14; }
    .thumbnail i { font-size: 24px; color: #D4AF37; }

    @media (min-width: 768px) {
      .slide img { max-height: 500px; }
      .main-image-container { min-height: 450px; }
    }

    .product-info {
      background: rgba(15,15,22,0.6);
      padding: 16px;
      margin: 12px;
      border-radius: 24px;
    }
    .product-brand { color: #D4AF37; font-size: 11px; letter-spacing: 2px; margin-bottom: 6px; }
    .product-name { font-size: 20px; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
    .rating { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .stars { color: #FFB800; font-size: 12px; letter-spacing: 2px; }
    .review-count { color: #888; font-size: 11px; }
    .price-section { margin-bottom: 16px; }
    .current-price { font-size: 28px; font-weight: 800; color: #D4AF37; }
    .original-price { font-size: 16px; color: #888; text-decoration: line-through; margin-left: 8px; }
    .discount { background: #FF4500; padding: 3px 8px; border-radius: 25px; font-size: 11px; font-weight: 600; margin-left: 8px; }
    
    .size-section, .color-section, .combo-section {
      margin: 16px 0;
      background: rgba(0,0,0,0.3);
      border-radius: 16px;
      padding: 12px;
    }
    .size-title, .color-title, .combo-title {
      font-size: 14px;
      font-weight: 600;
      color: #D4AF37;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .size-options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .size-btn {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.3);
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #FFFFFF;
    }
    .size-btn.active, .size-btn:active {
      background: #D4AF37;
      color: #050508;
      border-color: #D4AF37;
    }
    
    .color-options {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .color-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 5px;
      border-radius: 12px;
      transition: all 0.2s ease;
      min-width: 60px;
    }
    .color-btn.active {
      background: rgba(212,175,55,0.25);
      transform: scale(1.05);
    }
    .color-circle {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .color-btn.active .color-circle {
      border-color: #D4AF37;
      box-shadow: 0 0 15px rgba(212,175,55,0.6);
      transform: scale(1.05);
    }
    .color-name {
      font-size: 11px;
      color: #aaa;
      font-weight: 500;
    }
    .color-btn.active .color-name {
      color: #D4AF37;
      font-weight: 700;
    }

    .combo-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .combo-item {
      background: rgba(0,0,0,0.4);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 2px solid rgba(212,175,55,0.2);
      transition: all 0.3s ease;
    }
    .combo-item.selected {
      border-color: #D4AF37;
      background: linear-gradient(135deg, rgba(212,175,55,0.25), rgba(76,175,80,0.15));
    }
    .combo-quantity { font-size: 18px; font-weight: 800; color: #4CAF50; display: flex; align-items: center; gap: 8px; }
    .combo-save { font-size: 11px; color: #FFB800; background: rgba(255,184,0,0.15); padding: 2px 8px; border-radius: 20px; display: inline-block; margin-top: 4px; }
    .combo-price { text-align: right; }
    .combo-price .price-big { font-size: 20px; font-weight: 800; color: #D4AF37; }
    .combo-price .per-piece { font-size: 10px; color: #4CAF50; }
    .combo-select-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(212,175,55,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 12px;
    }
    .combo-item.selected .combo-select-icon { background: #4CAF50; }
    .combo-select-icon i { font-size: 16px; color: white; }
    .combo-badge {
      position: absolute;
      top: -8px;
      right: 12px;
      background: #FF4500;
      color: white;
      font-size: 9px;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .combo-item { position: relative; }

    .product-detail-section {
      margin: 20px 0;
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 16px;
    }
    .detail-title {
      font-size: 18px;
      font-weight: 700;
      color: #D4AF37;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 3px solid #D4AF37;
      padding-left: 12px;
    }
    .full-description { color: #CCCCCC; line-height: 1.7; font-size: 14px; text-align: justify; }
    .features-list { margin-top: 16px; background: rgba(212,175,55,0.05); border-radius: 16px; padding: 12px; }
    .feature-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .feature-item:last-child { border-bottom: none; }
    .feature-item i { width: 24px; color: #D4AF37; font-size: 14px; }
    .feature-item span { font-size: 13px; color: #AAAAAA; }

    .offer-tag { background: rgba(212,175,55,0.1); padding: 12px; border-radius: 16px; margin: 16px 0; text-align: center; font-size: 13px; }
    .quantity-selector { display: flex; align-items: center; gap: 15px; margin: 20px 0; }
    .qty-btn {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.3);
      width: 44px;
      height: 44px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      color: #D4AF37;
    }
    .qty-input {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(212,175,55,0.3);
      width: 60px;
      height: 44px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: white;
      border-radius: 14px;
    }

    .action-buttons {
      position: sticky;
      bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
      padding: 12px;
      background: rgba(5,5,8,0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(212,175,55,0.3);
      z-index: 99;
    }
    .add-cart-btn, .buy-btn {
      width: 100%;
      padding: 15px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
    }
    .add-cart-btn {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.5);
      color: #D4AF37;
    }
    .buy-btn {
      background: linear-gradient(135deg, #FF4500, #FF8C00);
      border: none;
      color: white;
    }

    .section-title { font-size: 20px; font-weight: 700; margin: 24px 16px 16px; display: flex; align-items: center; gap: 10px; }
    .section-title span { background: #D4AF37; width: 30px; height: 3px; }

    .related-products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px;
      margin-bottom: 30px;
    }
    .related-card {
      background: rgba(15,15,22,0.6);
      border-radius: 20px;
      padding: 12px;
      cursor: pointer;
    }
    .related-img {
      height: 140px;
      background: #0E0E14;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .related-img img { width: 100%; height: 100%; object-fit: contain; background: #0E0E14; }
    .related-img i { font-size: 55px; color: #D4AF37; }
    .related-name { font-size: 13px; font-weight: 600; margin-top: 8px; }
    .related-price { font-size: 15px; font-weight: 800; color: #D4AF37; margin-top: 5px; }

    .reviews-section { padding: 0 16px; margin-bottom: 40px; }
    .review-card {
      background: rgba(15,15,22,0.4);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .reviewer { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .review-stars-small { color: #FFB800; font-size: 11px; margin-bottom: 8px; }
    .review-text { font-size: 12px; line-height: 1.5; color: #CCCCCC; }
    .review-date { font-size: 10px; color: #888; margin-top: 8px; }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #D4AF37;
      color: #050508;
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: bold;
      z-index: 10000;
      font-size: 12px;
      display: none;
    }
    .toast.show { display: block; animation: fadeInOut 2s ease; }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }
    
    .loading-state {
      text-align: center;
      padding: 60px 20px;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(212,175,55,0.3);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Login Modal Styles */
    .login-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-modal.show {
      display: flex;
    }
    .login-modal-content {
      background: rgba(15,15,22,0.98);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 28px;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(212,175,55,0.3);
      text-align: center;
    }
    .login-modal-content h3 {
      color: #D4AF37;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .login-modal-content p {
      color: #888;
      font-size: 12px;
      margin-bottom: 20px;
    }
    .login-modal-input {
      width: 100%;
      padding: 14px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 18px;
      color: white;
      font-size: 15px;
      text-align: center;
      margin-bottom: 16px;
    }
    .otp-section {
      display: none;
    }
    .otp-section.show {
      display: block;
    }
    .login-modal-btn {
      width: 100%;
      background: linear-gradient(135deg, #D4AF37, #FF8C00);
      border: none;
      padding: 14px;
      border-radius: 18px;
      font-weight: 700;
      color: #050508;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .login-modal-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .resend-otp {
      background: none;
      border: none;
      color: #D4AF37;
      font-size: 12px;
      cursor: pointer;
      margin-top: 10px;
    }
    .timer-text {
      font-size: 11px;
      color: #888;
      margin-top: 10px;
    }
    .close-modal {
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      position: absolute;
      top: 20px;
      right: 20px;
    }
    .back-btn-modal {
      background: rgba(255,255,255,0.1);
      border: none;
      padding: 10px;
      border-radius: 18px;
      color: white;
      cursor: pointer;
      width: 100%;
      font-size: 13px;
      margin-top: 10px;
    }
    #recaptcha-container-modal {
      position: fixed;
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
    }
  </style>
</head>
<body>

<div class="floating-cart" id="floatingCart">
  <div class="cart-icon-container">
    <i class="fas fa-shopping-cart"></i>
    <span class="cart-count" id="cartCount">0</span>
  </div>
</div>

<div class="overlay" id="cartOverlay"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h3><i class="fas fa-shopping-bag"></i> Your Cart</h3>
    <button class="close-cart" id="closeCartBtn">&times;</button>
  </div>
  <div class="cart-items" id="cartItems"><div class="empty-cart">🛒 Your cart is empty</div></div>
  <div class="cart-footer">

<script>
  // ========== 🔥 FIREBASE CONFIGURATION - NEW CONFIG ==========
  const firebaseConfig = {
    apiKey: "AIzaSyCBZuwN4SKkXX1fEriYEwWDyTm-3uZnrKI",
    authDomain: "nexi-53897.firebaseapp.com",
    projectId: "nexi-53897",
    storageBucket: "nexi-53897.firebasestorage.app",
    messagingSenderId: "337349382612",
    appId: "1:337349382612:web:ae3c9b3d0fbf69f0e38641",
    measurementId: "G-W6N519LBPH"
  };
  
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch(err => console.log("Persistence:", err));
  
  let allProducts = [];
  let currentProductId = null;
  let currentProduct = null;
  let quantity = 1;
  let selectedSize = null;
  let selectedColor = null;
  let selectedCombo = null;
  let currentSlide = 0;
  let slideInterval = null;
  let cart = JSON.parse(localStorage.getItem('vedantaCart')) || [];
  let unsubscribeProduct = null;
  
  // Login Modal Variables
  let modalRecaptchaVerifier = null;
  let modalConfirmationResult = null;
  let pendingBuyProduct = null;
  let modalCountdownTimer = null;
  
  // ========== CHECK IF USER HAS SAVED ADDRESS ==========
  async function checkUserHasSavedAddress() {
    const currentUser = JSON.parse(localStorage.getItem('vedantaUser'));
    
    if (!currentUser || !currentUser.uid) {
      return false;
    }
    
    try {
      const addrSnapshot = await db.collection('addresses')
        .where('userId', '==', currentUser.uid)
        .limit(1)
        .get();
      
      if (!addrSnapshot.empty) {
        console.log("✅ User has saved address in addresses collection");
        return true;
      }
      
      const orderSnapshot = await db.collection('orders')
        .where('customerPhone', '==', currentUser.phone)
        .limit(1)
        .get();
      
      if (!orderSnapshot.empty) {
        console.log("✅ User has placed previous orders");
        return true;
      }
      
      console.log("❌ First time user - no saved address");
      return false;
    } catch(e) {
      console.error("Error checking saved address:", e);
      return false;
    }
  }
  
  // ========== SMART BUY NOW WITH POPUP LOGIN ==========
  async function buyNowWithSmartRedirect(product, qty, size, color, combo) {
    const currentUser = JSON.parse(localStorage.getItem('vedantaUser'));
    
    let finalPrice = product.price;
    let finalQty = qty;
    let comboInfo = null;
    let comboMultiplier = 1;
    
    if (combo) {
      finalPrice = combo.price / combo.quantity;
      comboInfo = `${combo.quantity} for ₹${combo.price}`;
      finalQty = combo.quantity;
      comboMultiplier = combo.quantity;
    }
    
    const tempCart = [{ 
      id: product.id, 
      name: product.name, 
      price: finalPrice, 
      quantity: finalQty, 
      size: size || 'Default', 
      color: color || '', 
      combo: comboInfo,
      isCombo: !!combo,
      comboMultiplier: comboMultiplier
    }];
    localStorage.setItem('vedantaCart', JSON.stringify(tempCart));
    
    if (currentUser && currentUser.uid) {
      // User already logged in, check saved address
      const hasSavedAddress = await checkUserHasSavedAddress();
      if (hasSavedAddress) {
        showToast(`💳 Redirecting to checkout (Saved address available)`);
        setTimeout(() => { window.location.href = 'secure-checkout2.html'; }, 300);
      } else {
        showToast(`💳 Proceeding to checkout with ${product.name}`);
        setTimeout(() => { window.location.href = 'secure-checkout.html'; }, 300);
      }
    } else {
      // User not logged in, show popup login
      pendingBuyProduct = product;
      openLoginModal();
    }
  }
  
  // ========== LOGIN MODAL FUNCTIONS ==========
  function setupModalRecaptcha() {
    return new Promise((resolve, reject) => {
      if (modalRecaptchaVerifier) {
        modalRecaptchaVerifier.clear();
      }
      try {
        modalRecaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container-modal', {
          size: 'invisible',
          callback: () => resolve(true)
        });
        resolve(true);
      } catch(e) {
        reject(e);
      }
    });
  }
  
  async function modalSendOTP() {
    const phoneInput = document.getElementById('modalPhoneInput');
    const phone = phoneInput.value.trim();
    const sendBtn = document.getElementById('modalSendOtpBtn');
    
    if (!phone || phone.length < 10) {
      showToast('❌ Please enter valid phone number', true);
      return;
    }
    
    const formattedPhone = formatPhoneNumber(phone);
    
    sendBtn.disabled = true;
    sendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
    
    try {
      await setupModalRecaptcha();
      modalConfirmationResult = await auth.signInWithPhoneNumber(formattedPhone, modalRecaptchaVerifier);
      showToast('✅ OTP sent successfully!');
      document.getElementById('modalPhoneSection').style.display = 'none';
      document.getElementById('modalOtpSection').classList.add('show');
      startModalTimer();
    } catch(error) {
      console.error("Error sending OTP:", error);
      let errorMsg = 'Failed to send OTP';
      if (error.code === 'auth/invalid-phone-number') errorMsg = 'Invalid phone number';
      else if (error.code === 'auth/too-many-requests') errorMsg = 'Too many requests. Try later';
      showToast(errorMsg, true);
    } finally {
      sendBtn.disabled = false;
      sendBtn.innerHTML = 'Send OTP';
    }
  }
  
  function startModalTimer() {
    let timeLeft = 60;
    const timerSpan = document.getElementById('modalTimer');
    const resendBtn = document.getElementById('modalResendBtn');
    
    if (modalCountdownTimer) clearInterval(modalCountdownTimer);
    
    modalCountdownTimer = setInterval(() => {
      if (timeLeft <= 0) {
        clearInterval(modalCountdownTimer);
        if (timerSpan) timerSpan.textContent = '';
        if (resendBtn) {
          resendBtn.style.display = 'inline-block';
          resendBtn.disabled = false;
        }
      } else {
        if (timerSpan) timerSpan.textContent = `Resend available in ${timeLeft}s`;
        if (resendBtn) resendBtn.style.display = 'none';
        timeLeft--;
      }
    }, 1000);
  }
  
  async function modalVerifyOTP() {
    const otpInput = document.getElementById('modalOtpInput');
    const otp = otpInput.value.trim();
    const verifyBtn = document.getElementById('modalVerifyBtn');
    
    if (!otp || otp.length < 6) {
      showToast('❌ Please enter 6-digit OTP', true);
      return;
    }
    
    verifyBtn.disabled = true;
    verifyBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Verifying...';
    
    try {
      const result = await modalConfirmationResult.confirm(otp);
      const user = result.user;
      
      const userData = {
        uid: user.uid,
        phone: user.phoneNumber,
        name: `User${user.phoneNumber.slice(-4)}`,
        email: `${user.uid}@vedanta.com`,
        joinDate: new Date().toISOString()
      };
      
      localStorage.setItem('vedantaUser', JSON.stringify(userData));
      await db.collection('users').doc(user.uid).set(userData, { merge: true });
      
      showToast(`✅ Welcome! Redirecting to checkout...`);
      closeLoginModal();
      
      // After successful login, check if user has saved address
      const hasSavedAddress = await checkUserHasSavedAddress();
      if (hasSavedAddress) {
        setTimeout(() => { window.location.href = 'secure-checkout2.html'; }, 500);
      } else {
        setTimeout(() => { window.location.href = 'secure-checkout.html'; }, 500);
      }
      
    } catch(error) {
      console.error("OTP verification error:", error);
      let errorMsg = 'Invalid OTP. Please try again.';
      if (error.code === 'auth/code-expired') errorMsg = 'OTP expired. Request new OTP.';
      else if (error.code === 'auth/invalid-verification-code') errorMsg = 'Invalid OTP code';
      showToast(errorMsg, true);
    } finally {
      verifyBtn.disabled = false;
      verifyBtn.innerHTML = 'Verify & Continue';
    }
  }
  
  async function modalResendOTP() {
    const phoneInput = document.getElementById('modalPhoneInput');
    const phone = phoneInput.value.trim();
    const formattedPhone = formatPhoneNumber(phone);
    
    const resendBtn = document.getElementById('modalResendBtn');
    resendBtn.disabled = true;
    resendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
    
    try {
      modalConfirmationResult = await auth.signInWithPhoneNumber(formattedPhone, modalRecaptchaVerifier);
      showToast('✅ OTP resent!');
      startModalTimer();
    } catch(error) {
      showToast('Failed to resend OTP', true);
    }
    resendBtn.disabled = false;
    resendBtn.innerHTML = 'Resend OTP';
  }
  
  function modalBackToPhone() {
    document.getElementById('modalPhoneSection').style.display = 'block';
    document.getElementById('modalOtpSection').classList.remove('show');
    document.getElementById('modalOtpInput').value = '';
    if (modalCountdownTimer) clearInterval(modalCountdownTimer);
  }
  
  function openLoginModal() {
    const modal = document.getElementById('loginModal');
    document.getElementById('modalPhoneSection').style.display = 'block';
    document.getElementById('modalOtpSection').classList.remove('show');
    document.getElementById('modalPhoneInput').value = '';
    document.getElementById('modalOtpInput').value = '';
    if (modalCountdownTimer) clearInterval(modalCountdownTimer);
    modal.classList.add('show');
  }
  
  function closeLoginModal() {
    const modal = document.getElementById('loginModal');
    modal.classList.remove('show');
    if (modalCountdownTimer) clearInterval(modalCountdownTimer);
  }
  
  function formatPhoneNumber(number) {
    let num = number.trim();
    if (!num.startsWith('+')) {
      if (num.startsWith('0')) {
        num = '+91' + num.substring(1);
      } else if (num.length === 10) {
        num = '+91' + num;
      }
    }
    return num;
  }
  
  // ========== CART FUNCTIONS ==========
  function saveCart() { localStorage.setItem('vedantaCart', JSON.stringify(cart)); updateCartUI(); }
  
  function addToCart(product, qty, size, color, combo = null) {
    let finalPrice = product.price;
    let comboInfo = null;
    let comboQtyMultiplier = 1;
    
    if (combo) {
      finalPrice = combo.price / combo.quantity;
      comboInfo = `${combo.quantity} for ₹${combo.price}`;
      comboQtyMultiplier = combo.quantity;
      qty = combo.quantity;
    }
    
    const existingIndex = cart.findIndex(item => 
      item.id === product.id && 
      item.size === size && 
      item.color === color && 
      item.combo === comboInfo
    );
    
    if (existingIndex !== -1) {
      if (combo) {
        cart[existingIndex].quantity += combo.quantity;
      } else {
        cart[existingIndex].quantity += qty;
      }
    } else {
      cart.push({ 
        id: product.id, 
        name: product.name, 
        price: finalPrice, 
        quantity: qty, 
        size: size || 'Default', 
        color: color || '', 
        combo: comboInfo,
        isCombo: !!combo,
        comboMultiplier: comboQtyMultiplier
      });
    }
    saveCart();
    showToast(combo ? `🎉 Combo Pack: ${combo.quantity} items for ₹${combo.price} added!` : `🛍️ ${product.name} added!`);
    if (combo) selectedCombo = null;
  }
  
  function updateCartQuantity(index, newQuantity) {
    const item = cart[index];
    if (item.isCombo && item.comboMultiplier) {
      const currentMultiples = item.quantity / item.comboMultiplier;
      const newMultiples = newQuantity / item.comboMultiplier;
      if (newMultiples < 1) {
        cart.splice(index, 1);
      } else {
        item.quantity = newMultiples * item.comboMultiplier;
      }
    } else {
      if (newQuantity < 1) {
        cart.splice(index, 1);
      } else {
        cart[index].quantity = newQuantity;
      }
    }
    saveCart();
  }
  
  function removeFromCart(index) { cart.splice(index, 1); saveCart(); }
  
  function updateCartUI() {
    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    const cartCountEl = document.getElementById('cartCount');
    if (cartCountEl) cartCountEl.innerText = totalItems;
    const cartItemsDiv = document.getElementById('cartItems');
    const cartTotalSpan = document.getElementById('cartTotal');
    if (cart.length === 0) {
      if (cartItemsDiv) cartItemsDiv.innerHTML = '<div class="empty-cart">🛒 Your cart is empty</div>';
      if (cartTotalSpan) cartTotalSpan.innerText = '₹0';
      return;
    }
    let total = 0;
    cartItemsDiv.innerHTML = '';
    cart.forEach((item, idx) => {
      const itemTotal = item.price * item.quantity;
      total += itemTotal;
      cartItemsDiv.innerHTML += `<div class="cart-item">
        <div class="cart-item-info">
          <h4>${escapeHtml(item.name)} ${item.size ? `(${item.size})` : ''} ${item.color ? `- ${item.color}` : ''}</h4>
          ${item.combo ? `<span class="combo-tag"><i class="fas fa-gift"></i> ${escapeHtml(item.combo)}</span>` : ''}
          <p>₹${item.price} x ${item.quantity} = ₹${itemTotal}</p>
        </div>
        <div class="cart-item-actions">
          <button class="cart-qty-btn" data-action="decr" data-index="${idx}">-</button>
          <span class="cart-qty">${item.quantity}</span>
          <button class="cart-qty-btn" data-action="incr" data-index="${idx}">+</button>
          <button class="cart-item-remove" data-index="${idx}"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
    });
    cartItemsDiv.querySelectorAll('.cart-qty-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.index);
        const action = btn.dataset.action;
        const item = cart[idx];
        if (action === 'incr') {
          if (item.isCombo && item.comboMultiplier) {
            updateCartQuantity(idx, item.quantity + item.comboMultiplier);
          } else {
            updateCartQuantity(idx, item.quantity + 1);
          }
        } else if (action === 'decr') {
          if (item.isCombo && item.comboMultiplier) {
            updateCartQuantity(idx, item.quantity - item.comboMultiplier);
          } else {
            updateCartQuantity(idx, item.quantity - 1);
          }
        }
      });
    });
    cartItemsDiv.querySelectorAll('.cart-item-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeFromCart(parseInt(btn.dataset.index));
      });
    });
    if (cartTotalSpan) cartTotalSpan.innerText = `₹${total}`;
  }
  
  function openCart() { document.getElementById('cartSidebar').classList.add('open'); document.getElementById('cartOverlay').classList.add('show'); }
  function closeCart() { document.getElementById('cartSidebar').classList.remove('open'); document.getElementById('cartOverlay').classList.remove('show'); }
  function showToast(msg, isError = false) { 
    const toast = document.getElementById('toast'); 
    toast.innerText = msg; 
    toast.style.background = isError ? '#F44336' : '#D4AF37';
    toast.style.color = isError ? 'white' : '#050508';
    toast.classList.add('show'); 
    setTimeout(() => toast.classList.remove('show'), 2500); 
  }
  function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m)); }
  
  function ensureProductFields(p) {
    if (!p.originalPrice) p.originalPrice = Math.round(p.price * 1.6);
    if (!p.rating) p.rating = 4.5;
    if (!p.reviewCount) p.reviewCount = 500;
    if (!p.fullDesc) p.fullDesc = "Premium quality product from Vedanta. Crafted with precision and care, this piece embodies luxury and elegance.";
    if (!p.sizes) p.sizes = [];
    if (!p.colors) p.colors = [];
    if (!p.combos) p.combos = [];
    if (!p.benefits) p.benefits = ["Premium Quality", "Handcrafted", "Made in India", "Eco-friendly"];
    if (!p.images) p.images = [];
    return p;
  }
  
  function getColorCode(colorName) {
    const colorMap = {
      'Red': '#FF0000', 'Crimson': '#DC143C', 'Maroon': '#800000',
      'Orange': '#FFA500', 'Gold': '#FFD700', 'Yellow': '#FFFF00',
      'Lime': '#32CD32', 'Green': '#008000', 'Teal': '#008080',
      'Cyan': '#00FFFF', 'Blue': '#0000FF', 'Navy': '#000080',
      'Purple': '#800080', 'Magenta': '#FF00FF', 'Pink': '#FF69B4',
      'HotPink': '#FF1493', 'Brown': '#8B4513', 'Black': '#000000',
      'White': '#FFFFFF', 'Silver': '#C0C0C0'
    };
    return colorMap[colorName] || '#D4AF37';
  }
  
  // ========== REAL-TIME PRODUCT LISTENER ==========
  function startRealTimeProductSync() {
    if (unsubscribeProduct) {
      unsubscribeProduct();
    }
    
    if (!currentProductId) return;
    
    const productRef = db.collection('products').doc(currentProductId);
    
    unsubscribeProduct = productRef.onSnapshot({
      includeMetadataChanges: true
    }, (docSnapshot) => {
      if (docSnapshot.exists) {
        const newData = docSnapshot.data();
        const updatedProduct = {
          id: docSnapshot.id,
          name: newData.name,
          price: newData.price,
          originalPrice: newData.originalPrice || Math.round(newData.price * 1.6),
          category: newData.category,
          badge: newData.badge || 'New',
          images: newData.images || [],
          sizes: newData.sizes || [],
          colors: newData.colors || [],
          combos: newData.combos || [],
          fullDesc: newData.fullDesc || "Premium quality product from Vedanta.",
          benefits: newData.benefits || ["Premium Quality", "Handcrafted", "Made in India"],
          rating: newData.rating || 4.5,
          reviewCount: newData.reviewCount || 500,
          status: newData.status
        };
        
        if (updatedProduct.status !== 'active') {
          showToast("⚠️ This product is no longer available");
          setTimeout(() => window.location.href = 'index.html', 2000);
          return;
        }
        
        const priceChanged = currentProduct && currentProduct.price !== updatedProduct.price;
        const nameChanged = currentProduct && currentProduct.name !== updatedProduct.name;
        
        if (priceChanged) showToast(`🔄 Price updated: ₹${updatedProduct.price.toLocaleString()}`);
        if (nameChanged) showToast(`🔄 Product name updated: ${updatedProduct.name}`);
        
        currentProduct = ensureProductFields(updatedProduct);
        
        const index = allProducts.findIndex(p => p.id == currentProductId);
        if (index !== -1) allProducts[index] = currentProduct;
        else allProducts.push(currentProduct);
        localStorage.setItem('vedantaProducts', JSON.stringify(allProducts));
        
        renderPageContent();
        console.log(`🔥 LIVE UPDATE: ${currentProduct.name} synced`);
      } else {
        showToast("❌ Product not found");
        setTimeout(() => window.location.href = 'index.html', 2000);
      }
    }, (error) => {
      console.error("Real-time listener error:", error);
    });
  }
  
  function loadAllProductsForRelated() {
    db.collection('products').where('status', '==', 'active').onSnapshot((snapshot) => {
      const products = [];
      snapshot.forEach(doc => {
        products.push({ id: doc.id, ...doc.data() });
      });
      if (products.length > 0) {
        allProducts = products;
        localStorage.setItem('vedantaProducts', JSON.stringify(allProducts));
        renderRelatedProducts();
      }
    });
  }
  
  function initSliderAfterRender() {
    const images = currentProduct.images || [];
    const totalSlides = images.length || 1;
    if (images.length <= 1) return;
    
    const slider = document.getElementById('imageSlider');
    const prevBtn = document.getElementById('prevSlide');
    const nextBtn = document.getElementById('nextSlide');
    const thumbnails = document.querySelectorAll('.thumbnail');
    
    if (!slider) return;
    
    function updateSlider(index) {
      if (index < 0) index = totalSlides - 1;
      if (index >= totalSlides) index = 0;
      currentSlide = index;
      if (slider) slider.style.transform = `translateX(-${currentSlide * 100}%)`;
      thumbnails.forEach((t, i) => i === currentSlide ? t.classList.add('active') : t.classList.remove('active'));
    }
    
    prevBtn?.addEventListener('click', () => updateSlider(currentSlide - 1));
    nextBtn?.addEventListener('click', () => updateSlider(currentSlide + 1));
    thumbnails.forEach((t, i) => t.addEventListener('click', () => updateSlider(i)));
    
    if (slideInterval) clearInterval(slideInterval);
    slideInterval = setInterval(() => updateSlider(currentSlide + 1), 5000);
  }
  
  function attachEventsAfterRender() {
    const sizeBtns = document.querySelectorAll('.size-btn');
    if (sizeBtns.length > 0) {
      sizeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          sizeBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedSize = btn.dataset.size;
        });
      });
      if (!selectedSize && sizeBtns[0]) {
        sizeBtns[0].classList.add('active');
        selectedSize = sizeBtns[0].dataset.size;
      }
    }
    
    const colorBtns = document.querySelectorAll('.color-btn');
    colorBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        colorBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedColor = btn.getAttribute('data-color');
        showToast(`🎨 ${selectedColor} selected`);
      });
    });
    if (colorBtns.length > 0 && !selectedColor) {
      colorBtns[0].classList.add('active');
      selectedColor = colorBtns[0].getAttribute('data-color');
    }
    
    const comboItems = document.querySelectorAll('.combo-item');
    comboItems.forEach(combo => {
      combo.addEventListener('click', (e) => {
        e.stopPropagation();
        const comboQty = parseInt(combo.getAttribute('data-combo-qty'));
        const comboPrice = parseInt(combo.getAttribute('data-combo-price'));
        
        if (selectedCombo && selectedCombo.quantity === comboQty && selectedCombo.price === comboPrice) {
          selectedCombo = null;
          combo.classList.remove('selected');
          const icon = combo.querySelector('.combo-select-icon i');
          if (icon) icon.className = 'fas fa-plus-circle';
          showToast(`✨ Combo offer removed!`);
        } else {
          comboItems.forEach(c => {
            c.classList.remove('selected');
            const icon = c.querySelector('.combo-select-icon i');
            if (icon) icon.className = 'fas fa-plus-circle';
          });
          combo.classList.add('selected');
          const icon = combo.querySelector('.combo-select-icon i');
          if (icon) icon.className = 'fas fa-check-circle';
          selectedCombo = { quantity: comboQty, price: comboPrice };
          showToast(`🎉 Combo selected! ${comboQty} items for ₹${comboPrice}`);
        }
      });
    });
    
    let qty = 1;
    const qtyMinus = document.getElementById('qtyMinus');
    const qtyPlus = document.getElementById('qtyPlus');
    const qtyInput = document.getElementById('qtyInput');
    if (qtyMinus && qtyPlus && qtyInput) {
      qtyMinus.addEventListener('click', () => { if (qty > 1) { qty--; qtyInput.value = qty; } });
      qtyPlus.addEventListener('click', () => { qty++; qtyInput.value = qty; });
    }
    
    document.getElementById('addToCartBtn')?.addEventListener('click', () => { 
      const currentQty = parseInt(document.getElementById('qtyInput')?.value || 1);
      addToCart(currentProduct, currentQty, selectedSize, selectedColor, selectedCombo); 
      if (selectedCombo) selectedCombo = null;
    });
    
    // UPDATED: Buy Now button uses smart redirect with popup login
    document.getElementById('buyNowBtn')?.addEventListener('click', () => { 
      const currentQty = parseInt(document.getElementById('qtyInput')?.value || 1);
      buyNowWithSmartRedirect(currentProduct, currentQty, selectedSize, selectedColor, selectedCombo); 
    });
  }
  
  function renderImageSlider() {
    const images = currentProduct.images || [];
    const hasImages = images.length > 0;
    let slidesHtml = hasImages ? images.map(img => `<div class="slide"><img src="${img}" loading="lazy"></div>`).join('') : `<div class="slide"><i class="fas ${currentProduct.icon || 'fa-gem'}"></i></div>`;
    let thumbnailsHtml = hasImages ? images.map((img, idx) => `<div class="thumbnail ${idx === currentSlide ? 'active' : ''}" data-index="${idx}"><img src="${img}"></div>`).join('') : `<div class="thumbnail active"><i class="fas ${currentProduct.icon || 'fa-gem'}"></i></div>`;
    
    return `<div class="product-gallery">
      <div class="main-image-container">
        <div class="badge">${currentProduct.badge || 'New'}</div>
        <div class="main-image-slider" id="imageSlider" style="transform: translateX(-${currentSlide * 100}%);">${slidesHtml}</div>
        ${hasImages && images.length > 1 ? `<button class="slider-btn slider-prev" id="prevSlide"><i class="fas fa-chevron-left"></i></button><button class="slider-btn slider-next" id="nextSlide"><i class="fas fa-chevron-right"></i></button>` : ''}
      </div>
      <div class="thumbnail-list" id="thumbnailList">${thumbnailsHtml}</div>
    </div>`;
  }
  
  function renderColors() {
    const colors = currentProduct.colors || [];
    if (colors.length === 0) return '';
    
    return `<div class="color-section">
      <div class="color-title"><i class="fas fa-palette"></i> Select Color:</div>
      <div class="color-options" id="colorOptions">
        ${colors.map(color => {
          const colorName = typeof color === 'object' ? color.name : color;
          const colorCode = (typeof color === 'object' && color.code) ? color.code : getColorCode(colorName);
          return `<div class="color-btn ${selectedColor === colorName ? 'active' : ''}" data-color="${colorName}">
            <div class="color-circle" style="background: ${colorCode};"></div>
            <span class="color-name">${colorName}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  
  function renderComboOffers() {
    const combos = currentProduct.combos || [];
    if (combos.length === 0) return '';
    
    return `<div class="combo-section">
      <div class="combo-title"><i class="fas fa-gift"></i> 🔥 SPECIAL COMBO OFFERS</div>
      <div class="combo-list" id="comboList">
        ${combos.map((combo, idx) => {
          const savePercent = Math.round(((combo.quantity * currentProduct.price) - combo.price) / (combo.quantity * currentProduct.price) * 100);
          const isSelected = selectedCombo && selectedCombo.quantity === combo.quantity && selectedCombo.price === combo.price;
          return `<div class="combo-item ${isSelected ? 'selected' : ''}" data-combo-index="${idx}" data-combo-qty="${combo.quantity}" data-combo-price="${combo.price}">
            <div class="combo-item-info">
              <div class="combo-quantity"><i class="fas fa-boxes"></i> Buy ${combo.quantity} Items</div>
              <div class="combo-save">🔥 Save ${savePercent}%</div>
            </div>
            <div class="combo-price">
              <div class="price-big">₹${combo.price}</div>
              <div class="per-piece">₹${Math.round(combo.price / combo.quantity)}/piece</div>
            </div>
            <div class="combo-select-icon"><i class="fas ${isSelected ? 'fa-check-circle' : 'fa-plus-circle'}"></i></div>
            <div class="combo-badge">BEST VALUE</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  
  function renderRelatedProducts() {
    const container = document.getElementById('relatedProducts');
    if (!container) return;
    const related = (allProducts || []).filter(p => p.category === currentProduct?.category && p.id != currentProduct?.id && p.status === 'active').slice(0, 4);
    if (related.length === 0) { container.innerHTML = '<p style="color:#888; text-align:center;">No related products</p>'; return; }
    container.innerHTML = related.map(p => {
      const hasImage = p.images && p.images.length > 0;
      return `<div class="related-card" data-product-id="${p.id}">
        <div class="related-img">${hasImage ? `<img src="${p.images[0]}" loading="lazy">` : `<i class="fas ${p.icon || 'fa-gem'}"></i>`}</div>
        <div class="related-name">${escapeHtml(p.name)}</div>
        <div class="related-price">₹${p.price.toLocaleString()}</div>
      </div>`;
    }).join('');
    document.querySelectorAll('.related-card').forEach(card => {
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        const productId = card.getAttribute('data-product-id');
        localStorage.setItem('vedanta_selected_product_id', productId);
        window.location.href = window.location.pathname + '?id=' + productId;
      });
    });
  }
  
  function renderPageContent() {
    if (!currentProduct) return;
    
    const discountPercent = Math.round(((currentProduct.originalPrice - currentProduct.price) / currentProduct.originalPrice) * 100);
    const galleryHtml = renderImageSlider();
    const hasSizes = currentProduct.sizes && currentProduct.sizes.length > 0;
    const sizeHtml = hasSizes ? `<div class="size-section"><div class="size-title"><i class="fas fa-tshirt"></i> Select Size:</div><div class="size-options" id="sizeOptions">${currentProduct.sizes.map(size => `<button class="size-btn ${selectedSize === size ? 'active' : ''}" data-size="${size}">${size}</button>`).join('')}</div></div>` : '';
    const colorsHtml = renderColors();
    const combosHtml = renderComboOffers();
    const benefitsHtml = `<div class="features-list">${(currentProduct.benefits || []).map(b => `<div class="feature-item"><i class="fas fa-check-circle"></i><span>${escapeHtml(b)}</span></div>`).join('')}</div>`;
    
    const html = `<div class="header">
      <div class="logo"><h1>VEDANTA</h1></div>
      <div class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back</div>
    </div>
    ${galleryHtml}
    <div class="product-info">
      <div class="product-brand">VEDANTA EXCLUSIVE</div>
      <div class="product-name">${escapeHtml(currentProduct.name)}</div>
      <div class="rating"><div class="stars">★★★★★</div><div class="review-count">${currentProduct.reviewCount} reviews</div></div>
      <div class="price-section"><span class="current-price">₹${currentProduct.price.toLocaleString()}</span><span class="original-price">₹${currentProduct.originalPrice.toLocaleString()}</span><span class="discount">${discountPercent}% OFF</span></div>
      ${sizeHtml}
      ${colorsHtml}
      ${combosHtml}
      <div class="product-detail-section"><div class="detail-title"><i class="fas fa-align-left"></i> Product Details</div><div class="full-description">${escapeHtml(currentProduct.fullDesc)}</div></div>
      ${benefitsHtml}
      <div class="offer-tag"><i class="fas fa-tags"></i> Free Shipping • COD Available • Easy Returns</div>
      <div class="quantity-selector"><button class="qty-btn" id="qtyMinus">-</button><input type="text" class="qty-input" id="qtyInput" value="1" readonly><button class="qty-btn" id="qtyPlus">+</button></div>
      <div class="action-buttons"><button class="add-cart-btn" id="addToCartBtn"><i class="fa-regular fa-bag-shopping"></i> ADD TO CART</button><button class="buy-btn" id="buyNowBtn"><i class="fas fa-bolt"></i> BUY NOW</button></div>
    </div>
    <div class="section-title"><span></span> You May Also Like</div>
    <div class="related-products" id="relatedProducts"></div>
    <div class="section-title"><span></span> Customer Reviews</div>
    <div class="reviews-section">
      <div class="review-card"><div class="reviewer"><i class="fas fa-user-circle"></i> Priya Sharma <span style="color:#4CAF50;">✓ Verified</span></div><div class="review-stars-small">★★★★★</div><div class="review-text">"Absolutely stunning product! The quality is amazing."</div><div class="review-date">15 Mar 2025</div></div>
      <div class="review-card"><div class="reviewer"><i class="fas fa-user-circle"></i> Amit Kumar <span style="color:#4CAF50;">✓ Verified</span></div><div class="review-stars-small">★★★★★</div><div class="review-text">"Worth every penny. Premium finish and fast delivery."</div><div class="review-date">10 Mar 2025</div></div>
    </div>`;
    
    document.getElementById('app').innerHTML = html;
    
    setTimeout(() => {
      initSliderAfterRender();
      attachEventsAfterRender();
      renderRelatedProducts();
    }, 50);
  }
  
  async function initialize() {
    const urlParams = new URLSearchParams(window.location.search);
    currentProductId = urlParams.get('id') || localStorage.getItem('vedanta_selected_product_id') || "1";
    
    const cached = localStorage.getItem('vedantaProducts');
    if (cached) {
      allProducts = JSON.parse(cached);
      const cachedProduct = allProducts.find(p => p.id == currentProductId);
      if (cachedProduct && cachedProduct.status === 'active') {
        currentProduct = ensureProductFields(cachedProduct);
        renderPageContent();
      }
    }
    
    loadAllProductsForRelated();
    startRealTimeProductSync();
    
    if (sessionStorage.getItem('scrollToTop') === 'true') {
      sessionStorage.removeItem('scrollToTop');
      window.scrollTo(0, 0);
    }
  }
  
  function attachCartEvents() {
    document.getElementById('floatingCart')?.addEventListener('click', openCart);
    document.getElementById('closeCartBtn')?.addEventListener('click', closeCart);
    document.getElementById('cartOverlay')?.addEventListener('click', closeCart);
    document.getElementById('checkoutBtn')?.addEventListener('click', () => { 
      if (cart.length === 0) {
        showToast('Cart is empty!');
      } else {
        // Check if user is logged in for cart checkout
        const currentUser = JSON.parse(localStorage.getItem('vedantaUser'));
        if (currentUser && currentUser.uid) {
          // Already logged in, check saved address
          checkUserHasSavedAddress().then(hasSavedAddress => {
            if (hasSavedAddress) {
              window.location.href = 'secure-checkout2.html';
            } else {
              window.location.href = 'secure-checkout.html';
            }
          });
        } else {
          // Not logged in, show login modal first
          pendingBuyProduct = null;
          openLoginModal();
        }
      }
    });
  }
  
  // Modal Event Listeners
  document.getElementById('modalSendOtpBtn')?.addEventListener('click', modalSendOTP);
  document.getElementById('modalVerifyBtn')?.addEventListener('click', modalVerifyOTP);
  document.getElementById('modalResendBtn')?.addEventListener('click', modalResendOTP);
  document.getElementById('modalBackBtn')?.addEventListener('click', modalBackToPhone);
  document.getElementById('closeModalBtn')?.addEventListener('click', closeLoginModal);
  
  document.getElementById('loginModal')?.addEventListener('click', (e) => {
    if (e.target === document.getElementById('loginModal')) {
      closeLoginModal();
    }
  });
  
  initialize();
  updateCartUI();
  attachCartEvents();
</script>
</body>
</html>
