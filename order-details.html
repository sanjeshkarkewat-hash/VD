<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Order Details - Vedanta</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Space Grotesk', sans-serif; background: #050508; color: #FFFFFF; overflow-x: hidden; min-height: 100vh; padding-bottom: 20px; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 20% 40%, rgba(212,175,55,0.08), transparent 70%); pointer-events: none; z-index: -1; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(10,10,18,0.98); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212,175,55,0.2); position: sticky; top: 0; z-index: 100; }
        .logo h1 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #FFF8E7, #D4AF37, #FF8C00); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .back-btn { background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.3); padding: 6px 14px; border-radius: 40px; color: #D4AF37; text-decoration: none; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .container { max-width: 600px; margin: 0 auto; padding: 12px; }
        .skeleton-card { background: rgba(15,15,22,0.6); border-radius: 20px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(212,175,55,0.1); }
        .skeleton-title { height: 20px; width: 40%; background: linear-gradient(90deg, #1a1a24 25%, #2a2a35 50%, #1a1a24 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; margin-bottom: 16px; }
        .skeleton-line { height: 12px; background: linear-gradient(90deg, #1a1a24 25%, #2a2a35 50%, #1a1a24 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; margin: 10px 0; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .status-bar { background: rgba(15,15,22,0.6); border-radius: 20px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(212,175,55,0.2); }
        .status-steps { display: flex; justify-content: space-between; gap: 4px; margin: 16px 0; overflow-x: auto; }
        .step { text-align: center; flex: 1; min-width: 55px; }
        .step-icon { width: 36px; height: 36px; background: #1A1A1A; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; border: 2px solid rgba(212,175,55,0.3); transition: all 0.3s ease; }
        .step.completed .step-icon { background: #4CAF50; border-color: #4CAF50; }
        .step.active .step-icon { background: #D4AF37; border-color: #D4AF37; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(212,175,55,0.4); } 70% { box-shadow: 0 0 0 8px rgba(212,175,55,0); } 100% { box-shadow: 0 0 0 0 rgba(212,175,55,0); } }
        .step-icon i { font-size: 14px; color: #050508; }
        .step-label { font-size: 9px; color: #888; white-space: nowrap; }
        .step.completed .step-label { color: #4CAF50; }
        .step.active .step-label { color: #D4AF37; font-weight: 600; }
        .info-card { background: rgba(15,15,22,0.6); border-radius: 20px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(212,175,55,0.2); }
        .card-title { font-size: 15px; font-weight: 700; color: #D4AF37; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #888; font-size: 12px; }
        .info-value { color: #FFFFFF; font-weight: 500; font-size: 12px; text-align: right; word-break: break-word; max-width: 60%; }
        .price-highlight { color: #D4AF37; font-weight: 700; }
        .order-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .order-item-img { width: 70px; height: 70px; background: #0E0E14; border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .order-item-img img { width: 100%; height: 100%; object-fit: cover; }
        .order-item-img i { font-size: 28px; color: #D4AF37; }
        .order-item-info { flex: 1; }
        .order-item-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .item-attributes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
        .size-badge, .color-badge { background: rgba(212,175,55,0.15); padding: 2px 8px; border-radius: 20px; font-size: 10px; color: #D4AF37; display: inline-flex; align-items: center; gap: 4px; }
        .color-dot-small { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .custom-badge-order { background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(255,140,0,0.1)); padding: 3px 10px; border-radius: 20px; font-size: 9px; color: #D4AF37; display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; }
        .order-item-price { text-align: right; min-width: 85px; }
        .final-price { font-weight: 700; color: #D4AF37; font-size: 14px; }
        .order-item-qty { font-size: 10px; color: #888; margin-top: 4px; }
        .total-section { margin-top: 12px; padding-top: 12px; border-top: 2px solid rgba(212,175,55,0.3); }
        .total-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
        .grand-total { font-size: 16px; font-weight: 800; color: #D4AF37; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
        .action-buttons { display: flex; gap: 10px; margin-top: 16px; flex-direction: column; position: sticky; bottom: 10px; background: rgba(5,5,8,0.95); backdrop-filter: blur(10px); padding: 12px; border-radius: 20px; border: 1px solid rgba(212,175,55,0.2); }
        .btn-primary, .btn-secondary { width: 100%; padding: 12px; border-radius: 50px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.2s; border: none; }
        .btn-primary { background: linear-gradient(135deg, #D4AF37, #FF8C00); color: #050508; }
        .btn-secondary { background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.5); color: #D4AF37; }
        .btn-cancel { background: rgba(244,67,54,0.15); border: 1px solid rgba(244,67,54,0.5); color: #F44336; }
        .btn-return { background: rgba(255,152,0,0.15); border: 1px solid rgba(255,152,0,0.5); color: #FF9800; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal.show { display: flex; }
        .modal-content { background: rgba(15,15,22,0.98); backdrop-filter: blur(15px); border-radius: 24px; padding: 24px; max-width: 320px; width: 100%; text-align: center; border: 1px solid rgba(212,175,55,0.3); }
        .modal-content i { font-size: 48px; color: #F44336; margin-bottom: 16px; }
        .modal-content h3 { font-size: 20px; margin-bottom: 8px; }
        .modal-content p { color: #888; font-size: 13px; margin-bottom: 20px; }
        .modal-buttons { display: flex; gap: 12px; }
        .modal-btn { flex: 1; padding: 10px; border-radius: 30px; font-weight: 700; cursor: pointer; border: none; font-size: 13px; }
        .modal-confirm { background: #F44336; color: white; }
        .modal-cancel { background: rgba(255,255,255,0.1); color: white; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #D4AF37; color: #050508; padding: 10px 20px; border-radius: 50px; font-weight: bold; z-index: 10000; display: none; font-size: 12px; text-align: center; max-width: 90%; }
        .toast.show { display: block; animation: fadeInOut 2s ease; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateX(-50%) translateY(10px); } 15% { opacity: 1; transform: translateX(-50%) translateY(0); } 100% { opacity: 0; transform: translateX(-50%) translateY(-10px); } }
        .error-state { text-align: center; padding: 60px 20px; }
        .cancelled-banner { text-align: center; padding: 12px; background: rgba(244,67,54,0.1); border-radius: 14px; margin: 12px 0; }
        .return-info { background: rgba(255,152,0,0.1); border: 1px solid rgba(255,152,0,0.3); border-radius: 14px; padding: 10px; margin-top: 10px; font-size: 11px; color: #FF9800; }
        .days-left-badge { background: #4CAF50; color: white; padding: 2px 8px; border-radius: 20px; font-size: 10px; margin-left: 8px; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo"><h1>VEDANTA</h1></div>
    <a href="booking.html" class="back-btn"><i class="fas fa-arrow-left"></i> Bookings</a>
</div>

<div class="container" id="app">
    <div class="skeleton-card"><div class="skeleton-title"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>
    <div class="skeleton-card"><div class="skeleton-title"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>
</div>

<div class="modal" id="cancelModal">
    <div class="modal-content">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>Cancel Order?</h3>
        <p>Are you sure you want to cancel this order? This action cannot be undone.</p>
        <div class="modal-buttons">
            <button class="modal-btn modal-cancel" id="modalCancelBtn">No, Go Back</button>
            <button class="modal-btn modal-confirm" id="modalConfirmBtn">Yes, Cancel</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCBZuwN4SKkXX1fEriYEwWDyTm-3uZnrKI",
        authDomain: "nexi-53897.firebaseapp.com",
        projectId: "nexi-53897",
        storageBucket: "nexi-53897.firebasestorage.app",
        messagingSenderId: "337349382612",
        appId: "1:337349382612:web:ae3c9b3d0fbf69f0e38641"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    let currentOrder = null;
    let productsCache = new Map();
    
    function getColorCode(colorName) {
        if (!colorName || colorName === 'Not Selected') return '#D4AF37';
        const colorMap = {
            'Red': '#FF0000', 'Crimson': '#DC143C', 'Maroon': '#800000',
            'Orange': '#FFA500', 'Gold': '#FFD700', 'Yellow': '#FFFF00',
            'Lime': '#32CD32', 'Green': '#008000', 'Teal': '#008080',
            'Cyan': '#00FFFF', 'Blue': '#0000FF', 'Navy': '#000080',
            'Purple': '#800080', 'Magenta': '#FF00FF', 'Pink': '#FF69B4',
            'HotPink': '#FF1493', 'Brown': '#8B4513', 'Black': '#000000',
            'White': '#FFFFFF', 'Silver': '#C0C0C0', 'Lavender': '#E6E6FA',
            'Peach': '#FFDAB9', 'Mint': '#98FB98', 'Coral': '#FF7F50',
            'Turquoise': '#40E0D0', 'Indigo': '#4B0082', 'Violet': '#EE82EE',
            'Rose': '#FF007F', 'Chocolate': '#D2691E', 'Khaki': '#F0E68C',
            'Salmon': '#FA8072', 'Plum': '#DDA0DD', 'Tan': '#D2B48C',
            'Beige': '#F5F5DC', 'Ivory': '#FFFFF0', 'Linen': '#FAF0E6'
        };
        return colorMap[colorName] || '#D4AF37';
    }
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.background = isError ? '#F44336' : '#D4AF37';
        toast.style.color = isError ? 'white' : '#050508';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    
    function getOrderIdFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('orderId');
    }
    
    // 🔥 FIXED: Get product image - supports BOTH regular and custom orders
    function getProductImageForItem(item, order) {
        // For CUSTOM orders: show custom design image
        if (order && order.isCustomized === true) {
            if (order.frontDesignImage) return order.frontDesignImage;
            if (order.customDesignImage) return order.customDesignImage;
        }
        if (item && item.isCustomized === true) {
            if (item.frontDesignImage) return item.frontDesignImage;
            if (item.designImage) return item.designImage;
        }
        if (order && (order.frontDesignImage || order.backDesignImage)) {
            return order.frontDesignImage || order.backDesignImage;
        }
        
        // For REGULAR orders: get product image from products cache
        let productName = item?.name || '';
        
        if (productName) {
            const lowerName = productName.toLowerCase();
            // Common product types
            if (lowerName.includes('sweatshirt')) {
                const prod = productsCache.get('sweatshirt');
                if (prod && prod.images && prod.images[0]) return prod.images[0];
            }
            if (lowerName.includes('regular fit')) {
                const prod = productsCache.get('regular fit');
                if (prod && prod.images && prod.images[0]) return prod.images[0];
            }
            if (lowerName.includes('polo')) {
                const prod = productsCache.get('polo');
                if (prod && prod.images && prod.images[0]) return prod.images[0];
            }
            if (lowerName.includes('oversized')) {
                const prod = productsCache.get('oversized');
                if (prod && prod.images && prod.images[0]) return prod.images[0];
            }
            if (lowerName.includes('hoodie')) {
                const prod = productsCache.get('hoodie');
                if (prod && prod.images && prod.images[0]) return prod.images[0];
            }
            
            // Try exact match from cache
            const cached = productsCache.get(productName);
            if (cached && cached.images && cached.images[0]) return cached.images[0];
            
            const cachedLower = productsCache.get(productName.toLowerCase());
            if (cachedLower && cachedLower.images && cachedLower.images[0]) return cachedLower.images[0];
        }
        
        // Check item for direct image URL
        if (item?.productImage) return item.productImage;
        if (item?.image) return item.image;
        
        return null;
    }
    
    function isCustomizedItem(item, order) {
        if (order && order.isCustomized === true) return true;
        if (item && item.isCustomized === true) return true;
        if (order && (order.frontDesignImage || order.backDesignImage || order.customDesignImage)) return true;
        if (item && (item.frontDesignImage || item.backDesignImage || item.designImage)) return true;
        return false;
    }
    
    async function loadProductsCache() {
        try {
            const snapshot = await db.collection('products').get();
            snapshot.forEach(doc => {
                const p = doc.data();
                productsCache.set(p.id, {
                    name: p.name,
                    images: p.images || [],
                    icon: p.icon || 'fa-tshirt'
                });
                if (p.name) {
                    productsCache.set(p.name.toLowerCase(), {
                        name: p.name,
                        images: p.images || [],
                        icon: p.icon || 'fa-tshirt'
                    });
                }
            });
            console.log("✅ Products loaded:", productsCache.size);
        } catch(e) { console.warn("Products fetch error:", e); }
    }
    
    async function loadOrder() {
        const orderId = getOrderIdFromUrl();
        if (!orderId) return false;
        try {
            const doc = await db.collection('orders').doc(orderId).get();
            if (doc.exists) {
                currentOrder = { id: doc.id, ...doc.data() };
                return true;
            }
        } catch(e) { console.error("Fetch error:", e); }
        return false;
    }
    
    function getStatusLabel(status) {
        const map = { pending:'Pending', confirmed:'Confirmed', processing:'Processing', shipped:'Shipped', delivered:'Delivered', cancelled:'Cancelled' };
        return map[status] || 'Pending';
    }
    
    function canCancel() {
        return currentOrder && ['pending', 'confirmed'].includes(currentOrder.status);
    }
    
    function isWithinReturnPeriod() {
        if (!currentOrder || currentOrder.status !== 'delivered') return false;
        const orderDate = new Date(currentOrder.orderDate);
        const today = new Date();
        const daysDiff = Math.floor((today - orderDate) / (1000 * 3600 * 24));
        return daysDiff <= 7;
    }
    
    function getDaysLeftForReturn() {
        if (!currentOrder || currentOrder.status !== 'delivered') return 0;
        const orderDate = new Date(currentOrder.orderDate);
        const today = new Date();
        const daysDiff = Math.floor((today - orderDate) / (1000 * 3600 * 24));
        const daysLeft = 7 - daysDiff;
        return daysLeft > 0 ? daysLeft : 0;
    }
    
    function canReturn() {
        if (!currentOrder) return false;
        if (currentOrder.status !== 'delivered') return false;
        if (!isWithinReturnPeriod()) return false;
        if (currentOrder.returnStatus === 'pending') return false;
        if (currentOrder.returnStatus === 'approved') return false;
        return true;
    }
    
    async function cancelOrder() {
        if (!canCancel()) { showToast("Cannot cancel this order now", true); return; }
        try {
            await db.collection('orders').doc(currentOrder.id).update({
                status: 'cancelled', cancelledAt: new Date().toISOString()
            });
            currentOrder.status = 'cancelled';
            showToast("✅ Order cancelled");
            renderOrderDetails();
        } catch(e) { showToast("Failed to cancel", true); }
    }
    
    function goToReturn() {
        const orderId = currentOrder?.orderId || currentOrder?.id;
        if (orderId) window.location.href = `return.html?orderId=${orderId}`;
        else showToast("Order ID not found", true);
    }
    
    function renderOrderDetails() {
        if (!currentOrder) return;
        
        const container = document.getElementById('app');
        const isCancelled = currentOrder.status === 'cancelled';
        const canCancelOrder = canCancel();
        const canReturnOrder = canReturn();
        const daysLeft = getDaysLeftForReturn();
        const orderDate = currentOrder.orderDate ? new Date(currentOrder.orderDate).toLocaleString() : 'N/A';
        
        const steps = ['pending', 'confirmed', 'processing', 'shipped', 'delivered'];
        let statusHtml = '';
        if (isCancelled) {
            statusHtml = `<div class="cancelled-banner"><i class="fas fa-times-circle"></i> Order Cancelled</div>`;
        } else {
            const currentIndex = steps.indexOf(currentOrder.status);
            statusHtml = `<div class="status-steps">${steps.map((step, idx) => {
                const completed = idx <= currentIndex;
                const active = step === currentOrder.status;
                const icons = { pending:'fa-clock', confirmed:'fa-check', processing:'fa-cogs', shipped:'fa-truck', delivered:'fa-check-circle' };
                return `<div class="step ${completed ? 'completed' : ''} ${active ? 'active' : ''}">
                    <div class="step-icon"><i class="fas ${icons[step]}"></i></div>
                    <div class="step-label">${getStatusLabel(step)}</div>
                </div>`;
            }).join('')}</div>`;
        }
        
        // 🔥 FIXED: Render items with proper images for both custom and regular orders
        const itemsHtml = (currentOrder.items || []).map(item => {
            const productImg = getProductImageForItem(item, currentOrder);
            const isCustom = isCustomizedItem(item, currentOrder);
            const selectedSize = item.size || item.selectedSize || '';
            const selectedColor = item.color || item.selectedColor || '';
            const colorCode = getColorCode(selectedColor);
            
            let customBadgeHtml = '';
            if (isCustom) {
                customBadgeHtml = `<div class="custom-badge-order"><i class="fas fa-palette"></i> Custom Designed</div>`;
            }
            
            let imageHtml = '';
            if (productImg) {
                imageHtml = `<img src="${productImg}" alt="${escapeHtml(item.name)}" loading="lazy" onerror="this.onerror=null;this.parentElement.innerHTML='<i class=\'fas fa-tshirt\'></i>';">`;
            } else {
                imageHtml = `<i class="fas fa-tshirt"></i>`;
            }
            
            return `<div class="order-item">
                <div class="order-item-img">${imageHtml}</div>
                <div class="order-item-info">
                    <div class="order-item-name">${escapeHtml(item.name)}</div>
                    <div class="item-attributes">
                        ${selectedSize ? `<span class="size-badge"><i class="fas fa-tshirt"></i> ${escapeHtml(selectedSize)}</span>` : ''}
                        ${selectedColor ? `<span class="color-badge"><span class="color-dot-small" style="background: ${colorCode};"></span> ${escapeHtml(selectedColor)}</span>` : ''}
                    </div>
                    ${customBadgeHtml}
                    <div class="order-item-qty">Qty: ${item.quantity}</div>
                </div>
                <div class="order-item-price">
                    <div class="final-price">₹${(item.price * item.quantity).toLocaleString('en-IN')}</div>
                </div>
            </div>`;
        }).join('');
        
        let actionButtonsHtml = '';
        if (canCancelOrder) {
            actionButtonsHtml += `<button class="btn-secondary btn-cancel" id="cancelOrderBtn"><i class="fas fa-times-circle"></i> Cancel Order</button>`;
        }
        if (canReturnOrder) {
            actionButtonsHtml += `<button class="btn-secondary btn-return" id="returnOrderBtn"><i class="fas fa-undo-alt"></i> Return Order <span class="days-left-badge">${daysLeft} days left</span></button>`;
            actionButtonsHtml += `<div class="return-info"><i class="fas fa-info-circle"></i> You can return this order within ${daysLeft} days (7 days return policy).</div>`;
        }
        
        container.innerHTML = `
            <div class="status-bar">
                <div class="card-title"><i class="fas fa-chart-line"></i> Order Status</div>
                ${statusHtml}
            </div>
            
            <div class="info-card">
                <div class="card-title"><i class="fas fa-receipt"></i> Order Info</div>
                <div class="info-row"><span class="info-label">Order ID</span><span class="info-value">${currentOrder.orderId || currentOrder.id}</span></div>
                <div class="info-row"><span class="info-label">Date</span><span class="info-value">${orderDate}</span></div>
                <div class="info-row"><span class="info-label">Payment</span><span class="info-value">${currentOrder.paymentMethod || 'COD'}</span></div>
                <div class="info-row"><span class="info-label">Status</span><span class="info-value price-highlight" style="color:${isCancelled?'#F44336':'#D4AF37'}">${getStatusLabel(currentOrder.status)}</span></div>
            </div>
            
            <div class="info-card">
                <div class="card-title"><i class="fas fa-user"></i> Customer</div>
                <div class="info-row"><span class="info-label">Name</span><span class="info-value">${escapeHtml(currentOrder.customerName || 'Guest')}</span></div>
                <div class="info-row"><span class="info-label">Phone</span><span class="info-value">${escapeHtml(currentOrder.customerPhone || 'N/A')}</span></div>
            </div>
            
            <div class="info-card">
                <div class="card-title"><i class="fas fa-map-marker-alt"></i> Shipping</div>
                <div class="info-row"><span class="info-label">Address</span><span class="info-value">${escapeHtml(currentOrder.shippingAddress?.address || 'N/A')}</span></div>
                <div class="info-row"><span class="info-label">City</span><span class="info-value">${escapeHtml(currentOrder.shippingAddress?.city || 'N/A')}</span></div>
                <div class="info-row"><span class="info-label">PIN Code</span><span class="info-value">${escapeHtml(currentOrder.shippingAddress?.pincode || 'N/A')}</span></div>
            </div>
            
            <div class="info-card">
                <div class="card-title"><i class="fas fa-shopping-bag"></i> Items (${currentOrder.items?.length || 0})</div>
                ${itemsHtml || '<div class="info-row">No items</div>'}
                <div class="total-section">
                    <div class="total-row"><span>Subtotal</span><span>₹${(currentOrder.subtotal || currentOrder.total || 0).toLocaleString('en-IN')}</span></div>
                    <div class="total-row grand-total"><span>Total</span><span>₹${(currentOrder.total || 0).toLocaleString('en-IN')}</span></div>
                </div>
            </div>
            
            <div class="action-buttons">
                ${actionButtonsHtml}
                <button class="btn-secondary" onclick="window.location.href='booking.html'"><i class="fas fa-list"></i> All Orders</button>
                <button class="btn-primary" onclick="window.location.href='index.html'"><i class="fas fa-shopping-cart"></i> Shop More</button>
            </div>
        `;
        
        document.getElementById('cancelOrderBtn')?.addEventListener('click', () => document.getElementById('cancelModal').classList.add('show'));
        document.getElementById('returnOrderBtn')?.addEventListener('click', goToReturn);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m));
    }
    
    document.getElementById('modalCancelBtn')?.addEventListener('click', () => document.getElementById('cancelModal').classList.remove('show'));
    document.getElementById('modalConfirmBtn')?.addEventListener('click', async () => {
        document.getElementById('cancelModal').classList.remove('show');
        await cancelOrder();
    });
    
    (async function init() {
        await loadProductsCache();
        const loaded = await loadOrder();
        if (!loaded) {
            document.getElementById('app').innerHTML = `<div class="error-state"><i class="fas fa-exclamation-triangle"></i><h3>Order Not Found</h3><button class="btn-primary" onclick="location.href='booking.html'">Back to Bookings</button></div>`;
            return;
        }
        renderOrderDetails();
    })();
</script>
</body>
</html>
